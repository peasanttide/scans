language = "fr"
place = "A Paris"
date = "1793"
note = """Prospectus for "Journal d'instruction sociale," published in 1793. Caption title. Imprint from colophon. "Ce journal ... paroîtra le premier juin prochain, et successivement tous les samedis de chaque semaine. Le prix de l'abonnement est de 20 livres 10 sols pour les départmens, franc de port ... S'adresser au citoyen Metoyen, au bureau de l'abonnement, rue du Petit-Musc, n°. 19, près de l'Arsenal, et chez tous les libraires & directeurs des postes dans tous les départemens"--P. 11. "L'entrepreneur du journal a ses concitoyens": p. 12-15. Ms. annotations. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />Text lost in binding.<br /><br />."""
url = "https://archive.org/details/journaldinstruc00unse"
