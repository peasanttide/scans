title = "Journal de Kirn, traduit de l'allemand, ou, Mêlanges allemands, françois et italiens"
language = "fr"
place = "Paris"
date = "1785"
note = """Prospectus for "Journal de Kirn.". Caption title. Printer statement from colophon. "Permis d'imprimer, le 2 août 1785"--P. 7. "On souscrit a Kirn, au bureau général du Journal. A Paris, au bureau d'abonnement & de correspondance, rue St.-Martin, n°. 273. A Lyon, chez M. Demontillet, directeur des étapes. A Rennes, chez M. Prieur, commissionaire. A Nantes, chez M. Dumont, distilateur. A Rouen, chez M. Besançon, rue aux Juifs. Et chez tous les libraires des principales villes du royaume"--P. 6-7. "Le prix de la souscription est de trente livres pour Paris, & trente-trois livres pour les provinces & les pays étrangers, franc de port jusqu'aux frontières de France"--P. 6. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
