note = """Prospectus for "Journal dédié à Monsieur, frère du roi.". "On souscrira à Paris, chez Demonville, imprimeur-libraire de l'Académie françoise, rue S. Severin, aux Armes de Dombes; Lacombe, libraire, rue Christine; & chez les principaux libraires ... Le prix de la souscription sera de vingt-quatre livres pour Paris & de trente livres pour la province"--P. 14. "On s'adressera à M. Dagoty, anatomiste & botaniste, pensionné du roi, de l'Académie des sciences & belles-lettres de Dijon, l'un des associés, à Paris, rue Saint-Honoré, vis-à-vis l'Oratoire, pour ce qui peut concerner le journal"--P. 14. Title vignette; head-piece. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
