language = "fr"
place = "Paris"
date = "1796"
note = """Prospectus for "Journal des fonctionnaires publics," which began publication in 1796. Caption title. "Le prix de l'abonnment est de 4 liv. par mois pour Paris, et de 5 liv. pour les départemens. Celui de la souscription pour les dix premiers mois est de 40 liv. pour Paris, et de 50 liv. pour les départemens. Les lettres et l'argent doivent être adressés, franc de port, au C. Ant. Bailleul, directeur du Journal des fonctionnaires publics et du Journal du commerce, rue Haute-Feuille, n°. 22"--P. [3]. Publisher statement from colophon. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
