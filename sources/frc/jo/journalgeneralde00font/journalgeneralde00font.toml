note = """Prospectus for "Journal général de France," published 1785-1792. Caption title. "On est prié d'adresser à M. l'abbé de Fontenai, auteur du Journal, rue S. André-des-Arcs, n° 44, les livres, estampes, musique, lettres, &c. ... M. Desplan, directeur du bureau du Journal général de France, rue Neuve S. Augustin, est chargé de tout ce qui concerne sa manutention, comme de recevoir les souscriptions, de donner les quittances, de faire l'envoi des feuilles, &c."--P. [2]. "Il suivra le même plan qu'il s'est formé depuis trois ans"--P. [1]. Printed in double columns. "Au lieu de 16 liv. 4 s. que coûtoit auparavant ce journal par an, il sera porté dorénavant à 18 liv. pour Paris, & à 19 liv. 4 s. pour la province"--P. [2]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
