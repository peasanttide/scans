note = """Prospectus for "Journal général de France," published 1785-1792. Caption title. "On est prié de vouloir distinguer l'auteur & le directeur de ce journal, qui portent le même nom. Le premier, M. l'abbé de Fontenai, est uniquement chargé de la rédaction ... Mais on peut lui adresser, rue Saint-Hyacinthe, la troisième porte cochère à droite par la place S. Michel, n°. 47, les livres, estampes, musique, lettres, &c. ... M. de Fontenay, directeur du bureau du Journal général de France, rue Neuve S. Augustin, reçoit les souscriptions, donne les quittances, & fait l'envoi des feuilles"--P. [2]. Printed in double columns. "Le prix de l'abonnement est de 16 livres 4 sols, pour Paris & pour la province, franc de port "--P. [2]. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
