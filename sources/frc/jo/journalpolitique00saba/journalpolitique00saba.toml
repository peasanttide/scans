date = "1789"
note = """Prospectus for "Journal politique-national," which began publication in 1789. Caption title. Place of publication and printer statement from colophon. "Le premier numéro paroîtra le mardi 7 juillet"--P. 4. "On souscrit à Versailles, chez Blaizot, libraire, rue Satori, n° 5; & chez Le Bel, libraire, au bas de l'escalier de marbre du château, près la Galerie des princes. Et à Paris, chez Dessenne, l'aîné, libraire, aux galeries du Palais Royal, & chez Barrois, l'aîné, libraire, quai des Augustins, près du pont S. Michel"--P. 4. "Le prix de la souscription est de six livres pour les deux mois"--P. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
