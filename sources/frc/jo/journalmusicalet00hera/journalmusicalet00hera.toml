note = """Prospectus for "Journal musical et des spectacles.". Proposed title never published? Caption title. "On souscrit, dès-à-présent, chez J.-B. Hérault, imprimeur, rue de Harlay, n°. 15, au Marais"--P. [2]. Printer statement from colophon. "Le premier n°. de ce journal paraîtra le premier février de l'année"--P. [2]. "Le prix de la souscription, pour Paris, est de six livres par mois, et de douze livres par trimestre; pour la province, il est de six livres dix sols par mois, et de treize livres dix sols par trimestre, franc de port"--P. [2]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
