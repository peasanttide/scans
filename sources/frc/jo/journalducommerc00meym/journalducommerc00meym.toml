note = """Prospectus with sample text for "Journal du commerce de l'Europe et nouvelles des colonies," of which the first regular issue appeared 2 April 1792. Cf. Tourneux. Caption title. "N°. Prospectus. Vendredi 17 février 1792. Premiere année"--P. [1]. "On souscrit à Paris ... chez Benard, rue de-Bussi, n°. 32, faubourg Saint-Germain; et chez M. Goiset, rue Chabanais, no. 8, près le Palais-Royal. A Londres, chez Boock, libraire. A Hambourg, chez M. Fauche, libraire. A Amsterdam, chez M. Gabriel Dufour, libraire. A Bordeaux, che M. Bergeret, libraire, rue Saint-Remi. A Marseille, chez M. Mossy, libraire à la Camubière. A Neuchatel, chez M. Fauche, imprimeur du roi. A Nantes, chez M. Despilly, libraire. Au Hâvre, chez M. Patry, libraire. A Lorient, chez M. Fauvel jeune, libraire. A Brest, chez M. Lefournier, libraire. A Bruxelles, chez M. Lecharlier, libraire. A Lyon, chez M. Jacquenot, libraire. Et généralement chez tous les libraires et maîtres-de-poste du royaume et de l'etranger"--P. 8. Tourneux, M. Paris pendant la Révolution française. Includes subscription rates. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page."""
url = "https://archive.org/details/journalducommerc00meym"
