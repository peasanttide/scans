type = "pamphlet"
title = "Journal de M. Suleau."
language = "fr"
date = "1791"
note = """No. 1-6 published in Paris. A single number of a periodical by M. Suleau appeared April 15, 1792. This is sometimes called no. 13 of the Journal de M. Suleau. Le Tocsin de la nécessité, complete in 1 number, Oct. 20, 1791, and the Journal de la contre-révolution, in 3 numbers, Neuwied, 1791, both by Suleau, may be early editions of no. 7-10 of the Journal de M. Suleau. Includes "Le Réveil de M. Suleau, suivi du Prospectus du Journal politique que le public lui demande" (56 pages), and Introduction (32 pages). Ceased publication 1792. Suleau was killed in the massacre of Aug. 10, 1792. Scanner's note: Irregular Pagination."""
