note = """Prospectus for "Journal général de la littérature étrangère.". Caption title. "Les bureaux généraux de la souscription sont: à Paris, chez Treuttel et Würtz, quai Voltaire, n°. 2, et à Strasbourg, chez les mêmes libraires, Grand'rue, n°. 15"--P. 3. "La publication du premier cahier aura lieu le 20 vendémiaire an IX. Le prix de la souscription est de 21 francs pour l'année, franc de port, ou de 11 francs pour six mois"--P. 3. "Ouvrages récemment publiés chez Treuttel et Würtz, libraires à Paris, quai Voltaire, n° 2, et à Strasbourg, Grand'rue, n°. 15": p. 3-4. Ms. annotations. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
