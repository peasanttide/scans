note = """Prospectus for "Journal dédié à Monsieur, frère du roi.". Caption title. "On souscrit à Paris chez Demonville, imprimeur-libraire, rue Saint-Severin, & chez les principaux libraires, tant de province que les pays etrangers ... Le prix de la souscription est de vingt-quatre livres pour Paris, & de trente livres pour la province"--P. [4]. "Permis d'imprimer, ce 31 décembre 1776"--P. [4]. "On s'adressera à M. Dagoty, anatomiste pensionné du roi, rue S. Honoré, vis-à-vis l'Oratoire, pour tout ce qui peut concerner le journal"--P. [4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No numbered pages. <br /><br />."""
