note = """Prospectus for "Journal des dames.". Caption title. Printer statement and date of publication from colophon. Head- and tail-pieces. "Le prix de la souscription est de 15 livres pour Paris & Versailles, & de 21 livres pour la province, franc de port. On souscrira à Paris, chez le sieur Lacombe, libraire, rue Christine, près la rue Dauphine. Tous les paquets seront adressés au sieur Quillau, imprimeur du Journal, rue du Fouarre, pour remettre à Madame la baronne de Princen"--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined.  Text extends off of the edge of the page.  Text lost in binding."""
