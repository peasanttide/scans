title = "Enterrement du despotisme : ou Funerailles des aristocrates ; seconde fête nationale, dédié a nos patriotes bretons ; et à tous les soldats-citoyens des troupes de lignes, & gardes-nationales du royaume, députés pour la fédération ; a l'honneur et gloire de nos braves freres du Faubourg-Saint-Antoine ; pour être célébré le 17 juillet 1790, sur les débris de la Bastille, de-là au Caamp [i.e. Champ] de Mars, & ensuite au réverbère régénérateur, place de Grêve, où sera déposé les cendres de tous les aristocrates, avec un marbre noir portant ses [i.e. ces] mots: Ci-gissent à la-fois tous les maux de France, clergé, judicature, noblesse & finance."
language = "fr"
