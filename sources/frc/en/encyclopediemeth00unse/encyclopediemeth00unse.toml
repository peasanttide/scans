title = "Encyclopédie méthodique, ou par ordre de matières, par une société de gens de lettres, de savans et d'artistes"
language = "fr"
place = "A Paris"
date = "1782"
note = """Prospectus for an encyclopedia published as a set of separate dictionaries by Charles Panckoucke, 1782-1792; continued by Henri Agasse, 1792-1813; and Mme. la veuve Agasse, 1813-1832. Abridged version published in Mercure de France, Dec. 8, 1781. Cf. Darnton, R. The business of enlightenment, 1979, p. 418. Place of printing and printer from colophon. "On souscrit à Paris, Hôtel de Thou ... à Liège, chez Plomteux ... et chez tous les libraires & directeurs des postes de l'Europe.". Signatures: A-E⁸. "Avis de M. Panckoucke, entrepreneur de cette édition": p. 73-79. Colophon: A Paris, de l'Imprimerie de Stoupe .. Accompanied by three unidentified clippings relating to this edition. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/encyclopediemeth00unse"
subject = [
    "Encyclopédie méthodique",
    "Publishers and publishing",
    "Encyclopedias and dictionaries",
]

