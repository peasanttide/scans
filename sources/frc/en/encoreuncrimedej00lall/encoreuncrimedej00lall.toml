title = "Encore un crime de Joseph Lebon, représentant du peuple : la veuve Lallart, demeurant à Arras, a la Convention nationale"
language = "fr"
place = "A Paris"
date = "1795"
note = "Caption title. Signed: Albertine Lallart, veuve Lallart. Erroneously attributed to Amélie-Françoise-Josephe Lallart Vicogne. Cf. Martin & Walter. Imprint from colophon. Martin & Walter. Révolution française. Concerns the prosecution of the merchant Benoît-Louis-Joseph Lallart (de Berlette) of Arras. Cf. Lecesne, E. Arras sous la Révolution, v. 2, p. 198; Paris, A.-J. Histoire de Joseph Le Bon et des Tribunaux révolutionnaires d'Arras et de Cambrai , v. 1, p. 252. Bibliography: Martin & Walter.  Révolution française, IV:1, 33495. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
url = "https://archive.org/details/encoreuncrimedej00lall"
subject = [
    "Lallart, Benoît-Louis-Joseph",
    "Lallart family",
    "Le Bon, Joseph, 1765-1795",
    "Arras (France). Tribunal révolutionnaire",
    "Malicious prosecution",
    "Political rehabilitation",
]
extent = "7 p. ; 27 cm."

