title = "Détail de la grande révolution arrivée au Château de Vincenne & au fauxbourg Saint-Antoine."
language = "fr"
place = "Paris"
date = "1790"
note = "Caption title. Imprint from colophon. Subtitle: Démolition de la tour de Vincenne. La cavalerie tombe à coups de sabre sur le peuple. La Garde nationale de Vincenne enjoue sur la cavalerie. Le peuple crie aux armes. On veut empêcher M. de Lafayette d'entrer au château. Un soldat de la Garde nationale de Vincenne leve le sabre nud sur une aide de camp. Sabre levé pour couper le cheval du domestique à M. de Lafayette. Canons braqués sur la populace. Le général commande à ses soldats de charger leurs armes. Harangue du général à ses soldats. Discours du général à la municipalité de Vincenne. Liste des aristocrates. Grande conspiration contre le roi, découverte par M. de la Fayette au chateau des Thuilleries. Martin & Walter IV 2: 5389. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover."
