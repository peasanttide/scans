note = "Printed letter of transmittal advertising Le Maistre de Sacy's French translation of the Bible, also known as the Port-Royal version, sold by Desprez. Title from first two lines of text. Signed in ms.: G Desprez. Includes prices for editions in various sizes, available by subscription. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."
