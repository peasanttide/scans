note = "Half title. Charrier de La Roche's letter has not been identified. Gobel's letter (Martin & Walter II: 15043) has title: Lettre de Monsieur l'Évêque métropolitain de Paris, contenant des vues de pacification sur les troubles actuels de l'Église de France; en réponse a celle de M. Charrier de La Roche, lui annonçant sa démission de l'Evêché métropolitain de Rouen. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."
