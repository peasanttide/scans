note = """Caption title. Without imprint. "... la cour, persistant dans son arrêté du 3 septembre dernier, a arrêté que, sous le bon plaisir du roi, il sera sursis à l'examen des edits, déclarations & lettres patentes, jusques à ce qu'il ait plu à Sa Majesté prendre de nouveau en considération les remontrances que son Parlement a eu l'honneur de lui adresser ... il sera écrit une lettre au Seigneur Roi, à l'effet de le supplier de rétablir le Parlement dans le lieu ordinaire de ses fonctions": p.4. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
