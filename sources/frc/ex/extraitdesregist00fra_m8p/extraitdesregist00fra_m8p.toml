place = "A Paris"
date = "1770"
note = "Caption title; imprint from colophon. Orders the burning of the following works: Baron d'Holbach's Le christianisme dévoilé, La contagion sacrée, and Système de la nature, and his translation, Discours sur les miracles de Jésus-Christ ... traduit ... de Voolston [i.e. Woolston], and Examen impartial des principales religions du monde (also attributed to d'Holbach); Nicolas Freret's Examen critique des apologistes de la religion chrétienne; and Voltaire's Dieu et les hommes. Quarto half-sheet, unsigned. Condemnation of 7 books. Vercruysse, J. Baron d'Holbach. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."
url = "https://archive.org/details/extraitdesregist00fra_m8p"
