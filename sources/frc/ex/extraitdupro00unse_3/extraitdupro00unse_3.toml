title = "Extrait du procès-verbal de la Convention nationale du 8 août 1793, l'an deuxième de la république française, une & indivisible."
language = "fr"
place = "Paris"
date = "1793"
note = """Imprint from colophon. "Extrait du procès-verbal du 8 août"--Bottom of p. 5. Not in Martin & Walter. Révolution française. Discours prononcé a la barre de la Convention nationale au nom des envoyés de toutes les sections du peuple français, le jeudi 8 août 1793, l'an deuxième de la République / par le citoyen Claude Royer, envoyé de l'une des sections de Châlons-sur-Saone, département de Saone & Loire -- Au peuple français, les envoyés de toutes les sections de la République a la grande réunion des français, a Paris, le 10 août -- A la Convention nationale, les envoyés des toutes les sections du peuple français -- Réponse du président de la Convention nationale au discours des envoyés du peuple français -- Discours prononcé par le citoyen Royer, lors de l'inauguration de l'arche constitutionnelle et du faisceau, dans le sein de la Convention nationale -- Réponse du président de la Convention nationale aux envoyés du peuple français, lorsqu'ils ont apporté dans le lieu des séances de la Convention l'arche constitutionnelle & le faisceau. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text. Irregular pagination.  Missing page numbers 1-3."""
