note = """Half title. Caption on p.[1]: Extrait des registres du Parlement de Bordeaux, du quatre septembre 1787. Opening sentence: La cour, toutes les chambres assemblées, vu l'arrêté par elle pris le lundi 3 de ce mois, portant que le roi sera très-humblement supplié de retirer les lettres-patentes du douze du mois dernier, portant translation de son Parlement dans la présente ville [i.e. Libourne]. Includes also "extraits des registres" for 6 and 7 September 1787. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
