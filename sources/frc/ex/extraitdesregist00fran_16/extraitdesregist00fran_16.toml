note = """Caption title. Without imprint. "Déclaration du roi, qui ordonne que l'assemblée des Etats-généraux aura lieu dans le courant de janvier de l'année 1789, & que les officiers des cours reprendront l'exercice de leurs fonctions": p.19-24. "Arrêté du Parlement, toutes les chambres assemblées, les pairs y séant. Du 25 septembre 1788": p.24-25. "Réponse du roi, du 26 septembre 1788": p.25. "Discours prononcé au Parlement, toutes les chambres assemblées, les pairs y séant, le 24 septembre 1788, par M. Mathurin-Jean-Baptiste Le Bruin, de la Guadeloupe, ecuyer, avocat au Parlement, lieutenant-général au bailliage du Palais à Paris": p.26-28. Not in Martin & Walter [edition 1: 28 p.; editions 1 and 2 differ slightly in the subsidiary texts]. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
