date = "1790"
note = "Caption title. Attributed to Charles-François de Bonnay. Cf. Tourneux. Suggested date of publication from Saricks. Variant of Martin & Walter. Révolution française, IV:2, 6520. Variant of Saricks, A. Melvin Coll., I, 430. Tourneux, M. Paris pendant la Révolution française. Satirical work on the search for Charles-Louis-François de Paule de Barentin at the couvent des Annonciades on 26 October 1789, by Charles de Lameth and the Garde nationale de Paris. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Tourneux, M. Paris pendant la Révolution française,  III, 16363a. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover."
