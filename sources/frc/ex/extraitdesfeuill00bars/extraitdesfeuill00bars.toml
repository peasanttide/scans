title = "... Extrait des feuilles & minutes du greffe de MM. les conseillers du roi honoraires en titre en la ville, bailliage & comté de Bar-sur-Seine : exerçant la justice sur le fait des aides, tailles & autres impositions & droits royaux en ladite ville, bailliage & comté ; du 28 juin 1788."
language = "fr"
place = "s.l."
date = "1788"
note = "Caption title. Imprint from colophon. At head of title: De par le roi. Condemns an anonymous pamphlet with title: Avis au peuple. Opening words of the pamphlet: Une querelle s'est élevée entre le roi & les Parlemens. Les Parlemens ont dit: Nous voulons être roi. Closing words: c'est le plus grand bienfait qu'un roi ait pu procurer à ses peuples (cf. statements on p.2). Not in Martin & Walter [edition 1. Title: Extrait des feuilles ...]. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br /><br />."
