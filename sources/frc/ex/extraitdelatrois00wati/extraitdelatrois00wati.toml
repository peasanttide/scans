note = """Advertisement for of Watin's "L'art du peintre, doreur, vernisseur," orginally published as "L'art de faire et d'employer le vernis, ou, L'art du vernisseur.". Caption title. Newberry's copy tightly trimmed at right and bottom margins, with loss of imprint; publication information from OCLC record 458876432. Head-piece. "Watin tient aussi magasin de toutes sortes de liqueurs étrangeres & de France, a 3 liv. la bouteille"--P. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />Text extends past page edges.<br /><br />."""
