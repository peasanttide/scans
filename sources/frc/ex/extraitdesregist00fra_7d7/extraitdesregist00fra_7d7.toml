language = "fr"
place = "Rouen?"
date = "1721"
note = """Caption title. "Fait au Conseil d'Etat privé du roy, tenu à Paris le dix-neuviéme jour de juillet mil sept cens vingt-un"--P. 4. Initial; head-piece. Regarding litigation involving Jean-Baptiste Besongne fils and members of the syndicate of printers and booksellers in Rouen (plaintiffs) and Jacques Boisjouvin and Jean-Baptiste Besongne père (defendants). The plaintiffs oppose the Conseil privé's decision to permit Boisjouvin to succeed his grandfather Besongne père as imprimeur-libraire of Rouen because he does not meet the syndicate's requirement that new members must be the sons of master printers in Rouen. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
