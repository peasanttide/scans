note = """Caption title. By Jean Joseph Mounier. Cf. Maignien. "Les observations ci-après transcrites ont été approuvées, & il a été arrêté qu'elles seront adressées par MM. les procureurs-generaux-syndics à MM. les députés de la province; que copie en sera envoyée à M. le président de l'Assemblée nationale & au ministre du département, & qu'elles seront rendues publiques par la voie de l'impression"--P. [1]. Imprint from colophon. Place and date of publication from Maignien. Not in Martin & Walter. Révolution française. Maignien, E. Ouvrages anonymes et pseudonymes du Dauphiné. Bibliography: Maignien, E.  Ouvrages anonymes et pseudonymes du Dauphiné,  954. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
