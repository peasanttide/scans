note = """Caption title. Without imprint. "Déclaration du roi, qui ordonne que l'assemblée des Etats-généraux aura lieu dans le courant de janvier de l'année 1789, & que les officiers des cours reprendront l'exercice de leurs fonctions. Donnée à Versailles le 23 septembre 1788. Registrée en Parlement le 25 septembre mil sept cent quatre-vingt-huit": p.19-23. "Réponse du roi a son Parlement de Paris, 26 septembre 1788": p.24. Not in Martin & Walter [edition 3: 24 p.]. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
