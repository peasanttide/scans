note = """Caption title. Imprint from colophon. Not in Martin & Walter. Révolution française. "Institut national des sciences et des arts. Extrait des registres de la Classe, séance du 11 messidor an 8. Un membre, au nom d'une commission ..., lit le rapport dont suit l'extrait ... Signé Cuvier, Sabatier"--P. 8-10. "Extrait du rapport fait à la Société de Médecine par le cit. Roussille-Chamseru, membre de l'ancienne faculté de médecine de Paris, et Médecin-Oculiste, sur l'observation du cit. Demours, relative à une pupille artificielle ... Signé Roussille-Chamseru"--P. 11-12. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Skewed text. Worn, damaged pages and cover."""
