type = "pamphlet"
title = "Arrêt de la Cour des monnoies, qui ordonne que Charles-Louis Pailly, archer-garde de la prévôté générale des monnoies, sera tenu de se défaire de son office dans trois mois, & le déclare incapable d'en posséder aucun autre : condamne ledit Pailly à rendre & restituer à Nicolas Thierry la somme de quarante-huit livres & la paire de boucles mentionnée au procès, pendant lequel tems il sera tenu de garder prison : extrait des registres de la Cour des monnoies : du 22 juillet 1780."
language = "fr"
place = "Paris"
date = "1780"
note = "Caption title. Imprint from colophon. Signatures: A⁴. Last page blank. Head-piece. No. 5 of 45 titles bound together. Scanner's note: No copyright page found. No table-of-contents pages found.  Uneven binding.  Skewed text.  Damaged, stained, torn and/or loose pages.  Title is on the cover page."
