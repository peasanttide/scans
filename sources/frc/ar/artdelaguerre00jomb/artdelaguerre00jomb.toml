note = """Prospectus for the Marquis de Puységur's "Art de la guerre". Initial; head-piece. "En deux volumes in-quarto, ornés de vignettes & accompagnés de plus de cinquante planches"--P. [1]. "Le prix pour les souscripteurs sera de dix-huit francs en feuilles pour chaque exemplaire ... Cette nouvelle edition sera achevée d'imprimer vers le fin du mois de septembre 1749"--P. [2]. Includes advertisements for three other titles sold by Jombert. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
