place = "s.l."
date = "1788"
note = """Half title. "Déclaration du roi, du 7 mars 1788, qui leve la modification insérée par le Parlement de Toulouse, dans l'enregistrement de l'edit du mois de novembre 1787, concernant ceux qui ne font pas profession de la religion catholique. Registrée en Parlement, le 17 mars 1788": p.[3]-8. "Arr^eté de la cour du Parlement, du 17 mars 1788, `a sept heures de relevée. Extrait des registres du Parlement": p.9-10. "Tr`es-humbles et tr`es-respectueuses remontrances que présentent au roi les gens tenant sa cour de Parlement de Toulouse, au sujet de la déclaration du 7 mars 1788, qui leve la modification mise `a l'édit du mois de novembre 1787, concernant ceux qui ne font par profession de la religion catholique ": p.11-24. Dated at end: Fait `a Toulouse, en Parlement, le premier avril 1788. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
