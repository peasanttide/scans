note = """Caption title: Articles accordez par le sieur duc de Ventadour pair de France, & lieutenant general pour le roy au gouuernement de Languedoc; et les sieurs de Thou, Ieannin, de Boissize, & de Bullion, tous conseillers au Conseil d'Estat, & commissaires deputez par Sa Majesté en vertu du pouuoir cy apres transcript du cinquiesme iour de may dernier. Title vignette; initial. Lindsay & Neu. French political pamphlets. Bibl. Nat. Cat. de l'histoire de France. "Fait & arresté à sainct Manehould le quinziesme iour de May mil six cens quatorze"--P. 10. "Signe Henry de Bourbon, Ventadour, Charles de Gonzague de Cleues, Henry d'Orleans, Henry de Lorraine, Henry de la Tour, Au. de Thou, P. Ieannin, I. de Thumery, Bullion, Henry de Luxembourg, Tauanes"--P. 10. "Sensvit la tenevr dudit pouuoir": p. [11]-13. Scanner's note: Title and cover page are combined. Damaged, stained, torn and/or loose pages. Uneven binding. Skewed text. Text is lost in the binding or extends off of the edge of the page."""
