type = "pamphlet"
title = "Arrêt de la Cour des aides de Paris, qui infirme une sentence de l'election de Montargis du 18 septembre 1779, qui avoit déclaré un procès-verbal rendu contre le sieur Dubuisson, marchand orfevre en ladite ville, le 9 juillet précédent, nul, faute par les commis de l'avoir sommé d'apposer son cachet sur la boîte renfermant les ouvrages saisis, d'avoir déposé au greffe ladite boîte, & d'avoir donné copie de l'attestation du juge qui avoit assisté à la visite, émandant, met les parties hors de cour, faisant droit sur les conclusions de M. le procureur de faire leurs déclarations & soumissions au bureau du régisseur pour les petits ouvrages qui ne pourront pas supporter l'apposition des poinçons de la régie, conformément à l'article 9 de la déclaration du 26 janvier 1749 : du 26 juin 1781 : extrait des registres de la Cour des aides"
