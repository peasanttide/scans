title = "Arrêt du Conseil d'État du roi, qui ordonne que l'article XIV de l'arrêt du Conseil, en forme de règlement, du 10 décembre 1778, sera exécuté selon sa forme & teneur, en conséquence, déclare le commerce des blés & farines incompatible avec la profession d'amidonnier  : fait Sa Majesté très-expresses inhibitions & défenses à tous amidonniers de faire ledit commerce, soit par eux-mêmes, soit par leurs femmes ou leurs enfans demeurans avec eux, à peine de confiscation, tant des blés & farines, que des amidons & de cinq cents livres d'amende : du 25 juillet 1781 : extrait des registres du Conseil d'État"
