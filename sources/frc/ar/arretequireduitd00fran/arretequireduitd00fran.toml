note = """Caption title. At head of title: No. 1242. "Le premier Consul, signé Bonaparte"--P. 4. Imprint from colophon. "No. 6"--Bottom of p. [1]. "No. 1242. Organisation des demi-brigades"--Bottom of p. 3. "Instruction adressée par le ministre de la guerre aux généraux en chef des armées et aux généraux commandant les divisions militaires de l'intérieur, sur l'exécution de l'arrêté des consuls du 9 fructidor, relatif aux changemens qui doivent s'opérer dans les états-majors des demi-brigades conservées à trois bataillons, et sur la formation de celles réduites à deux"--P. [5]--12; signed: Carnot. Scanner's note: No copyright page found. No table-of-contents pages found. No title page found."""
