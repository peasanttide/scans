note = """Caption title. Without imprint. Opening words: La cour, les chambres assemblées, délibérant sur le rapport des commissaires nommés par arrêt du 18 de ce mois, pour aviser au parti à prendre relativement à la situation actuelle du Parlement de Paris .. "Arrêté du Parlement de Rouen, du 23 août": p.6-8. "La cour [du Parlement de Rouen] ... ne peut voir sans effroi les actes multipliés du pouvoir absolu exercé dans toutes les cours de la capitale, & la translation inopinée du Parlement séant à Paris ...": p.6. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
