title = "Arrest du Conseil d'état du roi, qui casse la sentence du juge de police de la ville de Rennes, du 11 septembre 1784, & l'arrêt de la Chambre des vacations du Parlement de la même ville, du 15 du même mois; par lesquels la saisie conservatoire de différentes quantités de tabac avoit été confirmée & la continuation ordonnée ... et qui ordonne à ladite Chambre des vacations & auxdits juges de police, d'adresser incessamment à Sa Majesté, les procés-verbaux de vérification, si aucuns ont été faits en vertu desdits jugemens ... se réservant Sa Majesté, après qu'Elle se sera fait rendre compte des plaintes qui auront pu être portées sur la qualité des tabacs que le fermier fait vendre, d'y statuer ainsi qu'il appartiendra. Du 1.er octobre 1784. Extrait des registres du Conseil d'état."
