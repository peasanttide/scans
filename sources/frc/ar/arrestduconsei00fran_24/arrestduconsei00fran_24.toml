title = "Arrests du Conseil d'état du roi, dont le premier, casse un arrêt de la Cour des aides de Rouen, du 7 août 1767 & déclare bonne & valable la saisie de quatre cents quatre-vingt douze livres de faux tabac, trouvées dans le presbytère du Sieur Sevestre, curé de la paroisse de Saint-Vaast en Normandie ... Condamne ledit Sieur Sevestre en l'amende de mille livres, & aux dépens. Le second contradictoire, déboute ledit Sieur Sevestre de son opposition à celui du 14 juin 1768, & ordonne qu'il sera exécuté suivant sa forme & teneur."
