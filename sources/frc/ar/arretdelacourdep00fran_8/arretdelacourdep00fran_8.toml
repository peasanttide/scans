#:schema ../../../../schemas/source.json
layer = "source"
id = "arretdelacourdep00fran_8"
type = "pamphlet"
title = "Arrêt de la Cour de parlement, qui ordonne que l'imprimé de l'arret du deux avril dernier, dans lequel a été inséré une note, ensemble ladite note, seront et demeureront supprimés, comme contenant ladite note une mention qui n'est point sur la minute dudit Arrêt, laquelle note est injurieuse à l'honneur et à la réputation de Me. Duveyrier, avocat; enjoint à Seguy-Thiboust de se conformer aux arrêts et réglemens sur le fait de l'Imprimerie et notamment à l'arrêt de la cour du 4 mai 1717"
language = "fr"
place = "A Paris"
date = "1789"
note = """Because Duveyrier, lawyer in a case heard before the Parlement of Paris, was said to be unjustly treated in a note inadvertently included in an arrét of April 2, 1789, the Parlement suppressed copies of that impression of the arrêt. Appended to this document is an arrêt of May 4, 1717 which forbids all printers to issue copies of a decree of parlement without the permission of the court. Caption title. "Extrait des registres du Parlement"--P. 1. Imprint from colophon. Includes the text of the "Arrêt" of 4 May 1717 (regulating government printing). Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
url = "https://archive.org/details/arretdelacourdep00fran_8"
subject = ["Courts"]

