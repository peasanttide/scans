title = "Arrest de la cour de Parlement, en la Tournelle, qui sur les appels comme d'abus, interjettés par Me Claude Rivot, prêtre curé des grand & petit Gentilly-lès-Paris, d'une sentence de l'officialité de Meaux, & d'un rescrit de Cour de Rome, dit qu'il y a abuse, condamne Me Joseph-Sebastien Gex, curé de Saint-Pierre-aux-Bœufs, promoteur de l'officialité de Paris, en six mille livres de dommages & intêrêts, par forme de réparation civile, & aux dépens faits en la primatie de Lyon, en l'officialité de Meaux & au Parlement, avec permission d'imprimer & afficher cent exemplaires au présent arrêt : extrait des registres du Parlement : du 18 mars 1758"
