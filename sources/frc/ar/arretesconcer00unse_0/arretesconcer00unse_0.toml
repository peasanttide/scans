note = """Caption title. At head of title: No. 1054. "Le premier Consul, signé Bonaparte"--P. 10. Imprint from colophon. "No. 6"--Bottom of p. [1]. "Vivres et artillerie, an VIII. (No. 1054)"--Bottom of p. 3. Io. Arrêté portant que le service des vivres, dans les divisions militiares qui ne font pas partie des arrondissemens des armées, sera confié à une régie composée de cinq administrateurs -- 2o. Arrêtré qui règle l'organisation des charretiers d'artillerie en bataillons de cinq compagnies -- 3o. Arrêté portant création d'inspecteurs généraux de l'artillerie -- 4o. Arrêté portant création d'inspecteurs-généraux de l'arme du génie. Scanner's note: No copyright page found. No table-of-contents pages found.  Title on cover. Damaged, stained pages and cover.  Uneven binding. Skewed text."""
