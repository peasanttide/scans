title = "Arrivée a Paris du grand Polichinel, son entretien avec son compère sur les causes de nos malheurs : Ah! qu'il est vrai, ce citoyen Polichinel, comme il peint le voleur, l'assassin Schérer : il faut voir le tableau de nos défaites dans l'Italie, par la conduite de cet infâme ministre, qui, après l'avoir vendu aux autrichiens, l'a lui-même livrée à nos ennemis, et fait égorger nos soldats sous ses yeux : oh! il est bien de mauvaise humeur contre les dilapidateurs : comme il témoigne son indignation de ce que les triumvirs, ne sont pas encore en jugement : il faut entendre ses réflexions, elles en valent bien d'autres."
language = "fr"
place = "Paris"
date = "1798"
note = "Caption title. Signed: Saunier. Imprint from colophon. Woodcut at head of title, with caption: En rirant je dis vrai. Place and suggested date of publication from BM. Martin & Walter. Révolution française. BM. Bibliography: Martin & Walter.  Révolution française,  IV:1, 31061. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."
