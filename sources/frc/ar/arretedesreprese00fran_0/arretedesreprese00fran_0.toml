title = "Arrêté des représentants du peuple français, envoyés par la Convention nationale dans les départements de la Seine Inférieure & circonvoisins, qui port que tous les tailleurs et cordonniers, tant maîtres que garçons et apprentifs, mis en requisition pour le service et l'équippement des soldats de la premiere requisition, seront tenus de se réunir dans un même local du chef-lieu du district de Rouen, au jour qui leur sera indiqué, pour s'y former en atteliers de travail, sous la surveillance du directoire du district : a Pont-Audemer le 19 nivose, l'an 2e. de la République française, une et indivisible"
language = "fr"
place = "Rouen?"
date = "1794"
note = """Caption title. At head of title: Liberté. Egalité. "Le conseil-général du district de Rouen ... arrête que le présent sera consigné sur ses registres, & qu'il sera imprimé ..."--P. 5-6. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
