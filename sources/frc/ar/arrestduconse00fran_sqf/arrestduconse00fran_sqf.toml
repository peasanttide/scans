place = "A Paris"
date = "1776"
note = "Caption title. Publishing information from colophon. Head-piece at head of title. On the suppression of three anonymously published works regarding the controversy in 1773 between Condorcet, bishop of Lisieux, and his clergy. Two of the works are attributed to Guillaume-André-René Baston. Cf. Quérard, J.M. Supercheris littéraires, III, column 107. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."
