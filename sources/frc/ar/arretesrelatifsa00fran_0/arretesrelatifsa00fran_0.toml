note = """Caption title. At head of title: No. 1255. "Le premier consul, signé Bonaparte"--P. 7. Imprint from colophon. "Nos. 1, 6, 9"--Bottom of p. [1]. Io. Arrêté relatif à la division territoriale et au mode d'administration des départemens de la Sarre, de la Roer, de Rhin-et-Moselle et du Mont-Tonnerre -- 2o. Arrêté portant qu'à compter du premier vendémiaire an IX, les départemens de la Roer, de la Sarre, du Mont-Tonnerre et de Rhin-et-Moselle, seront assimilés aux autres départemens de la République -- 3o. Arrêté relatif aux places et postes de guerre des quatre départemens de la rive gauche du Rhin, et des neuf départemens réunis le 9 vendémiaire an IV -- 4o. Arrêté qui détermine le montant et le mode de répartement des contributions directes et indirectes de l'an IX dans les quatre départemens en-deçà̀ du Rhin -- Notices des principaux codes, recueils de législation, et ouvrages de jurisprudence, qui se trouve chez Rondonneau, au Dépôt des lois, place du Carrousel. Scanner's note: Irregular Pagination. No copyright page found. No table-of-contents pages found. No title page found."""
