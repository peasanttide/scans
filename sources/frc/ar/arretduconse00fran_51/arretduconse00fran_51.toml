type = "pamphlet"
title = "Arrêt du Conseil d'état du roi, qui casse une assignation donnée au Châtelet, à la requête du sieur Goderneaux, contre le sieur Stoupe, imprimeur; fait défenses à toutes personnes de faire de semblables procédures contre les imprimeurs, lorsque les ouvrages par eux imprimés, l'auront été conformément aux règlemens de la Librairie, sauf en ce cas à ceux qui croiroient avoir à se plaindre desdits imprimeurs, à se pourvoir au Conseil; et en outre supprime un Mémoire imprimé du sieur Goderneaux, tant comme contraire à l'autorité de l'arrêt du Conseil du 5 février dernier, que comme injurieux, soit aux sieurs Missa et Raulin, censeurs royaux, soit audit Stoupe, Imprimeur, du 16 avril 1785"
language = "fr"
place = "A Paris"
date = "1785"
note = """Caption title. "Extrait des registres du Conseil d'état"--p. 1. Imprint from colophon. The memoir is not identified by title. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
