title = "Arrest du Conseil d'État du roi, par lequel, en interprétation d'un du 26 août précédent, est déclaré que les droits sur les galons d'or & d'argent, gazes, points d'Espagne, & autres ouvrages pareils, expédiés de Lyon à l'etranger par Marseille, seront perçus suivant les tarifs comme avant ledit arrêt, (qui les avoit fixés à six pour cent de la valeur, & à deux pour cent pendant les foires de Lyon,) jusqu'à ce qu'à commencer du premier octobre 1762, lesdites ouvrages ne payent qu'un pour cent de leur valeur, suivant l'art. VIII. de l'arrêt du 15 mai précédent : du 16 décembre 1760 : extrait des registres du Conseil d'État"
