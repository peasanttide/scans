title = "Arrests du Conseil d'état du roi, des 22 janvier & 4 mai 1773 : le premier, ordonne que par le sieur Colleau, Commissaire du Conseil à Valence, le procès sera fait & jugé souverainement, aux auteurs & complices de rébellion & voies de fair commises la nuit du 19 au 20 octobre précédent, sur le port de Marseille, contre les employés des fermes, par dix fraudeurs en tabacs, armés ... : le second, casse deux arrêts du Parlement d'Aix des 29 mars & 2 avril derniers, le premier desquels, sur l'appel à minima de la sentence du maître des ports ... l'autre, postérieur à la signification du premier arrêt du Conseil, avoit fait défenses de distraire la jurisdiction de dette cour ..."
