note = """Caption title. At head of title: No. 913. "Pour expédition conforme, signé Merlin, président; par le Directoire exécutif, le secrétaire général Lagarde"--P. 3. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, qui modère la taxe d'entretien des routes, sur les objets destinés à la fabrication des sels ou à la construction des salines -- 2o. Arrêté du Directoire exécutif, qui diminue la taxe d'entretien des routes pour les matiéres destinées à l'approvisionnement et à l'exploitation des mines de fer de Poullaouen. Scanner's note: No copyright page found. No table-of-contents pages found.  Text on back cover is upside-down. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
