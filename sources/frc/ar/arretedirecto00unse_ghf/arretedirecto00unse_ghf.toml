note = """Caption title. At head of title: Au nom de la République française. Signed: Gohier, président; par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. "No. 6, 7"--Bottom of p. [1]; "No. 991"--Top of p. [1]. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, concernant les conscrits enrôlés pour les troupes de la Marine, du 9 vendémiaire an VIII -- 2o. Loi qui proroge le délai accordé aux jurys chargés de prononcer sur les demandes de dispense de service militaire, du 12 vendémiaire an VIII. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
