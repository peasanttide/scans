title = "Arrest de la Cour des aydes, qui infirme une sentence des elûs de Poitiers, par laquelle en conséquence de la revendication faite par plusieurs particuliers des vins non-entamés, trouvés en la cour du nommé diacre & sa femme cabaretier à Poitiers, & faisant partie des vins saisis sur ledit diacre, & de leur affirmation, que le prix desdits vins par eux vendus audit diacre, leur est dû, main-levée le est faite desdits vins, ordonne qu'il sera passé outre à la vente desdits vins saisis, & les deniers en provenant délivrés au fermier des aydes, jusqu'à concurrence de la somme de 962 livres contenuë en sa contrainte : du 2 décembre 1695 : extrait des registres de la Cour des aydes"
