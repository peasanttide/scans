title = "Arrêt du Conseil d'État du roi, qui ordonne que les dispositions des lettres patentes du 4 novembre 1772, auront leur exécution dans la ville de Versailles & dépendances, en conséquence que les vernis, soit de France, soit de l'etranger, eux-de-vie aromatisées, eaux de cologne, de mélisse, menthe, & autres liqueurs spiritueuses venant de l'etranger, acquitteront à leur entrée dans ladite ville de Versailles & dépendances, les mêmes droits que ceux qui sont dûs sur les eaux-de-vie triples, ou sur l'esprit-de-vin pur : donné à Versailles, le 23 septembre 1775 : registré au bailliage, le 20 octobre suivant : extrait des registres du Conseil d'État"
