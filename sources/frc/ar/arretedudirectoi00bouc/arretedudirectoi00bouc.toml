title = "Arreté du directoire du département des Bouches du Rhone, sur la liberté des opinions même religieuses & la réimpression du rapport du ci-devant evêque d'Autun, & de l'opinion de M. Sieyes, ci-devant chanoine & vicaire-général de Chartres : du 30 mai 1791."
language = "fr"
place = "A Aix"
date = "1791"
note = """Caption title. Imprint from colophon. Not in Martin & Walter. Révolution française. "Rapport fait au nom du Comité de Constitution, à la séance du 7 mai 1791, relatif à l'arrêté du département de Paris, du 6 avril précédent, par M. de Talleyrand-Perigord, ancien evêque d'Autun, imprimé & envoyé par ordre de l'Assemblée nationale, dans tous les départemens"--P. 9-22. "Opinion de M. Emm. Sieyes, député de Paris à l'Assemblée nationale, le 7 mai 1791, en réponse à la dénonciation de l'arrêté du département de Paris, du 11 avril précédent, sur les edifices religieux & la liberté générale des cultes"--P. 23-40. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
