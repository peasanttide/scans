title = "Arrest de la cour de Parlement :"
language = "fr"
place = "A Paris"
date = "1717"
note = "Royal arms on t.p. The works in question are: [1] Apologie des curez du diocese de Paris, contre l'ordonnance de Monseigneur l'Archevesque de Rheims, du 4. janvier 1717; [2] Apologie des curez qui ont écrit des lettres contre l'acceptation de la Constitution Unigenitus, &c.; [3] Lettre d'un docteur à un missionnaire touchant l'appel; [4] Observations sur la lettre circulaire de M. de Bissy aux evesques de France. The Constituion referred to is the Papal bull Unigenitus. The Reflexions morales is part of Quesnel's French translation of the New Testament. Scanner's note: Paper fused to page 6."
