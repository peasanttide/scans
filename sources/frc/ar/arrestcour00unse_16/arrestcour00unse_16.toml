title = "Arrest de la cour de Parlement, qui, en ordonnant l'exécution des arrêts & réglemens, maintient les avocats du bailliage de Troyes dans le droit de plaider, seuls & privativement, les causes d'appel & celles en matiere de droit & de coutume, comme aussi de faire toutes les ecritures dans les procès & instances intitulés, griefs, causes & moyens d'appel, avertissement, contredits, salvations, & généralement toutes les ecritures du ministere des avocats, fait défenses aux procureurs du bailliage de Troyes de les y troubler, sous telles peines qu'il appartiendra, fait pariellement défenses aux procureurs du bailliage de Troyes de retirer d'entre les mains des avocats les pieces & procédures des causes, lorsque les qualités auront été posées par les avocats à l'audience : extrait des registres du Parlement : du dix juillet mil sept cent quatre-vingt-un"
