title = "Arrest de la cour de Parlement, qui fait défenses aux cabaretiers, propriétaires & locataires de maisons, dans la terre de Coulombs, de recevoir chez eux, pendant plus d'une nuit, des mendians & gens inconnus, & de leur donner retraite, sous peine de vingt livres d'amende, ordonne qu'il n'y aura que les habitans domiciliés dans ladite terre de Coulombs qui pourront profiter des secours de la maison de charité établie dans ladite terre, sans que les étrangers y puissent être admis : extrait des registres du Parlement : du treize juillet mil sept cent quatre-vingt-un"
