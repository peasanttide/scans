note = "Caption title (p. 1): Arrest de la cour de Parlement, du 9 avril 1764, qui condamne au feu deux imprimés, l'un ayant pour titre: Instruction pastorale de M. l'Archevêque de Paris, &c. l'autre: Lettre pastorale de M. l'Archevêque d'Auch, &c. Ordonne que tous ceux qui étoient membres de la ci-devant Société se disant de Jesus, au 5 juin 1762, prêteront le serment porté au présent arrêt dans le délai de huitaine; 7 faute de ce faire, seront tenus de sortir du royaume dans un mois. Extrait des .. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  Title on cover. <br />."
