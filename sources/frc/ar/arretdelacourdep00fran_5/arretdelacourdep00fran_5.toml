note = """Caption title. Imprint at foot of p. 32. Relating to: Propositions & conditions du prix & du payment du collier, a pamphlet fraudulently attributed to Marie Antoinette. Of the six persons accused in this action involving the Diamond Necklace Affair, the first named is Marc Antoine Nicolas, Comte de Lamotte: "accusé, absent & contumas.". Decision in the Diamond Necklace Affair. Imprint from colophon. Signatures: A-D⁴. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
