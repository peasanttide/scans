type = "pamphlet"
title = "Arrest contradictoire du Conseil d'état du roi, qui, sans s'arrêter aux oppositions & demandes des nommés Hubert, Belestre & Binet, capitaine, matelot & mousse du navire la Petite Marie-Anne, dans lequel s'étoient trouvés douze barils de faux tabac, omis dans la déclaration du capitaine, & en conséquence saisis par procès-verbal du 25 décembre 1767 & jours suivans, au port de la Hougue: casse la sentence de l'Élection de Valognes du 23 janvier suivant, par laquelle sans motifs, même spécieux, main-levée avoit été donnée de la saisie: confisque ... le navire & tout son contenu: condamne lesdits Hubert, Belestre & Binet ... en l'amende de mille livres ... Du 6 juin 1769."
