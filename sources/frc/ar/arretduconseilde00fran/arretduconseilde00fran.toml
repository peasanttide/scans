title = "Arrêt du conseil de Monseigneur comte d'Artois, portant que, conformément à l'art. LXIII du réglement arrêté en son conseil le 23 novembre 1779, pour la comptabilité des receveurs-généraux de ses domaines & bois, les intendans de ses finances seront tenus d'envoyer au surintendant d'icelles, avant le premier mars de chaque année qui suivra l'époque des ventes & adjudications des coupes des forêts de son apanage, l'etat tant des taxes qu'ils jugeront devoir être faites aux officiers des maîtrises, que des autres charges assignées sur le produit desdites forêts, pour le montant en être employé dans les etats des bois qui seront annuellement arrêtés pour chaque département : extrait des registres du conseil de Monseigneur : du premier mai 1785"
language = "fr"
place = "Paris"
