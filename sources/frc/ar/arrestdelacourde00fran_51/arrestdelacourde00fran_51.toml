title = "Arrest de la cour de Parlement, qui ordonne qu'à compter du premier mars 1785, les créanciers écrouant & recommandant seront tenus de consigner entre les mains des greffiers ou geoliers des prisons de la ville de Paris, & par avance, la somme de douze livres dix sols par mois, pour la nourriture des prisonniers qu'ils feront arrêter ou recommander, à moins que les prisonniers ne déclarent sur le registre tenu par les greffiers ou geoliers, qu'ils n'entendent recevoir de leurs créanciers aucuns deniers pour leurs alimens : extrait des registres du Parlement : du premier février mil sept cent quatre-vingt-cinq"
