title = "Arrest du Conseil d'état du roi, qui ordonne que les porteurs de reconnoissances du caissier de la Compagnie des Indes, portant promesse de fournir des billets de la dernière loterie de ladite compagnie, qui n'auront pas retiré leurs billets le 9 du présent mois, seront déchus du sort de la loterie, & ne jouiront que d'une rente viagère de dix pour cent du montant de leur reconnoissance. Du 3 mai 1770. Extrait des registres du Conseil d'état."
