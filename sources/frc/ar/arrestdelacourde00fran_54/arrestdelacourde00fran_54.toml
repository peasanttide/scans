title = "Arrest de la cour de Parlement, qui condamne Jean Cheuhens dit Fidelle à être ataché au carcan, par l'exéctueur de la haute-justice, a un poteau qui, pour cet effet, sera planté dans la place publique de la ville d'Angoulême, & y demeurer, un jour de marché, pendant deux heures, ayant écriteau devant & derriere portant ces mots, (Distributeur de faux écus,) & audit lieu, flétri d'un fer chaud en forme de trois lettres GAL. sur l'épaule droit, ce fait, mené & conduit ès galeres du roi, poury être détenu & servir le roi, comme forçat, le temps & espace de neuf ans : extrait des registre du Parlement, du quatorze juin mil sept cent quatre-vingt-cinq"
