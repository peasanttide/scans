title = "Arrest de la cour de Parlement, qui condamne François Metais à être attaché au carcan, par l'exécuteur de la haute-justice, à un poteau qui pour cet effet sera planté dans la place publique de la ville de Niort, & y demeurer, un jour de marché, pendant deux heures, ayant écriteau devant & derriere portant ces mots, (voleur en foire,) & audit lieu battu & fustigé nud de verges, & flétri d'un fer chaud en form des trois lettres GAL. sur l'épaul droit, ce fait, mené & conduit ès galeres du roi, pour y servir comme forçat le lemps & espace de trois ans : extrait des registres du Parlement : du vingt-un janvier mil sept cent quatre-vingt-cinq"
language = "fr"
