title = "Arrest de la cour de Parlement, qui ordonne que l'usage toléré dans quelques villes & villages du Barrois, ressortissant au bailliage de Bassigny, séant à la marche, de stipuler des intérêts d'un capital qui n'est point aliéné, continuera d'y avoir lieu lorsque le prêteur & l'emprunteur seront domiciliés dans lesdits lieux, seulement jusqu'à ce qu'il ait plu au roi d'en ordonner autrement, & sans que les paiemens d'intérêts, pour un capital non aliéné, puissent avoir lieu entre ceux qui ne sont pas domiciliés dans l'étendue desdites villes & villages : extrait des registres du Parlement : du six août mil sept cent quatre-vingt-deux"
language = "fr"
