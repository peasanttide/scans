note = """Caption title. At head of title: No. 138. At right of title: B. 39. No. 312. "Pour expédition conforme, signé Letourneur, président; par le Directoire exécutif, le secrétaire général, Lagarde"--P. 3. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, qui fixe l'époque à laquelle il ne pourra plus être fait usage de papier timbré en noir, dans les départemens réunis par la loi du 9 vendémiaire dernier, du 18 germinal, an IV. B. no 39. No. 312 -- 2o. Arrêté du Directoire exécutif, additionnel à celui du 18 pluviose, an IV, sur le mode de promulgation des lois dans les neuf départemens qui composaient la ci-devant Belgique, du 20 germinal, an IV. B. 39. No. 316 -- 3o. Arrêté du Directoire exécutif, concernant le jugement des instances relatives aux douanes dans les départemens réunis par la loi du 9 vendémiaiare, an IV, du 23 germinal, an IV. B. 39. No. 323. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
