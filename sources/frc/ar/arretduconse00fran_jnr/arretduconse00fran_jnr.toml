type = "pamphlet"
title = "Arrêt du Conseil d'État du roi, qui ordonne que les juges des monnoies connoîtront privativement aux lieutenans généraux de police & tous autres officiers, de tout ce qui concerne l'orfévrerie & le fait de monnoie : du 20 janvier 1703 : extrait des registres du Conseil d'État."
language = "fr"
place = "A Paris"
date = "1781"
note = """Caption title. Imprint from colophon. Signatures: [A]⁴. Head-piece. "Déclaration du roi, portant que l'arrêt du Conseil d'État du 20 janvier 1703, auquel Sa Majesté n'a entendu déroger, sera exécuté selon sa forme & teneur, nonobstant tous les termes généraux des édit & déclaration des mois de novembre 1706 & 18 octobre 1707, qui seront au surplus exécutés": pages 6-8. No. 8 and 15 (2 copies) of 45 titles bound together; no. 8 lacks pages 3-6."""
