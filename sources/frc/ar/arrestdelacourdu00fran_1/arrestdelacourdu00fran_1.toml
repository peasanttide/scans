title = "Arrest de la Cour du Parlement, qui condamne Guillaume Reverchon, garçon perruquier, Edme Claude Vignon, dit Parisien, ci-devant garçon maréchal, Pierre Tetefort, garçon tailleur, Alexis Delaunay, dit Beau-Soleil, menuisier en voitures, Pierre Grandy, dit le Petit-Borgne, ferrailleur, à être rompus vifs dans la principale cour du château de Bicêtre, & Jean Chaty à assister à l'exécution, ayant la corde au col, ensuite flétri des lettres GAL. sur l'épaule gauche, & aux galeres à perpétuité, pour excès, violences, voies de fait à toute outrance, & assassinat, par complot formé & de desein prémédité, commis envers les nommés Medecée & Pelletier, dit le Grand-Thomas : extrait des registres du Parlement : du vingt-sept septembre mil sept cent soixante-quinze"
