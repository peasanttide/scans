date = "1796"
note = """
Caption title. At head of title: No. 123. At right of title: B. 36. No. 273. "Pour expédition conforme, signé Le Tourneur, président; par le Directoire exécutif, le secrétaire-général, Lagarde"--P. 2. Imprint from colophon. "B. 36. No. 275"--P. 2, left margin. Not in Martin & Walter. Révolution française. Io. Arrêté du Directoire exécutif, relatif à la révision des congés accordés aux citoyens de la première réquisition, faite depuis la loi du 4 frimaire, jusqu'à son arrêté du 4 ventose, du 29 ventose, an IV -- 2o. Arrêté du Directoire exécutif, concernant les conducteurs et charretiers employés dans les équipages militaires, du 7 germinal --3o. Arrêté du Directoire exécutif, portant que les jeunes gens de la première réquisition, seront admis au concours public des écoles de santé de Strasbourg et de Montpellier, du 10 germinal. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover. 
Only one numbered page."""
