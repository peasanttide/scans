place = "A Paris"
date = "1781"
note = """Caption title. Imprint from colophon. Signatures: [A]⁴. Head-piece. "Déclaration du roi, portant que l'arrêt du Conseil d'État du 20 janvier 1703, auquel Sa Majesté n'a entendu déroger, sera exécuté selon sa forme & teneur, nonobstant tous les termes généraux des édit & déclaration des mois de novembre 1706 & 18 octobre 1707, qui seront au surplus exécutés": pages 6-8. No. 8 and 15 (2 copies) of 45 titles bound together; no. 8 lacks pages 3-6. Scanner's note: No copyright page found. No table-of-contents pages found.  Uneven binding.  Skewed text.  Damaged, stained, torn and/or loose pages.  Title is on the cover page.  Page numbers 3-6 are missing from the book."""
