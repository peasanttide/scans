date = "1789"
note = """Half title. Caption on p.[3]: Arret de la cour du Parlement de Rennes, rendu les chambres assemblées; qui condamne trois imprimés ayant pour titres: 1⁰. Avis aus députés des villes & communes, aux etats de Bretagne; 2⁰. Avis aux Parisiens; 3⁰. Les Gracches françois; à être lacérés & brulés par l'exécuteur de la haute-justice: fait défenses à tous citoyens de former des assemblées autres que celles autorisées par les ordonnances, arrêts & règlemens, sous le nom de corporations, corps, communes, & tous autres, d'attenter à la liberté des suffrages des municipalités: fait pareilles défenses aux municipalités d'admettre à leur délibération ancuns [i.e. aucuns] citoyens autres que ceux qui y ont droit. Des 7 & 8 janvier 1789. Extrait des registres de Parlement. "Arret du conseil d'état du peuple de Rennes, qui casse & annulle l'arrêt du Parlement de Rennes, du 8 janvier, qui condamne au feu l'Avis aux Parisiens, les Gracches françois, &c. & défend à tous particuliers de s'assembler. Du 9 janvier 1789": p. [26]-29. The first condemned work is Martin & Walter IV 2: 2529; the second, Martin & Walter IV 2: 1553; the third is not in Martin & Walter. Not in Martin & Walter. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
