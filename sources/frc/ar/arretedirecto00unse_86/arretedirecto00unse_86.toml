title = "Arrêtés du Directoire exécutif concernant la radiation de la liste des emigrés : des 26 fructidor an V, 20 vendémiaire, 8 brumaire et 25 germinal an VI de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1798"
note = """Caption title. At head of title: No. 562. "Pour expédition conforme, signé L.M. Réveillere-Lépeaux, président; par le Directoire exécutif, le secrétaire général, Lagarde"--P. 6. Imprint from colophon. "No. 12"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, qui ordonne la formation d'un bulletin des demandes en radiation de la liste des émigrés, du 26 fructidor an V -- 2o. Arrêté du Directoire exécutif, qui ordonne la formation d'un recueil alphabétique des individus rayés de la liste des émigrés, du 26 fructidor an V -- 3o. Arrêté du Directoire exécutif, additionnel à celui du 26 fructidor an V, concernant les radiations de la liste des emigrés, du 20 vendémiaire an VI -- 4o. Arreté du Directoire exécutif, qui prescrit de nouvelles formalités pour la radiation de la liste des emigrés, du 8 brumaire an VI -- 5o. Arrete du Directoire exécutif, portant que l'état des biens appartenant aux personnes inscrites sur les listes d'emigrés, sera joint aux demandes en radiation, du 25 germinal an VI. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
