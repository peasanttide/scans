note = """Prospectus for "Feuille de Strasbourg, ou, Journal politique et littéraire des rives du Rhin," which began publication in 1792. Caption title. "Le prix de l'abonnement pour les neuf mois de cette année est de dix-huit livres & de six livres par trimestre, franc de port dans tout le royaume. On s'adressera à Strasbourg à la Librairie académique & à Paris à Fuchs, quai des Augustins, no. 27 ... Nous commencerons le 15 avril les envois de ce journal.". Printed in double columns. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
