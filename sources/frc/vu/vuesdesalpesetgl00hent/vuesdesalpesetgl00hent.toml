note = """Prospectus for Hentzy's "Vues remarquables des montagnes de la Suisse.". Caption title. Printer from colophon. "Permis d'imprimer ce 3 octobre 1783"--P. 8. "On souscrit à Paris, chez MM. Bost & Horion, banquiers, rue Montmartre, chez M. Graff, rue des Deux Portes Saint-Saveur au magasin de dentelles, chez Prault, imprimeur du roi, quai des Augustins à la rue Pavée à l'Immortalité, chez M. Janinet, graveur, place Maubert, hôtel de la Limace, n°. 17, et chez M. David, graveur, rue des Noyers"--P. 8. Includes prices. All booksellers on p. 8 crossed out in ink except for M. Graff and M. Janinet. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
