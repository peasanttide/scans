note = """Prospectus for Brion de la Tour's "Atlas itinéraire portatif de l'Europe". Caption title. "La souscription est ouverte, & l'ouvrage se débite chez M. Langlois, libraire, rue du Petit Pont, près de la fontaine S. Severin, & chez l'auteur, même maison, au premier sur le devant"--P. 8. Head- and tail-pieces. "Le prix de chaque section, contenant 12 cartes enluminées, est de 3 liv. Les personnes qui ne desireront qu'une seule ou plusieurs routes, au-dessous de ce nombre de cartes, payeront chaque feuille à raison de 6 s."--P. 8. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
