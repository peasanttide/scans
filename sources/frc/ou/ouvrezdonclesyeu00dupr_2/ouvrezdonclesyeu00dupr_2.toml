date = "1789"
note = "Caption title. Authorship claimed by Duprat in his Le comte Duprat devenu théologien. Date of publication based on another edition. Cf. Barbier, A.A. Ouvrages anonymes, III, 756. Barbier identifies d'Agoult as the author of this work and Biron and Favras as the supposed authors at the time of publication. Martin & Walter attribute it variously to d'Agoult and Duprat. Cf. Barbier, A.A. Ouvrages anonymes, III, 756; Martin & Walter. Révolution française, I, 64; II, 12293. Variant of Martin & Walter. Révolution française, I, 64; II, 12293. Scanner's note: Title on cover."
