title = "Décrets de la Convention nationale, relatifs aux pensions et secours accordés aux veuves et parens des défenseurs de la patrie"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. Signed, p. 2.: Mallarmé, président; Meaulle et Durand-Maillane, secrétaires. Imprint from colophon. Décrets dated 4 juin 1793 - 1 juin 1794. "Secours publics-militaires"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. Décret relatif aux pensions de retraite à accorder aux généraux, sous-officiers, volontaires et soldats que des blessures auront mis hors d'état de continuer et de reprendre leurs services, du 6 juin 1793 ... (No. 1031) -- Décret additionel au précédent, du 27 thermidor ... (No. 57*) -- Décret qui règle le mode de paiement des pensions, indemnitiés et secours accordés aux défenseurs de la patrie et à leurs familles, du 21e. jour de pluviôse ... (No. 2169) -- Décret de la Convention nationale, du 13 jour de prairial ... qui détermine le mode de distribution des secours dûs aux familles des defenseurs de la patrie (No. 2382) -- Décret qui accorde des secours aux familles des infirmiers morts pendant l'excercice de leurs fonctions, du 7e. jour de floréal ... (No. 2331). Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
