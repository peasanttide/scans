note = """Caption title. At right of title: No. 2235. Signed: Gohier, président du Conseil exécutif provisoire. Imprint from colophon. Not in Martin & Walter. Révolution française. "Tableau des appointemens des officiers de sante de diverses classes, & des sous-employés & infirmiers attachés aux hôpitaux ambulans & sédentaires à la suite des armées, & des hôpitaux militaires fixes, conformément au décret du 3 ventôse, an IIe. de la République"--P. 14. "Réglement concernant les hôpitaux militaires de la République française, décrété par la Convention nationale le 7 ventôse, an IIe. de la République"--P. 15-72. Scanner's note: Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages. No title page found. No copyright page found. No table-of-contents pages found."""
