place = "S.l."
date = "1664"
note = "Concerns certain books condemned by the Inquisition, in a decree dated 9 Nov. 1609. The letter of Monsieur Paul, juiconsulte, dated Caen, 20 Dec. 1663, directed to the President au Grand Conseil, attributes the actions to the influence of the Jesuits. The letter of the Faculté de théologie, Université de Paris is dated 1 Dec. 1554. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover page. <br />."
