date = "1788"
note = """Prospectus for Honoré-Gabriel de Riquetti Mirabeau's "De la monarchie prussienne, sous Frédéric le Grand.". False imprint; possibly printed in Paris. Cf. ESTC T83509. "4 volumes in-4°. de cinq à six cents pages chacun; 8 volumes in-8°. de trois à quatre cents pages chacun. Imprimés avec les mêmes caractères et sur le même papier que ce prospectus, ornés d'un portrait de Frédéric le Grand, et accompagnés d'un atlas contenant quatre-vingt-treize planches, dix cartes géographiques,et plus de cent tableaux numériques.". "Prix de l'in-4°, 78 liv. Prix de l'in-8°, 50 liv.". Advertisement laid in: Rue Helvetius, ci-devant des Récollets, n°. 23, au coin du cul-de-sac, a Versailles. Basan, marchand, tient magasin de toutes sortes de papiers fins .. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
url = "https://archive.org/details/delamonarchi00leja"
subject = [
    "Mirabeau, Honoré-Gabriel de Riquetti, comte de, 1749-1791",
    "Booksellers and bookselling",
]

