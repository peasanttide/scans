note = """Prospectus for Bourrit's "Description des Alpes pennines et rhetiennes". "Le prix de la souscription est de 9 liv. argent de France ... Ceux qui n'auront pas souscrit payeront 12 livres. La souscription sera ouverte jusqu'au premier avril 1780. On peut souscrire à Paris chez l'auteur, Hôtel Bar-le-Duc, rue Calandre, près du Palais ... & chez M. Mérigot, libraire, quai des Augustins, près du Pont-Neuf."--P. 7. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.   <br />."""
