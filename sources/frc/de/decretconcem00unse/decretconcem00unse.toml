type = "pamphlet"
title = "Décret concernant la recette, la comptabilité & l'emploi des fonds provenant de la vente des bois appartenant à des communautés d'habitans : du 30 juin 1793-4 juillet"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At right of title: No. 11593. Signed: Bréard, ex-président; Cambacérés & Michaud, secrétaires. Imprint from colophon. "Biens communaux"--Bottom of p. [1]. Décret concernant la recette, la comptabilité & l'emploi des fonds provenant de la vente des bois appartenant à des communautés d'habitans, du 30 juin 1793-4 juillet -- Decret no. 1364. Interprétatif d'un article de la loi du 10 juin sur le mode de partage des biens communaux, du 8 août 1793-13 du même mois -- Decret no. 1633. Qui ordonne que les procès des communes, à raison des biens communaux & patrimoniaux, seront jugés par la voie de l'arbitrage, du 2 octobre 1793 -- Decret no. 1861. Relatif au mode de partage des biens communaux, du 19 brumaire-20 du même mois -- Decret no. 2083. Relatif au partage de la coupe des bois communaux, du 26 nivôse-premier pluviôse -- Decret no. 2160. Qui maintient provisoirement les buax des bois & forêts dans la propriété desquels les communes sont rentrées ou renteront à l'avenir -- Loi qui ordonne le versement à la Trésorerie nationale, des fonds provenant de la vente des quarts de réserve des bois appartenant aux communes, du 13 messidor, l'an deuxième de la République française, une & indivisible. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
url = "https://archive.org/details/decretconcem00unse"
