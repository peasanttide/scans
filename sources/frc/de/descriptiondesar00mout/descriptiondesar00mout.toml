note = """Catalog listing individual volumes of "Description des arts et métiers", issued by the Académie royal des sciences, 1761-1789, and sold by Moutard. Caption title. Volumes listed as "sous presse" on p. [4] were published in 1780. "Le prix des cahiers séparés est diminué de deux cinquiemes, & celui de la collection entiere est réduit à moitié, & n'est que de 639 liv. pour les 86 cahiers"--P. [1]. Original and new discounted prices in parallel columns. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
