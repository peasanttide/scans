title = "Décret de la Convention nationale, du 16e. jour de brumaire, an second de la République française, une & indivisible, portant que les baux de biens nationaux produisant des grains, du foin ou des légumes à gousse, seront désormais payés en nature"
language = "fr"
place = "A Paris"
date = "1793"
note = """Caption title. At right of title: No. 1943. Signed: Destrounelles; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. "Registre des déclarations faites par les fermiers des biens nationaux provenant des émigrés ou de toute autre origine, de la nature & de la quantité des denrées énoncées en l'article 1er. de la loi du ******* 1793, qu'ils ont recueillies en la présente année 1793, & des quantités de ces denrées restant à la disposition de la nation, & qu'ils liveront dans les magasins, au lieu du prix en derniers stipulé par leurs baux"--P. [10]-[11]. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/decretdelaconven00fra_u5y"
