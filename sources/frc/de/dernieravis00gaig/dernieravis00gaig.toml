note = """Prospectus for "Encyclopédique poétique, ou, Recueil complet de chef-d'oeuvres de poésie sur tous les sujets possibles, depuis Marot, Malherbe, &c. jusqu'à nos jours," edited by Alexandre Toussaint de Gaigne. Caption title. Printer statement from colophon. "Permis d'imprimer ... ce 3 décembre 1778"--P. 6. "Les dix-huit volumes avec estampes, 79 liv. 4 sols; neuf volumes 37 liv. 12 sols; six volumes 25 liv. 14 sols; trois volumes 12 liv. 17 sols. M. de Gaigne prie de nouveau MM. les souscripteurs de vouloir bien réitérer leurs ordres"--P. 6. Accompanied by blank form: Modèle de soumission de souscription pour une Encyclopédie poétique. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
