title = "Décret de la Convention nationale, du 2e. jour de nivôse, an second de la République française, une & indivisible, qui ordonne l'exécution des traités existant entre la France & la république de Gênes"
language = "fr"
place = "A Paris"
date = "1793"
note = "Caption title. At right of title: No. 1996. Signed: Paré; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. Asserts that the Genoese are not to be held responsible for the massacre aboard the French frigate Modeste, which was carried out by the English in the port of Genoa. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
