language = "fr"
place = "A Paris"
date = "1793"
note = "Caption title. At right of title: No. 2143. Signed: Destournelles; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. Books, manuscripts, and parchments destined to be destroyed are instead to be used to make ammunition. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages. Only one numbered page."
