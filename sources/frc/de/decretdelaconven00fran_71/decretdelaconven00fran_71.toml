title = "Décret de la Convention nationale, du 12 août 1793, l'an second de la République françoise, une & indivisible, qui determine le mode d'amalgame pour l'infanterie de la République, suivi du règlement à observer par les officiers généraux qui en seront chargés"
language = "fr"
place = "A Paris"
date = "1793"
note = """Caption title. At right of title: No. 1466. Signed: Paré; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. "Instruction pour les officiers-généraux chargés d'opérer la formation des régimens d'infanterie & des bataillons de volontaires nationaux en demi-brigades, conformément à la loi du 21 juin dernier"--P. 22-38. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
