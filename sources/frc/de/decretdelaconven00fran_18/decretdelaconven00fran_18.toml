title = "Décret de la Convention nationale, du 3 avril 1793, l'an second de la République françoise, lu au directoire du département des Vosges, et consigné sur ses registres le 6 du même mois, qui déclare que Dumouriez, traître à la patrie, est mis hors de la loi, autorise tout citoyen à courir sus & assure une récompense de trois cent mille livres & des couronnes civiques à ceux qui s'en saisiront, & l'amèneront à Paris mort ou vif"
language = "fr"
place = "A Épinal"
date = "1793"
note = "Caption title. At head of title: Departement des Vosges. Juillet 1790. République française. At right of title: No. 674. No. 509 de la consignation. Signed: Garat; countersigned: Gohier. Imprint from colophon. Variant of Martin & Walter. Révolution française, IV:2, 4423. Scanner's note: Irregular Pagination. No title page found. No copyright page found. No table-of-contents pages found."
