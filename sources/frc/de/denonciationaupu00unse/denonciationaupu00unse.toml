type = "pamphlet"
title = "Denonciation au public, a l'occasion de quelques écrits anonymes : particuliérement d'une comédie ayant pour titre: La cour plénière, calomnieusement attribués a Monsieur Bergasse ; avec des réflexions sur le danger de ce qu'on appelle bulletins a la main, & les moyens sourds qu'employe une cabale, pour favoriser & faire renaître les anciens abus de la police ; suivie d'une Lettre missive aux notables ; [motto: 4 lines]"
language = "fr"
place = "A Paris"
date = "1788"
note = """La cour plénière is usually attributed to H.M.N. Duveyrier. "Lettre missive écrite aux notables, en leur adressant cette dénonciation": 4 p. at end; dated and signed: Paris ce 12 novembre 1788. Signé [blank]. Not in Martin & Walter [edition 2: marked "Seconde édition"; last line on p. v: sa charge, combien ce Duum-Virat doit dé-]. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
url = "https://archive.org/details/denonciationaupu00unse"
subject = [
    "Bergasse, Nicolas, 1750-1832",
    "Duveyrier, Honore Marie Nicolas, Baron, 1753-1839",
    "Cour plénière",
]
