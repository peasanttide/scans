type = "pamphlet"
title = "Dénonciation au public a l'occasion de quelques écrits anonymes, particulierement d'une comédie ayant pour titre, La cour plénière, calomnieusement attribués à M. Bergasse : avec des détails sur sa retraite en Suisse, l'époque & les motifs de cette retraite, des réflexions sur le danger de ce qu'on appelle bulletins a la main, &c, & les moyens sourds qu'employe une cabale pour favoriser & faire renaître les anciens abus de la police : suivi de la Lettre missive aux notables."
language = "fr"
place = "A Paris"
date = "1788"
note = """Attributed to Bergasse. Cf. Reboul. La cour plénière is usually attributed to Honoré Duveyrier. "Lettre missive écrite aux notables, en leur adressant cette dénonciation"--4 p. at end; signed: Patriophile. Not in Martin & Walter. Révolution française. Reboul, R.M. Anonymes, pseudonymes, et supercheries littéraires. Includes bibliographical references. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Reboul, R.M.  Anonymes, pseudonymes, et supercheries littéraires,  2129. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover. Irregular pagination."""
url = "https://archive.org/details/denonciationaupu00tall_0"
subject = [
    "Bergasse, Nicolas, 1750-1832",
    "Duveyrier, Honoré, baron, 1753-1839",
    "Libel and slander",
]
extent = "viij, 44, 4 p. ; 22 cm."

