id = "decretdelaconven00fra_ns3"
type = "pamphlet"
title = "Décret de la Convention nationale, du 11 septembre 1793, l'an second de la République française, une et indivisible, qui défend la vente, cession, négociation ou transport des titres actuels constatant les créances non viagères sur la nation, à compter du premier octobre prochain, qui règle l'échange de ces titres contre un extrait provisoire d'inscription, et autorise les porteurs des extraits provisoires d'inscription, à les échanger contre un bon admissible, pendant l'année 1793, en paiement des domaines nationaux adjugés depuis le 24 août dernier, à la charge de fournir en même temps pareille somme en assignats"
language = "fr"
place = "A Paris"
date = "1793"
note = "Caption title. At right of title: No. 1514. Signed: Gohier, président du Conseil exécutif provisoire. Imprint from colophon. Not in Martin & Walter. Révolution française. No. 1er. Modéle de l'inscription provisoire sur le grand-livre de la dette publique -- No. II. Modèle de l'acte de vente ou cession -- No. III. Administration des domaines nationaux. Modèle du bon applicable, pendant tout l'année 1794, au paiement des domaines nationaux qui ont été ou seront adjugés après le 24 août 1794 -- No. IV. Modèle de récépissé à fournir par les receveurs de district. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."
