type = "pamphlet"
title = "Dénonciation faite au Directoire exécutif, par le ministre de la police générale, d'une affreuse conspiration tendante à renverser le gouvernement afin de rétablir un roi : liste des noms des conspirateurs au nombre desquels se trouvent des banquiers, et le total des sommes immenses qu'ils ont fournies pour faire la contre-révolution : déclaration précieuse du chef des conspirateurs qui se trouve être une actrice : saisie des registres et d'une écharpe de représentant du peuple et de toute la correspondance : interrogatoire de tous ces scélérats devant le directeur du Jury d'accusation au Palais de justice."
language = "fr"
place = "Paris"
date = "1798"
note = "Caption title. Signed, p. 4: Duval. Imprint from colophon. Place of publication from Martin & Walter. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 12575. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover page."
