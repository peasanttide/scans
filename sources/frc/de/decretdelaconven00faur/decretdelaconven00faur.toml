title = "Décret de la Convention nationale, et proclamation fait par Balthazard Faure, représentant du peuple, envoyé par la Convention nationale, dans les départemens de la Mozelle, la Meurthe, les Vôges & la Haute-Marne, pour assurer & accélérer l'exécution du décret relatif à une levée de chevaux dans tout le l'étendue de la République : du septième jour de la seconde décade du premier mois de l'an deuxième de la République française"
language = "fr"
date = "1793"
note = "Caption title. Proclamation signed, p. 8, in ms: Jeanblair, delegé du representant du peuple. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
