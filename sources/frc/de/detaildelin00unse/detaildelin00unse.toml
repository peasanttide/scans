title = "Détail de l'infame conspiration des poudres, qui sera jugée aujourd'hui, par le premier conseil de guerre de la 17eme division militaire, séant rue du Cherche-Midi : crimes affreux dont les accusés sont prévenus, tendant à livrer de la poudre aux Chouans : ordre donné par Barras, alors directeur : lettre curieuse, écrite à ce sujet par l'ex-directeur Moulins : liste des noms des accusés, et de leurs dénonciateurs."
