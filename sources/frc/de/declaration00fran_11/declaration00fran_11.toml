title = "Declaration dv roy, portant reglement pour le nouueau prix donné aux especes d'argent legeres & rognées: ensemble pour l'obseruation des prix de l'or & argent employez aux ouurages d'orfeurerie. Et defenses de fondre les monoyes, & les transporter ny autres matieres d'or & d'argent hors du royaume. Verifiée en la Cour des monoyes le 30. octobre, mil six cens quarante."
language = "fr"
place = "Paris"
date = "1640"
note = """"Evalvation ov tarif du prix du marc & diminutions des pieces d'argent legeres & rongnées": p. 20-27. "Instrvction povr la connoissance du marc, & des poids qui le composent": p. 29. Dated at Versailles, October 29, 1640. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, marked, torn, stained and/or loose pages. Uneven binding. Skewed text. Some text may be lost in the binding or extend off of the edge of the page."""
