title = "Décret de la Convention nationale, du 19e. jour de nivôse, an second de la République française, une & indivisible, portant que l'infanterie de la République sera organisée en demi-brigades"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At right of title: No. 2044. Signed, p. 2: Bouchotte; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. "Instruction qui donne la Convention nationale aux représentans du peuple à envoyer aux armées pour y établir l'embrigadement des corps d'infanterie, régler les comptes d'administration de chacun de ces corps, & fixer ces bases d'administration, pour l'avenir, par demi-brigades. Du 21 nivôse ... "--P. 3-25. "Décompte de chaque bataillon a faire, pour le transmettre au Comité militaire de la Convention nationale"--P. 26-31. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
url = "https://archive.org/details/decretdelaconven00fra_0ov"
subject = [
    "France. Armée. Infanterie",
    "Military administration",
]
