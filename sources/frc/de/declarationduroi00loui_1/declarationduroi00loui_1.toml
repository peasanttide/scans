note = """Caption title. Signed: Donné au mois de juillet de l'an de grâce, 1795, et de notre règne le premier ... Louis. "La déclaration ... sera publiée dans notre armée et dans toutes les paroisses ... [signed] le chevalier Charette"--At end. Vignette at head of title of royal arms surrounded by bunting and rays of light. Two variant editions exist, one that is not signed by the chevalier Charette, one with rectangular vignette at head of title with royal arms surrounded by stars. Martin & Walter. Révolution française. BN. On assuming the title of King of France, at the death of Louis XVII. Bibliography: Martin & Walter.  Révolution française,  III, 21942. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />Text extends off page edges at top of page.<br /><br />."""
