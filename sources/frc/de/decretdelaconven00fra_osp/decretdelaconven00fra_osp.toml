note = """Caption title. At right of title: No. 1521. Signed, p. 10: Robespierre, président. Imprint from colophon. Not in Martin & Walter. Révolution française. "Décret du 7 septembre 1793, l'an deuxième de la République, une & indivisible"--P. 29; signed: Destournelles; countersigned: Gohier. Modèle de la déclaration pour un célibataire, ou un homme veuf, ou une veuve sans enfans ... -- Modèle de la déclaration pour un citoyen marié ... -- Modèle de la matirce du rôle de l'emprunt forcé ... -- Modèle du rôle de perception de l'emprunt force -- Modèle du récêpissé de l'emprunt forcé pour les sommes qui seront payées avant le 1er. mars 1794 ... -- Modèle du récépissé de l'emprunt forcé pour les sommes qui seront payées après le 1er. mars 1794... indivisible. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
