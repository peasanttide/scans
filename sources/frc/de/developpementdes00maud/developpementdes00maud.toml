title = "Développement des moyens qu'emploie la citoyenne Prudence-Catherine Demarest, ci-devant épouse Fremin, aujourd'hui épouse Courtecuisse, de lui autorisée, pour faire réformer le jugement rendu par le seconde section du tribunal civil du département du Nord, le 28 frimaire, an 5, qui annulle l'acte de son divorce : contre le citoyen Fremin, son ci-devant époux, cité sur appel."
language = "fr"
place = "A Douai"
date = "1796"
