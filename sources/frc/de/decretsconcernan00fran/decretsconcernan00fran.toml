type = "pamphlet"
title = "Décrets concernant la répression des conspirateurs, l'éloignement des ex-nobles, des étrangers, et la police générale de la République : des 27e. et 28e. jours de germinal, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. Imprint from colophon. "Recueil sur les ex-nobles et étrangers"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. 1er. Décret, du 27 germinal, (No. 2297) -- IIème. Décret, du 28 germinal -- Decret contenant une nouvelle rédaction de l'article VIIII du décret du 27 germinal sur la police générale, du 29 germinal, an IIe., (no. 2306) -- Extraits du registre des arrêtés du Comité de salut public de la Convention nationale -- Décret portant que les personnes compries dans la loi du 26 germinal, peuvent sortir des communes qu'elles habitent, pour aller résider das aune aute, du 17 thermidor, an II, (No. 52 et 53-I*) -- Arrêté du Comité de salut public relatif aux citoyens, qui n'étant point compris dans les dispositions du décret des 26 et 27 germinal, desirent rentrer à Paris, du 4 fructidor, l'an second ... -- Arrêté du Comité de législation, portant que la citoyenne Petit veuve d'Anglure n'est polnt [i.e. point] comprise dans la loi du 27 germinal, extrait du registre des séances du Comité de législation, du 2 vendémiaire de l'an troisième de la République française. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
