note = """Martin & Walter IV 2: 5088. Premier appel, du 15 janvier 1793. La question a été ainsi posée: "Louis est-il coupable de crime de lèze-nation, et de conspiration contre la sureté de l'état" -- Second appel, du 16 janvier 1793. Sur la question: "Y aura-t-il appel au peuple, oui ou non["] -- Troisième appel, du 17 et 18 janvier 1793. La question a été ainsi posée: "Quelle peine à infliger à Louis?" -- Discussion sur la question du sursis proposé à l'exécution du jugement porté contre Louis XVI. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page is on the cover. Skewed text. Damaged, stained, and/or loose pages."""
