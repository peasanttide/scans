type = "book"
title = "[Declaration du roy, portant que les monnoyes d'argent legeres ne seront exposées que pour leur iuste prix selon leur poids & titre, & que tous les poids dont on se seruira pour les monnoyes, seront aiustez & estallonnez sur ceux de la Cour des monnoyes dans vn mois : registrée en la Cour des monnoyes le 24. octobre 1640 : ensemble l'arrest de ladite cour, pour le fait de l'estalonnement desdits poids]."
language = "fr"
place = "Paris"
date = "1640"
note = """Title supplied from another ed. of the same declaration described in: NUC pre-1956, NF 0314932; Lindsay & New. French political pamphlets, 6410. Cramoisy is named in the privilege and "extraict" at end. The present ed. has index on p. [84-85]. The declaration is dated Oct. 18, 1640. Signatures: A-L⁴. "Les portraits, poids & prix des especes d'or & d'argent, tant de France qu'estrangers, ausquelles le roy a donné cours par sa declaration du 25. iuin 1636": p. 12-82. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, marked, torn, stained and/or loose pages. Uneven binding. Skewed text. Some text may be lost in the binding or extend off of the edge of the page."""
url = "https://archive.org/details/declaration00fran_8"
