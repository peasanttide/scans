title = "De la constitution monétaire : précedé d'observations sur le rapport du Comité des monnoies, & suivi d'un projet de lois monétaires : présenté a l'Assemblée nationale /"
language = "fr"
place = "A Paris"
date = "1790"
note = """"N.B. On a placé en notes, à la suite de cet ouvrage, ce qui doit servir de prevue, donner plus de développement, ou exiger plus d'attention.". "De la constit. monétaire"--Bottom of p. xvij. "De la constitution monétaire"--Bottom of p. xxij. Martin & Walter. Révolution française. Includes bibliographical references. "Tableaux des expériences solemnelles faites in 1788, par les plus habiles essayeurs, en présence de neuf commissaires, en exécution d'un arrêt du Conseil d'État du roi, du premier mars 1788, pour constater le véritable titre commun des Louis fabriqués depuis le mois de janiver 1726, jusqu'au mois d'octobre 1785"--[2] p. on folded leaf. "Post-scriptum, ou, Observations sur un brochure apologétique de M. Solignac"--P. [137]-154. Bibliography: Martin & Walter.  Révolution française,  III, 24469. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
