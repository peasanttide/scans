title = "Description générale et particulière de la France"
language = "fr"
place = "Paris"
date = "1779"
note = """Prospectus for Jean-Benjamin de Laborde's "Description générale et particulière de la France.". Caption title. Printer statement and date of publication from colophon. "On souscrit à Paris chez les sieurs Née & Masquelier, rue des Francs-Bourgeois, porte Saint-Michel. A Versailles, chez Fournier, libraire. A Marseille, chez Moissy, libraire. A Lyon, chez les Frères Périsse, libraires. A Grenoble, chez Cuchet, libraire. A Dijon, chez Frantin, imprimeur du roi, & Chaussier, marchand d'estampes. A Avignon, chez M. Arthaud, rédacteur du Courier. A Rheims, chez Casin, libraire. A Orléans, chez Couret de Villeneuve, libraire. A Lille, chez Jacquez, libraire. A Bordeaux, chez les Frères Labottiere. A Strasbourg, chez Bawer & Treuttel, libraires. A La Haye, chez Gosse, libraire. A Bruxelles, chez les demoiselles Le May & chez Flon, libraires. A Gand, chez Coquit, libraire. A Vienne en Autriche, chez M. Artaria, marchand d'estampes. A Mayence, chez Le Roux fils, libraire. A Turin, chez les Frères Reycends. A Basle & pour toute la Suisse, chez Mechel, marchand d'estampes à Basle. A Londres, chez M. Swinton, propriétaire du Courier de l'Europe. A Rome, chez M. Le Fevre de Revels. Et dans les autres villes du royaume & de l'Europe, on s'adressera aux principaux libraires, qui en feront passer l'avis, franc de port, à Paris chez lesdits sieurs Née & Masquelier"--P. 4. "Les souscripteurs payeront la somme de 6 livres en recevant chaque livraison du texte, ce qui fera 24 liv. par chaque volume"--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page."""
url = "https://archive.org/details/descriptiongener00labo"
subject = [
    "Laborde, M. de (Jean-Benjamin), 1734-1794",
    "Booksellers and bookselling",
]

