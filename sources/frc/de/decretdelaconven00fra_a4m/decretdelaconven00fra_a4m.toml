note = """Caption title. Signed and countersigned by Garat. Place of publication and printer statement from colophon. "No. 481/No. 390"--Upper right corner of p. [1]. Orders the printing of Louis XVI's "livres rouges," secret registers of expenses not kept on the civil list for espionnage and other secret services. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
