#:schema ../../../../schemas/source.json
layer = "source"
id = "declarationfaict00cond_0"
type = "book"
title = "Declaration faicte par Monsieur le Prince de Condé, pour monstrer les raisons qui l'ont contrainct d'emtreprendre la defense de l'authorité du Roy, du gouuernement de la Royne, & du repos de ce Royaume. Auec la protestation sur ce requise."
language = "fr"
date = "1564"
note = "Signatures: A-I 8, K 4. Bibl. Nat. Cat. gen. The various parts were previously published separately (1562). Declaration faicte par ... Prince de Condé.--Traicté d'association faicte par ... le Prince de Cõdé ... pour maintenir l'honneur de Dieu, le repos de ce Royaume, & l'estat & liberté du Roy sous le gouuernement de la Royne sa mere.--Seconde declaration de Monsieur le Prince de Condé, pour faire cognoistre les autheurs des troubles qui sont auiourd'huy en ce Royaume.--Lettre de ... le Prince de Condé, enuoyee à Paris auec la seconde declaration.--Response des habitans de la ville de Rouen.--Remonstrance enuoyee au Roy, par les habitans de la ville du Mans.--Discovrs svr la liberté ou captiuité du Roy.--Les moyens de pacifier le trouble qui est en ce royaume, enuoyez à la Royne par ... le Prince de Condé.--Devx reqvstes presentees au Roy & à la Royne, par le triumuirat [François de Lorraine, de Montmorence, Sainct André]--Avtre reqveste presentee à la Royne ledict iour, par ledict triumuirat.--Response faite par ... le Prince de Condé, à la requeste presentee par le triumuirat. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."
url = "https://archive.org/details/declarationfaict00cond_0"
extent = "[152] p.14 cm."

