title = "Defiennes, ex-accusateur-militaire-révolutionnaire, a la suite des armées de l'Ouest et des cotes de Brest réunies, premier lieutenant au 22e régiment de chasseurs, infanterie légère, en arrestation à Rennes, en réponse aux calomnieuses inductions lancées contre lui par Magnier, aîné, ci-devant Le Pelletier, Baurepaire, Brutus Magnier, ex-président du même tribunal, détenu à la Tour-la-Montagne, à Rennes, & insérées dans son mémoire ayant pour titre, Ma vie patriotique."
language = "fr"
place = "A Rennes"
date = "1795"
note = "Caption title. At head of title: Égalité, unité, liberté. Signed: Rennes, le 10 vendemiaire, 3e. année républicaine, & le 4e. mois de ma détention. Defiennes, aîné. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged pages and cover."
