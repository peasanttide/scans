title = "Décret de la Convention nationale, du 7 septembre 1793, l'an second de la République française, une et indivisible, qui déclare traîtres à la patrie et hors de la loi, les Français qui ont accepté ou accepteraient des fonctions publiques dans les parties du territoire français envahies par l'ennemi"
language = "fr"
place = "A Paris"
date = "1797"
note = "Caption title. At right of title: Nos. 1587, 1556, 74-1*, 550. Signed, p. 2: Dalbarade; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. Décret de la Convention nationale, du 7 septembre 1793 ... qui déclare traîtres à la patrie et hors de la loi, les Français qui ont accepté ou accepteraient des fonctions publiques dans les parties du territoire français envahies par l'ennemi -- Décret additionnel à celui du 7 ce mois, relatif aus Français qui aurait exercé des emplois dans les lieux envahis par les puissances étrangères -- Loi qui restrient à ceux qui étainet attachés aux armées ou employés à leur suite, les disposition des lois relatives aux fonctionnaires publics et autres non rentrés dans l'intérieur de la République après l'invasion du lieu de leur résidence, du 15 fructidor an II de la République française, une et indivisible -- Loi qui annulle des décrets et arrêtés prononçant des mises hors de la loi, du 14 fructidor an V de la République française, une et indivisible. Scanner's note: Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages. No title page found. No copyright page found. No table-of-contents pages found."
url = "https://archive.org/details/decretdelaconven00fra_am9"
