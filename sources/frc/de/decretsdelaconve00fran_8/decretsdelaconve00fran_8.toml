language = "fr"
place = "A Paris"
date = "1793"
note = "Caption title. At right of title: No. 1413 et 1592. Signed: Dalbarade; countersigned: Gohier. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Décret qui supprime la formalité d'une consultation signée d'avoués, pour se pouvoir en cassation ou en requête civile -- 2o. Décret qui accorde le délai de trois mois pour se pourvoir par la voie de l'appel, contre des condamnations en vertu de lettres-patentes, des arrêtes de propre mouvement et autres du ci-devant conseil. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
