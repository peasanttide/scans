note = """Caption title. "L'Assemblée nationale décrète que les pièces déjà trouvées dans le cabinet du roi, chez l'administrateur de la liste civile et autres endroits, qui prouvent jusqu'à l'évidence les trahisons et les perfides du pouvoir exécutif, seront envoyées aux armées par des couriers extraordinaires"--P. [1]. Imprint from colophon. "No. 3"--Bottom of p. [1]. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, IV:2, 2053. Scanner's note: No copyright found.  No table of contents found. Title on cover. Damaged, stained pages and cover. <br />."""
