#:schema ../../../../schemas/source.json
layer = "source"
id = "chroniquelittera00acha"
type = "book"
title = "Chronique littéraire des ouvrages imprimés et manuscrits de l'abbé Rive, des secours dans les lettres, que cet abbé a fournis à tant de littérateurs françois ou étrangers, de quelque rang & profession que ce soit, de la confiance dont divers illustres amateurs l'ont honoré en lui remettant divers ouvrages très-savans à faire imprimer avec ses corrections & ses notes, & des jugemens que divers journaux françois aussi, ou etrangers ont portés sur ses ouvrages."
language = "fr"
place = "A Éleutheropolis [i.e. Aix"
date = "1790"
note = """Attributed to Claude François Achard. Cf. Barbier. Weller attributes to G. Imbert. Fictitious imprint. Printed in Aix-en-Provence. Cf. Weller. Martin & Walter. Révolution française. Barbier A.A. Ouvrages anonymes. Weller, E.O. Falsche Druckorte. Includes bibliographical references. Errata, p. [i]-ii. "Addition pour la note 10 qui est sur la pag. 232 de la Chronique littéraire de l'abbé Rive, contenant le grand éloge de Senebier, bibliothécaire de Geneve, sçavant auteur du Catalogue des msts. de cette biliothéque, fait de la chase aux bibliographes & aux antiquaire mal-advisés, par cet abbé"--4 p. at end. Includes text of several letters to and from Rive. Bibliography: Martin & Walter.  Révolution française,  IV:1, 29392. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Uneven binding.  Skewed text.  Damaged, stained, marked and/or loose pages."""
url = "https://archive.org/details/chroniquelittera00acha"
subject = ["Rive, Jean-Joseph, 1730-1791"]
extent = "235, ii, 4 p. ; 22 cm."

