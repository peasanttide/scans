language = "fr"
place = "A Paris"
date = "1790"
note = "Colophon: De l'imprimerie de Valleyre. Martin & Walter IV 2: 3260. Chanson nouvelle, par un abbé aristocrate. Air: Qu'en voulez-vous dire? [First two lines: Messieurs, je me nomme clergé, / Je suis parent de la noblesse] -- La suppression des ordres religieux, & la célébration de leurs mariages. Air d'Alexandr[i]ne [First two lines: Sortez tous de vos couvents, / Plus de monasteres] -- Chanson patriotique, par un soldat de la Garde nationale. Air: de Renaud d'Ast [First two lines: Enfin après tous les orages / Qui sont venus fondre sur nous] -- L'amitié a l'épreuve. Air Marseillois [Opening words: J'ai tout perdu en disant je vous aime, tendres amans, brûlez d'un feu discret] -- Ronde du retour de la noce [First two lines: A la fête du hameau, / Ah, comme c'est beau!]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Skewed text.  Damaged, stained, and/or loose pages."
