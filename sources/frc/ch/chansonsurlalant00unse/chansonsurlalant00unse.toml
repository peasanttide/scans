note = "Caption title. Imprint from colophon. First line: La fievre lente tenoit le Parisien. Also includes: Chanson nouvelle, contenant la joie & le contentement du peuple françois, sur la réunion des trois ordres de l'Assemblée nationale [First two lines: La noblesse, depuis long-temps, / Tyrannise les paysans]; Couplets, sur l'air: On dit qu'à quinze ans on plait, on aime, on se marie [First line: Amis, tout-à-tour]; Chanson du Tiers-état. Air: J'ai fait une maitresse, &c. [First line: Chantons en alégresse, vive le roi]; Chanson nouvelle [First line: Ah! quelle heureuse nouvelle]. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Skewed text.  Damaged, stained, and/or loose pages."
