language = "fr"
place = "s.l."
date = "1798"
note = "Caption title. Without imprint. First two lines: L'oracle s'accomplit! Français, la République / Partout triomphe avec éclat. Includes also: Couplets. Air: Du pas redoublé de l'infanterie [First line: Soldats, le bal va se rouvrir]; Chanson sur la paix continentale. Air: Parlez, braves volontaires [First two lines: Quelle aurore bienfaisante / Vient dans son heureux retour]; Chanson patriotique sur l'Armée d'Italie [First two lines: C'en est fait, l'hydre tyrannique / En rendant le dernier soupir]. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Skewed text.  Damaged, stained, and/or loose pages."
