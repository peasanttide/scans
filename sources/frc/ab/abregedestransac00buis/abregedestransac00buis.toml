note = """Prospectus for "Abrégé des Transactions philosophiques de la Société royale de Londres.". Caption title. "On prie seulement les personnes qui désireront s'inscrire d'adresser, franc de port, le plutôt possible & avant le premier juin, à Paris, au sieur Buisson, libraire, hôtel de Mesgrigny, rue des Poitevins, n°. 13 ..."--P. 3. Printer statement and publication date from colophon. "Dix volumes in-8°. avec des planches en taille-douce, proposés par inscription"--P. [1]. "Le prix de chaque livraison, composée de deux volumes brochés, est de 9 livres, & franc de port par la poste dans tout le royaume, 10 livres. Le prix de chaque volume relié en veau est de 5 liv. 10 s."--P. 3. "Avis sur le retard de la premiere livraison de l'Économie rurale et civile": p. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
