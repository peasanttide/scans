title = "... Suite des pi`eces relatives `a la conspiration découverte le 12 pluvi^ose [an V = 31 janvier 1797] : tendant au renversement du gouvernement républicain et au rétablissement de la royauté ; message /"
language = "fr"
place = "A Paris"
date = "1797"
note = "Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des anciens. Accompanied by: [1] ... Seconde suite des pi`eces relatives `a la conspiration découverte le 12 pluvi^ose [an V = 31 janvier 1797], tendante au renversement du gouvernement républicain et au rétablissement de la royauté. Message / du Directoire exécutif. Extrait du registre des délibérations du Directoire exécutif. Du 25 pluvi^ose, l'an 5 de la République française, une et indivisible [13 février 1797] -- A Paris : De l'Imprimerie nationale, pluvi^ose, an V [1797] -- 19 p. ; 20 cm. -- Caption title. Imprint from colophon. -- At head of title: Corps législatif. Conseil des anciens. [2] ... Troisi`eme suite des pi`eces relatives `a la conspiration découverte le 12 pluvi^ose [an V = 31 janvier 1797], tendante au renversement du gouvernement républicain et au rétablissement de la royauté. Message / du Directoire exécutif. Extrait du registre des délibérations du Directoire exécutif. Du 26 pluvi^ose, l'an 5 de la République française, une et indivisible [14 février 1797] -- A Paris : De l'Imprimerie nationale, vent^ose, an V [1797] -- 98 p. ; 20 cm. -- Caption title. Imprint from colophon. -- At head of title: Corps législatif. Conseil des anciens. Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
