title = "Loi sur la réunion de l'actif et passif des hôpitaux, maisons de secours, de pauvres, etc. au domaine national, la liquidation du passif de ces établissemens, la prorogation du délai pour la remise des titres de créances sur les communes, le rapport de la déchéance de six mois d'intérêts, et autres dispositions générales sur la liquidation de la dette publique : du 23 messidor, l'an deuxième de la République Franc̦aise, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 30*). At right of title: B. no. 20, D. 93. Signed, p. 7: Louis (du Bas Rhin), président; Bordas, Brival, A. Dumot et A. Besson, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète"--P. [1]. "Loi relative aux prises faites par les vaisseaux de guerre de la République, du 23 messidor, l'an deuxième de la République française, une et indivisible. B. no. 19, D. 90"--P. 7-8. "Loi qui renvoie au 10 thermidor la fête ordonnée en l'honneur des jeunes Barra et Vialla, du 23 messidor, l'an deuxième de la République française, une et indivisible. B. no. 20, D. 94"--P. 8. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
