date = "1793"
note = """Caption title. "Instruction que donne la Convention nationale aux représentans du peuple à envoyer aux armées pour y établir l'embrigadement des corps d'infanterie, régler les comptes d'administration de chacun de ces corps, et fixer ces bases d'administration, pour l'avenir, par demi-brigade.". Error in pagination: p. 16 numbered as p. 4. Includes templates for inspection paperwork to be copied and completed by each representative, p. 13-43. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 11193. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages. Damaged, uneven binding. Skewed text."""
