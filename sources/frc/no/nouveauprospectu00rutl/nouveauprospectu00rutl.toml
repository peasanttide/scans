language = "fr"
place = "Paris"
date = "1778"
note = """Caption title. "On souscrit chez l'auteur, le chevalier Rutlidge, rue des Noyers, maison de M. Bernard, marchand orfèvre-méchanicien, près de S. Yves; il faut s'adresser à M. Belle. On soucrit encore chez Bastien, libraire, rue du Petit-Lion, fauxbourg Saint-Germain; chez Esprit, libraire, au Palais Royal; chez Lesclapart fils, libraire, à la Sainte-Famille, quai de Gevres; chez Le Boucher, le jeune, libraire à Rouen; chez Frantin, libraire à Dijon; et chez les autres principaux libraires dans les provinces"--P. 4. Printer statement from colophon. "Permis d'imprimer ... le 5 décembre 1778"--P. 4. "Le prix de l'abonnement pour l'année est de 24 liv. pour Paris, & de 30 liv. pour la province, franc de port"--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
