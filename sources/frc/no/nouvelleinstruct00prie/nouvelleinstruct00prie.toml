type = "book"
title = "Nouvelle instruction sur les poids et mesures et sur le calcul décimal : adoptée par l'Agence temporaire des poids et mesures, pour servir de supplément aux instructions déjà publiées, et d'explication au décret du 18 germinal de l'an 3 /"
language = "fr"
place = "A Paris"
date = "1795"
note = "Martin & Walter. Révolution française. Nouvelle instruction sur les poids et mesures, pour servir d'explication à la loi du 18 germinal l'an 3 -- Vocabulaire des measures républicaines, contenant l'indication de leurs valeurs et de leurs principaux usages -- Instruction sur le calcul décimal, appliqué principalement au nouveau système des poids et mesures, a l'usage de ceux qui sauvent l'addition, la soustruction, la multiplication et la division des nombres simples, et pour leur apprendre promptement à faire les mêmes opérations sur les nombres complexes, ou accompagnés de fractions, et de sous-espèces quelconques -- Loi relative aux poids et measures du 18 germinal, l'an 3e. de la République française, une et indivisible -- Table sommaire des rapports, décrets et instructions concernant les nouveaux poids et measures -- Corrections a faire à la nomeclature des instructions sur les poids et measures, publiées avant le décret du 18 germinal. Bibliography: Martin & Walter.  Révolution française,  IV:1, 28218. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text.  Irregular pagination."
