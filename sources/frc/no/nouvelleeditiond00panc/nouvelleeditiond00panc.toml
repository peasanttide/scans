language = "fr"
place = "Paris?"
date = "1772"
note = """Prospectuses for the "Histoire de l'Académie royale des sciences" and "Histoire de l'Académie royale des inscriptions et belles lettres", sold by Charles Joseph Panckoucke. Caption title. "Le sieur Panckoucke croit rendre un nouveau service à sa nation & aux gens de lettres, en leur proposant une nouvelle édition de cet ouvrage in-4"--P. [1]. "Souscription continuée jusqu'au premier août 1772"--P. [4]. Includes listings of other titles offered at reduced prices by Panckoucke until August 1772. Newberry's copy tightly trimmed at top margin, possibly removing page numbers. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
