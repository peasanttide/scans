note = """Caption title. Signed, p. 3: C. Panckoucke, éditeur de l'Encyclopédie méthodique et membre du jury d'instruction. "Du 1er vendémiaire, an VI. (22 septembre 1797, vieux style.)"--P. [1]. "Le prix de ce journal n'est que de 36 liv. pour Paris et les départemens, rendu franc de port. On peut s'abonner pour 3, 6, 9 mois et un an, à volonté, et toujours à dater du Ier d'un mois républicain ... Le bureau général est actuellement rue de Grenelle, n° 321, en face de la rue des Saints-Peres, maison du citoyen Panckoucke"--P. 3. "Nouvelles entreprises devant former le fonds de librairie et s'exécuter dans l'imprimerie de Fleuri Panckoucke, fils, (âgé d'environ 17 ans) sous la direction de Charles Panckoucke, son pere": p. [1] at end. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page.  Text lost in binding."""
