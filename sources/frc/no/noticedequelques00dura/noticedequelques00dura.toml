language = "fr"
place = "Paris?"
date = "1774"
note = """Caption title. Entry for "Almanach d'agriculture" (p. 6) notes availability of 1774 edition, while 1775 edition, to appear in January, is still "sous presse". Printed in double columns. Includes prices. Histoire littéraire des troubadours, contenant leurs vies, les extraits de leurs pièces, & plusieurs particularités sur les mœurs, les usages, & l'histoire du douzième & du treizième siècles -- Elémens d'histoire générale, par M. l'abbé Millot, des Académies de Lyon & de Nancy -- Elémens de l'histoire de France, depuis Clovis jusqu'à Louis XV, par M. l'abbé Millot, nouvelle édition, considérablement augmentée -- Elémens de l'histoire d'Angleterre, depuis la conquête des Romains, jusqu'au regne de Georges II, par M. l'abbé Millot, nouvelle édition, corrigée & augmentée -- Autres livres nouveaux. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
