language = "fr"
place = "A Orléans"
date = "1810"
note = """Prospectus for Latour's "Nosographie synoptique". Caption title. "La première livraison paraîtra dans le mois de juin prochain, et sera adressée ... à ceux qui, avant cette époque, auront fait parvenir l'engagement ci-dessous à l'adresse de M. Huet-Perdoux, imprimeur-libraire, à Orléans, ou celle de M. J.-A. Brosson, libraire, rue Pierre-Sarrazin, n°. 9, à Paris"--P. 8. Imprint from colophon. "Le prix de chaque livraison sera de 9 fr., payable, franc de port, à la réception de chaque livraison"--P. 8. Two stamps: A timbrer a l'extraordinaire ; Dept. du Loiret. In original printed paper wrappers. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/nosographiesyno00huet"
