language = "fr"
place = "Paris?"
date = "1785"
note = """"Toutes les quittances de souscriptions seront signées désormais par M. Duhamel, banquier à Paris, y demeurant quai des Miramionnes, n°. 44, et eslles seront visées par M. Levacher de Valincourt, directeur de la correspondance du Journal, demeurant rue Plâtriere, hôtel de la Grecque"--P. 10-11. "Permis d'imprimer, ce 2 juillet 1785"--P. 12. "La souscription nouvelle a commencé à compter du Ier juillet présent mois, pour finir au Ier juillet 1786 ... Le prix de la souscription est toujours de 24 liv. pour Paris, & de 30 liv. pour la province"--P. 10. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
