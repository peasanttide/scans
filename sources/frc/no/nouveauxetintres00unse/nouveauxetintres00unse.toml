type = "pamphlet"
title = "Nouveaux et intéressans dètails [i.e. détails] de l'horrible conspiration de Robespierre et ses complices : piéces trouvées sous les scellés de ces scélérats ; arrêtés liberticides du conseil-général et municipalité de Paris ; complicité d'Hauriot pour seconder leurs infâmes desseins., et fomenter la guerre civile et faire rétrograder le gouvernement républicain, en faisant assassiner la Convention nationale et marier la fille Capet avec Robespierre, pour regner ensemble, et faire mourir quatre-vingt mille citoyens ; arrestation dans plusieurs départemens de leurs complices dont un s'est brûlé la cervelle et un autre a voulu s'empoisonner ; fermeté et courage de la Convention qui a détruit leurs complots et sauvé la patrie."
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. Imprint from colophon. Footnote on p.4: Le 9 thermidor [an II = 27 juillet 1794]. Martin & Walter IV 2: 10767. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
