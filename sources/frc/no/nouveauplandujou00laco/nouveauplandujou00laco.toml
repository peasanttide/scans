note = """Prospectus for "Journal des sciences et des beaux-arts.". Caption title. Printer statement from colophon. "Permis d'imprimer ce 21 octobre 1777"--P. 10. "Le premier cahier paroîtra le 15 janvier 1778. Le prix de la souscription est de vingt-quatre l. pour Paris, & de trente l. pour la province, franc de port. On souscrit au bureau d'administration, cour de Rohan, près de celle du Commerce, quartier de l'ancienne Comédie Françoise; & chez Lacombe, libraire"--P. 9-10. Head-piece. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
