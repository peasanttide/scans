date = "1778"
note = """Prospectus for the 156-volume edition of Histoire de l'Académie royale des sciences, sold by Charles Joseph Panckoucke. Caption title. Imprint from colophon. "Actuellement en vente ... A Paris, Hôtel de Thou, rue des Poitevins, & chez les principaux libraires & directeurs des postes de l'Europe, 1778 ... On peut aussi adresser ses commissions au sieur Batilliot, banquier de toute la librairie, rue Saint-Jacques."--P. [1]. "Hôtel de Thou, rue des Poitevins" is Panckoucke's commercial address. Cf. Lottin, A.-M. Libraires de Paris, 2e ptie, p. 135. Includes prices in loose sheets, sewn, or bound. "Nouveautés, 1778": p. 3-4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
