language = "fr"
date = "1798"
note = """Caption title. At head of title: Corps législatif, Conseil des cinq-cents. "Les membres composant ces commissions sont les représentans du peuple Roemers, Tiessé, Favard, Membrede, Grandmaison, Talot, Rollin, Beaujard, Legorrec, Dupire, et Bertrand (du Calvados)"--P. [1]. Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,I, 3047. Scanner's note: Title found on front cover. No copyright page found. No table-of-contents pages found."""
