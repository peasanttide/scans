title = "A Nosseigneurs de l'Assemblée nationale : supplément au mémoire des maitres de postes, et observations sur un précis, présenté à l'Assemblée nationale, par M. Alary, au nom d'une compagnie"
language = "fr"
place = "Paris"
date = "1790"
note = """Caption title. Signed: Cretté, maître de poste & cultivateur .. Imprint from colophon. Not in Martin & Walter. Révolution française. Tourneux, M. Paris pendant la Révolution française. "Réponses & observation" and "Propositions de M. Alary & compagnie" in parallel columns. "(No. 1) Apperçus de la différence qu'il y a sur le prix des fourrages entre le Bourget, distant de Paris de 3 lieues, & Noyon, distant de 20 lieues"--P. 23. "(No. II.) Tableau comparatif du prix de 25 sols avec celui proposé par les maîtres des postes"--P. [2] at end. "(No. III.) Apperçu de la dépense à faire par M. Alary & compagnie, pour établir ses onze cent relais de post avec 18,700 chevaux, suivant son mémoire"--P. [4] at end. Bibliography: Tourneux, M.  Paris pendant la Révolution française, III, 14468. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
