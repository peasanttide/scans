date = "1779"
note = """Prospectus for J. de Sales' "Histoire nouvelle de tous les peuples du monde.". Caption title. "Permis d'imprimer ce 24 mars 1779"--P. [4]. "On s'abonne à Paris chez Couturier le pere, imprimeur aux Galeries du Louvre, chez Clousier, imprimeur du roi, rue Saint-Jacques, & chez Barbou, imprimeur-libraire, rue des Mathurins. La souscription est aussi ouverte chez plusieurs libraires de province, & sur-tout chez Couret de Villeneuve à Orléans, De Livani à Châlons-sur-Saone, & La Mort à Nancy"--P. [4]. "Cet abonnement, franc de port dans toute la France, est de ving-quatre livres pour Paris & de trente liv. pour la province"--P. [4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
url = "https://archive.org/details/nouveauprospectu00cout"
