note = "Half title. Imprint from colophon. Opening sentence: Le comité électif de la ville de Bernay, a l'honneur de vous représenter que les citoyens de la ville et des campagnes, ont lu avec inquiétude, les rapports faits à votre comité féodal, sur le mode et le prix du rachat des droits féodaux et censuels non supprimés sans indeminité. Dated on p.10: Arrêté en l'assemblée, à l'Hôtel de ville, l'onze janvier 1790. Martin & Walter IV 2: 2706 (which specifies: A propos du rachat des droits féodaux). Scanner's note: Some faint/missing text. No title page found. No copyright page found. No table-of-contents pages found."
