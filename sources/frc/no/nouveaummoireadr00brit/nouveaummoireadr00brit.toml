date = "1788"
note = """Half title. "'Nous supplions très-humblement Votre Majesté ... de retirer les edits, ordonnances & déclaration, transcrits d'autorité les 8 & 10 mai dernier, tant à la Chambre des comptes, qu'au Parlement de Bretagne.' Fait en commission, à Rennes le 22 juin 1788": p.37-38. Usually issued without "Nouveau" in the title. Not in Martin & Walter [edition 4: [1] leaf, 38 p.]. Scanner's note: Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages. No title page found. No copyright page found. No table-of-contents pages found."""
