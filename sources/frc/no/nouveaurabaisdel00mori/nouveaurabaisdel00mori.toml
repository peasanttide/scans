note = """Caption title. "Ce rabais aura lieu jusqu'au 15 germinal prochain"--P. [1]. Publication date based on announcement at end for Soirées littéraires, which indicates that t. 18-19 are in press. Tome 17 was published in 1799. Cf. BN. Catalogues de libraires, 2195. Differs from another catalog with the same title (BN. Catalogues de libraires, 2195), which indicates that t. 18 of Soirées littéraires has been published and t. 19 is in press. Printed in double columns. With original and discounted prices. Stamp: Rép. fra. 3 cent. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
