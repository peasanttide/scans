type = "pamphlet"
title = "Nouveau mémoire sur les assignats, ou, Moyen de liquider sur le champ la dette nationale : dix fructidor, an troisième /"
language = "fr"
place = "A Paris"
date = "1795"
note = """"Ce mémoire ne se vend pas.". "Envoyé aux Comités de salut public et des finances, le 10 fructidor, et à le Convention, le 30."--P. [3]. "Quatrieme mémoire sur les assignats, contenant le moyen de retirer sur-le-champ de la circulation 10 milliards d'assignats, sans secousse, sans exciter de murmures, sans nuire au commerce, à l'industrie, sans faire tort aux particuliers, et de remettre les assignats restans au pair, en rétablissant le prix des denrées et marchandises tel qu'il étoit en 1789."--P. [3]-16. "Suite du nouveau mémoire sur les assignats, concernant l'établissement d'une nouvelle Caisse d'Escompte, composée d'un fonds de 400 millions, savoir, 300 millions destinés à l'échange des cédules hypothécaires, et 100 millions pour le service particulier de la Caisse."--P. [17]-45. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Uneven binding. Skewed text.  Damaged, stained, and/or loose pages."""
url = "https://archive.org/details/nouveaumemoiresu00panc"
subject = [
    "Caisse d'escompte (France)",
    "Assignats",
]
