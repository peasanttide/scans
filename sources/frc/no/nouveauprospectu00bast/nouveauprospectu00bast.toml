title = "Nouveau prospectus et observations très-importantes sur l'édition des Œuvres complettes de Plutarque"
language = "fr"
place = "Paris"
date = "1783"
note = """Prospectus for the 1784 French edition of Plutarch's complete works. Caption title. Imprint from colophon. "Grand in-8. et in-4. seize volumes de près de 600 pages chacun, contenant les 13 vol. de l'édition de Vascosan, imprimé en 1567 et 1574, et le supplément qui fait le 14e. vol."--P. [1]. Includes prices for impressions on "papier d'Angoulême" or "papier d'Hollande". Includes brief prospectuses for works by Michel de Montaigne, Pierre Charron, and François Rabelais. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/nouveauprospectu00bast"
