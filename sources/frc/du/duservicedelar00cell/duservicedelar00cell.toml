note = """Bookseller's catalog, preceded by prospectus for: Du service de l'artillerie a la guerre / par M. le Chevalier d'Antoni ; traduit de l'Italien, avec des additions & des notes par M. de Mont-Rozard. Paris : L. Cellot, 1780. Caption title. "A Paris, chez L. Cellot, imprimeur-libraire, rue Dauphine, gendre & successeur de Jombert pere, libraire du roi pour l'artillerie & le génie, la seconde porte cochere à droite en entrant par le Pont-Neuf, au fond de la Cour & au rez-de chaussée, in-8o, figures, 5 liv. broché"--P. [1]. "Les personnes qui voudront se le procurer, s'adresseront au sieur Cellot, libraire, à l'adresse ci-dessus, & il le leur fera parvenir par la poste, & port franc, par la voie du Bureau de l'abonnement littéraire de M. Luneau de Boisjermain ..."--P. [1]. "Notice très-abrégée de quelques-uns des livres dudit Cellot, avec les prix reliés; en les prenant brochés, on diminuera le prix de la reliure": p. [1]-4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
