id = "listealphabtique00unse_1"
type = "pamphlet"
title = "Liste alphabétique des noms de MM. les députés a l'Assemblée nationale et de leurs suppléans : avec l'indication des bailliages, sénéchaussées ou evêchés qui les ont députés."
language = "fr"
place = "s.l."
date = "1790"
note = "Caption title. Without imprint. Note following caption title: N.B. On a suivi l'ancienne division des ci-devant ordres, afin de laisser des traces de la manière dont la première députation nationale a été faite, et des qualités supprimées des députés ci-devant nobles. On a profité de cette liste pour faire connoître les députés qui ont protesté contre le décret rendu le 13 avril 1790, conernant la religion, et qui ont signé la déclaration qui a été repandue dans les provinces. Le nom de ces députés protestans est précédé d'une main figurée [representation of printer's fist]. Cette table doit être placée avant le discours préliminaire des séances de Versailles. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
url = "https://archive.org/details/listealphabtique00unse_1"
subject = ["France. Assemblée nationale constituante (1789-1791)"]
extent = "36, [1] p. ; 19 cm."

