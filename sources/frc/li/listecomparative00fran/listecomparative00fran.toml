#:schema ../../../../schemas/source.json
layer = "source"
id = "listecomparative00fran"
type = "book"
title = "Liste comparative des cinq appels nominaux faits dans les séances des 15, 16, 17, 18 et 19 janvier 1793, sur le procès et le jugement de Louis XVI, avec les déclarations que les députés ont faites à chacune des séances, par ordre de numéros"
language = "fr"
place = "A Paris"
date = "1793"
note = """"Suivie de la déclaration de Louis à la Convention, par laquelle il interjette appel à la nation du jugement porté contre lui; et du discours prononcé à la barre, par Desèze. Immédiatement après, le résultat du scrutin sur la peine à infliger à Louis; des observations de Tronchet et Lamoignon Malesherbes, ses défenseurs; du testament de Louis XVI; et enfin de la relation des vingt-quatre heures qui ont précedé sa mort.". Martin & Walter. Révolution française. "Declarations et observations faites par plusieurs députés aux appels nominaux, dans le procès et le jugement de Louis XVI"--109 p. at end. Bibliography: Martin & Walter.  Révolution française, IV:2, 8963. Scanner's note: No copyright found. No table of contents found.  Damaged, stained pages and cover. <br />Irregular pagination. <br />."""
url = "https://archive.org/details/listecomparative00fran"
subject = [
    "Louis XVI, King of France, 1754-1793",
    "France. Convention nationale",
]
