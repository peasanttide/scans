note = """Caption title. Publication date from BN. Catalogues de libraires. Printed in double columns. BN. Catalogues de libraires. Grammaires, dictionnaires, belles lettres -- Œuvres mêlées de différens auteurs -- Jurisprudence : droit public, droit françois, droit etranger, droit ecclésiastique -- Sciences & arts : philosophie, métaphysique, morale, politique, histoire naturelle, physique, œconomie rustique, agriculture, médecine, chirurgie, mathématiques, géométrie, art militaire, architecture, peinture, sculpture, &c. -- Géographie & voyages -- Histoire universelle, générale, particuliere, ecclésiastique, ancienne & moderne de différens pays -- Histoire prophane -- Histoire littéraire, vies des hommes illustres, &c. -- Theologie & livres de piété. "On trouve chez le même libraire un assortiment général d'autres livres, tant de Francem que des pays étrangers, & les nouveautés en tout genre"--At end. With prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
