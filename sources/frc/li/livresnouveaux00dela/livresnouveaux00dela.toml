language = "fr"
place = "Paris"
date = "1802"
note = """Caption title. Announces the upcoming publication date as 1er germinal for Traité théorique et pratique de la culture des grains by Parmentier and three others, and the date 8 germinal for Notions élémentaires de botanique by Philibert; both were published in 1802. Probably issued later in 1802 than a catalog with the same title (BN. Catalogues de libraires 838) because the earlier catalog annouces coming publications only through 1er and not 8 germinal. Cf. BN. Catalogues de libraires. "Le citoyen Delalain fils continue de faire les commissions avec la même exactitude que son père, et son oncle le citoyen Delalain jeune, dont il a acquis le fonds en totalité"--P. 4. BN. Catalogues de libraires. Livres de fonds -- Livres d'assortimens. With prices. Stamp: Rép. fra. 3 cen. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
