note = """Caption title. Announcement on p. 1-4 for John Pinkerton's Geographie moderne, which was published by Dentu in 1804. "Catalogue des livres de fonds qui se trouvent chez Dentu ...": p. [5]-16. With prices. No. 11 of 17 titles bound together. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined.  Tight Margins - Text lost in binding.  Pages are out of order."""
