note = """Catalog featuring various book genres with a focus on French literature. Caption title. Printed in double columns. BN. Catalogues de libraires. "Avis pour le nouveau Dictionnaire historique, en 6 vol. in-8. Messieurs les souscripteurs de cet ouvrage sont priés de retirer leurs exemplaires. On trouve chez le même libraire, un assortiment de livres nouveaux en tout genre, ainsi que tous les théâtres, & pièces séparées"--At end. With prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
