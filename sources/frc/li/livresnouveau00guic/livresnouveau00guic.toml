note = """Prospectuses for legal literature compiled or written by Guichard. Caption title. Publication information from colophon. "Les personnes de province qui desireront se procurer quelqu'un des ouvrages ci-dessus n'ont autre chose à faire que d'en adresser directement la demande à l'auteur ... Il faut avoir soin d'affranchir les lettres et les adresser à M. Guichard, homme de loi, auteur de [blank] (tel ouvrage), place Dauphine, n°. XI, à Paris"--P. 2. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
