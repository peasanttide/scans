title = "Liste des personnes des deux sexes : arrêtés et détenues dans les différentes prisons de Paris ; tant pour crimes de conspiration, que pour vols faits aux Tuileries, dans la journée du 10 août 1792, jusqu'au 2 septembre ; avec la date de leur emprisonnement ; une partie des détails de leurs professions, les sortes de vols qu'ils ont commis ; les noms des commisaires [sic], juges de paix et autres personnes qui les ont fait conduire ès-dites prisons, et de ceux qui ont été mis en liberté ; terminée par une liste générale de tous les Suisses qui ont survecu à la journée du 10 ; leur âges ; les différens grades qu'ils occupoient dans ce corps, et leurs années de service ; ouvrage soigné avec le plus grande exactitude ; [motto: 2 lines]"
