title = "L'intrigant démasqué, ou, La vie privée de Bourdon, se qualifiant de Bourdon de la Marne, acquéreur de biens nationaux, s'en disant propriétaire, et de Barbe, surnommée Julie Dauphin sa confidente : détenus à la maison de justice près le tribunal criminel du département de la Dyle, séant à Bruxelles : prévenus tous les deux du crimes de faux, banqueroute frauduleuse, enlèvement et destruction de titres, vols à main-armée pendant le jour et la nuit, violences envers les personnes, escroqueries de plusieurs genres, et d'autres faits mentionnés en la procédure."
