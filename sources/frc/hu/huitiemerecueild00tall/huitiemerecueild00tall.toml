note = """Caption title. "Déposé au Comité de surveillance par MM. Gohier, Audrein et Pinet, commissaires nommés par l'Assemblée nationale pour l'examen des titres et papiers de la liste civile"--P. 8. Imprint from colophon. Dated at beginning: Mai et juin. 1792. Martin & Walter. Révolution française. Itemized expense account tallied by Laporte for printing and distribution costs of various documents. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Martin & Walter.  Révolution française,  IV:2, 13967. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover."""
