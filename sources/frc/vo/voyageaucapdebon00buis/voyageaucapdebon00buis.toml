note = """Prospectus for French translation of Sparrman's "Resa till Goda Hopps-udden". Caption title. "Cet ouvrage se vend à Paris, chez Buisson, libraire, Hôtel de Mesgrigny, rue des Poitevins; il forme trois vol. in 8° ... imprimés par M. Didot le jeune sur beau caractère de Cicero neuf ... Et deux vol. in-4° ... imprimés sur beau caractère de S. Augustin neuf"--P. 1. Imprint from colophon. Printed in double columns. Includes prospectuses for French translation of John Gillies' "The history of ancient Greece" and for François Soulés' "Histoire des troubles de l'Amérique anglaise". Includes prices sewn or bound. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
