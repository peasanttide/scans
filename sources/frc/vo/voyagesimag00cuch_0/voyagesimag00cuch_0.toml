note = """Prospectus for "Voyages imaginaires, songes, visions, et romans cabalistiques", edited by Charles-Georges-Thomas Garnier. Caption title. "On s'inscrit à Paris, chez Cuchet, libraire, rue & Hôtel Serpente, chez les principaux libraires, & chez les directeurs des postes."--P. 8. Imprint from colophon. "Permis d'imprimer, le 14 mars 1788"--P. 8. "Cette collection dont il paroît actuellement 20 volumes en contiendra de 36 à 40 in-8° au plus ... Le prix de chaque volume broché, avec deux planches, sera de 3 livres 12 sols."--P. 6-7. Seconde souscription, en faveur des personnes qui n'ont pas eu connoissance du premier prospectus -- Ordre des livraisons -- Conditions de l'inscription. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
