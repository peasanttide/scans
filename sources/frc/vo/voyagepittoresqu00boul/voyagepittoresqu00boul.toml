note = """Prospectus for: Voyage pittoresque de Constantinople et des rives du Bosphore / d'après les dessins de M. Melling. Paris : Chez les éditeurs, 1807-1819. "Ceux qui voudront se procurer l'ouvrage ... sont invités à s'inscrire, a Paris, chez Boulard, notaire, rue S.-André-des-Arcs, no 28, près celle Pavee; Melling, auteur dudit ouvrage, et l'un des éditeurs, rue de la Liberté, ci-devant des Fossés-M.-le-Prince, no 34; Née, graveur et directeur dudit ouvrage, rue des Francs-Bourgeois-S.-Michel, no 127; P. Didot l'aîné, imprimeur, aux galeries du Louvre, no 3; et chez tous les libraires et marchands d'estampes de France et des pays étrangers"--P. 8. With prices. No. 14 of 17 titles bound together. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
