note = """Prospectus for French translation of Antonio de Ulloa and Jorge Juan's "Relación histórica del viage a la América Meridional.". "Ceux qui auront envie de souscrire peuvent s'adresser à Amsterdam & à Leipzig chez les imprimeurs de l'ouvrage, à Basle chez Mrs. Leonard Vischer Fils & Birr, banquiers, à Genève chez les Freres Cramer & Claude Philibert, à Lausanne chez M.M. Bousquet & Compagnie, & chez les principaux libraires des autres villes de l'Europe"--P. [4]. Title vignette; tail-piece. Includes itemized price list, with separate prices for maps, plans, frontispieces, etc. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
