note = """"Département d[e Paris]"--Front cover. By Lavallée. Cf. Martin & Walter. "A Paris, de l'imprimerie du Cercle social, rue du Théatre-François, no. 4"--Colophon. Added engraved t.p. Maps hand colored. "Chaque cahier coûtera 50 sols, et 3 liv. pour les départemens, franc de port"--Back cover. One in a series of descriptive guides on the departments of France. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 19752. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained, and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text and images lost in binding."""
