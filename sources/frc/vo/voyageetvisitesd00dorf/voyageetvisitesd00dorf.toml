title = "Voyage et visites de Madame Liberté et de Mademoiselle Constitution sa fille : suivis des remarques qu'elles ont faites dans différentes cours de l'Europe, & n'ayant trouvé, après avoir parcouru la terre, aucun asyle plus agréable que dans la France, elles ont fixé leur résidence dans un fort & une tour situés sur des rochers inébranlables : ainsi, elles invitent tous les citoyens français à y être avec elles leurs défenseurs, afin qu'aucune couronne de l'univers ne puisse approcher de leur retraite si justement gagnée /"
