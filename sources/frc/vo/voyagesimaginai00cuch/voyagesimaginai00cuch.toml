note = """Prospectus for Voyages imaginaires, songes, visions, et romans cabalistiques, edited by Charles-Georges-Thomas Garnier. Caption title. "On s'inscrit à Paris, chez Cuchet, libraire, rue & Hôtel Serpente, chez les principaux libraires, & chez les directeurs des postes"--P. 11. Imprint from colophon. "Cette collection formera 40 volumes in-8° ... Le prix de chaque volume broché, avec deux planches, sera de 3 livres 12 sols jusqu'au Ier juin 1787, époque à laquelle ce prix sera porté à 4 livres sans diminution"--P. 10-11. Prospectus -- Ordre des livraisons -- Conditions de l'inscription -- Liste des ouvrages qui composeront cette collection. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
