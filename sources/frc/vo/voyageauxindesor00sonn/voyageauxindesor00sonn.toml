note = """Prospectus for: Voyage aux Indes orientales et a la Chine / par M. Sonnerat. Paris, 1782. Caption title. Place of publication and printer statement from colophon. "Permis d'imprimer, le 28 septembre 1781"--P. 4. "La souscription est de 36 livres ... On souscrit à Paris, chez l'auteur, M. Sonnerat, maison de M. Menissier, marchand d'etoffes de soi, rue S. André des Arts, vis-à-vis la rue de l'Eperon, Froullé, libraire, sur le pont Notre-Dame, vis-à-vis le quai de Gêvres. A Lyon, chez Jean-Marie Bruyset, pere & fils, imprimeurs-libraires, rue S. Dominique"--P. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
