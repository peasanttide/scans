language = "fr"
place = "Paris"
date = "1779"
note = """Prospectus for Nicolas-Léger Moutard's "Manuel bibliographique des amateurs.". Caption title. Printer statement from colophon. "... permis d'imprimer ... ce 7 juillet 1779"--P. 4. "A commencer dès cette année 1779, on recevra tous les ans sept volumes in-8."--P. 4. "Le prix pour les sept volumes brochés est de 18 livres pour Paris, & de 21 livres pour la province, franc de port. Le bureau de l'abonnement est à Paris, rue de Cimetiere Saint-André, vis-à-vis de l'hôtel d'Artois"--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
