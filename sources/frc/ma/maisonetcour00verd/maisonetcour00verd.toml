language = "fr"
place = "A Paris"
date = "1773"
note = """Prospectus for Verdier and Fortier's "Cours d'éducation" and "Maison d'éducation physique et morale", the latter of which was never published. Caption title. "Permis d'imprimer, ce 30 juillet 1773"--P. 16. "Ce prospectus se distribue gratuitement à Paris chez MM. Verdier & Fortier, quai S. Bernard, la seconde porte cochere avant la rue de Seine"--P. 16. Printed in double columns. Ms. annotations. Scanner's note: Handwritten notes throughout - Some lost in binding. Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
