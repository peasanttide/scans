note = """Prospectus for: Manuel de la typographie française, ou, Traité complet de l'imprimerie / par P. Capelle. Paris, 1826. Caption title. Place of publication and printer statement from colophon. "On souscrit a Paris, chez Rignoux, rue des Francs-Bourgeois-S.-Michel, n° 8; Baudouin frères, rue de Vaugirard, n° 17; Aillaud, quai Voltaire, n° 11; Delaunay, Palais-Royal, Galeries de Bois; Hy, marchand d'ustensiles d'imprimerie, rue Poupée, n° 7; et chez les principaux libraires de Paris, de la France et de l'étranger"--P. 4. "Cet ouvrage sera publié en trois livraisons de 150 pages environ. La première paraîtra le Ier août prochain. Le prix de chaque livraison ... est de dix francs, et de onze francs par la poste"--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
