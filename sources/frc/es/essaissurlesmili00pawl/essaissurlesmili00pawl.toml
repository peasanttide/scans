type = "pamphlet"
title = "Essais sur les milices nationales : où l'on présente les moyens de les rendre beaucoup plus utiles, sans être à charge aux peuples : de remplacer les corvées à prix d'argent, & de faire tous les travaux publics, de la manière la moins coûteuse & la plus généralement utile : d'établir dans tout le royaume l'ordre de police le plus doux & le plus propre à prévenir les crimes, afin de n'avoir pas à les punir, & la formation ds vagabonds, en les forçant de se rendre utiles, sans les enfermer ni les rendre malheureux, & sans cependant qu'ils puissent s'en défendre : extraits d'un plan général d'administration publique, proposé en 1775 /"
