language = "fr"
place = "A Paris"
date = "1649"
note = "Signatures: A-D². Text using Biblical sources to support argument of royal authority. Title continues: Contre les vsurpateurs du bien public. Où le droit des gens, & la cause commune sont equitablement defendus. En faueur des Souuerains & des Peuples. Touchant la veritable creation & la legitime authorité des Roys, & la mutuelle obligation des Princes enuers leurs sujets, & des sujets enuers les Princes. Piece rare & instructiue & pour le Tiers Estate, & pour la Noblesse. Published between March 30 and April 16, 1649. Cf. Moreau III, 316. Moreau."
