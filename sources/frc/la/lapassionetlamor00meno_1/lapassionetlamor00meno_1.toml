note = """Signed, p. 4: Le baron de Menou, évangéliste & président du manége. Fictitiously attributed to Jacques Menou. Cf. BN. Fictitious imprint, published in Paris. Cf. Weller. "N.B. Le lecteur est prié de ne pas confondre cet écrit patriotique, avec une rapsodie aussi platte que ridicule, qu'on a affublé du même titre que le nôtre.". Not in Martin & Walter. Révolution française. Variant of BN, CXII, column 449. Weller, E.O. Falsche Druckorte. Bibliography: Weller, E.O.  Falsche Druckorte,  II, p. 248. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
