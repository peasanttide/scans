title = "La capilotade :"
language = "fr"
place = "A Fontenoy"
date = "1745"
note = """By François de Quinsonas. Cf. Querard. A parody of Voltaire's Bataille de Fontenoy. Only one ed. known to Quérard: "77 e (prem. et unique)" (Superchéries litt. dev). La capilotade, poeme a la mode.-- Epitre de Melle. Javotte, niece du curé de Fontenoy, au Roy.-- Ode sur les victoires du Roy / par un enfant de choeur de la paroisse de Fontenoy.-- Epitre au Roy / par Gros Jean, bedeau, carillonneur & fossoyeur de la paroisse de Fontenoy. -- Neant sur toutes les requetes.-- Epitre au public / par un mechant poëte.-- Ode sur la bataille de Fontenoy, et sur la prise de Tournay.-- Les filles de Fontenoy.-- Les chantres.-- Le curé d'Antouin, contre le curé de Fontenoy.-- La Palme; vers allégoriques sur la victoire du roy.-- Dialogue entre un grassin et un paisan, au sujet du poëme sur la bataille de Fontenoy.-- Chanson nouvelle, sur l'air, Si t'avois connu M. de Catinat, &c. Binder's title: Bataille de Fontenay. Inlaid. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page.  Uneven binding.  Skewed text.   Irregular pagination."""
url = "https://archive.org/details/lacapilotad00quin"
subject = ["Fontenoy, Battle of, Fontenoy, Hainaut, Belgium, 1745"]

