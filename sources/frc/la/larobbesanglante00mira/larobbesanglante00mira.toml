note = 'Title page device of Minerva; ornamental tail-piece. Signatures: A-C². Attack on Mazarin, by a fellow Sicilian, to encourage the Fronde to unite the provinces. Second state of Moreau 3554 where "cicilen" has been corrected in title. Cf. Walsh 3554a. Published between January 23 and 26, 1649. Cf. Moreau III, 303. Moreau. Walsh.'
