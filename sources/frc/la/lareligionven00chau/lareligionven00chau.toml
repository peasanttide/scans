note = """Prospectus for "La religion vengée, ou, Réfutation des auteurs impies," by Jean-Nicolas-Hubert Hayer, Jean Soret, and others. Cf. BN, LXIX, column 565. Caption title. Head-piece. "On donnera de cet ouvrage quinze cahiers par an ... Chaque cahier sera de 72 pages in-douze, ce qui formera par année trois volumes, chacun de 360 pages. On commencera au premier de janvier 1757. Le prix de chaque cahier sera de 12 sols"--P. 3. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
