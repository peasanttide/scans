title = "La Christiade, ou, Le paradis reconquis"
language = "fr"
place = "A Paris"
date = "1752"
note = """Prospectus for La Baume-Desdossat's "La Christiade, ou, Le paradis reconquis". "On souscrira à Paris chez Lambert, libraire, rue de la Comédie Françoise, a Lyon chez Perisse, rue Merciere, a Marseille chez Carry & Boyer, a Avignon chez Alexandre Giroud, imprimeur de la Rde Chambre, a Nantes chez Joseph Vatar, imprimeur du roi & de Monseigneur l'Evêque. On pourra souscrire pareillement chez les libraires des principales villes du royaume"--P. 46. Colophon: De l'Imprimerie de C.F. Simon, imprimeur de la reine & de l'archevêché, 1752. Engraved frontispiece signed: Alais inv. ; P. Aveline sc. Title vignette; head- and tail-pieces. "Cet ouvrage, qui est chargé des notes, contiendra six volumes in-12 qui seront du prix de 18 liv. en feuilles par souscription"--P. 44. Bookseller's catalog: [2] p. at end. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/lachristiadeou00lamb"
subject = [
