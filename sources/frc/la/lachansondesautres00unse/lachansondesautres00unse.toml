note = """Binder's title: Conquest du roy. Inlaid. For unacc. voice. "J'appelle cette chanson la Chanson des autres, parceque j'ay profité de leurs pensées. Heureux si ceux a qui elles appartiennent ne les trouvent pas trop défigurées, pour les reconnôitre! En ce cas, ils ne me scauront pas mauvais gré de les avoir consacrées par le chant. Les paroles et la musique sont du meme."--Avertissement de l'auteur (t.p.). First line: Dans le séjour de la sincerité. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover.  Uneven binding.  Skewed text.  Irregular pagination.  Some page numbers may be altered or defaced."""
