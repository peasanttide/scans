id = "lamort00unse"
type = "book"
title = "La mort de Robespierre : tragédie en trois actes et en vers, avec des notes où se trouvent des particularités inconnues, relatives aux journées de septembre et au régime intérieur des prisons, notamment une relation complète de l'abbé Sicard, et des anecdotes concernant Gandolphe, secrétaire de M. Montmorin, Madame Beauharnais, Chatrie, Béhourt, et un soldat suisse qui, pour échapper à la mort, le 10 août, s'étoit caché dans une des cheminées du château, et beaucoup d'autres /"
language = "fr"
place = "A Paris"
date = "1801"
note = """*** is A. Sérieys; also attributed to Jean Chas. Cf. Barbier. "Honneur et gloire a tous ceux que le 9 thermidor de l'an 2 a sauvés, gloire et honneuer [sic] a ceux qui les ont sauvés.". Martin & Walter. Révolution française. Barbier, A.A. Ouvrages anonymes. Bibliography: Martin & Walter.  Révolution française,  IV:1, 31442. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/lamort00unse"
