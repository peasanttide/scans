note = """Caption title. Signed: Garnerey, président. Ollivier, secrétaire. Imprint from colophon. Address given 17 June 1791. Cf. Actes de la Commune de Paris pendant la révolution. Not in Martin & Walter. Révolution française. Actes de la Commune de Paris pendant la révolution. "Plan d'une ecole nationale des beaux-arts ayant le dessin pour base, et l'imitation de la nature pour but"--P. 21-34. Bibliography: Actes de la Commune de Paris pendant la révolution,  sér. 2, IV, p. 623.. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
