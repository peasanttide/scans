note = """Prospectus for: L'art de faire et d'employer le vernis, ou, L'art du vernisseur / par le sieur Watin. Paris, 1772. Caption title. "Par le sieur Watin, peintre, doreur, vernisseur, & marchand de couleurs & de vernis, in-8°. broché, prix 3 liv. 12 s. franc de port, pour Paris & pour la province ... A Paris, chez l'auteur, carré de la porte Saint-Martin, au magazin des couleurs & vernis, 1772"--P. [1]. Printer statement from colophon. "Permis d'imprimer ce 21 mai 1772"--P. 8. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
