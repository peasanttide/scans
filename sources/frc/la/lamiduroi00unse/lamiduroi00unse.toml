id = "lamiduroi00unse"
type = "pamphlet"
title = "L'Ami du roi, des français, de l'ordre et sur tout de la vérité ..."
language = "fr"
place = "Paris"
date = "1790"
note = "Edited by Mme. Fréron and her brother Royou. Colophon varies. Some numbers: Chez Madame Fréron même, rue Saint-André-des-arts, no. 37 .. Colophon omitted on many numbers. Caption title. Supplements issued with numbers for Oct. 8, 15, Nov. 4, 20, 1790, Jan. 25, Feb. 19, Mar. 7, 10, Apr. 3, 6, Aug. 20, Sept. 1, 17, 28, 1791. July 1, 1791-May 4, 1792 have epigraph: Je l'aimai tout-puissant, malheureux je l'adore. Sept. 2, 1790-May 31, 1791 numbered 94 to 377 in continuation of L'Ami du roi published Chez Crapart from which this periodical separated Sept. 1, 1790. Numbering dropped with 377, May 31, 1791. Suppressed May 4, 1792. No more published. Scanner's note: paper adhered over text in one issue."
url = "https://archive.org/details/lamiduroi00unse"

