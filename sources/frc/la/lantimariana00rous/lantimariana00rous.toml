id = "lantimariana00rous"
type = "pamphlet"
title = "L'antimariana ou, Réfutation des propositions de Mariana. : Pour monstrer que la vie des princes souuerains doit estre inuiolable aux subiects & à la republique, tant en general qu'en particulier, & qu'il n'est loisible de se reuolter contr'eux ou attenter à leur personne, sous pretexte de tyrannie ou autre que ce soit. A la fin sont les deliberations de la Sorbonne, & l'arrest de la Cour de Parlement."
language = "fr"
place = "A Rouen"
date = "1610"
note = "Coat of arms of Henry IV on t.-p. Bibl. Nat. Cat. gen. Signatures: A⁸? B-M⁸ N² (A8 and N2 blank). Dedication signed: M. Roussel. Numerous errors in paging. By Michel Roussel. Cf. Barbier. Barbier, A. A. Ouvrages anonymes. Scanner's note: Book is missing pages 64/65. Pages 175/176 have text lost in binding. Damaged, stained, torn and/or loose pages. Uneven binding. Skewed text. Text is lost in the binding or extends off of the edge of the page. Irregular pagination."
url = "https://archive.org/details/lantimariana00rous"
subject = [
    "Mariana, Juan de, 1536-1624",
    "Despotism",
    "Monarchy",
]
