note = """Prospectus for Buc'hoz's "La nature considérée sous ses différens aspects.". Caption title. "Le prix de l'abonnement, pour vingt-cinq cahiers par an, est de 14 liv. pour Paris, & 18 pour la province, franc de port. On souscrira chez Lacombe, libraire, rue Christine, ou chez M. Buc'hoz, médecin-botaniste de Monseigneur le comte de Provence, rue de Tourraine, fauxbourg S. Germain"--P. 3. "Lu & approuvé, à Paris ... permis d'imp. ce 28 janvier 1773"--P. 4. "Avis. M. Buc'hoz ... se propose actuellement de donner une description de ce royaume, & d'en publier une histoire naturelle & économique ..."--P. 3-4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
