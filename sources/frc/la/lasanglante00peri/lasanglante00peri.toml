note = "Supposedly a speech from Henry IV to his son Louis XIII on the occasion of the civil war, and in favor of the Prince de Condé. Also published under the title La chemise sanglante de Henry le Grand. André, Les sources de l'histoire de France. First pub. under title La chemise sanglante. cf. Barbier. Dict. des ouvr. anon. Scanner's note: Title and cover page are combined. Damaged, stained, marked, torn and/or loose pages. Uneven binding. Skewed text."
