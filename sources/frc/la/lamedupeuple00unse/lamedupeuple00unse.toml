note = "Caption title. Signed: Par le républicain T. Rousseau, premier commis dans les bureaux de la guerre. Imprint from colophon. Place of publication from Martin & Walter. Also published as part of an 8 v. collection. Cf. Martin & Walter. Martin & Walter. Révolution française. Cantique d'allegresse sur nos conquêtes à la liberté : air, Ah! ça ira, ça ira, ça ira -- Les devoirs du bon citoyen : air, Joseph est bien marié -- Dialogue entre le roi de Prusse et le sieur Brunswick -- Autre, entre Bouillé et Mirabeau-Tonneau : Air, Dans ma cabane obscure -- Aux braves défenseurs de Valenciennes et de Condé : air, Malgré la bataille -- Hymne pour une fête champêtre en l'honneur de la liberté : air, Dansez, chantez, amusez vous -- Hommage a tout bon patriote : air, Daigne écouter l'amant fidèle et tendre -- Le damas du véritable père Duchêne : air, Quand un tendron vient dans ces lieux. Bibliography: Martin & Walter.  Révolution française,  IV:1, 30114. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text."
