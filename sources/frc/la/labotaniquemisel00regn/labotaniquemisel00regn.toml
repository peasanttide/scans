note = """Prospectus for: La botanique mise à la portée de tout le monde, ou, Collection des plantes d'usage dans la médecine, dans les alimens et dans les arts / executé et publié par les Sr. et De. Regnaults. Paris, 1774 [i.e. 1770-1780]. Caption title. Printer statement from colophon. "Permis d'imprimer, ce 26 juillet 1769"--P. [4]. "Grand in-folio proposé par souscription"--P. [1]. "On souscrit à Paris, chez l'auteur, rue Croix-des Petits-Champs, au magasin de chapeaux des troupes du roi, Dessain junior, libraire, quai des Augustins, Delalain, libraire, rue de la Comédie Françoise, Lacombe, libraire, rue Christine, près de la rue Dauphine"--P. [4]. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
