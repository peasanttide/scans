language = "fr"
place = "s.l."
date = "1788"
note = """Half title. "Je viens de chez un M. qui m'a assuré que c'étoit vainement qu'on demandoit les Etats généraux; qu'ls ne seroient point convoqués; que le roi ne pourra jamais s'y résoudre": p.5. "Maintenant que vous m'avez dissuadé des bruits populaires, concernant les Etats généraux, je serois charmé d'apprendre de vous, quel sera le plan de leurs travaux, & quel effet ils produiront": p.9. Not in Martin & Walter. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
