note = """Author's name is pseudonym. Cf. Martin & Walter, BN. Dated, p. 42: Ce 20 mai, 1791. Martin & Walter. Révolution française. BN. Épitre dédicatoire a mademoiselle de Villeneuve -- Vérités historiques, sur l'installation de M. l'evêque constitutionnel du département du Gard -- Le livre de l'exaltation de Mouduchel, rabbin des quatre puissances de sapir -- Lettre extraite du Journal de la cour et de la ville, du dimanche 17 avril 1791, no. 48, page 428, toisième paragraphe, ligne 15, et sous ce titre: Aux rédacteurs -- Madrigaux en l'honneur de M. Dumouchel, evêque du département du Gard, par la graĉe de la constitution -- Lettre de M. Dumouchel, evêque du département du Gard, à tous les curés de ce département -- Observations patriotiques de M. Benoît Saussine. "Lettre ... à tous les curés de ce département" and " Observations patriotiques ..." on facing pages. Bibliography: Martin & Walter.  Révolution française,  IV:1, 31059. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
