note = """Caption title. Without imprint. Opening sentence: Nous avions cru qu'après la fin tragique de MM. de Launay & de Flesselles, Paris n'offriroit plus de scènes sanglantes. "M. Berthier, intendant de Paris, est arrivé à neuf du soir, à la Grêve, accompagné de 800 hommes à cheval, dont l'un portoit la tête de Foulon": p.2. Not in Martin & Walter (not the same as IV 2: 2774, 1st or 2d entries). Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
