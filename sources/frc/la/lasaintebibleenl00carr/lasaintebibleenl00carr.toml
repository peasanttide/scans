date = "1748"
note = """Prospectus for "La Sainte Bible en latin et en françois," published 1748-1750 with French translation of the Latin Vulgate by Louis de Carrières and commentaries by Augustin Calmet, Abbé de Vence, and others. Title vignette. "On propose par souscription, & pour en faciliter l'acquisition, non seulement on en bornera le prix à 72 liv. en feuilles pour ceux qui souscriront, mais on consentira même de ne recevoir cette forme que par parties"--P. 5. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Missing pages 1-3."""
