title = "La grande fureur de Moustache-Sans-Peur contre ce vieux sacré sac-a-vin de Père Duchêne : qui, après avoir perdu sa tête, voudrait nous ramener le rêgne de la terreur pour nous faire perdre les nôtres ; La grande colère de ce brave sapeur contre tous les plats-gueux qui vont gueuler dans les grouppes et dans les sociétés politiques, pour tâcher d'obtenir, afin de pouvoir, tout à leur ais, voler et piller les citoyens; faire renaître les comités révolutionnaires; se gorger du sang du peuple, et briser encore des scellés."
