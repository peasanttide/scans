note = """Prospectus for "La Sainte Bible en latin et en françois," published 1767-1773 with French translation of the Latin Vulgate by Louis de Carrières and commentaries by Augustin Calmet, Abbé de Vence, and others. Caption title. Printer from colophon. "Permis d'imp. ce 21 octobre 1774"--P. [2]. Includes prospectus for an edition of Jean de La Fontaine's Fables. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
