title = "Vente a l'amiable, d'un cabinet de livres rares & curieux"
language = "fr"
place = "Paris"
date = "1774"
note = """Caption title. "Cette vente commercera le lundi, 12 décembre 1774, & jours suivans, jusqu'au 24 dudit mois, depuis neuf heures du matin jusqu'à neuf heures du soir, chez Bailly, libraire, quai des Augustins, entre le pont Saint-Michel & la rue Gist-le-Cœur. Les prix seront marqués sur chaque article"--P. [1]. Imprint from colophon. Printed in double columns. BN. Catalogues de libraires. Catalog of rare books on theology, arts and sciences, belles-lettres, history, and law, including 130 from the Elzevir Press. Some entries describe type of paper, binding, and rarity of the books. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
