title = "Véritable lettre de Marie Antoinette d'Autriche, ci-devant reine des François, pour être présentée aujourd'hui à la Convention nationale, envoyée aux quarante-huit sections de Paris, aux quatre-vingt-quatre départemens, aux quarante-quatre mille municipalités du royaume, à toutes les autorités constituées, et à toutes les couronnes étrangères, sur la mort de Louis XVI, son époux, sur sa situation et celle de ses enfans, et sur sa translation qui aura lieu demain dans les prisons de la conciergerie du Palais : imprimée par ordre de son défenseur."
language = "fr"
place = "Paris"
date = "1793"
