title = "Grand discours fait par Ch.-Ph. Ronsin, l'an 4me. de la liberté, et le 1er. de l'égalité, à l'occasion de la cérémonie funèbre, faite le 26 août 1792, au jardin des Tuileries, ordonnée en l'honneur de nos frères d'armes morts à la journée du 10, pour la défense de la liberté et de l'égalité."
