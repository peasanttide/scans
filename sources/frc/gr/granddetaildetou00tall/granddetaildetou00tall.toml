title = "Grand detail de tout ce qui s'est passe à l'Hôtel-de-ville hier au soir & la nuit derniere, pour obliger M. de La Fayette à garder sa place : grande députation de toutes les sections de Paris : discours du général, qui s'est trouvé mal après l'avoir prononcé, & qui a été forcé de se retirer : discours d'un chasseur du bataillon des Carmes : discours d'un grenadier du bataillon des Petits-Peres : motion du curé de Chaillot, approuvée par le conseil de la commune : M. Bailly chargé d'aller savoir la derniere réponse de M. La Fayette."
