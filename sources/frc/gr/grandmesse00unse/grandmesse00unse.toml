title = "Grand'messe de requiem pour le repos de l'ame de son altesse sérénissime et éminentissime Monseigneur le clergé de France, décédé le jour des morts 1789, et inhumé le 14 avril 1790, dans la salle de l'Assemblée nationale : qui sera célébrée demain et jours suivans, et plus particulièrement tous les dimanches, fêtes et lundis de l'année, à la Courtille, aux Porcherons, à la Barrière-Blanche, à la Nouvelle-France, à Vaugirard, et généralement dans toutes les guinguettes et cassines de la ville et fauxbourgs de Paris : tous les citoyens sont priés d'y assister : requiescat in pace."
language = "fr"
place = "Paris"
date = "1790"
