title = "Grande victoire remportée par les patriotes de la montagne, cassation de la Commission des complots, liberté rendue à Hebert, et exécrable conspiration découverte de Maximilien Isnard! Barbaroux! Buzot! Brissot! Louvet! Ducos! Lanjuinais! Louvet! Gensonné! Guadet! Vergniaud! Genésieux! Fonfrede! Lasource! Pétion! Pénieres (Le Poltron)! la Commission des (complots)! : enfin tout la bande des complices de Capet et de Dumourier, de faire massacrer les montagnards, la municipalité de Paris, les Jacobins, et toutes les sociétés populaires, en les traitant de conspirateurs et d'assassins de la représentation nationale! : au Tribunal révolutionaire! : les scélérats qui veulent perdre Paris aux yeux des départmens! : il est tems, ou nous sommes perdus!."
language = "fr"
place = "Paris"
date = "1793"
note = "Caption title. Signed: Lebois, l'ami des sans-culottes, & l'ennemi des jean-foutres. Imprint from colophon. Place and date of publication from BM. BM. Martin & Walter. Révolution française. Bibliography: BM,  CXXXII, colum 581. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
