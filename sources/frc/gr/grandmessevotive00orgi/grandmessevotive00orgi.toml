title = "Grand'messe votive, qui doit être célébrée à l'ouverture des Etats généraux, par l'aumônier du tiers : où l'on trouvera bien des choses édifiantes & curieuses, propres à ranimer la dévotion & la confiance des bons citoyens, telles que le nouveau confiteor du clergé, & celui de la noblesse : l'épitre du patriotisme, la prose du jour de la fête des Etats généraux, le nouveau credo, les deux evangiles selon la raison, & mille autres traits édifians /"
language = "fr"
place = "France"
date = "1789"
note = """"La noblesse n'est pas exclue dudit office, du moment qu'elle se résignera aux volontés justes du monarque.". Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page.  Uneven binding.  Damaged, stained and/or loose pages.  Skewed text.  Skips pages 2-3."""
