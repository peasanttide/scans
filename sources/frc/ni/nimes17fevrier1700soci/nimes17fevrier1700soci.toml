note = """Caption title. Imprint from colophon. At head of title: Société des amis de la liberté et de l'égalité. Séante aux ci-devant Jacobins St.-Honoré, `a Paris. The first text signed on p.3: Les membres de la Société des sans-culottes de Nîmes. "La Société des républicains sans-culottes du club national, séante aux ci-devant Jacobins de Bordeaux, a la Convention nationale": p.3-8. Dated at end: Bordeaux, 20 février 1793, l'an II de la République françoise, le premier de la mort du tyran. "La soct́té, dans sa séance du 24 février, l'an deuxi`eme de la République françoise, a arr^eté l'impression & l'envoi de ces deux pi`eces ...": p.8. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained, and/or loose pages."""
