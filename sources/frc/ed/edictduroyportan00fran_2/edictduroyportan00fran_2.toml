title = "Edict du roy portant nouuelle fabrication d'especes d'argent, augmentation du marc d'argent le roy, & des quarts d'escu, testons & francs aux coins & armes de Sa Maiesté estans de leur iuste poids, & continuation du cours des especes d'argent legeres auec le remede des grains iusques au dernier mars prochain, & outre vn droit de seigneuriage sur les ouurages d'orfeurerie & tireurs d'or, auec vne nouuelle eualuation : ensemble l'arrest de verification en la Cour des monnoyes, du 18. nouembre 1641, aux exceptions y contenuës."
language = "fr"
place = "A Paris"
date = "1642"
note = """The edict is dated Sept. 1641. Signatures: A-S⁴. "Portraits, poids & prix des especes d'or & d'argent, tant de France qu'estrangeres, ausquelles le roy a donné cours par son present edict": p. 29-130; "Instruction pour la connoissance du marc & des poids qui le composent": p. [132]. Bound with France. Cour des monnaies. Grand tarif, ou evaluation du prix du marc des escus ... 1642."""
