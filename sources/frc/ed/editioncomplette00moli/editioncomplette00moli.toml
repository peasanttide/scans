note = """Prospectus for an edition of Pietro Metastasio's complete works. Caption title. Publication information from colophon. "On soucrira chez les libraires suivans: A Paris, Durand le neveu, rue Galande, Molini, rue de la Harpe, Esprit, au Palais Royal; a Lyon, Bruyset; a Londres, Helmsly, Pierre Molini; a Madrid, Antoine de Sancha; a Lisbone, Borel; a Amsterdam, J. Corn. Haak; a Vienne, Bernard, Arteria; a Berlin, Bordeau; a Pétersbourg, Potet, directeur de l'Imprimerie de l'Académie; a Varsovie, Groell; a Stockholm, Wlf; a Rome, Noël Barbiellini; a Naples, Dominique Terres; a Florence, Joseph Molini; a Venise, Pasquali; a Parme, Carmignani; a Turin, Albino; a Milan, J. Antoine Cairoli; a Gênes, Baillieu, de feu Jules; a Bologne, les frères Taruffi"--P. 6-7. Includes prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/editioncomplette00moli"
