note = """Prospectuses for Mirabeau's "Mémoires du ministere du duc d'Aiguillon, pair de France, et de son commandement en Bretagne," and a French translation of Mackintosh's "Vindiciae Gallicae," both published by Buisson in 1792. Caption title. Probably detached from a larger work. "Apologie de la Révolution française, et de ses admirateurs anglais, en réponse aux attaques d'Edmund Burke, avec quelques remarques sur le dernier ouvrage de M. de Calonne, par Jacques Mackintosh, ouvrage traduit de l'anglais sur la troisième édition. 1 volume in-8°. Prix, 3 liv. 12 sols, broché. A Paris, chez le même libraire": P. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />Text extends past page edges. <br /><br />."""
