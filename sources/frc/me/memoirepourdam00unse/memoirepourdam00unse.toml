title = "Memoire, pour Dame Fleurie Martin, femme separée quant aux biens de noble Antoine Compain, seigneur de Vavre, baron de Lurcy, avocat en Parlement, doyen des conseillers du roy en l'election de Lyon, & Damoiselle Pierrete Compain, fille mineure dudit Sieur Compain, émancipée d'âge, procedant sous l'autorité de Sieur Denis-Nicolas Lambotte, procureur au Parlement de Paris, son curateur aux causes, & le même Sieur Lambotte, au nom de curateur, demandeurs en cassation des arrêts du Parlement de Dombes des 10. & 24. mars 1738."
