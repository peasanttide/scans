note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des anciens. Égalité. Liberté. "Le Directoire exécutif au Conseil des anciens.". "Le Directoire exécutif vous adresse la lettre qu'il vient de recevoir du citoyen François (de Neufchâteau), contenant son acceptation des fonctions de membre du Directoire exécutif": p.[1]-2. The letter (on p.2-3) is dated: Paris, le 24 fructidor, l'an 5 ... (10 September 1797). Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
