title = "Message du Directoire exécutif ; envoyé hier au soir au Corps législatif ; qui lui rend compte définitivement de la situation de la République et des motifs qui ont causé les revers de nos armées ; plan du Directoire pour sauver la chose publique ; nom du nouveau directeur qui va remplacé [i.e. remplacer] le directeur destitué ; démissions demandé par plusieurs membres du Directoire, au Corps législatif."
language = "fr"
place = "À Paris"
date = "1799"
note = "Caption title. Imprint from colophon. Dated in contemporary ms. at head of p.[1]: 30 prair. an 7 [18 juin 1799]. Appears to be an unofficial paraphrase of the Message of 29 prairial an 7 (17 June 1799). Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."
