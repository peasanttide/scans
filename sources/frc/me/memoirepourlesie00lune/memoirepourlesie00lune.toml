type = "pamphlet"
title = "Mémoire pour le sieur abbé Luneau de Boisjermain, contre le sieur Grangé, imprimeur-libraire"
language = "fr"
place = "Paris"
date = "1761"
note = """Caption title. Signed, p. 10: Luneau de Boisjermain. Me. Dandasne, avocat. Duchesne l'aîné, proc. Imprint from colophon. Initial; head-piece. Luneau de Boisjermain alleges that Grangé breached their contract for the printing of his Cours d'histoire et de géographie universelle and demands restitution. "Pieces justificatives des faits énoncés dans le Mémoire": p. 11-23. "Avis aux souscripteurs du Cours d'histoire & de géographie universelle": [1] p. at end. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
url = "https://archive.org/details/memoirepourlesie00lune"
subject = [
    "Luneau de Boisjermain, Pierre Joseph François, 1732-1801",
    "Grangé, Jean-Augustin, b. 1712?",
    "Authors and publishers",
    "Restitution",
]

