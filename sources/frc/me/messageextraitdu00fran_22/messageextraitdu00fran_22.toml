note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Relevé des décisions du Directoire exécutif sur les demandes en radiation de la liste des émigrés depuis l'époque de la loi qui le charge de statuer sur ces demandes, jusques et compris le 20 pluviôse de l'an V [8 février 1797]": p.[3]-58. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding. Tight margins. Text extends off edge of the page, and some text lost in binding."""
