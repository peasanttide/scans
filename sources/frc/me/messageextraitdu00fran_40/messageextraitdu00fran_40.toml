note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des anciens. Égalité. Liberté. "Le Directoire exécutif au Conseil des anciens.". "Le Directoire exécutif ne peut tarder à vous transmettre la lettre écrite par le général Moreau au citoyen Barthélmy, en date du 19 de ce mois": p.[1]-2. "Le général en chef au citoyen Barthélemy, membre du Directoire exécutif de la République française": p.[3]-6. Dated at beginning: Au quartier-général à Strasbourg, le 19 fructidor, an cinquième de la République française [5 septembre 1797]. Martin & Walter III: 25134 (which specifies: Pour dénoncer la trahison de Pichegru). Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
