title = "... Message : Extrait du registre des délibérations /"
language = "fr"
place = "Paris"
date = "1799"
note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". Further details on the assassination of French ministers at Rastatt, Germany, 18 April 1799. "Narré fidèle du forfait commis à Rastadt, d'après les ordres de l'Autriche, par le régiment des hussards autrichiens, dits Szeklers, contre la légation française au congrès de paix, le 9 floréal, an 7 de la République [29 avril 1799]; dicté par Jean Debry, l'un des ministres plénipotentiaires, le 17 floréal an 7 [6 mai 1799]": p.3-14. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title on cover. Damaged, stained pages and cover. Tight margins."""
