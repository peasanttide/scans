place = "Paris"
date = "1793"
note = "Caption title. Signed: Lauchard, femme Gilles. Imprint from colophon. Publisher location from Martin & Walter. Martin & Walter. Révolution française. Defends Lauchard's husband, administrator of the civil list granting a personal allowance to Louis XVI, from accusations made against him. Bibliography: Martin & Walter. Révolution française, II, 14843. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Uneven binding. Skewed text.  Damaged, Cut and Creased Pages."
