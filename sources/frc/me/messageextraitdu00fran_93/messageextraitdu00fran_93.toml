date = "1799"
note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Le Directoire exécutif vient appeler de nouveau et fixer votre sollicitude sur l'état intérieur de la République, sur les causes qui la remplissent de troubles et de désordres, qui la menacent de toutes parts des plus affreux déchiremens et des convulsions les plus funestes": p.[1]-2. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
