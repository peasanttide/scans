#:schema ../../../../schemas/source.json
layer = "source"
id = "memoirepresentel00brul"
type = "pamphlet"
title = "Mémoire présenté à l'Assemblée nationale par le sr Brullée, concernant l'offre de faire verser dans la caisse de la ville de Paris une somme de vingt millions, qui pourrait être appliquée, par l'Assemblée nationale, au secours des indigens dans l'étendu du royaume : l'etablissement d'un canal qui abrégera la navigation des rivières de Marne, de Seine & d'Oise, & en amènera les eaux au bastion de l'arsenal, et la construction, sur les ruines de la Bastille, d'une place nationale, dans laquelle sera construit un bassin de quatre-vingts toise de diamètre, entouré des quais destinés au commercer, au center sera élevée la statue du roi, & sur l'un des bords sera construit un palais à la gloire de la nation"
language = "fr"
place = "A Paris"
date = "1789"
note = "Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, I, 5432. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
url = "https://archive.org/details/memoirepresentel00brul"
