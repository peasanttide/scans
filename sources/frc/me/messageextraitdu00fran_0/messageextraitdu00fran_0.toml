date = "1796"
note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif, au Conseil des cinq-cents.". "Le Directoire exécutif, informé hier ... que des mandats d'amener avoient été lancés par le bureau central de la commune de Paris, contre des membres du Conseil des cinq-cents, donna sur-le-champ des ordres pour qu'il fut rendu compte des causes qui ont pu produire un délit aussi criminel ...": p.[1]-2. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
