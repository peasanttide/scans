note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Le Directoire exécutif vous transmet les pièces qu'il vous a annoncées dans son message d'hier, comme prouvant qu'Imbert-Colomès a été à Lyon le principal agent de celui des émigrés et leurs infâmes partisans qualifient de roi": p.[1]-2. "Pièces relatives a Imbert-Colomes": p.3-27. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
