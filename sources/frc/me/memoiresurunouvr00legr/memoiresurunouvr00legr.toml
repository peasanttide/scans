note = """Prospectus for Le Gras du Villard's "Mémoires sur l'état présent du Dauphiné," published 1753. Caption title. Signed: M. Gras-Duvillard, chanoine de Saint André de Grenoble, demeurant près la petite porte de la même église. Page 4 misnumbered 2. Head-piece. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Page numbering errors."""
