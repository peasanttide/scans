note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Armée catholique et royale de Bretagne et pays adjacens. Joseph Comte de Puisaye, lieutenant-général des armées du roi, commandant en chef pour Sa Majesté dans la province de Bretagne, etc.; aux habitans de ces pays": p.[3]-7. Dated at end: Donné le premier jour de janvier 1797, l'an troisième du règne de Louis XVIII. "Beaufranchet, président de l'administration municipale du canton de Nantes, au ministre de la police générale": p.7-8. Dated at beginning: Nantes, le 21 pluviôse, l'an 5 de la République française, une et indivisible [9 février 1797]. "Garde nationale sédentaire. Le chef de division de la Garde nationale sédentaire du canton de Nantes, à ses concitoyens": p.8-10. Dated at end: Nantes, le 20 pluviôse, an 5 de la République [8 février 1797]. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
