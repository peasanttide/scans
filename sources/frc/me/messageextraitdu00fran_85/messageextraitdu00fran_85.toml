note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Le Directoire exécutif auroit répondu plutôt à votre message du 17 de ce mois [5 juin 1799], sur la situation extérieure et intérieure de la République, s'il n'eût été jaloux de vous présenter ... l'ensemble des mesures les plus propres à remplir vos vues ...": p.[1]-2. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
