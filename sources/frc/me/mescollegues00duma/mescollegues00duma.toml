note = """Caption title. Signed at end: Matthieu Dumas. Paris, le 4 avril 1792. Publisher name from colophon. "Des journalistes ont répandu sur mon compte une absurde calomnie. J'ai toujours dédaigné de repousser de pareilles attaques; mais le nom d'un de mes collègues, et celui d'un citoyen estimable, cités avec la dernière impudence, ne m'ont pas permis de me taire."--P. [1]. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 11795. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
