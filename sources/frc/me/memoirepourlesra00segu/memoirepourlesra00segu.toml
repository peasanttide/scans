title = "Mémoire pour le sr Augustin-Martin Lottin, l'aîné, libraire & imprimeur de M. le duc de Berry, intervenant & demandeur, contre M. l'evêque de Noyon, le chapitre de Noyon, & le sr Cuquigny, chanoine, défendeurs"
language = "fr"
place = "Paris"
date = "1763"
note = "Caption title. Signed: Monsieur Séguier, avocat-général. Me Pierret de Sansieres, avocat. Lézat, proc. Imprint from colophon. Head-piece. Lottin seeks damages from the bishop, chapitre, and chanoine of Noyon for the loss of income he sustained from the suspension of the printing of a new Breviary for Noyon. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."
