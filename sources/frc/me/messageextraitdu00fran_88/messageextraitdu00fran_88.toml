note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des anciens. Égalité. Liberté. "Le Directoire exécutif au Conseil des anciens.". "Macdonald, général en chef de l'Armée de Naples, au général en chef Moreau": p.3-4. Dated at beginning: Au quartier-général de Formigino, le 24 prairial an 7 de la République française, une et indivisible [12 juin 1799]. "Copie de la lettre écrite du quartier-général de Modène le 25 prairial [13 juin 1799], par le général Macdonald, commandant en chef l'Armée de Naples, au général en chef Moreau, commandant l'Armée d'Italie": p.5. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
