note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". Opening sentences: Par votre message du 4 frimaire dernier, vous avez demandé au Directoire exécutif: 1⁰. De vous donner des renseignemens sur la situation politique des départemens de l'ouest; 2⁰. De vous faire connoître si les lois actuelles sont suffisantes pour arrêter les brigandages et les complots liberticides. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
