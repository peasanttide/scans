note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "En exécution de la loi du 24 messidor dernier [12 juillet 1799] sur la répression du brigandage et de l'assassinat dans l'intérieur, le Directoire exécutif vous propose de déclarer compris dans les dispositions de cette loi toutes les communes du département de la Haute-Garonne": p.[1]-2. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.   Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
