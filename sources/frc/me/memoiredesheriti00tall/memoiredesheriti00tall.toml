title = "Mémoire des héritiers Valade, fournisseurs d'artillerie pour la République, contre le citoyen Broussoneix, a la commission composée des représentans Roux (de l'Aveyron), Ribereaux et Marcheaux, et nommée pour examiner la réclamation du citoyen Broussoneix contre l'arrêté des comités de salut public et de législation de la Convention nationale, du 10 vendémiaire, an IV."
language = "fr"
place = "A Paris"
date = "1796"
note = """Caption title. Signed, p. 26: Grolhier-Desbrousses, jeune, faisant pour les Valade. Imprint from colophon. Not in Martin & Walter. Révolution française. "Extrait du registre des arrêtés du Comité de salut public de la Convention nationale. Du 10 vendémiaire, an IV de la République française, une et indivisible"--P. 27-30. Scanner's note: Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
