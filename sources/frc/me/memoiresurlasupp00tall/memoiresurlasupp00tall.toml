title = "Mémoire sur la suppression des banqueroutes frauduleuses par-tout le royaume : présenté successivement à MM. de Calonne, de Villedeuil & Lambert, contrôleurs généraux, comme aussi à M. l'abbé de Brienne, principal ministre, & depuis à M. Necker, directeur-général des finances, les 20 octobre 1788, & 20 mars 1789 : le tous sans aucun succès, ni réponse, ni attention : pour servir de rénovation de la même demande, vis-à-vis de la nation, représentée par N.S. les Etats-généraux assemblés à Versailles : à M. Necker, directeur-général des finances."
