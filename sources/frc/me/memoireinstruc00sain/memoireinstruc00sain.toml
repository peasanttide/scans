title = "Mémoire instructif, pour le pere Nicolas de S. Joseph, prieur des Carmes déchaussez du couvent de la ville de Toulon, decreté d'ajournement personnel à l'occasion de la plainte formée par la demoiselle Cadiere, contre le pere Jean-Baptiste Girard, recteur des jesuites de la même ville, son ancien directeur."
language = "fr"
place = "A Aix"
date = "1731"
note = "Caption title. Signed at end: F. Nicolas de St. Joseph, prieur des Carmes dechaussez du couvent de Toulon. Pascal, avocat. H. Chery, procureur. Imprint from colophon. Signatures: A-O². Initial; head-piece. No. 16 of 54 titles bound together. Scanner's note: No copyright page found. No table-of-contents pages found.  Uneven binding. Skewed text. Title is on the cover. Text is lost in the binding. Damaged, stained, and/or torn pages."
url = "https://archive.org/details/memoireinstruc00sain"
