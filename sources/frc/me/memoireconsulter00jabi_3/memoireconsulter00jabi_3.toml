note = "Caption title. Signed: Jabineau de Santer. Blondel. Courtin. Treilhard. Gaultier du Breil. Imprint from colophon. Head-piece. Regarding a legal dispute over the publication, by Jean Debure, of La Chapelle's Traité des sections coniques, et autres courbes anciennes and L'art de communiquer ses idées. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."
