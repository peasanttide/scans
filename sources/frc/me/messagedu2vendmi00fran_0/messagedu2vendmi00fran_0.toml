note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Liberté. Égalité. "Le Directoire exécutif au Conseil des cinq-cents.". "L'objet de ce message est de fixer vos yeux sur les besoins urgens de nos armées de terre et de l'armée navale": p.3. "Discours de Théodore Chabert, des Bouches-du-Rhône, sur le message du Directoire exécutif relatif à la levée de deux cent mille hommes et à la demande de 125 millions pour les dépenses extraordinaires des ministres de la guerre et de la marine": p.[7]-8. "Discours du citoyen Duviquet": p.[9]-11. Not in Martin & Walter [edition 2: 11 p.; with extra text as indicated]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title on cover. Damaged, stained pages and cover. Tight margins."""
