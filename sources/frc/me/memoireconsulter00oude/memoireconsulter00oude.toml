id = "memoireconsulter00oude"
type = "pamphlet"
title = "Mémoire a consulter pour M. Buc'hoz, médecin de quartier de Monsieur, ancien médecin de Monseigneur le comte d'Artois, & de feu S.M. Stanislas roi de Pologne, membre du College royal de médecine de Nancy, & de plusieurs académies des sciences, des belles-lettres & des arts, contre le sieur Brunet, libraire á Paris, les syndics de ses créanciers, se disant en ses droits, et le sieur Delisle, négociant á Paris, que le sieur Brunet dit lui avoir succédé"
language = "fr"
place = "Paris"
date = "1779"
note = "Caption title. Signed, p. 73: Oudet. Imprint from colophon. Head-piece. Regarding a contractual dispute between author Pierre-Jospeh Buc'hoz and publisher Pierre Prudence Brunet over payment for Buc'hoz's Histoire universelle du regne végétal. Errata, p. 73. Includes bibliographical references. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."
url = "https://archive.org/details/memoireconsulter00oude"
subject = [
    "Buc'hoz, Pierre-Joseph, 1731-1807",
    "Brunet, Pierre Prudence, d. 1781",
    "Delisle, négociant",
    "Authors and publishers",
    "Debtor and creditor",
]

