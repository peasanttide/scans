title = "Mémoire pour le sieur Loyseau, graveur & fondeur de caractères d'imprimerie, contre le sieur Ballard, imprimeur du roi, & noteur de la chapelle de Sa Majesté"
language = "fr"
place = "Paris"
date = "1764"
note = "Caption title. Signed: Monsieur Seguier, avocat général. Me Le Gouvé, avoc. Servais, proc. Imprint from colophon. Head-piece. Regarding a 1764 legal dispute between Loiseau and Ballard over whether the former copied the latter's patented musical type characters. Cf. Dictionnaire des imprimeurs, libraires et gens du livre à Paris, I, p. 120. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."
url = "https://archive.org/details/memoirepourlesie00segu"
subject = [
    "Loiseau, Pierre François",
    "Ballard, Christophe, approximately 1701-1765",
    "Music printing",
    "Type and type-founding",
]

