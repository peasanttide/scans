title = "A Messieurs les députés a l'Assemblée nationale : observations des fabricans de porcelaine & fayence du royaume, sur une adresse lue à l'Assemblée nationale : séance du seize janvier."
language = "fr"
place = "Paris"
date = "1790"
note = "Caption title. Signed: Glot, administrateur du département de Paris. Imprint from colophon. Publication date inferred from another work by Glot (Martin & Walter, II, 15030), published in 1790, on the same subject. Martin & Walter. Révolution française. Challenges a request by the English entrepreneur Potter to establish a ceramics factory in l'Aisne and calls for stronger tariffs to protect the French ceramics trade. Bibliography: Martin & Walter.  Révolution française,  II, 15029. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover page."
url = "https://archive.org/details/messieurslesdepu00glot"
