title = "... Message : Extrait du registre des délibérations /"
language = "fr"
place = "A Paris"
date = "1799"
note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". Opening sentences: Le Conseil des cinq-cents a adressé au Directoire exécutif un message, pour lui demander compte de l'exécution des lois portées contre les auteurs, imprimeurs, vendeurs, afficheurs d'écrits, proclamations, adresses, provoquant le rétablissement de la royauté, le renversement de la République et de la constitution de l'an 3. Le Directoire, animé des mêmes sentimens que le Conseil, se livroit aux mêmes sollicitudes .. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
