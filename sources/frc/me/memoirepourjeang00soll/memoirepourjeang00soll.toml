language = "fr"
place = "France?"
date = "1730"
note = "Caption title. Signed, page 15: Monsieur l'abbé Pucelle, raporteur. Gaultier, procureur. Dated at end: À Soleure le 24. mars 1730. Signatures: A-E². Head-piece. No. 12 of 54 titles bound together. Scanner's note: Uneven binding. Skewed text. Title is on the cover. Text is lost in the binding. Damaged, stained, or torn pages."
