language = "fr"
place = "A Paris"
date = "1792"
note = """Signed: Charles de Bourbon-Montmorency. "On y trouve aussi un abrégé histoire de son infortunée vie, et la liste des noms, titres, qualités et demeures de toutes les personnes qui doivent et qui ont attesté ses malheurs et ses droits.". Martin & Walter. Révolution française. "Pièces justificatives, et liste des personnes qui doivent attester les droits et les malheurs de Charles Bourbon-Montmorency, dit Alexandre de Crequy, et dont la plupart sont ici présens, tant en personnes que par leurs certificats et attestations ci-jointes"--P. 7-34. "Supplément aux pièces présentées à l'Assemblée nationale de France, en date du 29 janvier 1792"--35-38. Bibliography: Martin & Walter.  Révolution française,  I, 8795. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page. Skewed text. Damaged, loose pages."""
