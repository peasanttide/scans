note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Le Directoire exécutif vous transmet copie d'une dépêche qu'il vient de recevoir du général Bonaparte": p.[1]. "Bonaparte, membre de l'Institut national, général en chef, au Directoire exécutif": p.[3]-6. Dated at beginning: Au quartier-général d'Alexandrie, le 10 thermidor an 7 de la République française, une et indivisible[28 juillet 1799]. "Discours prononcé par Gaudin": p.[7]-10. "Discours prononcé par Carret (du Rhône)": p.[11]-12. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
