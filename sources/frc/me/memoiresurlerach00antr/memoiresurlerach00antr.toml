note = """Publisher's device on t.p. Martin & Walter. Révolution française. "Edit du roi de Sardaigne, du 20 janvier 1762, pour l'affranchissement de la taillabilité personnelle en Savoie, la rémission du Tot-Quot, et délégation des intendans respectifs"--P. 27-35. "Edit du roi de Sardaigne, du 19 décembre 1771, pour l'affranchissement des fonds sujets à devoirs féodaux ou emphitéotiques en Savoie, et autres dispositions relatives à cet objet, aux fiefs et emphithéoses, aux dettes des communautés, et à la réduction des intérêts"--P. 36-62. "Lettres-Patentes du roi de Sardaigne, du 10 décembre 1773, par lesquelles sa Majesté prescrit des Réglemens relatifs à l'Edit du 19 décembre 1771, pour l'affranchissement des fiefs, et emphitéoses du duché de Savoie, et aux dispositions émanées en conséquence"--P. 63-68. "Manifeste de la chambre des comptes, du 25 octobre 1777, pour la vente des fiefs, jurisdictions, biens et revenus du royal domaine"--P. 69-77. Bibliography: Martin & Walter.  Révolution française,  I, 427. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover."""
