title = "Mémoire sur le mariage des protestans."
language = "fr"
place = "A Paris"
date = "1787"
note = "Attributed to Chrétien Guillaume de Lamoignon de Malesherbes. Cf. Martin & Walter. Martin & Walter. Révolution française. Mémoire sur le mariage des protestans fait en 1785 -- Mémoire de M. Joly de Fleury -- Arrêt du conseil du 9 août 1683, qui ordonne à ceux qui ont les registres des baptemes, mariages & mortuaires des lieux où l'exercie de la R.P.R. a été interdit, de les mettre aux greffes des bailliages & sénéchaussées, dans le ressort desquels sont situés lesdits lieux -- Arrêt du conseil du 15 septembre, 1685, concernant les baptêmes & les mariages de ceux de la R.P.R. -- Déclaration du roi du 11 décembre 1685, pour établir la preuve du jour du décès de ceux de la R.P.R. Bibliography: Martin & Walter.  Révolution française,  III, 22483."
