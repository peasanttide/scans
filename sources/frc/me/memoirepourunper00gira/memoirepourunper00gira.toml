title = "Mémoire pour un père de famille qui réclame la justice de la Convention nationale : il s'agit de sa fortune et de celle de sed deux fils, dévoués volontairement au service de la République : il espère que ce motif suffira pour engager les représentans du peuple à donner toute leur attention à cette affaire, qu'on a trop cherché à embrouiller, et à ne porter une décision qu'après en avoir pris une parfaite connoissance"
language = "fr"
place = "Paris"
date = "1793"
