note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Égalité. Liberté. "Le Directoire exécutif au Conseil des cinq-cents.". "Mantoue s'est rendue le 14 de ce mois [2 février 1797], à dix heures du soir: la garnison est prisonnière de guerre": p.[1]. "Motion d'ordre de Lacombe-Saint-Michel sur le message relatif à la prise de Mantoue": p.2-4. "Discours de Mathieu Dumas sur le message du Directoire qui annonnce la prise de Mantoue": p.4-7. Not in Martin & Walter [edition 2: 7 p.; addressed to: Conseil des anciens; with extra text as indicated]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
