language = "fr"
place = "s.l."
date = "1787"
note = """Caption title. Without imprint. Opening sentence: Il sera ... représenté au Seigneur Roi, qu'en venant tenir sa séance dans son Parlement, il s'est annoncé comme un pere au milieu de ses enfants ... que cependant ... un prince de son sang a été éloigné de la cour & conduit au lieu de son exil; que deux magistrats on[t] été enlevés à leurs fonctions & renfermés dans des châteaux. "Lettre au roi": p.8-11. Not in Martin & Walter [edition 2: 11 p.]. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
