title = "Observations sur un rapport fait au nom d'une commission spéciale, par le citoyen Renault (de l'Orme) : sur la question de savoir si les co-héritiers qui ont acquis par licitation, postérieurement à la loi du 17 nivose, doivent être regardés comme tiers possesseurs ; et, si à ce titre, l'article premier de la loi du 3 vendémiaire, an quatrième [25 septembre 1795], leur est applicable."
language = "fr"
place = "A Paris"
date = "1797"
note = "Caption title. Imprint from colophon. Renault's report (Martin & Walter IV 1: 29037) has title: Rapport ... sur la question de savoir si les cohéritiers qui ont acquis par licitation postérieurement à la loi du 17 nivôse doivent être regardés comme tiers possesseurs ... [séance du 26 pluviôse an V = 14 février 1797]. Martin & Walter IV 2: 11376. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
