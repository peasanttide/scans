language = "fr"
place = "s.l."
date = "1787"
note = """Caption title. Without imprint. Opening sentence: Il sera ... représenté au Seigneur Roi, qu'en venant tenir sa séance dans son Parlement, il s'est annoncé comme un pere au millieu [sic] de ses enfans ... que cependant ... un prince de son sang a été éloigné de la cour & conduit au lieu de son exil; que deux magistrats ont été enlevés à leurs fonctions & renfermés dans des châteaux. "Lettre au roi": p.6-8. Not in Martin & Walter [edition 1: 8 p.]. Scanner's note: Title page locate on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
