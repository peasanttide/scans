title = "Observations du cen. Pierre-Joseph Olbrechts, président de l'administration municipale de la commune et canton de Bruxelles, aux président et membres composant l'administration centrale du département de la Dyle, sur la pétition en forme de plainte de Jean-Baptiste Deyris, attaché au théatre de Bruxelles."
language = "fr"
place = "A Bruxelles"
date = "1798"
note = "Not in Martin & Walter. Révolution française. Olbrechts defends his arrest of the actor Deyris for portraying a French soldier wearing a costume suspiciously dissimilar to actual French uniforms. Includes bibliographic references. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
