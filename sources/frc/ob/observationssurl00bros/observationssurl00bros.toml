title = "Observations sur le jugement du Tribunal criminel du département de la Seine, dans l'affaire du Dictionnaire de l'Académie françoise"
language = "fr"
place = "Paris"
date = "1803"
note = "Caption title. Imprint from colophon. Legal opinion on a copyright case in which Bossange, Masson et Besson accused booksellers Nicolas Moutardier and François-Augustin Leclère of pirating copies of the fifth edition of the Dictionnaire de l'Académie française, to which the plaintiff held the copyright. Owner's inscription: (2 avril 1803) Adanson. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."
url = "https://archive.org/details/observationssurl00bros"
subject = [
    "Moutardier, Nicolas, 1763-1807",
    "Leclère, François-Augustin, fl. 1786-1803",
    "Bossange, Masson et Besson",
    "Seine (France). Tribunal criminel",
    "Académie française",
    "Books",
]

