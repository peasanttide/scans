note = """Half title. Dated at end: Paris, 22 novembre 1790. The Clavière letter is Martin & Walter I: 7621 (which specifies: Du 13 nov. 1790. Pour dénoncer un écrit anonyme intitulé: "Réponse très sommaire aux Observations sur le projet d'une refonte générale des monnoies"). The Baux letter is Martin & Walter I: 2120 (which specifies: A propos des "Observations sur le projet d'une refonte générale des monnoies" de Clavière [= Martin & Walter I: 7628]). Martin & Walter IV 2: 11176. Scanner's note: Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages. No table-of-contents pages found. No copyright page found."""
