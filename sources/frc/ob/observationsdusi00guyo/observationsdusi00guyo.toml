note = "Caption title. Imprint at foot of p. 12. Signed at end: Guyot. Relating to a legal dispute between Catherine Chaucat (widow of the publisher Nicolas Desaint) and Guyot over the publication rights of Répertoire universel & raisonné de jurisprudence civile, criminelle, canonique & bénéficiale, the editorship of which is ascribed either to Joseph Nicolas Guyot or to Pierre Jean Jacques Guillaume Guyot. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page. Title page and cover are combined."
