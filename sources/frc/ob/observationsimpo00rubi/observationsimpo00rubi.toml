title = "Observations importantes a la patrie, sur l'abus et les devoirs des représentans du peuple."
language = "fr"
place = "A Paris"
date = "1799"
note = """"Par Derubigny-Berteval, tanneur de Paris, rue Censier, près Saint-Médard, faubourg Marcel, ancien prisonnier de la Bastille et du Luxembourg, etc., etc. pour avoir fait, au nom du peuple souverain, l'ouverture de la première église, Médard, à Paris, pour le rétablissement du culte décrété libre, et réclamé par les cahiers présentés aux États-généraux"--P. [3]. Imprint from colophon. "Quels reproches aux sept cents cinquante législateurs de nous avoir amusé et occupé depuis 1789! Voilà dix années, qu'a-t-on fait?"--P. 201. Martin & Walter. Révolution française. Bibliography: Martin & Walter. Révolution française,  IV, 30394. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
