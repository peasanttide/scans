title = "Observations sur la résolution qui déclare valides les opérations d'une fraction de l'assemblée électorale du Gers : et sur les pièces qui devroient être jointes."
language = "fr"
place = "Paris"
date = "1799"
note = "Caption title. Imprint from colophon. Opening sentence: La fraction de l'assemblée électorale du Gers ... s'est livrée à des excès si graves qu'il a fallu que le président de l'assemblée appelât la force armée en arrêter le cours et empêcher l'effusion du sang. Includes documents dated 2-5 prairial (21-24 May 1799) and 1 germinal an 7 (21 March 1799). Martin & Walter IV 2: 11215. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
