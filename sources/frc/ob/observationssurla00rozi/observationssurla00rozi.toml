note = """Prospectus for "Observations sur la physique, sur l'histoire naturelle et sur les arts.". Colophon: De l'imprimerie de P. de Lormel, rue du Foin. "Le prix de l'abonnement est de 30 liv. pour Paris, & de 36 liv. pour la province. On trouvera l'ouvrage chez Le Jai, libraire, rue Saint Jacques. Les personnes ... qui voudront s'abonner à cet ouvrage affranchiront leurs lettres & le port de leur argent. Elles s'adresseront directement à M. l'abbé Rozier, rue Saint Honoré, maison de M. Guislain, près la rue d'Orléans, ou au libraire"--P. 8. Title vignette; tail-piece. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
