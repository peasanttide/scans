title = "Observations de MM. Pupier freres, négociants de la ville de Saumur sur un écrit anonyme ayant pour titre, Adresse à Nosseigneurs de l'Assemblée nationale, commencant par des mots, Les bons, les paisibles citoyens de la ville de Saumur se plaignent, et finissant par ces mots, Et pour la prompte et heureuse prospérité de vos infatiguables et penibles travaux, répandu dans la ville de Saumur avec profusion, et envoyé à Angers et autres villes."
language = "fr"
place = "A Angers"
date = "1790"
note = "Caption title. Imprint from colophon. Suggested date of publication based on reference to a letter dated 8 janvier 1790. Not in Martin & Walter. Révolution française. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text.<br />No Copyright found. No Table of Contents found. <br />."
