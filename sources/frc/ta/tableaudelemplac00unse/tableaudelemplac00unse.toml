note = """Caption title. Without imprint. At head of title: Loi du 19 vendémiaire, an 4 [11 octobre 1795]. "Loi du 19 vendémiaire, an 4. Tableau des tribunaux civils et criminels de département de la République, ainsi que des lieux de leur emplacement et des trois tribunaux d'appel affectés `a chacun d'eux": p.[5]- 15. Accompanied by:. Erreurs ou omissions commises dans l'impression des Tableaux sur l'emplacement des tribunaux civils et criminels, tribunaux civils d'appel et tribunaux correctionnels, annexés `a la loi du 19 vendémiaire, l'an 4.e, insérée au 194.e cahier des lois. -- [s.l. : s.n., 1795] -- 3 p. ; 20 cm. -- Caption title. Without imprint. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Loose pages."""
