title = "Tableau raisonné du Voyage pittoresque du rme. de Naples et de Sicile, ou, Nouveau prospectus"
language = "fr"
place = "Paris"
date = "1781"
note = """Prospectus for Saint Non's "Voyage pittoresque à Naples et en Sicile". Caption title. "On s'adressera toujours pour souscrire chez M. de La Fosse, graveur, Place du Carrousel"--P. 8. Imprint from colophon. "L'ouvrage entier formant quatre volumes, coûtera 22 louis & demi, ou 23 en tout, en supposant que des plans & des détails d'architecture, nécessaires, exigent une livraison de plus"--P. 8. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
