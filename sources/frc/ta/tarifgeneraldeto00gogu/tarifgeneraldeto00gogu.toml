type = "book"
title = "Tarif général de toutes les contributions, tant directes qu'indirectes, décréteés par l'Assemblée nationale en 1790 et 1791 : ouvrage utile aux percepteurs & aux contribuables, dans lequel on trouve le calcul tout fait de ce que chacun doit payer pour les contributions foncière, mobiliaire, patriotique, le droit de patentes, le droit d'enrégistrement des actes, le droit du timbre & les droits perçus sur les marchandises à leur entrée dans le royaume & à leur sortie : avec des instructions claires & précises qui déterminent le sens de la loi, &, par-là, préviennent toutes les discussions qui pourroient s'élever entre les percepteurs & les contribuables : présenté a l'Assemblée nationale /"
