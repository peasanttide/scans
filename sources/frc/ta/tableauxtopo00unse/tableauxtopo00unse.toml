note = """Prospectus for Jean-Benjamin Laborde and Beat Fidel Zurlauben's "Tableaux topographiques, pittoresques, physiques, historiques, moraux, politiques, littéraires de la Suisse.". Caption title. Printer statement from colophon. "Permis d'imprimer, ce 6 juillet 1776"--P. 4. "On souscrit à Paris, chez les srs Née & Masquelier, graveurs, rue des Francs-Bourgeois, porte S. Michel, & chez Ruault, libraire, rue de la Harpe. A Lyon, chez Rosset. A Stasbourg, chez Bauer & compagnie. A Rome, chez Francesi. A Naples, chez Dominicis. A Florence, chez Molini. A Livourne, chez Masi. A Venise, chez Zatta. A Turin, chez Reycends. A Vienne en Autriche, chez Trattner. A Berlin, chez Voss. A Francfort sur le Mein, chez Eslinger. A Pétersbourg, chez Weissetbrecht. A Gottingue, chez Dieterich. A Bruxelles, chez Le May. A la Haye, chez Gosse. A Madrid, chez Orcel. A Zurich, chez Gesner. A Berne, à la Société topographique. A Bâle, chez Tourneisen. A Neufchâtel, à la Société typographique. A Lausanne, chez Grasset. A Genève, chez Chirol"--P. 4. "Leurs Majestés, ainsi que la famille royale, ont honoré cet ouvrage de leurs souscriptions"--P. [1]. Head-pieces. "Ces estampes se distribueront six par six, de mois en mois, à raison de 9 liv. pour les souscripteurs ... & de 12 liv. pour ceux qui n'auront pas souscrit"--P. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
