title = "État des pensions dont les Fermiers des voitures de la cour s'étoient chargés : envers les veuves de leurs co-intéressés & les anciens cochers ; à la forme de leurs délibérations, qui, sur les représentations de la compagnie, lors de la conversion de la ferme en régie, ont été confirmées par le Ministre des finances, avec autorisation à continuer le paiement de ces pensions ; la décision du ministre est du 4 mars 1790, & l'acquittement des pensions a été rendu obligatoire au nouveau Fermier-général des messageries."
