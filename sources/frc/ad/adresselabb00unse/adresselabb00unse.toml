note = """Picture caption: Ne me trahis pas, ou je-- ? Subject: Sieyès is seated in a church with a nude woman holding a torch on his lap. He reads from a book on which is written the phrase "Ch. de la vérité." Two pillows with the phrases "Ch. de Paris" and "Ch. de Montpellier" lie beneath the woman on a table. Beneath the caption is text excoriating Sieyès for motions regarding freedom of the press that he presented to the Assemblée nationale. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
