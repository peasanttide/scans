type = "book"
title = "Advertissement svr le povrparlé [!] qv'on dit de paix, entre le Roy & ses rebelles. Auec son contrepoison. A fin que chacun sache qu'il n'a esté rien adiousté, ne osté de l'original, il a esté premierement imprimé à Paris par Ian Dallier en ceste presente annee, 1568."
language = "fr"
date = "1568"
note = """Signatures: A-L 4. "Advertissement sur le pourparlé (sic) qu'on dict de la paix entre le Roy et ses rebelles. Paris, 1568 ... suivi de Continuation du Discours et advertissement. Ecrit catholique contra les négociations d'Odet de Chastillon à Vincennes: les huguenots sont des rebelles inexcusables et incorrigibles ... L'Advertissement est réédité par les Calvinistes ... avec son contre-poison."--Hauser, Les sources de l'histoire de France, part II, v. 3, p. 218, no. 2015. Scanner's note: No copyright page found. No table-of-contents pages found.  No page numbers."""
