title = "Adresse de l'assemblée électorale aux habitans du département de Vaucluse, arrêtée dans la séance du 13 août 1791 : arrêté de l'assemblée électorale, portant envoi de deux députés, pris dans son sein, auprès de l'Assemblée nationale, & priere à M. Verninac-St.-Maur, l'un des médiateurs de la France, de se rendre à Paris en même temps que les députés, pour diriger leurs démarches, à l'effet de parvenir à la réunion à l'empire français, & à l'organisation, du 18 du même mois : formule du serment prêté par les électeurs du départmenet de Vaucluse"
