title = "Adresse a la Convention nationale, le 26 ventôse, l'an deuxième de la République française, par la famille Palloy, le lendemain de sa mise en liberté par les huissiers de la Convention, qui ont brisé ses chaînes dans son cachot, où l'intrigue et les ennemis du peuple l'avoient plongé depuis trois mois"
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. At head of title: Liberté, égalité. Signed: Palloy, patriote, N. femme Palloy, B. Palloy fils, D. fille Palloy, républicaine pour la vie. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
