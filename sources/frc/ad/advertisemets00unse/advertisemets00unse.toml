title = "[Advertisements for l'Histoire naturelle éclaircie dans une de ses parties principales, l'ornithologie]"
language = "fr"
date = "1767"
note = "Two clippings advertising French translation by Mr. Salerne of John Ray's Synopsis methodica avium, published in 1767 by Guillaume Debure. The first advertisement is on sheet paged 537-538, probably detached from the 1767 volume of Avantcoureur, feuille hebdomadaire. The second advertisement, possibly detached from a catalog and trimmed, lists bookseller details: Chez Debure père, quai des Augustins, 1767. 1 vol. in-4°. 36 liv. rel. Ms. annotations on first advertisement. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."
