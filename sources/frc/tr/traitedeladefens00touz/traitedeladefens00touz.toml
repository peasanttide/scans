note = """Prospectus for Mr. de Touzac's "Traité de la défense interieure et exterieure des redoutes". Caption title. "Le prix de chaque exemplaire est de 5 liv. 10 s. broché. On ne sera reçu à souscrire que jusqu'au mois d'août 1761; passé ce temps, chaque exemplaire se vendra 7 liv. 10 sols"--P. [3]. Engraving titled "Fortifier en angle aisgu", possibly a sample plate from De Touzac's "Traité", laid in. Text in upper margin: 39 planche, page 283. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
