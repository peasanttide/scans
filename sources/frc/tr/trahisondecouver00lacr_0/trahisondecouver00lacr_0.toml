language = "fr"
place = "Paris"
date = "1790"
note = """Signed: Par le rédacteur des Actes des capucins, en réponse aux Actes des apôtres. By Marie-Sébastien Bruno de Lacroix. Cf. BN; Martin & Walter II, 18180. Imprint from colophon. Place of publication from BN. "Cette édition est la seule avouée de l'auteur, l'autre n'est qu'une contrefaction faite par un pirate en librairie, nommé Garnery, qui a volé jusqu'au nom du libraire, pour qu'on ne s'apperçût pas de sa fripponnerie"--At end. Last word of p. 7, line 13: crimes. Two other editions with the same imprint exist. One edition bears a slightly different statement at end against pirated editions, and p. 7, line 13 ends with word: tes. Another edition bears no statement against piracy, and p. 7, line 13 ends: cri-. BN. Martin & Walter. Révolution française. Bibliography: BN,  LXXXV, column 526. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/trahisondecouver00lacr_0"
subject = ["Mirabeau, Honoré-Gabriel de Riquetti, comte de, 1749-1791"]
extent = "8 p. ; 19 cm."

