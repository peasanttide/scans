title = "Trahison de Robespierre et de ses complices dévoilée et punie : ou détails authentiques et circonstanciés de ce qui s'est passé `a Paris, dans la nuit du 9 au 10 thermidor, an 2 de la République [27-28 juillet 1794], lorsqu'éclata l'horrible conjuration de Robespierre & consors, contre la souveraineté du peuple français, en la personne de la Convention nationale, & des suites heureuses de la fermeté de celle-ci, pour le maintien de la liberté, de l'égalité, & conséquemment des droits de l'homme."
