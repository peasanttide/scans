type = "book"
title = "Traité du Tribunal de famille : contenant une instruction détaillée sur la compétence & les fonctions de ce tribunal, considéré sous ses divers rapports : suivie d'un formulaire de tous les actes & procédés d'instructions qui peuvent avoir lieu en ce tribunal, dans toutes les affaires susceptibles d'y être décidées : terminée par plusieurs décisions des Comités de constitution & Conseil de justice, confirmatives de ladite instruction /"
language = "fr"
place = "Se trouve a Paris"
date = "1791"
note = """Not in Martin & Walter. Révolution française. "Avertissement: Cet ouvrage a été composé pour faire suite au Code de la justice de paix que l'auteur a précédemment publié. C'est pourquoi on trouvera souvent des renvois à ce Code, qu'on a supposé entre les mains de tous ceux qui se procureront celui-ci qui en est une dépendance inséparable"--T.p. verso. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Some tight margins.  Text extends into binding."""
