title = "Traduction littérale d'une lettre écrite en anglais, & déposée au Comité de salut public."
language = "fr"
place = "Paris"
date = "1793"
note = """Caption title. Imprint from colophon. "Juin 29 1793, 7 heures du soir"--P. [1]. Variant of Martin & Walter. Révolution française, IV:2, 17634. Concerns efforts on the part of Great Britain to foment civil war in France. Traduction littérale d'une lettre écrite en anglais, & déposée au Comité de salut public -- Notes tirées d'un porte-feuille anglais, traduites sur l'original -- Extrait du procès-verbal tenu par les représentans du peuple français dans le département de l'Aveyron, relatif a Charrier, chef des rebelles du département de la Lozère. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/traductionlitter00fran"
subject = [
    "Charrier, Marc-Antoine, 1755-1793",
    "Counterrevolutionaries",
    "Espionage, British",
]
