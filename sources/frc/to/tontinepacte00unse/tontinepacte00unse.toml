title = "Tontine du pacte social, ou association survivancière établie à Paris, sous la surveillance des autorités constituées : hôtel Longueville, rue St. Thomas du Louvre : déposés le 15 juin 1793, chez Me Gaillard note. à Paris"
language = "fr"
date = "1820"
note = """Manuscript. Signed at end: Tolozé. "Compagnies financières, copie à conserver"--Page 1. Written on stationery with printed letterhead of "G. Pissin, successeur de Rondonneau et Dècle, place Saint-Germain-L'Auxerrois, 41." Rondonneau et Dècle operated in Paris until approximately 1820. "Expéditions certifiées des édits, arrêts, lettres-patentes, lois, décrets et autres actes publics, imprimés ou manuscrits, qui se trouvent dans le fonds de législation ancienne et moderne du Dépôt des lois"--Letterpress at head of manuscript text, page 1. Outlines rules, conditions, and benefits of investing with Tontine du pacte-social, formed by Tolozé. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text. No page numbers."""
