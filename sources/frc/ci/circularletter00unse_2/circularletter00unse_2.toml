note = "Caption title. Signed, p. 2: Les administrateurs composant le directoire du département de Maine et Loire ... Not in Martin & Walter. Révolution française. [Circular letter on the levée en masse in Maine-et-Loire] -- Décret de l'Assemblée nationale, du 4 août 1791, sur la formation & la solde des bataillons de gardes nationales, rassemblées en vertu des décrets des 21 juin & 22 juillet 1791 -- Réglement provisoire pour le service des gardes nationales -- État des effets d'habillement, équipement et armement, dont les gardes-nationales devront être pourvus -- Gardes nationales, état de la répartition, par département, des 97,000 gardes nationales, décrétées le 28 juillet 1791. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
