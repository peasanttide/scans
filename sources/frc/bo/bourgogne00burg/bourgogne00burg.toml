date = "1788"
note = "Caption title. Without imprint. Not in Martin & Walter. Recit substantiel de ce qui s'est passé au bailliage d'Ornans, comté de Borgogne, le 6 juin 1788 -- Arrêté de M. le procureur du roi au bailliage de Montcenis [11 juin 1788] -- Extrait des registres des délibérations & du greffe du bailliage d'Avallon [12 juin 1788] -- Discours prononcé à M. le premier président du Parlement de Dijon, au nom de l'ordre des avocats, le 13 juin 1788 -- Guienne. Discours prononcé par les députés de l'ordre des avocats à M. le président, à son retour de Libourne à Bordeaux, du 10 juin 1788. Arrêté de la Chambre des comptes de Bourgogne & Bresse [Fait à Dijon, le 9 juin 1788] -- Arrêté du bailliage & siége présidial de Dijon [Ce jourd'hui 30 mai 1788] -- Arrêté du bailliage de Nuits, du samedi 31 mai [1788] -- Arrêté du bailliage d'Autun, du 2 juin 1788 -- Arrêté du bailliage de Saint-Jean-de-Losne, du 5 juin 1788 -- Arrêté du bailliage d'Auxonne, du 6 juin 1788 -- Arrêté des officiers du bailliage & siége présidial de Chatillon-sur-Seine, du vendredi 6 juin 1788 -- Arrêté du bailliage de Saulieu, du lundi 9 juin 1788 -- Protestation de MM. les officiers du bailliage de Sémur, du 10 juin 1788 -- Protestations du bailliage de Semur en Brionnois [du jeudi 12 juin 1788] -- Arrêté du bailliage de Bourbon-Lancy, du lundi 2 juin 1788 --. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."
url = "https://archive.org/details/bourgogne00burg"
