#:schema ../../../../schemas/source.json
layer = "source"
id = "bulletindesloisd00fran"
type = "pamphlet"
title = "Bulletin des lois de la République no.190 : au nom de la République française."
language = "fr"
place = "À Paris"
date = "1798"
note = "Caption title. Imprint from colophon. Comprises the following:. [1] (N.o 1764.) Loi qui ratifie le traité de réunion de la République de Mulhausen à la République française. Du 11 ventôse, an VI de la République une et indivisible [1 mars 1798]. [2] (N.o 1765.) Loi qui autorise l'administration municipale de Châlons, département de la Marne, à faire un échange de maisons. (Du 12 ventôse [2 mars 1798].). [3] (N.o 1766.) Arrêté du Directoire exécutif, contenant des mesures pour assurer le libre cours des rivières et canaux navigables et flottables. Du 19 ventôse [9 mars 1798]. [4] (N.o 1767.) Loi interprétative d'un article de celle du 24 frimaire an VI [14 décembre 1797], concernant la liquidation de l'arriéré de la dette publique. Du 22 ventôse [12 mars 1798]. [5] (N.o 1768.) Arrêté du Directoire exécutif, qui prescrit des mesures pour ramener au port de Toulon les marins déserteurs, désobéissans et vagabonds. Du 23 ventôse [13 mars 1798]. [6] (N.o 1769.) Arrêté du Directoire exécutif, concernant la réunion et la reclusion des prisonniers de guerre anglais. Du 23 ventôse [13 mars 1798]. [7] (N.o 1770.) Arrêté du Directoire exécutif, concernant les adresses ou pétitions des cercles constitutionnels. Du 24 ventôse [14 mars 1798]. [8] (N.o 1771.) Loi portant que l'Armée française en Suisse a bien mérité de la patrie. Du 24 ventôse [14 mars 1798]. [9] (N.o 1772.) Arrêté du Directoire exécutif, qui rétablie dans la commune de Lyon l'argue destinée à dégrossir et tirer les lingois d'argent et de doré. Du 25 ventôse [15 mars 1798]. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."
url = "https://archive.org/details/bulletindesloisd00fran"
extent = "20 p. ; 23 cm."

