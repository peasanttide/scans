note = """Prospectus for: Bulletin des sciences / par la Société philomathique de Paris. Paris, 1797-1805. Caption title. Printer statement from colophon. "Le prix de l'abonnement est de cinq francs, en numéraire, par année ... Le numéro premier paraîtra dans la première décade de germinal"--P. [1]-2. "On souscrit a Paris, chez le citoyen Alex. Brongniart, professeur d'histoire naturelle aux ecoles centrales, trésorier de la société, rue St. Marc, n°. 14, Fuchs, libraire, rue des Mathurins, hôtel de Cluny ... [and 31 others in 31 places]"--P. 2. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
