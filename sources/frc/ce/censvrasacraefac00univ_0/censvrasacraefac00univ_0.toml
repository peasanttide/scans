note = "[1] Arrest de la Covr de Parlement de Paris, par lequel il est ordonné que le decret sus-rapporté sera leu par chascun an à pareil iour 4. de iuin, en l'assemblee de la Faculté de theologie, & publié és prosnes des parroisses, & que le liure de Iehan Mariana, institulé, De rege & regis institutione, sera bruslé. [2] Proces verbal de l'execution de l'arrest sus-rapporté touchant le liure de Mariana, bruslé par l'executeur de la haulte iustice. Caption title. Text also in Latin. About the assassination of Henri IV, King of France. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover page. <br />."
