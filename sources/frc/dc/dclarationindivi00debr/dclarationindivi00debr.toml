title = "Déclaration individuelle sur l'assassinat des ministres français a Rastadt : avec le plan topographique de Rastadt et de ses environs, exécuté sur la carte allemande ; [motto: 9 lines]"
language = "fr"
place = "A Paris"
date = "1799"
note = """"Les originaux des déclarations suivantes sont entre les mains du citoyen Jean Debry; elles complettent le corps de preuves résultantes du procès-verbal rédigé et signé par les membres restés au congrès lors de l'attentat du 9 floréal [an VII = 29 avril 1799]": from the "Avis de l'éditeur" on p.[3]. Martin & Walter IV 2: 5083. Incomplete: wanting the plan mentioned in the title. Scanner's note: No copyright page found.  Contents are on the back cover. Skewed text. Damaged, stained, and/or loose pages."""
