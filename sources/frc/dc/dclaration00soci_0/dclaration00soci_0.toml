note = """Caption title. Without imprint. "Ceux-là ... ne sont pas les amis de la constitution, qui, les premiers, admettent au milieu d'eux les réfractaires envers la loi, qui les accmpagnent dans leurs séditions contre la loi ...": p.[1]. "Les membres de l'Assemblée nationale, fondateurs et membres de la Société des amis de la constitution, séante aux Jacobins, à Paris, ont arrêté de transporter leurs séances dans un autre lieu, et de les continuer dans la maison des Feuillans, rue Saint-Honoré. A Paris, le 16 juillet 1791": p.6-8 (chiefly a list of names). Martin & Walter IV 2: 5041 [edition 1: 8 p.; with extra text as indicated]. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
