note = """Caption title. Imprint from colophon. "Arrêt du Parlement, qui ordonne que les Annales politiques, civiles & littéraires, par Linguet, seront lacérées & brûlées sur le perron du Palais par l'exécuteur de la Haute-justice": p.9-17. The work in question is a periodical edited by Linguet. "Arrêt du Parlement, qui ordonne que l'ecrit intitulé, Arrêté du Grand-bailliage de Bourg en Bresse, sera lacéré & brûlé sur le perron du Palais, par l'exécuteur de la Haute-justice": p.18-26. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.   Title page is on the cover. Skewed text. Damaged, stained, and/or loose pages."""
