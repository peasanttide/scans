date = "1778"
note = """Prospectus for French translation of Alexander Pope's collected works, published 1779. Caption title. "On souscrit à Paris chez la veuve Duchesne, libraire, rue St.-Jacques, au Temple du Goût"--P. 8. Imprint from colophon. "On payera 18 livres en souscrivant, & la même somme en retirant l'ouvrage en feuille ... Il y en aura quelques-uns en papier d'Hollande, pour lesquels on payera 36 liv. en souscrivant & 36 liv. en retirant l'ouvrage"--P. 8. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
