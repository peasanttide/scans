date = "1745"
note = "Poem; a parody of Voltaire's poem La Bataille de Fontenoy according to NUC pre-1956 cited below. Caption title. Sieur Rabot is a pseud. of Robbé de Beauveset. Imprint from colophon, gives date of 10 Juillet 1745; false imprint, published in Paris, according to Weller, E.O. Falsche Druckorte, v. 2, p. 115. cf. BN. cf. NUC pre-1956. cf. Cioranescu, A. 18. s. Binder's title: Bataille de Fontenay. Verse. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page.  Uneven binding.  Skewed text.    Irregular pagination."
url = "https://archive.org/details/epitredusieur00robb"
