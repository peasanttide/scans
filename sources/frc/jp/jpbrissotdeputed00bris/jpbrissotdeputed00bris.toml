type = "pamphlet"
title = "J.P. Brissot, député du département d'Eure et Loire, a ses commettans, sur la situation de la Convention nationale, sur l'influence des anarchistes, et les maux qu'elle a causés, sur la nécessité de l'anéantir cette influence, pour sauver la république."
language = "fr"
place = "A Paris"
date = "1793"
note = """"On trouve aussi aux mêmes adresses, les difféntes opinions, réponses, lettres de Péthion, Gaudet, Verginaux, Salles, et la conspiration du 10 [août] par Louvet.". "Avis aux lecteurs ... Paris, 22 mai 1793, l'an 2 de la république française"--P. [3]-[4] (1st sequence). "N.B. La rapidité de l'impression a empêché de corriger plusieurs fautes tipographyques, et même de faire un errata. Les lecteurs y suppléront"--P. [4] (1st sequence). Title vignette (oak branches and shield with sunburst and text: amour de la patrie et des arts). Bookseller's advertisement, p. [2] (1st sequence). Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 5218. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover. Damaged, stained, and marked pages."""
