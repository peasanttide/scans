note = """Caption title. Imprint from colophon. "Grangeneuve"--Bottom of p. [1]. "M. Grangeneuve"--Bottom of p. 9. Martin & Walter. Révolution française. "Tableau de l'appel nominal fait a l'Assemblée nationale, le premier février 1792, sur cette question, Y a-t-il lieu à délibèrer sur le projet de décret du Comité de marine, tendant à déclarer que M. Dubertrand, ministre de la marine, a perdu la confiance de la nation?"--P. [14]-22. Bibliography: Martin & Walter.  Révolution française,  II, 15553. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged pages. Uneven binding. Skewed text. Title and cover pages combined. Irregular pagination. Page number 17 is used twice."""
