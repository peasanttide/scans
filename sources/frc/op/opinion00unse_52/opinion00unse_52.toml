title = "Opinion de G.-J.-F. Loisel, député par le département de la Manche, sur le second rapport relatif à la résolution du 17 vendémiaire, interprétative de l'article VII du titre II de la loi du 21 brumaire an 5, code des délits & des peines pour les troupes de la République : sur ces questions, Quel est & jusqu'à quel point doit s'étendre le droit du Corps législatif dans la création, l'abrogation ou la modification d'une loi pénale?  La loi qui en abroge ou modifie une précédente peut-elle en même temps en anéantir les effets sans contrevenir à l'article des droits qui porte que nulle loi, tant civile que criminelle, ne peut avoir d'effet rétroactif? : séance du 7 frimaire an 7."
