title = "Opinion d'un député de la province de Normandie : sur le mode du rachat du treizieme."
language = "fr"
place = "Paris"
date = "1790"
note = """Half title. Imprint from colophon. Opening sentence: Les droits de mutation connus en Normandie, sous le nom des treiziemes, sont compté par l'Assemblée nationale parmi ceux qui sont présumés rachetables, sauf la preuve contraire. "Il me semble ... que tous les biens qui n'ont pas été aliénés par les possesseurs de fief ... n'ont été assujettis au treizieme que par la commutation d'une servitude personnelle, en une servitude réelle, à laquelle on a donné le nom de treizieme ...": p.[3]. Martin & Walter IV 2: 11475. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
