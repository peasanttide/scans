title = "Opinion de Rivoallan (des Côtes-du-Nord), sur la résolution du 2 vendémiaire, qui déclare traîtres à la patrie tous négociateurs, généraux, ministres, directeurs et tous autres que ce soit citoyens français, qui proposeraient ou accepteraient des conditions de paix, tendantes à modifier ou à changer en tout ou en partie la Constitution de l'an 3, ou à altérer l'intégralité du territoire de la République française, tel qu'il est déterminé par la Constitution et par les lois de réunion : séance du 28 vendémiaire an 8."
