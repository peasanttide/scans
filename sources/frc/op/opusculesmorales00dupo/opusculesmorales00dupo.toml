title = "Opuscules morales et politiques, retirées de différens journaux."
language = "fr"
place = "A Paris"
date = "1805"
note = """Each section has separate t.p. Martin & Walter. Révolution française. Schelle, G. Du Pont de Nemours et l'école physiocratique. 1. Sur quelques erreurs de M. Marmontel relatives à M. Turgot. -- 2. Pourquoi la plupart des chemins sont tortus. -- 3. Oeuvres posthumes de Marmontel. -- 4. Le serpent [et] Mlle. Dzjerzbicka. -- 5. Notice historique sur Mr. Quesnay. -- 6. Mémoires du baron de Besenval. -- 7. Lettre aux auteurs du Journal du commerce, sur la prohibition des toiles blanches. -- 8. De l'infidélité [et] Des différens régimes. -- 9. Mathilde. -- 10. Sur la Banque de France. -- 11. Alphonsine. -- 12. Sur la liberté morale. -- 13. Théorie du monde politique. -- 14. Du courage. -- 15. Discours sur cette question: Comment l'abolition progressive. -- 16. Sur le gout dans la littérature. -- 17. Rapport fait à la Société philantropique ... le 6 Pluviôse an XIII. -- 18. Rapport à la Société philantropique ... 4 Ventôse an 13. -- 19. Rapport de M. Du Pont de Nemours, à la Société philantropique. -- 20. Rapport général sur les sociétes de prévoyance ... (21 Décembre 1805). -- 21. Aux rédacteurs de la Revue. -- 22. Madame de Maintenon. -- 23. Sur le déisme. (Includes six other essays: Sur les assertions du docteur Gall; Rapport à la Sociéte d'encouragement, sur les concessions de canaux; Des bases de la morale; Sur les institutions religieuses dans l'intérieur des familles; Sur la nature de la côte, à l'est de l'Amérique septentrionale; Sur quelques dénominations d'animaux). -- 24. Sur l'instinct. -- 25. Elisabeth. -- 26. Mémoire sur l'abus du mot "nouveau.". Bibliography: Martin & Walter.  Révolution française,  II, 12213. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover page."""
