note = """Caption title. At head of title: Convention nationale. "Imprimée par ordre de la Convention nationale"--P. [1]. Imprint from colophon. "15 janv. 1793"--Session date from Martin & Walter. "Législation. (No. 229)"--Bottom of p. [1]. Another edition exists, lacking "Législation. (No. 229)" at bottom of p. [1]. Martin & Walter. Révolution française. Forms part of the Louis XVI Trial and Execution Collection at the Newberry Library. Uncut and loose-bound in v. 9 of a collection of pamphlets in contemporary cartonnage bindings, with pink pastepaper over boards and blue paper spine labels. Bibliography: Martin & Walter.  Révolution française, I, 4130. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover are combined. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
