note = "Not in Martin & Walter. Révolution française. Extrait du premier rapport présenté au directoire dans le mois de mai 1791, sur les moyens propres à transformer l'Église de Sainte-Geneviève en Panthéon français / par Ant. Quatremère, Paris, imprimerie de Ballard, 1792 -- Extrait du deuxième rapport fait au directoire du département de Paris, le 13 novembre 1792, l'an premier de la République française, sur l'état actuel du Panthéon français, sur les changemens qui s'y sont opérés, sur les travaux qui restent à entreprendre, ainsi que sur l'ordre administratif établi sur leur direction et comptabilité / par Ant. Quatremère, commissaire du département, pour l'administration et direction du Panthéon français, imprimerie de Ballard, du département, an premier de la République française. Includes bibliographical references. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text.<br />No Copyright found. No Table of Contents found. <br />."
