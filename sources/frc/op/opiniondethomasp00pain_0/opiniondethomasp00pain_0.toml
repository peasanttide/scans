note = """Translation of: Reasons for wishing to preserve the life of Louis Capet. Caption title. At head of title: Convention nationale. Imprint from colophon. "Législation. (No. 221)"--Bottom of p. [1]. "Opin. de T. Payne, sur l'aff. de Louis Capet"--Bottom of p. 5. Martin & Walter. Révolution française. Argues that Louis XVI should not be executed but rather exiled to the United States. "Addition à l'opinion de Thomas Payne"--P. 9-10. Bibliography: Martin & Walter.  Révolution française, III, 26331. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover are combined. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
