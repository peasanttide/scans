id = "opinionsurlamass00phil"
type = "pamphlet"
title = "Opinion sur la masse et la valeur des assignats qui doivent rester dans la circulation : sur les bases à établir pour déterminer l'époque à laquelle le cours forcé des assignats doit cesser, et sur les moyens les plus prompts & les plus efficaces de faire rentrer dans les caisses publiques les assignats qui, dans ce système, doivent être supprimés, sans établissement de nouvelles caisses, sans aucuns frais pour la nation, et par un mode qui, en remplissant tout-à-la fois l'intérêt politique de l'Etat, et celui des fortunes particulières, et étant à la portée de tous les citoyens de l'Empire, pourra rendre à la circulation des espèces effectives un commencement d'activité : suivi d'un projet projet [sic] de décret /"
language = "fr"
place = "A Paris"
date = "1791"
note = """"Monnoies & assignats. K."--Bottom of p. [1]. "Opinion de Th. Philibert sur les assignats"--Bottom of p. 17. Martin & Walter. Révolution française. Errata, [1] p. at end. Bibliography: Martin & Walter.  Révolution française,  III, 27179. Scanner's note: No Copyright found. No Table of Contents found. Title on cover. Damaged, stained pages and cover. <br />."""
