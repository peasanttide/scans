id = "opiniondecharles00ball"
type = "pamphlet"
title = "Opinion de Charles André Balland, député du département des Vosges à la Convention nationale, sur les moyens de faire jouir incessamment de l'abondance, d'empêcher la contrefaction des assignats, de les accréditer et faire cesser leur perte, d'en diminuer beaucoup la masse avec utilité, ainsi que le prix de toutes les denrées et marchandises, de rétablir le bon ordre et la tranquillité, d'économiser le trésor national, d'anéantir l'agiotage, de ranimer le commerce, de rendre heureux les citoyens, d'affermir la révolution, et prévenir les dangers imminens qui menacent la République."
language = "fr"
date = "1795"
note = "Caption title. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,I, 1251. Scanner's note: Title found on front cover. No copyright page found. No table-of-contents pages found."
