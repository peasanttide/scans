#:schema ../../../../schemas/source.json
layer = "source"
id = "echelledepreci00unse"
type = "pamphlet"
title = "Échelle de dépréciation, du département de la Seine, avec des changes faits sur cette échelle, de manière que chaque particulier, créancier ou débiteur, pourra trouver d'un coup-d'œil toutes les sommes réduites qu'il aura à payer ou à recevoir, depuis vingt sols jusqu'à un million : auquel on a joint un tableau extrêmement simple sur la réduction des arrérages, qui fournit toutes les solutions aux opérations générales de ce genre"
language = "fr"
place = "A Paris"
date = "1797"
note = """"Le citoyen Vigneti, auteur de cet ouvrage ..."--P. [2]. Not in Martin & Walter. Révolution française. Publisher's advertisement, t.p. verso. "Au nom de la République française. Loi relative à la formation, dans chaque département, d'un tableau des valeurs successives du papier-monnoi. Du 5 messidor an V de la République française, une et indivisible"--P. [1]-[2] at end. "Département de la Seine. Extrait du registre des délibérations de l'administration centrale du département de la Seine. Du 28 fructidor, an V de la République française"--P. [3] at end. "Eschelle de déprèciation des papiers-monnoies, calculée sur l'unité de 100 liv. assignats et 100 liv. mandats, à partir du premier janvier 1791 (vieux style) jusqu'au premier messidor an IV"--P. [4] at end. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
url = "https://archive.org/details/echelledepreci00unse"
subject = [
    "Devaluation of currency",
    "Assignats",
    "Paper money",
    "Debtor and creditor",
]
extent = "35, [4] p. ; 27 cm."

