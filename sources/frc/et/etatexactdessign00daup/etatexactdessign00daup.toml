type = "pamphlet"
title = "Etat exact des signatures, telles qu'elles se trouvent apposées à l'acte de protestation signifié à la commission intermédiaire des Etats de Dauphiné : & à Monseigneur l'Archevèque de Vienne, président des Etats de la province, les 6 & 8 avril 1789 ; de la part de M. le Comte de Mercy, agissant en vertu d'une procuration de MM. le Marquis de Grammont, le Marquis Dupuy-Montbrun & le Comte de Flotte ; lesquels se sont dit, dans l'acte de procuration, députés des deux premiers ordres du Dauphiné, chargés des pouvoirs d'un très-grand nombre de membres de ces deux ordres ; avec observations y relatives."
language = "fr"
place = "s.l."
date = "1789"
note = "Caption title. Without imprint. Signed on p.20 by prominent members of the clergy and nobility of Dauphiné. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."
