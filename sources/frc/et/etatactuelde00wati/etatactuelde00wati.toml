language = "fr"
place = "A Paris"
date = "1789"
note = """Prospectus for "État actuel de Paris, ou, Le provincial à Paris," originally published in 1787 under the title "Le provincial à Paris, ou, État actuel de Paris.". "C'est au sieur Watin fils, éditeur de l'ouvrage, rue Sainte Apolline, n°. 33, qu'il faut adresser, francs de port, les renseignemens ou avis qu'on desire faire insérer dans l'ouvrage; c'est à lui ou au sieur son père que l'on pourra s'adresser pour faire venir de la capitale les articles détaillé dans l'ouvrage"--P. 11. Includes notice for Jean-Félix Watin's "L'art du peintre, doreur, vernisseur," originally published as "L'art de faire et d'employer le vernis, ou, L'art du vernisseur.". Includes prices. Ms annotations. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
