title = "Théorie générale de l'administration politique des finances : dédiée à Monsieur, frère du Roi, et présenté à Sa Majesté par M. Grouber de Groubentall : nouvelle édition, en 3 vol. in-8°. proposée par souscription."
language = "fr"
place = "Paris"
date = "1789"
note = """Prospectus for a new edition of Grouber de Groubental's "Théorie générale de l'administration politique des finances," originally published in 1788. Caption title. "L'on soucrira à Paris chez Laurent junior & Cressonnier, libraire, rue Saint-Jacques, vis-à-vis celle des Mathurins. Et chez l'auteur, rue Geoffroi-l'Asnier, n°. 37"--P. 4. Printer from colophon. Includes letters, dated 1789, in support of the proposed work. Head-piece. "Le prix de la souscription sera de 12 liv. pour les trois volumes brochés, pris à Paris & à Versailles, & de 13 liv. 16 s., franc-de-port, pour toute la France"--P. 3. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Discolored pages."""
url = "https://archive.org/details/theoriegeneraled00laur"
