title = "L. Deschereaux letter regarding property in Arcahaie, Haiti"
language = "fr"
date = "1799"
note = "Manuscript. Signed: L. Deschereaux fils ainé. Dated in accordance with the French Republican calendar: le 25. floreal an 7eme de la R/q francaise. Letter to an unnamed recipient inquiring after property in Arcahaie, Haiti, purchased by Dechereaux's father-in-law Henry Guyon from merchant Frederich d'Oleyres on February 13, 1793, in the name of his daughters Marie and Aurore Guyon. After several years without news from Guyon, Dechereaux and his wife presumed he had died amid violence during the Haitian Revolution. Scanner's note: No copyright page found. No table-of-contents pages found.  No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
