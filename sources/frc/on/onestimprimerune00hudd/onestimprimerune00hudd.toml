note = """Prospectus for a new edition of Martin Lister's "Historia sive Synopsis methodica conchyliorum", edited by William Huddesford and published in 1770. "As the plates are adapted to their particular places, it is proposed to take them off in the same order in which they stand in the most perfect copies extant.". "The editor will think himself greatly obliged to any person who would favor him with the use of any good copy of this work ... Any notice on this subject would be gratefully acknowledged, if directed to the Rev. Mr. William Huddesford at Trinity College, Oxford.". Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
