title = "Instructions /"
language = "fr"
place = "s.l."
date = "1789"
note = """Caption on p.[3]: Instructions, que les propriétaires & habitans de la paroisse de St. Sulpice de Chevannes donnent à leurs députés pour l'assemblée baillivale, convoquée à Nemours par M. le grand bailli d'épé de Nemours, à l'effet de rédiger les remontrances, moyens & avis du bailliage, & de nommer les députés aux Etats-généraux, au desir des lettres de convocation, données par Sa Majesté, le 24 janvier 1789. Dated on p.73: Fait & arrêté ... le premier jour de mars de l'année mil sept cent quatrevingt-neuf .. "Procès-verbal de l'assemblée communale & général de la paroisse de Chevannes, en laquelle ont été arrêtées les instructions précédentes, & fait élection des députés de ladite paroisse au bailliage de Nemours": p.74-78. Dated at beginning: Aujourd'hui premier mars 1789 .. Martin & Walter IV 2: 3342. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."""
