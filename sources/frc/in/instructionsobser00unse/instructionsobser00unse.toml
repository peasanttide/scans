note = """Prospectus for "Instructions et observations sur les maladies des animaux domestiques," edited by Philibert Chabert, Pierre Flandrin, and J.-B. Huzard. Caption title. "L'administration des postes ayant doublé le port de nos volumes au commencement de cette année 1792, il ne nous est plus possible de les faire parvenir à nos souscripteurs par cette voix, au même prix ... Ils continueront ... à recevoir les Instructions & obsevations sur les maladies des animaux domestiques ... en faisant passer ... le somme de 4 liv. 10 sous pour chaque volume directement à M. Huzard, rue Montmartre, cour de la Jussienne, ou à l'adresse du libraire"--P. 3. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
