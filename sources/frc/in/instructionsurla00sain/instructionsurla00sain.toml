note = """Caption title. At head of title: Commission des transports et convois militaires, postes et messageries. Neuvième division. Liberté. Fraternité. Égalité. Levée du 18 germinal. Signed: Le 15 vendémiaire l'an 3ème. de la République ... Joseph Saint Cricq. Imprint from colophon. Not in Martin & Walter. Révolution française. "Liberté, fraternité, égalité. Décret du 19e. jour du premier mois ... Décret du 23 ventose ..."--P. [1] at beginning. "Circulaire. Arles le vingt vendémiaire de l'an 3ème. de l'ère républicaine. Le commissaire-inspecteur chargé dans la neuvième division de la levée du 18 germinal, a l'agent nationale de la commune d [blank]"--P. [1]-[2] at beginning. Scanner's note: Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text. No title page found. No copyright page found. No table-of-contents pages found."""
