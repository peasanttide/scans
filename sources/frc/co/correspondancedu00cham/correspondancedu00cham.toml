title = "Correspondance du ministre de l'interieur, relativement au bruit qui s'est répandu qu'on formoit un amas d'armes et d'habits au château des Tuilleries."
language = "fr"
place = "Paris?"
date = "1792"
note = "Caption title. Champion de Villeneuve was Minister of the Interior from July 21 to August 10, 1792. Cf. Histoire du ministère de l'Intérieur de 1790 à nos jours, p. 20-21. Imprint from colophon. Not in Martin & Walter. Révolution française. Lettre de M. le procureur général syndic du département de Paris, au ministre de l'intérieur, en date du 25 juillet 1792, l'an quatrième de la liberté -- Reponse du ministre de l'intérieur, du même jour -- Lettre du ministre de l'intérieur à M. le maire de Paris, du 25 juillet, à plus de minuit -- Réponse de M. le maire, du 26 juillet, à 10 heures du matin -- Lettre du ministre de l'intérieur à M. le maire, du 26 juillet, à midi -- Lettre de M. le maire au ministre de l'intérieur, du 26 juillet -- Réponse du ministre de l'intérieur à M. Petion -- Lettre du ministre de l'intérieur à M. le président de l'Assemblée nationale, du 26 juillet, à trois heures et demie. Scanner's note: No Copyright found. No Table of Contents found. Title on cover. Damaged, stained pages and cover. <br />."
url = "https://archive.org/details/correspondancedu00cham"
