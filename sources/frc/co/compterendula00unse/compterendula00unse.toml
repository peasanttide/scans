note = "Caption title. Imprint from colophon. Martin & Walter. Révolution française. Compte rendu à l'Assemblée nationale / par M. Bertrand de Moleville ... -- Note sur quelques insurrections qui se sont manifestées à bord des bâtimens de l'État, & des juris qui ont été tenus à cette occasion -- Extrait sommaire des comptes successivement rendus de plusieurs insurrections qui se sont manifestées dans les ports -- [Extracts from 15 letters to Bertrand] -- Aperçu du compte que rend à l'Assemblée nationale & au roi, M. de Bertrand, ci-devant ministre de la Marine. Bibliography: Martin & Walter.  Révolution française, I, 3051. Scanner's note: No copyright page found. No table-of-contents pages found.   Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."
