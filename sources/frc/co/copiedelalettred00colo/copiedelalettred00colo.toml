title = "Copie de la lettre du citoyen Luc Yves associé de Lubin, Fizel & cie de St. Marc"
language = "fr"
date = "1798"
note = "Manuscript. Addressed on page 4: Au citoyen Andrault sur ses terres des Petits Bois pres Melle, departe. des Deux Sevres a Melle; stamped: Le-Havre. Dated in accordance with the French Republican calendar: le 8. brumaire an 7e. Bifolium. Letter from the firm Colombel Aîné, Besongnet et Barabé to Andrault, which conveys a copy of a letter dated May 9, 1798, from Luc Yves, an associate of Lubin, Fizel et cie in Saint-Marc, Haiti, to Colombel Aîné, Besongnet et Barabé. Yves discusses the defeat of British expeditionary forces in 1798 during the Haitian Revolution and assures his associates that his firm has not suffered any damage from the violence. Archives municipales du Havre;. Colombel Aîné, Besongnet et Barabé was created in 1788 in Le Havre, France, from the union of the firms Colombel frères and Barabé et Besongnet fils and was associated with Lubin, Fizel et cie of Saint-Marc, Haiti, to supply arms for the Haitian slave trade. Scanner's note: No copyright page found. No table-of-contents pages found.  No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
url = "https://archive.org/details/copiedelalettred00colo"
