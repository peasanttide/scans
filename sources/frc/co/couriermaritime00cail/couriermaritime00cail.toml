note = """Prospectus for "Courrier maritime.". Place of publication and printer statement from colophon. "Permis d'imprimer & distribuer, le 29 décembre 1787"--P. [2]. Printed in double columns. "Le prix de l'abonnement est de 15 livres par an pour Paris, & de 20 livres pour la province, port franc dans tout le royaume. On souscrit en tout temps & à toutes époques, pourvu que ce soit pour une année entière. A Paris, au Bureau du Courier maritime, rue de la Verrerie, n°. 95"--P. [2]. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined.  Text extends off of the edge of the page.  Text lost in binding."""
