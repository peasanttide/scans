note = """Prospectus for "Description des arts et métiers", issued by the Académie royal des sciences, 1761-1789. Caption title. "Le sieur Moutard continuera de vendre les Arts séparés, de manière que chaque artiste pourra acquérir la description particuliere de l'art qui le concerne"--P. [2]. "Les personnes qui voudront acquérir la collection entiere, portée actuellement à 86 cahiers, auront une remise de moitié, & l'acquisition pourra même se faire en trois payements égaux ... Il sera libre à ceux qui voudront payer à la fois 640 liv. de retirer leur collection entiere"--P. [2]. "Ordre que l'on peut observer pour relier la collection des Arts et métiers, & qui est le même que celui qu'on a suivi pour l'exemplaire de l'Académie royale des sciences": p. [3]-[4]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
