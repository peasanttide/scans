note = """Prospectus for "Collection universelle des mémoires particuliers relatifs à l'histoire de France.". Caption title. "Il en paroîtra régulièrement un volume chaque mois, à commencer dans les premiers jours de février prochain. Les editeurs ont pris les précautions nécessaires pour qu'il en ait paru 12 volumes à la fin de l'année 1785"--P. 4. "On souscrit dès-à-présent. C'est au directeur de la Collection des mémoires, &c. qu'il faut s'adresser, rue d'Anjou, la deuxieme porte cochere à gauche, en entrant par la rue Dauphine, à Paris"--P. 4. Includes subscription rates. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
