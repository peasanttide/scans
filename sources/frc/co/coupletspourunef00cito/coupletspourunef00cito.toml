note = "Caption title. Without imprint. First two lines: Satellites des rois, mercenaires esclaves, / Et vous traîtres Anglais, dégénérés Bataves. Includes also: Couplets pour la fête du 14 juillet (vieux style). Par le même citoyen. Sur l'air: Plutôt la mort que l'esclavage -- Hommage a l'Être suprême. Couplets sur l'air de l'ancienne marche du Régiment de Flandre. Par un citoyen de la commune de Passy -- Autres couplets. Même air. Par le même auteur. Not in Martin & Walter. Scanner's note: Title on cover. Damaged, stained pages and cover.<br />No copyright. No table of contents. <br /><br />."
