language = "fr"
place = "Paris"
date = "1789"
note = "Caption title. Imprint from colophon. Note in contemporary ms. on p.1: Ce complot infernal etoit imaginaire. Il a été duement [?] reconnu que le feu a été mis par accident à quelques barils de poudre renfermés dans une cave du Chateau de Quincey. Cette provision de poudre étoit destinée a faire sauter quelques roches qui nuissient à l'arrangement du jardin de M. de Mesmay, qui s'est justifié par la mémoire imprimée. Not in Martin & Walter. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."
