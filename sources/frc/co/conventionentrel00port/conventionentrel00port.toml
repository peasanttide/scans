note = """At head of caption title: Corps législatif. Imprint from colophon. "Convention"--Bottom of p. 17. Not in Martin & Walter. Révolution française. BN. Includes bibliographical references. Discours prononcé par Portalis, orateur du gouvernement, relatif à la convention conclue entre le gouvernement fançais et Sa Sainteté Pie VII -- Rapport du citoyen Portalis, conseiller d'État, chargé de toutes les affaires concernant les cultes, sur les articles organiques de la convention passée à Paris, le 26 messidor an 9, entre le gouvernement français et la pape -- Rapport du citoyen Portalis sur les articles organiques des cultes protestans -- Projet de la loi. Bibliography: BN,  CXLI, column 192. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text.  Irregular pagination.  Permanent creases obscure text.  No margin space.  Some text is lost in the binding."""
