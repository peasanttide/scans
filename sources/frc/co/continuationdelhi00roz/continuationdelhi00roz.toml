#:schema ../../../../schemas/source.json
layer = "source"
id = "continuationdelhi00roz"
type = "pamphlet"
title = "Continuation de l'Histoire générale des voyages, ou, Collection nouvelle, 1°. Des relations de voyages par mer, decouvertes, observations, descriptions, omises dans celle de feu M. l'abbé Prevôt, ou publiées depuis cet ouvrage, 2°. Des voyages par terre faits dans toutes les parties du monde"
language = "fr"
place = "A Paris"
date = "1765"
note = """Prospectus for "Continuation de l'Histoire générale des voyages," a continuaton compiled by A.-G. Meusnier de Querlon, Alexandre Deleyre, and Jacques-Philibert Rousselot de Surgy of Abbé Prevost's 15-volume "Histoire générale des voyages". The first seven volumes of Prevost's "Histoire" are a French translation, with omissions and variations of "New general collection of voyages and travels," compiled by John Green. Cf. NUC pre-1956, v. 470, p. 587, NP 0569815. "Le même libraire Rozet, rue S. Severin, qui annonce la présente Continuation, ayant acquis des Sieurs Veuve Didot & Durand tout le fond de l'Histoire des voyages de M. l'abbé Prevost, avertit ceux qui ont précédemment souscrit pour cette collection ... de se présenter ... pour retirer les volumes qui leur manquent"--P. 13-14. "On pourra souscrire pour la Continuation de l'Histoire des voyages chez tous les libraires des principales villes de l'Europe, & particulierement chez MM. les freres Reycends & Guibert, libraires, sur le coin de la rue Neuve à Turin"--P. 13. Colophon: De l'imprimerie de Le Breton, premier imprimeur ordinaire de roi, 1765. Title vignette; initial; head-piece. Includes prices. Laid in: Avis. Ce qui désireront souscrire pour l'Histoire des voyages, & qui se trouveront trop éloignés de la demeure du libraire, pourront ... écrire par la petite poste au libraire, en prenant le soin de lui donner leur demeure exacte, & il leur sera envoyé sur le champ une souscription qu'ils payeront au porteur. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/continuationdelhi00roz"
subject = [
    "Prévost, abbé, 1697-1763",
    "Booksellers and bookselling",
]

