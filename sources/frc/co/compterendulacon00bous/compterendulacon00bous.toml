title = "Compte rendu à la Convention nationale, en vertu de la loi du 21 nivôse, par Boussion, représentant du peuple des recettes & des dépenses qu'il a faites pendant le temps qu'a duré sa mission dans les départements de la Gironde & de la Dordogne, où il a été envoyé par décret du 22 pluviôse an troisième, parti le 3 ventôse, & de retour à Paris le 3 fructidor suivant, le présent compte rendu est pour six mois, ma mission ayant été prolongée d'après les lettres des comités de salut public des 8, 11 & 12 prairial, & de sûreté générale du 13 du même mois, qui m'invitoient à continuer les mesures prises pour rappeler les autorités constituées à leurs devoirs, & pour réprimer les attroupements & les mouvemens séditieux & fanatiques, dans les six mois se trouve compris celui de congé qui m'a été accordé, & que j'ai passé dans le département de Lot-&-Garonne ; imprimé par ordre de la Convention nationale."
language = "fr"
