note = """Prospectus for "Courrier des spectacles," which began publication in 1797. Caption title. "Monsieur, ce journal paroissant de nature à vous intéresser, nous avons cru devoir vous le faire connoître. Nous vous saluons bien parfaitement, Le Pan et Desanteul, rédacteurs.". "Ce journal paroît tous les jours, depuis le 18 nivose (7 janvier) dernier.". "On s'abonne au bureau du Courrier des spectacles, rue Saint-Guillaume, n°. 1150, et dans les départemens, chez les principaux libraires; le prix pour trois mois est de 7 liv. 10 s. pour Paris, et de 9 liv. pour les départemens.". Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined.  Text extends off of the edge of the page.  Text lost in binding."""
