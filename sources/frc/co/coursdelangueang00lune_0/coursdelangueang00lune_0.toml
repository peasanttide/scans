note = """Prospectus for Luneau de Boisjermain's "Cours de langue angloise" and "Cours de langue italienne," published 1783 and 1784 respectively. Caption title. Printer statement and date of publication from colophon. "A Paris, chez l'auteur, rue S. André-des-Arts, près la rue Contrescarpe"--P. [1]. "On s'abonne au Cours anglois. On paie en souscrivant 41 l. 5 s. ... On reçoit le Cours de langue italienne en adressant 26 liv. 5 s.; il est tout imprimé"--P. [1]. Includes excerpts from "Cours de langue angloise" in English. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  Text extends past page edges.<br /><br />."""
