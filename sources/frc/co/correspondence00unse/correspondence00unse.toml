note = "Newberry's copy lacks t.p.; title supplied by cataloger. Correspondence dated 12-25 mars 1790. Not in Martin & Walter. Révolution française. Copie de la lettre de M. Millanois, membre de l'Assembeĺe nationale, & député de la ville de Lyon, à M. Dejoly, lieutenant de maire de la ville de Paris -- Copie de la lettre souscrite au nom des officiers municipaux réunis avec le comité de la Garde nationale de Lyon, adressée à MM. les députés de la ville & sénéchaussée de Lyon à l'Assemblée nationale -- Copie de la lettre adressée à MM. les officiers municipaux, en réponse à leur lettre du 20 mars 1790, par MM. les députés de la ville & sénéchaussée de Lyon à l'Assemblée nationale -- Les officiers municipaux, réunis avec le comité de la Garde nationale. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />Page numbers skip from 8 to 13. Irregular pagination. <br />."
