note = """Prospectus for: Cours de langue italienne / par M. Luneau de Boisjermain. Paris, 1783. Caption title. "Permis d'imprim. le 23 août 1783"--P. 4, first sequence. Head-piece. "On paye 15 liv., franches de port, pour se procurer les huit cahiers du Cours de langue italienne ... Ces cahiers parviennent, port franc, à l'adresse des abonnés; il faut envoyer le prix de l'abonnement à M. Luneau de Boisjermain, rue Saint-André-des-Arts, à Paris"--P. 4, first sequence. Includes excerpts from the proposed work in Italian. Laid in: Clipping from unknown source advertising the publication of "Jérusalem libérée," a French translation of Torquato Tasso's "Gerusalemme liberata.". Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Irregular pagination. <br /><br />."""
