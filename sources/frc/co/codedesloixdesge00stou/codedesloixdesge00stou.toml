note = """Prospectus for French translation by J.B. Robinet of Nathaniel Brassey Halhed's "A code of Gentoo laws, or, Ordinations of the pundits," an English translation made from the Vivādārnavasētu, a digest of Hindu law compiled for Warren Hastings by several pandits. French translation also attributed to Jean Nicolas Démeunier. Cf. BN, CLIII, column 562. Caption title. Date of publication from colophon. Listings for other titles sold by Stoupe on p. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
