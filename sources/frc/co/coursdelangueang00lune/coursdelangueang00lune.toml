note = """Prospectus for Luneau de Boisjermain's "Cours de langue angloise" and "Cours de langue italienne," published 1783 and 1784 respectively. Caption title. "On reçoit le Cours de langue italienne en adressant 26 liv. 5 s. à l'auteur par lettre affranchie; il est tout imprimé. On s'abonne au Cours anglois. On paie 15 liv. en se faisant inscrire, 15 liv. à la réception du septieme cahier, & 11 liv. 5 s. à la réception du quinzieme cahier de prose"--P. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
