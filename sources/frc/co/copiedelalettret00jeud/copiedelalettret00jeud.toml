id = "copiedelalettret00jeud"
type = "pamphlet"
title = "Copie de la lettre trouvée après le départ du roi et de la reine, le mardi vingt-un juin 1791, laquelle étoit dans un appartement d'un valet-de-chambre de Sa Majesté, cachée sous trois matelats, et prise par les sieurs Gaudron, Marcus, Prudem, Thiériot et Siecham .."
language = "fr"
place = "Paris"
date = "1791"
note = """Caption title. Signed, p. 6: Jeudi, de l'Houmande. Imprint from colophon. "Icelle lettre a été lue, au jardin des Tuileries, par le sieur Charles Alexandre Mary, commandant au district du Petit Saint-Antoine de Paris, à l'époque du 13 juillet 1789 et mois suivant, lequel a été député par le peuple pour porter ladite lettre à l'Assemblée nationale, où il a été admis et conduit par un huissier de la chaîne à M. Voidel, président du Comité des recherches, où il a déposé ladite lettre et en a reçu une attestation"--P. [1]. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, II, 17298. Scanner's note: No copyright found.  No table of contents found. Title on cover. Damaged, stained pages and cover. <br />."""
url = "https://archive.org/details/copiedelalettret00jeud"
subject = ["Louis XVI, King of France, 1754-1793"]
extent = "8 p. ; 22 cm."

