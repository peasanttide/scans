language = "fr"
place = "Paris"
date = "1788"
note = """Prospectus for Fabre's "Les fastes de la noblesse de France, ou, Collection de diplômes, chartes, rouleaux, contrats et autres titres et documents.". Only the introduction of the proposed work was published. Cf. Guigard, J. Bibliothèque héraldique de la France, 3298. Printer statement and date of publication from colophon. "MM. les souscripteurs et autres ... pourront envoyer leurs soumissions, s'ils le jugent à propos, par une simple lettre affranchie à l'auteur, par laquelle ils promettront prendre les quatre vol. in-8°. à measure qu'ils paroîtront, à raison de 6 liv. les 500 pages"--P. 6-7. "Les personnes qui écriront à l'auteur pour se procurer ou pour donner des renseignemens, sont priées d'affranchir leurs lettres, rue Bourtibourg, n°. 29, près la rue Sainte-Croix de la Bretonnerie"--P. 8. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
url = "https://archive.org/details/collectiondedipl00fabr"
subject = [
    "Fabre, avocat au parlement de Paris",
    "Booksellers and bookselling",
    "Genealogical literature",
]

