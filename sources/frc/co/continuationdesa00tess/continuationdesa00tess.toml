title = "Continuation des Annales de l'agriculture françoise"
language = "fr"
place = "A Paris"
date = "1800"
note = """Prospectus for "Annales de l'agriculture françoise.". Caption title. Signed: Tessier, membre de l'Institut national, de la Société d'agriculture du département de la Seine, des Sociétés de médecine de Paris, etc. Place of publication and printer statement from colophon. "A compter de vendémiaire an IX [1800], il paroîtra dans le courant de chaque mois un cahier ..."--P. 3. "On s'adresser, pour souscrire, à Paris, chez Madame Huzard, imprimeur-libraire, rue de l'Eperon-Saint-André-des-Arts, n°. 11; et dans les départemens, chez tous les libraires et directeurs des postes aux lettres"--P. 4. "La souscription, pour les quatre volumes ou pour l'année, est de 24 francs pour toute la République"--P. 3-4. Ticket laid in: La Société royale d'agriculture tiendra sa séance publique, le mercredi 29 décembre 1790, à cinq heures précises, dans la grande salle de M. Le Brun, rue de Clery, n°. 96. Ce billet est nécessaire pour entrer; inscription in ms. on verso: A Monsieur, Monsieur Adanson, de l'Académie des sciences, au Palais Royal, n° 44. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />Irregular pagination. <br />."""
url = "https://archive.org/details/continuationdesa00tess"
subject = [
    "Annales de l'agriculture françoise",
    "Booksellers and bookselling",
    "Periodicals",
]

