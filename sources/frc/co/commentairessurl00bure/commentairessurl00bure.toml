note = """Prospectus for "Coutume d'Angoumois", compiled by Étienne Souchet. Caption title. "Le premier volume des Commentaires ... est imprimé. Il paroîtra le premier du mois de décembre prochain; le second sera distribué dans le mois de mars 1781."--P. [2]. Includes brief prospectuses for titles and advertisements for other goods offered by the following Parisian booksellers and artisans: Pierre-Michel Lamy, Maupin, Jean-Félix Watin, Deveria, Pierre Bulliard, Roch-Henri Prévost Saint-Lucien, Joseph Mallet, Georget, Benoît Morin, J.D. Du Planil, Pierre-Etienne-Germain Durand, Antoine Boudet, Boutillier, Rouzeau, Louis-Charles Desnos. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers.<br /><br />."""
