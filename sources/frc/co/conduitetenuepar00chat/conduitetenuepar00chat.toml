id = "conduitetenuepar00chat"
type = "pamphlet"
title = "Conduite tenue par le général divisionnaire Châteauneufrandon, commandant la cinquième division militaire, départemens des haut et bas Rhin relativement au bruit répandu sur les derrières de l'armée du général Jourdan, de la marche rapide d'une colonne autrichienne sur Kehl et le front du département du bas Rhin, par les gorges de la Forêt-noire, au-delà de son aile gauche : avec les pièces capables de faire juger l'indispensable nécessité où il a été de requérir et de réunir, pendant deux jours, les colonnes mobiles du département du bas Rhin, sur plusieurs points, et avec la preuve physique et morale de la possibilité et de la présomption générale de ce mouvement de l'ennemi."
language = "fr"
date = "1799"
note = "Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,I, 7023. Scanner's note: Title found on front cover. No copyright page found. No table-of-contents pages found."
