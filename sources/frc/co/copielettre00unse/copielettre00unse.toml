language = "fr"
place = "A Clermont"
date = "1790"
note = "Caption title. Signed, p. 1: H.J.C., evêque de Soissons. Imprint from colophon. Not in Martin & Walter. Révolution française. Copie de la lettre de M. l'evêque de Soissons, aux curés de son diocèse -- Lettre de curé, maire de Chavignon, a M. le doyen de Vailly -- Memoire, en forme de réponse a la lettre circulaire imprimée de M. l'evêque de Soissons, aux curés de son diocèse, en date du 8 octobre 1790, sur la nécessité de l'adhésion aux décrets concernant l'organisation du clergé / par Jean-François Nusse, curé & maire de Chavignon ... -- Réponse a la déclaration de M. l'évêque de Soissons, au département de l'Aisne, en date du 15 octobre 1790, aussi envoyée à son clergé -- Extrait du procès-verbal d'apposition de scellé à la cathédrale de la ville de Laon -- Extrait du registre des délibérations du directoire du departement de l'Aisne. Scanner's note: No copyright page found. No table-of-contents pages found.   Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."
url = "https://archive.org/details/copielettre00unse"
