#:schema ../../../../schemas/source.json
layer = "source"
id = "compterenduparun00fran"
type = "pamphlet"
title = "Compte rendu par une partie des membres de l'Assemblée nationale, de leur opinion sur le rapport de la procédure du Châtelet, & sur le projet de décret proposé par le Comité des rapports, & adopté par l'Assemblée nationale dans la séance du 1 octobre 1790."
language = "fr"
place = "France"
date = "1790"
note = "Caption title. Without imprint. Opening sentence: Nous députés soussignés, justement indignés des exécrables attentats commis à Versailles, les 5 & 6 octobre de l'année derniere [1789]; attentats dont le souvenir seroit à jamais déshonorant pour le nom francçais, si le recherche la plus sévère & d'éclatantes punitions ne venoient pas, en frappant sur les coupables, absoudre la nation. Dated on p.5: Fait à Paris, ce 6 octobre 1790. Variant of Martin & Walter. Révolution française, IV:2, 3690. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."
url = "https://archive.org/details/compterenduparun00fran"
subject = ["Châtelet (Paris, France)"]
extent = "15 p. ; 21 cm."

