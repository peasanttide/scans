title = "Condamnation du Nouveau Testament de Mons par nôtre Saint Pere le Pape Clement IX .."
language = "fr"
date = "1668"
note = "Caption title. Dated 20 April 1668. Concerns Le Maistre's translation, revised by Antoine Arnauld and other Port Royalists. Includes also the text of the two Ordonnances on the same subject issued by Hardouin de Beaumont de Péréfixe, Archbishop of Paris (18 Nov. 1667, and 20 Apr. 1668). On verso of last leaf (blank) is a list in contemporary ms. of other similar condemnations. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined. Text extends off of the page edge."
url = "https://archive.org/details/condamnationduno00cath"
subject = [
