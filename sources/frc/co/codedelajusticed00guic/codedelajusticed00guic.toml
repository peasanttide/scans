place = "Sur l'imprimé a Paris"
date = "1790"
note = """"Nouvelle édition augmentée du décret additionnel du premier décembre, et de diverses explications données par le Comité de Constitution sur plusieurs questions relatives aux juges de paix"--T.p., [1er cahier]. "Assemblée nationale, 1789. La loi et le Roi"--Device on t.p., cahiers [1]-7. Tome second comprised of cahiers 6-8, continuously paged. T.p., cahier 8 lacks author name; includes vignette. Not in Martin & Walter. Révolution française. Cf. II, 15969; different edition listed. Includes index to Tome second at end of cahier 8. Stamp, t.p. of cahiers [1] and 6: La ou ailleurs. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover.  Skewed text.  Uneven binding.  Inconsistent page sizes.  Damaged pages."""
