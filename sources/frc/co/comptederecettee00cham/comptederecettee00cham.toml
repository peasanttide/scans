title = "Compte de recette et de dépense, rendu en exécution de la loi du 21 nivôse, en [i.e. an] III, par Jean-Michel Chambon, représentant du peuple, envoyé dans les départemens des Bouches-du-Rhône & du Var par décret du 7 pluviôse dernier, continué par décret du 23 prairial suivant, qui assimile sa mission à celles près des armées & envoyé dans les départemens de Vaucluse par décret du 23 dudit mois prairial, ayant cessé ses fonctions le 12 thermidor à Beaucaire, où il étoit resté pendant la foire, en vertu de la lettre du Comité de sûreté générale du 15 messidor, rentré dans la Convention le 9 fructidor dernier."
