note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Compte rendu par Philippeaux"--Bottom of p. 17. Martin & Walter. Révolution française. "Rapport substanciel fait au Comité de salut public, le 22 août 1793, l'an deuxième de la République une & indivisible, par Philippeaux, député-commissaire dans les départemens du centre & de l'ouest"--P. 35-42. Bibliography: Martin & Walter.  Révolution française,  III, 27209. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text. <br />No Copyright found. No Table of Contents found. <br />Tight margins and no margins. Text lost in binding. <br />."""
