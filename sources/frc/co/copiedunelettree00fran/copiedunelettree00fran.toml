note = """Caption title. Imprint from colophon. "Séance de l'Assemblée nationale du mercredy 15 juillet 1789": p.6-12. "Délibération de l'Assemblée nationale. Du 13 [?] juillet 1789": p.13-14. "Réponse du roi": p.15-17. "Extrait des délibérations de l'Assemblée des Trois ordres de la ville de Lyon ...": p.[18]-26. Dated: Ce jour 17 juillet mil sept cent quatre-vingt-neuf .. Not in Martin & Walter. Scanner's note: Title on cover. Damaged, stained pages and cover.<br />No copyright. No table of contents. <br /><br />."""
