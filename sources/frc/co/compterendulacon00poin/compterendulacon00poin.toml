title = "Compte rendu a la Convention nationale et au peuple souverain, par Noel Pointe-d'Armeville, représentant du peuple, envoyé dans les départemens de la Nièvre, de l'Allier et du Cher."
language = "fr"
place = "Paris"
date = "1794"
note = """At head of title: Convention nationale. Publisher name from colophon. "Imprimé par ordre de la Convention nationale.". "Registre de correspondance pour servir à l'enregistrement des lettres que j'écrirai, pendant le temps de la mission qui m'a été confiée par la Convention nationale, au Comité de salut public, commencé le 17 brumaire, l'an second de la Republique, une & indivisible"--P. [7]-178. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  IV:1, 27624. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
