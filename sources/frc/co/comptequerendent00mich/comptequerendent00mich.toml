type = "pamphlet"
title = "Compte que rendent les représentans du peuple Michaud & Siblot de la dépense qu'ils ont faite dans les deux missions qu'ils ont remplies, l'une dans les départemens du Doubs & de la Haute-Saone, pour accélérer le recrutement des trois cent mille hommes, en exécution de la loi du 29 mars 1793 (vieux style), & l'autre dans les communes de Marly & de Saint-Germain-en-Laye, en exécution de celle rendue le 12 juillet de la même année, pour la conservation des meubles & effets dépendans de la ci-devant liste civile ; la première de ces missions ayant duré depuis le 14 mars jusqu'au 11 mai de ladite année, & la seconde depuis le 27 août jusqu'au 27 septembre suivant : en exécution du décret du 21 nivôse, l'an III."
language = "fr"
place = "Paris"
date = "1795"
