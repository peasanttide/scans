note = """Prospectus for Luneau de Boisjermain's "Cours de langue angloise.". Caption title. "La distribution de cet ouvrage se faira par cahiers. Ils paroîtront le premier septembre 1796, vieux style, & les 10, 20, 30 de chaque mois. Prix 43 l. 4 s. On adressera ce prix, franc de port, ainsi que celui des ouvrages suivants, à l'auteur, rue ci-devant de Condé, n°. 10"--P. 4. Includes brief notices for other works written or edited by Luneau de Boisjermain. Clipping from unidentified source laid in: Annonces et avis divers. La Nomenclature anglaise ... avec une introduction & des notes utiles composées par M. William Cobbett ... Cet ouvrage se trouve chez Testu, libraire, rue Hautefeuille .. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Irregular pagination.  Insert included. <br /><br />."""
