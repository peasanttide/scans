note = """Caption title. Imprint from colophon. Opening words: L'Assemblée nationale, en décrétant le pacte fédératif, qu'elle a fixé au 14 juillet, a voulu qu'un serment auguste & public, réunissant, au même instant tous les citoyens du même empire, les liât d'un noeud indissoluble .. "Le premier devoir des commissaires, nommés par la municipalité & par la commune de Paris, pour veiller aux préparatifs de cette fête, étoit donc de fixer dans un lieu vaste, qui ... présentât le plus de facilité & d'économie pour les dispositions ...": p.[1]-2. Martin & Walter IV 2: 3734. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."""
