note = """Prospectus for Rozier's "Cours complet d'agriculture, théorique, pratique, économique, et de médecine rurale et vétérinaire". Caption title. "Les soumissions seront adressées, franches de port, à Paris, chez M. Cuchet, au bureau du Journal de physique, rue des Mathurins, Cloître Saint-Benoît"--P. [2]. Imprint from colophon. Newberry's copy closely trimmed, removing portion of printer's statement and possibly date of publication. "Permis d'imprimer, le 30 avril 1779"--P. [2]. Printed in double columns. "Les deux premiers volumes paroîtront en 1780, les deux seconds en 1781, & les deux derniers en 1782. On payera 24 liv. en recevant chaque livraison composée de deux volumes"--P. [2]. Includes blank subscription form. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
