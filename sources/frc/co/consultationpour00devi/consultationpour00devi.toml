title = "Consultation pour le sieur Leblanc, secretaire des commandemens de S.A.S. Mgr. le prince de Conti, propriétiare du privilege exclusif de la feuille intitulée, Courrir d'Avignon, receveur-général du tabac, & directeur des postes dudit Avignon, contre le sieur Jean-Joseph Niel, son imprimeur"
language = "fr"
place = "A Avignon"
date = "1778"
note = """Caption title. Signed, p. 46: Devillelles, Balze, avocats. Imprint at head of title. Initial; head-pieces. Regarding a contract dispute between Joachim Leblanc and Jean-Joseph Niel, publisher and printer, respectively, of the Courrier of Avignon. "Pieces justificatives": p. 47-70. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
url = "https://archive.org/details/consultationpour00devi"
