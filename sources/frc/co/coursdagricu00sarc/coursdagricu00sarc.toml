note = """Advertisement for a course on agriculture taught by Sarcey de Sutières and prospectus for accompanying textbook: Cours complet d'agriculture, ou, Leçons périodiques sur cet art / par M. de Sutières-Sarcey. Paris, 1788-1789. Caption title. "Permis d'imprimer, ce 16 janvier 1788"--P. 4. "Le cours sera de trois mois. Il commencera le 18 février prochain ... chez M. de Sutières, rue de la Sourdière, n°. 14 ... Le prix de la souscription, pour l'année, est de 24 liv. pour Paris; & de 27 liv. pour la province, franc de port. On souscrira au bureau du cours, même rue, même numéro"--P. 4. Laid in: Form letter inviting prospective student to attend the first session of the course; signed: De Sutières-Sarcey; dated in ms.: Ce 1er. mars 1788. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Irregular pagination. <br /><br />."""
