note = """Prospectus for an edition of Rousseau's complete works, published 1774-1783. "Cette collection complette se vend à Paris, chez Pierre J. Duplain, libraire, rue de l'ancienne Comédie Françoise, cour du Commerce.". Newberry's copy tightly trimmed, possibly removing imprint. Possibly published in 1783; text indicates that the edition of Rousseau's works has just been completed. "Prix, 10 liv. le vol. en feuilles, & 1 l. 10 sols chaque estampe.". Inscription: Monsieur Adanson, rue Vivienne, Paris. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
