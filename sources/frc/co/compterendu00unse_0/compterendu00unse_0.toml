note = """Caption title. Without imprint. Opening sentence: Nous députés soussignés, considérant, 1⁰. que le décret du 28 mars, portant ces mots: "si le roi sortoit du royaume, et si, après avoir été invité par une proclamation du corps législatif, il ne rentroit par en France, il seroit censé avoir abdiqué la couronne", renferme une disposition pénale destructive de l'inviolabilité de la personne du roi et de l'hérédité du trône. Dated on p.4: Fait à Paris, le 30 mars 1791. This edition not in Martin & Walter (cf. IV 2: 3691). Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."""
