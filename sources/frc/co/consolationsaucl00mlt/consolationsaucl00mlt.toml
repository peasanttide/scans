note = "Page 106 misnumbered 104. Opening sentences: Les six décrets mentionnés au titre de cet ouvrage, sont ceux qui ont rapport, 1⁰. Aux rentes foncières, perpétuelles, champarts, & redevances non remboursables. 2⁰. Aux droits féodaux. 3⁰. Aux justices seigneuriales. 4⁰. Aux dîmes de tout espèce. 5⁰. Au traitement à faire aux décimateurs, lorsque la dîme cessera d'être perçue. 6⁰. A la pluralité des bénéfices. This edition not in Martin & Walter (cf. IV 2: 4089). Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Page number 104 used twice."
