title = "... Copie du decret de la Convention nationale ; du 3 avril 1793, l'an 2me de la République française ; qui déclare que Dumourier [i.e. Dumouriez] traitre `a la patrie, est mis hors de la loi, autorise tout citoyen `a courir-sus, et assure une récompense de trois cent mille livres et des couronnes civiques `a ceux qui s'en saisiront mort ou vif."
language = "fr"
place = "Paris"
date = "1793"
note = "Caption title. Imprint from colophon. At head of title: Société des amis de la liberté et de l'égalité, séante aux ci-devant Jacobins, Saint-Honoré, a Paris. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
url = "https://archive.org/details/copiedudecretdel00fran_0"
