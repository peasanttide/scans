title = "Compte rendu par Jourdan, représentant du peuple, en vertu de la loi du 21 nivôse, de sa dépense dans les départemens de l'Yonne, Saone-et-Loire, Loiret et la Nièvre, où il a été envoyé par le Comité de salut public, le 28 brumaire an 3, pour surveiller les approvisionnemens de Paris en bois de chauffage, et où il est resté jusqu'au 7 frimaire an 4, époque où il a reçu la nouvelle officielle de l'installation du Directoire exécutif."
language = "fr"
place = "A Paris"
date = "1795"
note = "Caption title. At head of title: Convention nationale. Imprint from colophon. Martin & Walter. Révolution française. Personal expense report. Bibliography: Martin & Walter.  Révolution française,  II, 17506. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page."
