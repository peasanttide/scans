language = "fr"
place = "A Grenoble"
date = "1780"
note = """Prospectus for Faujas-de-St.-Fond's "Histoire naturelle de la province de Dauphiné.". Only v. 1 published, in 1781. Cf. BN, XLIX, column 1162. "On souscrit a Grenoble chez la veuve Giroud, libraire au Palais, a Paris chez Panckoucke, libraire, rue des Poitevins, Hôtel de Thou, chez Nyons, rue Saint-Jean de Beauvais, et au bureau du Journal de physique ... et chez tous les principaux libraires de chaque ville de Daupiné & du royaume"--P. 26. Title vignette. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/histoirenaturell00giro"
