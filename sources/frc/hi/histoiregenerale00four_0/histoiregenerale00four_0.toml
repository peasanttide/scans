note = """Prospectus for M. de L'Aulnaye's "Histoire générale et particulière des religions et du culte de tous les peuples du monde, tant anciens que modernes". "On se fait inscrire ... a Paris, chez J.B. Fournier le jeune, libraire, rue Haute-Feuille, no. 27"--P. 16. Colophon: De l'imprimerie de P. Fr. Didot le jeune. "Douze volumes in-4o. grand papier.". "Chaque volume sera divisé en quatre livraisons ... Chaque livraison sera du prix de 15 liv. pour les personnes qui se feront inscrire"--P. 15. Ms. annotations. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
