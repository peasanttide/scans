note = """Prospectus for Méhée de La Touche's "Histoire de la prétendue révolution de Pologne" and Faur's "Vie privée du maréchal de Richelieu," both published by Buisson in 1792. Caption title. Probably detached from a larger work. "Édition in-12 de la Vie privée du maréchal de Richelieu, contenant ses amours et intrigues, et tout ce qui a rapport aux divers rôles qu'a joués cet homme célèbre, pendant plus de quatre-vingts ans. Seconde édition. Avec des corrections considérables et des augmentations, 3 volumes in-12. Prix, 8 liv. broché. A Paris, chez le même libraire": p. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
