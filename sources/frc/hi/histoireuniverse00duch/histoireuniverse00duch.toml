note = """Prospectus for "Histoire universelle des théâtres de toutes les nations". "Bureau général de l'abonnement, chez les auteurs, rue Ticquetonne, la seconde porte cochère à gauche en entrant par la rue Montmartre, maison de M. Cosme d'Angerville ... Seconde adresse, chez la veuve Duchesne, libraire, rue Saint-Jacques, au Temple-du-Goût"--P. [9]. "L'Histoire universelle des théâtres se distribuera périodiquement tous les mois par demi-volume ... ce qui formera par an 6 volumes in-8°"--P. 8. "Prix de la souscription ... est de 30 liv. par an pour Paris, & de 36 liv. pour la province, franc de port"--P. [9]. Title vignette; head- and tail-pieces. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
