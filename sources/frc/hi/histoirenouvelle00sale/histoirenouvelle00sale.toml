#:schema ../../../../schemas/source.json
layer = "source"
id = "histoirenouvelle00sale"
type = "pamphlet"
title = "Histoire nouvelle de tous les peuples du monde, reduite aux seuls faits qui peuvent instruire & piquer la curiosité, ou, Histoire des hommes"
language = "fr"
place = "A Paris"
date = "1779"
note = """Attributed to J. de Sales. Cf. Barbier, A.A. Ouvrages anonymes, II, column 754. The phrase "Partie de l'histoire ancienne" immediately follows the phrase "Histoire des hommes" on t.p. Issued on subscription. Newberry's copy, uncut and unbound, consists of first two subscription deliveries of t. 1, numbered "no. 1" and "no. 2". Each no. is in paper wrappers with printed "avis aux souscripteurs" describing work to subscribers and soliciting subscriptions for the remainder of the work. "On prie MM. les Abonnés de Paris ... de faire passer au sieur Couturier pere, imprimeur, aux Galeries du Louvre, l'argent de leur abonnement."--"Avis aux souscripteurs", no. 1. Head- and tail-pieces. BN. Includes bibliographical references. Letter of transmittal laid in no. 1: Monsieur ... Si la lecture de l'introduction ci-jointe peut vous plaire, on vous prie de remettre vingt-quatre livres à la personne qui vous portera la troisieme numero de cette Histoire ... A Paris, ce 30 janvier 1779. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
url = "https://archive.org/details/histoirenouvelle00sale"
subject = ["History, Ancient"]

