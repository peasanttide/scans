note = """Prospectus for a new edition of Samuel Guichenon's "Histoire de Bresse et de Bugey". Proposed edition never published? "On souscrira a Lyon chez Regnault, libraire-imprimeur, rue Merciere, a Paris chez Crapart, libraire, rue de Vaugirard, a Dijon chez Bidault, libraire, au Palais, a Chalons chez Desaint, imprimeur du roi, a Bourg chez Robert & Gautier, libraires, a Autun chez Habert, libraire, a Roane chez Boisserand l'aîné, libraire, a Grenoble chez Grabit, libraire, a Vienne chez M. l'abbé Colombier, à l'Abbaye de Saint Pierre, au Puy chez Boisserand, libraire, rue Saint Gilles, a Marseille chez Isnard, libraire, a Aix chez David, imprimeur du parlement, a Avignon chez Fabre, libraire, a Annecy chez Saillet, libraire, a Turin chez les freres Reycends, libraires, Guibert & Orgies, libraires"--Leaf [2]. Title vignette. "Le prix de la souscription sera de cinquante-deux livres pour les deux volumes, in-folio, brochés"--Leaf [2]. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
