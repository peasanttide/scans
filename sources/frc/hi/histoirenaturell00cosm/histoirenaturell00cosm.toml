note = """Prospectus for "Histoire naturelle de la terre, des volcans éteints, des volcans non éteints & de leurs émanations méphitiques.". Proposed work never published? Caption title. "On souscrit à Paris chez M. Cosme, maître en chirurgie, rue des Poulies, vis-à-vis le café de l'Etoile, quartier Saint-Honoré. Chez Monory, libraire, rue & vis-à-vis l'ancienne Comédie Françoise, fauxbourg Saint-Germain. Et chez les principaux libraires de l'Europe"--P. [4]. Printer from colophon. "Permis d'imprimer le 12 mars 1779"--P. [4]. "On payera 18 liv. en souscrivant. En recevant les deux premiers volumes, en janvier prochain 1780, on payera 12 liv. En recevant les deux volumes suivans ..., on payera encore 6 liv. On recevra sans rien payer les deux derniers volumes"--P. [4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
