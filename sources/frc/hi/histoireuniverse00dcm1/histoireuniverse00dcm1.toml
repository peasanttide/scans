note = """Prospectus for Pierre-Joseph Buc'hoz's "Histoire universelle du regne végétal". Caption title. "24 vol. in-folio ornés de 1200 planches gravées en taille-douce par les meilleurs maîtres"--P. [1]. "La condition de l'acquisition actuelle est ... de payer cent quatre-vingt livres, en recevant les trois premiers volumes de planches ... en feuilles, au moyen de quoi, l'on recevra les trois premieres parties du discours grâtis, & l'on ne payera que soixante livres pour chaque volume de planches & huit livres pour chaque partie du discours imprimé en feuilles."--P. [4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  Text extends past page edges. <br />No page numbers. <br /><br />."""
