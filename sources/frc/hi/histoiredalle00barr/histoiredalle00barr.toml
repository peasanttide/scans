language = "fr"
place = "A Paris, rue S. Jacques"
date = "1744"
note = """Prospectus for Joseph Barre's "Histoire générale d'Allemagne," published in 1748. "Dix volumes in-4°. proposés par souscription.". Title vignette; initial; head-piece. "Le prix en faveur de ceux qui souscriront sera pour l'exemplaire, en papier ordinaire, de 72 livres en feuilles ... Ceux qui n'auront pas souscrit payeront l'exemplaire de petit papier 120 liv. relié, & celui de grand papier 170 liv. aussi relié"--P. 8. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
