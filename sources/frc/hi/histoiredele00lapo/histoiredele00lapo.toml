note = """Prospectus for Jacques Longueval's "Histoire de l'église gallicane.". Caption title. "Se vend à Paris chez Laporte, imprimeur-libraire, rue des Noyers, a Toulouse chez N. Etienne Sens, libraire, vis-à-vis Saint Rome, a Nismes chez Gaude pere, fils & comp., libraires, et chez les principaux libraires des villes de France"--P. 4. "Permis d'imprimer & distribuer le 5 juin 1784"--P. 4. Includes prospectus for Augustin Calmet's "Dictionnaire historique, critique, chronologique, géographique, et littéral de la Bible.". Includes prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
