note = """Prospectus for Michel Félibien's "Histoire de la ville de Paris.". "On ne trouvera point extraordinaire qu'on demande cent quarante livres pour chaque exemplaire ... Le prix de chaque exemplaire pour ceux qui n'auront point souscrit sera de deux cens dix livres en blanc. Les souscripteurs pourront s'adresser aux libraires nommez cy-dessus, ou, s'ils le jugent à propos, au P. Lobineau, à l'abbaye de S. Germain des Prez"--P. [4]. Title vignette; initial; head-piece. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text.  Text extends off of the edge of the page."""
