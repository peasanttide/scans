note = """Prospectus for French translation of Aitzema's "Saken van staet en oorlogh". "Projet de souscription" (p.[3]-6) is written by Jean-Baptiste-Gilles de Colins. "Les souscriptions seront reçues jusqu'au premier janvier 1744, chez les libraires des principales villes de l'Europe ... et a Paris, chez M. Saugrain, pere, rue de Savoye, près le quai des Augustins"--P. 7-8. Title vignette; head- and tail-pieces. "Cet ouvrage sera imprimé en dix-huit tomes in-quarto ... On donnera exactement deux volumes par année, & chaque volume en feüilles coûtera huit livres aux souscripteurs"--P. 7. Inscription at foot of p. 8: Ou chez Mr. Colins, ruë du Cami[s?]et derrière St. Sulpice. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
