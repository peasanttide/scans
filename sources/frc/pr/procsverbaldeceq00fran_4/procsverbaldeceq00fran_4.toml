title = "Procès-verbal de ce qui s'est passé au lit de justice : tenu par le roi à Versailles, le lundi 6 août 1787."
language = "fr"
place = "s.l."
date = "1787"
note = """Half title. Caption on p.[3]: Extrait des registres du Parlement, du lundi 6 août mil 1787, du matin. Le Roi Louis XVIe du nom, tenant son lit de justice, en son château de Versailles. "Édit du roi, portant suppression des deux vingtièmes & quatre sous pour livre du premier vingtième; & établissement d'une subvention territoriale dans tout le royaume. Donné à Versailles au mois d'août 1787. Registré en Parlement le 6 desdits mois & an": p.26-36. "Déclaration du roi, concernant le timbre. Donnée à Versailles, le 4 août 1787. Registrée en Parlement le 6 desdits mois & an": p.37-62. "Tarif des droits de timbre, que Sa Majesté veut & entend être perçus en exécution de la déclaration de ce jour": p.63-76. Not in Martin & Walter [edition 2: 76 p.]. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
url = "https://archive.org/details/procsverbaldeceq00fran_4"
subject = ["Taxation"]
extent = "76 p. ; 22 cm."

