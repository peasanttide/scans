title = "Proclamation pour que les armées françaises soient complètes et prêtes à marcher le 15 vendémiaire prochain [6 octobre 1797] : du 4e, jour complémentaire, l'an 5e. de la République française, une et indivisible [20 septembre 1797] /"
language = "fr"
place = "Au Puy"
date = "1797"
note = """Caption title. Imprint from colophon. "Instruction aux commissaires du Directoire près les administrations départementales et municipales, et aux chefs d'états-majors généraux des armées, pour l'exécution de la proclamation du Directoire, du quatrième jour complémentaire de l'an cinq de la République": p.6-10. Dated at end: Paris, ce 3 vendémiaire, an 6 de la République française, une et indivisible [24 septembre 1797]. "Liberté. Égalité. Au Puy, le 12 vendémiaire, an 6e. de la République française, une et indivisible [3 octobre 1797] Le commissaire du pouvoir exécutif près l'administration centrale du département de la Haute-Loire. Aux commissaires du pouvoir exécutif près les administrations municipales et à la gendarmerie nationale du département": p.11-16. Martin & Walter IV 2: 5676 [edition 2: 16 p.; with extra text as indicated]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title on cover. Damaged, stained pages and cover.  Skewed text."""
