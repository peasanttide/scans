note = """Prospectus for Charles François Bouche's "Essai sur l'histoire de Provence.". Caption title. "On souscrit à Marseille, chez Jean Mossy, imprimeur dudit ouvrage. A Aix, chez David, imprimeur-libraire, Surre, libraire. A Toulon, Mallard, imprimeur-libraire, Surre, libraire, Boery, libraire. A Arles, Gaudion, libraire. A Nimes, Gaude pere & fils, libraires. A Montpellier, Rigaud, Pons & compe., libraires. A Beziers, Barbut, imprimeur-libraire. A Bordeaux, Labottieres freres, imprimeurs-libraires, Chappius freres, libraires, Gintrac, libraire, Bergeret, libraire. A Rouen, Leboucher, libraire. A Paris, Delalain jeune, libraire, rue St. Jacques, Debure aîné, libraire, quai des Augustins, Nyon aîné, libraire, rue du Jardinet, Veuve Duchesne, libraire, rue St. Jacques. A Lyon, Rosset, libraire, rue Merciere, Jacquenod, libraire, idem. A Grenoble, Giroud, imprimeur-libraire. Et à [blank] chez [blank]. Et chez les principaux libraires de l'Europe"--P. 4. Place of publication and printer statement from colophon. "Cet ouvrage paroîtra dans le courant de janvier prochain 1785, sans retard. Il est sous presse"--P. 4. Head-piece. "Les deux volumes en feuilles coûteront 18 liv."--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
url = "https://archive.org/details/prospectus00moss"
