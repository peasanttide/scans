note = """Prospectus for Hoüel's "Voyage pittoresque des isles de Sicile, de Malte et de Lipari". Caption title. "On souscrira chez M. Menjaud, notaire, rue Saint-Honoré, entre la rue des Poulies & celle de l'Arbre-Sec"--P. 4. Imprint from colophon. "Cet ouvrage consistera en 300 planches, qui feront cinquante livraisons ... On en donnera six par livraison, accompagnée du texte; chaque livraison se paiera 12 liv. tout compris"--P. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
