title = "Prospectus d'une édition complète des Ouvrages imprimés et manuscrits de d'Anville, et des 62 cartes qui y sont annexées, proposée par souscription, sans aucune avance de fonds"
language = "fr"
place = "Paris"
date = "1834"
note = """Prospectus for: Œuvres d'Anville / publiées par M. de Manne. Paris : Imprimerie royale, 1834. Caption title. "On peur recourir ... à la Notice des ouvrages de M. d'Anville ... qui se trouve à Paris, chez le cit. Demanne, l'un des premiers employés de la Bibliothèque nationale, y demeurant; chez Fuchs, libraire, rue des Mathurins, et chez les libraires ci-dessous ... [15 others in 12 other places]"--P. 5-6. Printed in 1802. Cf. blank subscription form, p. [1] at end. Includes prices, with or without subscription, on p. 2. No. 7 of 17 titles bound together. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/prospectusdune00mann"
subject = [
    "Anville, Jean Baptiste Bourguignon d', 1697-1782",
    "Map publishing",
    "Booksellers and bookselling",
]

