language = "fr"
place = "Paris"
date = "1773"
note = """Prospectus for Carpentier's "Histoire de tous les empires, royaumes et républiques connus.". Proposed work never published? Caption title. "On souscrira à Paris, chez le sieur Carpentier, maître de géographie & d'histoire, auteur de ces cartes, rue du Four Saint Eustache, au numéro 87, et chez Jorry, fils, imprimeur-libraire, rue de la Huchette, près du petit Châtelet"--P. 3. Printer statement from colophon. "Permis d'imprimer le 28 mars 1773"--P. 4. "Cet ouvrage est une histoire abrégée de tous les empires, royaumes & républiques, connus depuis la création du monde, jusqu'à J.C. ... On en donnera tout à la fois une double edition, pour la commodité du public, l'une en 20 tableaux ou cartes, d'environ trois pieds de long sur deux & demi de large; l'autre en 40 cartes d'égale longeur, & de moitié de largeur des premieres"--P. [1]. Folded leaf is sample letterpress table from proposed work: Tableau figuratif des distributions. Includes prices. Scanner's note: No copyright page found. No table-of-contents pages found."""
