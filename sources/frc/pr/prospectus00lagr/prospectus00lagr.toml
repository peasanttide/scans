date = "1788"
note = """Prospectus for French translation of Peter Simon Pallas' "Reise durch verschiedene Provinzen des Russischen Reichs," published 1788-1793. Caption title. "On souscrit à Paris chez Lagrange, libraire, rue Saint-Honoré, vis-à-vis le licée, chez les principaux libraires des grands villes de l'Europe, & chez les maîtres de postes"--P. 6. "Le premier volume & les gravures qui lui appartiennent paroîtront au mois de mars 1788"--P. 5. "L'édition complette sera de 120 livres pour les souscripteurs & de 160 livres pour ceux qui n'auront point souscrit"--P. 6. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/prospectus00lagr"
