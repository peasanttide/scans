note = """Prospectus for: Nouveau recueil de voyages au nord de l'Europe et de l'Asie. Genève : Paul Barde ; Paris : Moutard : Mérigot le jeune, 1785-1786. Caption title. "La souscription sera ouverte jusqu'à la publication de la premiere livraison, qui se fera au premier septembre prochain ... Les personnes qui désirent s'inscrire pour cette précieuse collection ... sont seulement priées de faire leur soumission chez un des librairies ci-dessous nommés ... A Paris, chez Moutard, imprimeur-libraire de la reine, rue des Mathurins, chez Merigot le jeune, libraire, quai des Augustins. Et chez les libraires des principales villes de l'Europe"--P. 4. Printing privilege dated: 21 décembre 1784. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
