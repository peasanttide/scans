note = """Caption title. "On souscrit à Paris à l'Imprimerie polytype, rue Favart, vis-à-vis celle de Grétry. On peut souscrire à tous les bureaux des postes pour les provinces; mais en consignant le prix de l'abonnement, on demandera une reconnoissance, qu'il faudra envoyer, avec la lettre d'avis, à M. Hoffman, rue Favart"--P. [1] at end. Place of publication and printer statement from colophon. "Permis d'imprimer & distribuer, ce 13 janvier 1786"--P. [1] at end. "La premiere feuille paroîtra le 13 février 1786"--P. 6. Head-piece. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
