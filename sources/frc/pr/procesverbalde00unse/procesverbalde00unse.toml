note = """Prospectus for "Procès-verbal de l'Assemblée nationale," published 1789-1791. Caption title. Place of publication and printer statement from colophon. "Le Procès-verbal de l'Assemblée nationale commence au 17 juin"--P. 2. "On souscrit à Paris, chez Baudouin, imprimeur de l'Assemblée nationale, rue du Foin St.-Jacques, n°. 31"--P. 3. List of 32 other booksellers in 32 other cities where one may also subscribe, p. 3-4. "Le prix de l'abonnement ... est pour Paris et Versailles de 18 livres, et de 21 livres pour la province"--P. [1]-2. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
