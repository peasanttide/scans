date = "1784"
note = """Prospectus for "Traduction du théâtre anglois depuis l'origine des spectacles jusqu'à nos jours," translated by Cornélie Wouters de Vasse. Caption title. "On soucrira à Paris chez la Veuve Ballard & fils, imprimeurs du roi, rue des Mathurins, quartier S. Jacques, chez Mérigot l'aîné, libraire au boulevard de la porte S. Martin & sous le vestibule de l'Opéra, chez Mérigot le jeune, libraire, quai des Augustins, chez Belin, libraire, rue S. Jacques, chez Renaut, libraire, rue S. Jacques, et au Bureau du théâtre anglois, n°. 6, rue Saint-Appoline, porte S. Martin"--P. 4. Printer from colophon. "Permis d'imprimer le 13 mars 1784"--P. 4. "Le prix de la souscription est de 36 livres par an pour Paris & de 42 liv. pour la province & les pays étrangers, franc de port ... L'ouvrage, pour ceux qui n'auront pas souscrit, se vendra à raison de 4 liv. le volume"--P. 3. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/prospectus00vass"
