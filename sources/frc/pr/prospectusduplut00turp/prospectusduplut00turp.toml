note = """Prospectus for F.H. Turpin's "La France illustre, ou, Le Plutarque franc̜ais.". Caption title. "Lu & approuvé. A Paris, le 20 novembre 1777"--P. 4. "On souscrit encore, a Paris chez La Combe, rue de Tournon, a Versailles chez Blaiseau, rue Satori, a Amsterdam chez Chandion & Vanharrvelt, libraires. Et chez les principaux libraires de l'Europe"--P. 4. "Le prix de chaque cahier est de trois livres. Celui de la souscription est de trente livres pour treize cahiers franc de port"--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover. <br />."""
