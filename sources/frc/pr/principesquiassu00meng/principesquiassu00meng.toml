#:schema ../../../../schemas/source.json
layer = "source"
id = "principesquiassu00meng"
type = "book"
title = "Principes qui assurent la bonne foi dans les conventions, la sûreté dans leur exécution : donnent à chaque propriétaire un crédit, aux engagemens du commerce une confiance jusqu'alors inconnus : offrent à la nation sur ses immeubles, et pour sa dette, le même crédit, lui procurent la facilité d'eteindre ses assignats, de subvenir aux dépenses de quatre campagnes, sans en émettre, sans aucun nouvel impôt, sans avoir même besoin des biens des condamnés, qui la dispensent, pour rétablir ses finances, de réduire le capital et les arrérages de la dette constituée, ceux de ses rentes viagères, et d'exercer la rigueur des déchéances : comparaison de ces principes avec ceux adoptés par le gouvernement anglais /"
language = "fr"
place = "A Paris"
date = "1793"
note = """Date of publication from NUC pre-1956. "Principes de finances"--Bottom of p. [17]. Martin & Walter. Révolution française. BN. NUC pre-1956. Bibliography: Martin & Walter.  Révolution française,  III, 23817. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
