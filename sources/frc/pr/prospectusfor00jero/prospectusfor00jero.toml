note = """Prospectus for a collection of Bible commentaries by a group of Capuchin friars. First line: L'étude des langues orientales reçoit, tout les jours, de nouveaux encouragemens. Signed: F. Jérôme, d'Arras. Fr. Sixte, de Vesoul. "La lecture des livres prophétiques, sur-tout, les disposera à s'acquitter avec succès des fonctions du sainte ministere. C'est pour remplir cet important objet que les religieux de la Société hébraïque proposent à MM. les directeurs et supérieurs des séminaires & colleges du royaume les versions ci-après indiquées, à raison de [blank] le volume relié, & de [blank] broché"--P. 4. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
