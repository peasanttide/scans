language = "fr"
place = "A Paris"
date = "1778"
note = """Caption title. "Déclaration de M. Charles Bonnet" (p. 2) dated June 1, 1778. Text indicates the first installment of Bonnet's works will be available in January 1779. Cf. p. 3. "On aura pour la somme de 96 liv. la collection complette ... des Œuvres de M. Bonnet en 8 vol. in-4°. Passé le premier d'avril, ils seront payés 120 liv. Et pareillement pour l'edition en 16 vol. in-8°, on payera 56 liv., & passé le premier d'avril, 72 liv."--P. 3. Includes advertisements for three other titles sold by Hardouin. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
