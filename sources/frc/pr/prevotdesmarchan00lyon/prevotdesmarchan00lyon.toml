note = "Two manuscript documents, one dated 21 December 1704 and the other dated 16 July 1706, detailing the proceedings of the Prévôt des marchands et echevins of Lyon, France, regarding in particular the nomination of new échevins, or magistrates, and the appointment of master artisans in various industries. No. 26 of 54 titles bound together. Scanner's note: Uneven binding. Skewed text. Title is on the cover. Text is lost in the binding. Damaged, stained, and/or torn pages."
