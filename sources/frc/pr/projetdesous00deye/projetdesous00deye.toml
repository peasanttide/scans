note = """Prospectus for Bibliothèque universelle des romans. Caption title. Signed: Deyeux. "On s'abonnera uniquement au bureau, rue Neuve Sainte-Catherine, & l'on s'adressera à M. de Grandbois ..."--P. 4. "Permis d'imp. & dist., ce 13 mars 1784"--P. 4. Head-pieces. Deyeux proposes to use one third of each subscription fee to help finance a commemorative tomb for Descartes. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover. <br />."""
