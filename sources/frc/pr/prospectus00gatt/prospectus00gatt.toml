note = """Prospectus for "École de politique", edited by Antoine Jeudy Du Gour. Caption title. "On souscrit à Paris chez Gattey, au Palais-Royal, et chez Retiers, directeur du bureau de l'Ami du roi, hôtel de Carignan, rue Bailleul"--P. 2. Place of publication and printer from colophon. Model subscription form on p. 2 dated 1791. "Le prix est de 4 liv. 10 sous le volume"--P. [1]. Includes catalog of books sold by Gattey. Ms annotations. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
