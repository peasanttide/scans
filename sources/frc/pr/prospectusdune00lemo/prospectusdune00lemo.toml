title = "Prospectus d'une Diplomatique-pratique, ou, Traité de l'arrangement des archives et trésors d'icelles"
language = "fr"
place = "A Metz"
date = "1763"
note = """"[Les souscripteurs] seront remettre le prix de leur souscription dans le tems utile indiqué, & franc de port, ainsi que les lettres d'avis, savoir: à Metz, au Sr. Antoine, imprimeur du roi & de l'Académie royale; à Paris, au Sr. Despilly, rue S. Jacques; à Lyon, au Sr. Bruyset Ponthus, libraire, rue S. Dominique; à Rouen, au Sr. Richard Lallemant, imprimeur-libraire; & à Nancy, au Sr. Baurain, libraire."--P. 7. Device of Société royale des sciences et des arts de Metz on t.p.; head- and tail-pieces. "Le prix de la souscription est fixé à neuf livres, broché. Elle sera ouverte depuis le premier novembre prochain jusqu'au premier août 1764 suivant, passé lequel tems ceux qui n'auront pas souscrits le payeront quinze livres."--P. 7. Accompanied by letter of transmittal dated: A Toul, le 18 8bre. 1763; signed in ms.: LeMoine. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text.  Title page and cover are combined."""
