language = "fr"
place = "Paris?"
date = "1767"
note = """Prospectus for Fessard's "Recueil de toutes les variétés des animaux sauvages et domestiques.". "Dessinés d'après la plus belle nature, & gravés par le sieur Claude Fessard"--P. [3]. Notices for the proposed work appeared in Mercure de France and L'Avant-coureur in 1767. Cf. BN Inventaire du fonds français. Graveurs du 18 s., IX, p. 9. Head-piece. "On les distribuera journellement chez l'auteur, quai d'Orléans, isle S. Louis, maison de M. Chambette père, procureur au parlement, au coin de la rue S. Louis, & chez le sieur Mathenet, son associé, rue des Noyers, maison d'un coutelier, au milieu de la rue"--P. 10. "Chaque cahier de six planches sera de 24 sols"--P. 9. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
