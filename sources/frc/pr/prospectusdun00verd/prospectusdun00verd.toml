language = "fr"
place = "Paris"
date = "1772"
note = """Prospectus for Jean Verdier's "Recueil de mémoires et d'observations sur la perfectibilité de l'homme par les agens physiques et moraux". Imprint from colophon. "Permis d'imprimer, le 25 décembre 1772"--P. 12. "On souscrira à Paris, chez Moutard, libraire de Madame la Dauphine, quai des Augustins, à S. Ambroise, & chez les libraires des principales villes de province"--P. 12. "Le prospectus & celui de la Maison & Cours d'éducation physique & morale de MM. Verdier & Fortier se distribuent gratuitement chez l'auteur & chez Moutard ... Cette brochure expose en un plus grand détail les idées de l'auteur sur l'éducation"--T.p. verso. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
