type = "pamphlet"
title = "Prospectus d'une estampe ayant pour title, La partie de plaisir, gravée par M. de Launay, de l'Académie royale de peinture de Paris & celle de Copenhague, d'après le tableau original de Wéenix"
language = "fr"
place = "Paris"
date = "1783"
note = """Caption title. Printer statement and date of publication from colophon. "L'estampe est de seize pouces de haut sur vingt-deux de large. Elle sera mise en vente le premier décembre prochain, au prix de 12 liv. Les amateurs qui désireront se faire inscrire avant cette époque chez l'auteur, rue de la Bucherie, n°. 26, seront assurés d'avoir les premières épreuves"--P. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
url = "https://archive.org/details/prospectusdun00dela"
subject = [
    "Delaunay, Nicolas, 1739-1792",
    "Prints",
]

