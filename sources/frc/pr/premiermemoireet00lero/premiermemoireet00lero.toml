title = "Premier mémoire et consultations pour le citoyen Leroy, imprimeur-libraire à Lyon, propriétaire d'une édition du Cours d'agriculture, par Rozier"
language = "fr"
place = "A Lyon"
date = "1798"
note = """Caption title. Signed, p. 26: Leroy aîné. Imprint from colophon. "Consultations" (22 p. at end) signed, p. 21: Délibéré à Paris, le 27 nivôse, an 7 de la République. Signés Emmery, G. Hom, Cambacerès, A.C. Thibaudeau. Regarding a copyright dispute between Du Gour and the brothers Le Roy over the right to print an edition of Rozier's Cours complet d'agriculture, théorique, pratique, économique, et de médecine rurale et vétérinaire. Includes bibliographical references. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
