language = "fr"
place = "A Paris"
date = "1780"
note = """Prospectus for "Lettres édifiantes et curieuses écrites des missions étrangères", edited by Yves Mathurin Marie Tréaudet de Querbeuf. Caption title. "On pourra souscrire dès le moment de la publication du prospectus jusqu'à la fin de septembre de cette année, à Paris, chez J.G. Merigot le jeune, libraire, quai des Augustins, au coin de la rue Pavée"--P. [4]. Imprint from colophon. "Chacun des volumes ... ne sera donc que de 2 liv. pour les souscripteurs. Ceux qui n'auront pas souscrit paieront chaque volume 2 liv. 10 sols"--P. [3]-[4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
