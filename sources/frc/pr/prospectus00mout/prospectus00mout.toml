note = """Prospectus for Philippe Louis Gérard's "Comte de Valmont". Caption title. "Chez Moutard, libraire de Madame la Dauphine, rue du Hurepoix, à Saint Ambroise"--P. [1]. Imprint from colophon. "Permis d'imprimer, ce 17 avril 1774"--P. 4. "Trois volumes in 12, avec dix figures en taille-douce, dédiés a Madame la Dauphine"--P. [1]. Bookseller's catalog with prices on p. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
