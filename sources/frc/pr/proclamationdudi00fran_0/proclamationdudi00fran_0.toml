note = """Caption title. Imprint from colophon. At head of title: Directoire exécutif. Martin & Walter IV 2: 5663 (which specifies: création des mandats territoriaux) [edition 2: last line on p.[1]: tout-à-coup reportée, par la création des Mandats]. "Mandats territoriaux" were created by the Directoire to take the place of "assignats" (paper money). Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
