note = """Prospectus for: Entomologie, ou, Histoire naturelle des insectes / par M. Olivier. Paris, 1789-1808. Caption title. Printer statement from colophon. "Permis d'imprimer, ce 9 janvier 1789"--P. 12. "Pour juger si le succès répond à l'annonce, on peut voir les planches qui sont déjà gravées et enluminées chez l'auteur, rue des Maçons, n°. 11; M. Desfontaines, graveur de Monseigneur comte-d'Artois, rue St.-Louis, n°. 77, au Marais; Prévost, libraire, quai des Augustins; Veuve Delaguette, imprimeur-libraire, rue de la Vieille-Draperie; Lamy, libraire, quai des Augustins; Desenne, libraire, au Palais Royal; Royez, libraire, quai des Augustins, à la descente du Pont-Neuf; Basan et Poignant, marchands d'estampes, rue et hôtel Serpente. C'est à ces adresses qu'on souscrit sans aucune avance"--P. 8-9. "Les livraisons seront de douze planches aux prix de 24 liv. la livraison"--P. 11. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
