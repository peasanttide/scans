note = """Caption title. At head of title: Préfecture du département de l'Isère. Signed, p. 2: Le préfet, J.B.J. Fourier. Imprint from colophon. "Le 1er. vendémiaire de l'an 11 ..."--P. [1]. Not in Martin & Walter. Révolution française. "Tableau des citoyens qui ont assisté aux cours de l'Ecole centrale, depuis son organisation; extrait des registres d'inscriptions et du secrétariat"--[1] p. at end. In blue paper wrapper with printed text: Grenoble, le 6 brumaire an 11 de la République française. Le préfet du département de l'Isère, au citoyen [in ms: Jean-Bpte. Jacquier de la Tronche], élève de l'École centrale. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
