note = """Prospectus for French translation of "Universal history, from the earliest account of time to the present". Caption title. "On souscrit dès à présent à Paris chez Moutard, imprimeur-libraire de la reine, Hôtel de Cluni, rue des Mathurins, & chez les principaux libraires du royaume & de l'Europe"--P. 4. "Le premier volume de l'Histoire universelle paroîtra à la fin du mois de janvier prochain (1779) ... On paiera 24 liv. en souscrivant pour les six premiers volumes; en recevant le sixième, on paiera 24 autres liv. pour les six volumes suivans, ainsi de suite de six mois en six mois. Ceux qui n'auront pas souscrit d'ici au premier janvier 1779 paieront chaque volume 6 liv."--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
