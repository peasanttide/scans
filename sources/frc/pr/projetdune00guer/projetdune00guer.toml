language = "fr"
place = "Paris"
date = "1739"
note = """Prospectus for a work to be titled "Essai d'une bibliothèque universelle," compiled by Paul-Alexandre de Reneaulme. The proposed work was never published. Cf. Biog. universelle ancienne et moderne, t. 37, p. 353. Caption title. "On pourra adresser les memoires (affranchis de port) que l'on voudra bien donner, à MM. Guerin, imprimeur, Barrois & Piget, libraires, sur le quai des Augustins, à Paris"--P. 8. Date from colophon. Head-piece. Ms annotations. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
