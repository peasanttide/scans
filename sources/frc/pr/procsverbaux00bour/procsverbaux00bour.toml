note = """Half title. Imprint from colophon. Caption on p.[1]: Procès verbal de la séance de l'Assemblée électorale du district du Bourg-la-Reine, département de Paris, tenue le 13 février 1791, pour la proclamation des sujets aux cures de Conflans, de Viellejuif, de Mont-Rouge, et de Montreuil. "Procès-verbaux de l'Assemblée electorale du district du Bourg-la-Reine, département de Paris, pour l'organisation de l'administration du district": p.28-75. Sessions: 21-23 février 1791. "Liste alphabétique de messieurs les électeurs du district du Bourg-la-Reine, département de Paris. 1791": p.76-80. Martin & Walter IV 2: 2805. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
