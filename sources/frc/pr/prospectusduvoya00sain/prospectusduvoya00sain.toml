note = """Prospectus for Saint Non's "Voyage pittoresque à Naples et en Sicile.". Caption title. "A Paris, ce 19 octobre 1778"--Imprimatur, p. 7. "On engage les amateurs à faire parvenir leurs soumissions qui seront enregistrées suivant l'ordre de leur réception, & l'on s'adressera pour cet effet à M. de Lafosse, graveur ...: sa demeure est place & rue du Carousel, vis-à-vis les Tuileries"--P. 5. "Le prix de chaque livraison ..., etant composée de huit estampes, est de 12 liv."--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text.  Title page and cover are combined."""
