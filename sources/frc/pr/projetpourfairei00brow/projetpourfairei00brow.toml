language = "fr"
place = "London?"
date = "1700"
note = """Caption title. "On avertit ceux qui voudront encourager un si pieux & si important dessein d'envoyer leurs souscriptions à Mr. Daniel Brown, libraire at Blak Swan & Bible without Temple-Bar, ou à Mr. Downing, imprimeur & libraire in Bartholomew-Close, près Westsmithfield, à Londres"--P. 3. "On prie les scavans de delà la mer qui auront quelques pieces importantes sur le sujet cy dessus proposé d'en donner avis aux personnes nommées pour recevoir les souscriptions, chez Monsieur Chamberlayne de la Société royale à Londres"--P. 3. Includes prices per sheet and per illustration printed. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
