note = """Caption title. "Permis d'imprimer, ce 15 novembre 1786"--P. 8. "Le bureau du Journal des trois regnes est à Paris, chez Perisse, libraire, sur le pont Saint-Michel, au Soleil d'or, chez lequel on souscrira ... On pourra encore souscrire à Strasbourg chez Treutel, a Lyon chez les freres Perisse, rue Merciere, a Bordeaux chez les freres Chappuy, libraires. A Nismes chez M. Boyer-Brun, rue de la Trésorerie. A Turin chez Reycends, freres, a Milan chez les mêmes, a Lille en Flandres chez Jacquet, a Bruxelles chez Desjardin, a Berne chez Haller, libraires"--P. 7-8. "Le prix de l'abonnement est de vingt-sept livres, franc de port par-tout le royaume"--P. 7. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
