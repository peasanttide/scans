title = "Prospectus des oeuvres de J.J. Rousseau, nouvelle édition, ornée de quatre-vingt-dix gravures"
language = "fr"
date = "1787"
note = """Caption title. Prospectus for the edition of 1788-93, edited by mercier, l'Abbe Brizard, and De Aulnaye. Cf. Senelier, no. 1908, and Dufour no. 397 (the latter with a detailed account of this prospectus). "A glaris. 1787 et on souscrit, a Liege, chez Plomteux ... A Paris, chez Poincot ..." In addition to the above, ten other publishers are listed as places of subscription.". Bookplate: Justin Godart. Bound with Jean-Jasques; ou, Le réveil-matin des représentans de la nation françoise. [n.p.] 1789. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover. <br />."""
url = "https://archive.org/details/prospectusdesoeu00poin"
subject = ["Rousseau, Jean-Jacques, 1712-1778"]

