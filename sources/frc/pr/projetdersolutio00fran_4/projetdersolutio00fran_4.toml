note = "Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. Opening sentence: Le Conseil des cinq-cents, considérant que la multiplicité des contre-seings qui affranchissent les lettres & paquets transportés par la voie de la poste, donne lieu à des abus sans bornes, lesquels sont très-préjudiciables aux intérêts du trésor public. Martin & Walter IV 2: 3946. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover."
