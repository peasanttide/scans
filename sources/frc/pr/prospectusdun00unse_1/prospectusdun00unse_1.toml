note = """Caption title. "La souscription sera ouverte le 10 août 1775, chez Me Gibert, notaire à Paris, cloître Sainte-Opportune. On ne pourra plus souscrire passé le dernier de janvier 1776; & l'ouvrage paroîtra dans le courant du mois de mai de la même année, & se délivera chez G. Desprez, imprimeur ordinaire du roi & du clergé de France, rue Saint-Jacques, près la rue des Noyers."--P. 7. Initial; head-piece. "La totalité de l'ouvrage consiste en deux volumes ... Le prix en sera de 120 livres; mais ceux qui souscriront auront les deux volumes pour 96 livres"--P. 7. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
