language = "fr"
place = "A Paris"
date = "1780"
note = """Prospectus for "Journal de Monsieur.". Caption title. Place of publication and printer statement from colophon. "Permis d'imprimer ce 11 novembre 1780"--P. 4. "Le premier n°. paroîtra le 30 décembre de la présente année 1780"--P. 4. "A Paris, on ne pourra souscrire que chez M. l'abbé Royou, chapelain de l'ordre de S. Lazare, demeurant rue S. Jacques, entre le Collège de Louis le Grand & celui du Plessis"--P. 4. "Le prix de la souscription est de 24 liv. pour Paris, & de 30 liv. pour la province"--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />Text extends to page edges. <br /><br />."""
