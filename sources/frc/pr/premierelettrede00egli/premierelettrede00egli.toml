note = """"Harangve de Monsievr de la Haye, enuoyé de Monsieur le Prince de Condé en l'Assemblée generale de Crenoble, prononcée le 10. d'Aoust, 1615"; p. 6-7. Lettre de Monseignevr le Prince escrite aux Maires & Escheuins de la Rochelle, & Bourgeois d'icelle, le 30. Iuillet, 1615": p. 8. "Serment fait a l'armee de Monseigneur le Prince, le 4. de Septembre 1615 en faisant la monstre": p. 8. "Seconde lettre de messieurs de l'Assemblée de Grenoble, enuoyée au Roy par les deputez. Et vne à la Royne": p. 9-13. Concerns the civil war in France and the solicitations of the Prince of Condé for aid. Lelong, Bibliothèque historique de la France, v. 2, p. 403, no. 20345. Scanner's note: No copyright page found. No table-of-contents pages found.   Title and cover page are combined."""
