title = "Proces verbal de l'execution des arrests de la Cour de Parlement, donnez és années mil cinq cens quarante & soixante & six, faite à la requeste des escheuins des villes d'Orleans, Nantes, Gien & Neuers: prenans la cause pour leurs deleguez, pour le fait des marchands frequentans la riuiere de Loire: ensemble des nouueaux deleguez des villes de Rouane, Chinon & Pont de Scé."
language = "fr"
date = "1567"
note = """Caption title. Dated September 2, 1567, and signed: F. Thomas. "Edicts des roys Charles, Louys, & autres roys de France, pour les marchands frequentans la riuiere de Loire & autres fleuues descendans en icelle, par lesquels il est defendu à toutes personnes tenans peages depuis soixante ans auparauant iceux edicts, de ne les plus leuer, sur peine d'estre punis": p. 39-96. Scanner's note: Cover and Title page are combined. Uneven, damaged binding. Damaged, stained and/or loose pages. Skewed text."""
