date = "1772"
note = """Prospectus for Jean Sauri's "Cours complet de mathématiques.". Caption title. "Permis d'imprimer, le 15 novembre 1772"--P. 8. "Les souscriptions seront ouvertes seulement depuis le mois de décembre jusqu'à la fin de mars 1773 inclusivement"--P. 6. "On souscrit dans les différentes villes ci-après: a Paris, chez la veuve Desaint, rue du Foin, Saillant & Nyon, rue S. Jean de Beauvais, Molini, rue de la Harpe, Valade, rue S. Jacques; a La Haye, chez Gosse junior & Daniel Pinet; a Amsterdam, chez Changuion; a Maëstricht, chez Dufour; a Londres, chez M. Nourse, libraire du roi, & chez P. Molini; a Rome, chez Bouchar & Gravier; a Naples, chez Dominique Terres; a Venise, chez Pascoli; a Florence, chez Joseph Molini; a Bologne en Italie, chez les freres Taruffi; a Turin & à Milan, chez les freres Reicends; a S. Petersbourg, chez M. Weitbrech; a Vienne, chez M. Jean-Thomas Noble de Trattnern; a Berlin, chez M. Spener; a Bruxelles, chez Flon; a Lausanne, chez Grasset; a Lyon, chez les freres Perisse; a Bordeaux, chez les freres Labottiere; a Rouen, chez la veuve Besogne; a Strasbourg, chez Godefroy, Bawers & comp.; a Toulouse, chez Sens; a La Rochelle, chez Pavie; a Poitiers, chez Chevrié; a Nîmes, chez Gaude; a Rheims, chez Casin; a Nantes, chez la veuve Vatar; a Rennes, chez Blouet"--P. 8. "Le prix de la souscription sera de 24 liv. pour les cinq volumes in-8°. brochés ou en feuilles; elle sera de 36 livres pour le format in-4°. broché ou en feuilles"--P. 5. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/prospectusdun00saur"
