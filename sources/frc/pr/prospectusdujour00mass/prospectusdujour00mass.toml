note = """"Le prix sera toujours le même, 16 liv. pour Paris et 20 liv. 4 s. pour la province. On ne souscrira que pour l'année entiere ... Il sera imprimé à l'Imprimerie des sourds et muets ... On s'adressera, pour souscrire, à M. Masset, économe de cet établissement, dans l'ancienne maision claustrale des célestins, près l'Arsenal"--P. vj. Title vignette. "Bureau du Journal des savans, établi en 1665": p. vij-viij. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined.  Text extends off of the edge of the page.  Text lost in binding."""
