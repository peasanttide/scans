note = """Prospectus for "Journal d'État et du citoyen," published in 1789. Caption title. Printer statement from colophon. Printed on light blue paper. "Ce journal sera composé d'une feuille in-8°. par semaine; elle paroîtra tous les jeudis. Le prix de la souscription pour un mois sera de 2 liv. 8 sols pour Paris & de 3 liv. pour la province, franc de port par la poste. L'abonnement ne pourra être moins de trois mois"--P. [1]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Only one numbered page.  Tight margins. <br /><br />."""
