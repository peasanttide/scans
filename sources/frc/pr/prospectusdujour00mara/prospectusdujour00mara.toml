date = "1789"
note = """Prospectus for "Journal de la ville," which was first published in 1789. Caption title. "Il aura trente numéros par mois, composés chacun de 8 pages d'impression. Le prix de la souscription, pour un mois, est de six liv. pour Paris, & de sept pour la province, franc de port par la poste"--P. [1]. Tourneux, M. Paris pendant la Révolution française. Includes bookseller's advertisement for a supplement, never published, to an edition of the works of Voltaire. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Only one numbered page.<br /><br />."""
