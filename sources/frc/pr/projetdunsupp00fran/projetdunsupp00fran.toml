language = "fr"
place = "A Paris"
date = "1730"
note = """Prospectus for a supplement to "Sacrosancta concilia ad legiam editionem exacta," Philippe Labbe and Gabriel Cossart's compilation of the councils of the Catholic Church. Proposed edition never published? Caption title. Also published in Latin under title: Monitum de supplemento Collectionis Labbeanae conciliorum. Head-piece. "On imprimera ce supplément de même forme, grandeur & caractère que les Conciles du P. Labbe, & on n'en tirera qu'un petit nombre d'exemplaires, sur le prix desquels on accordera un benefice à ceux qui en retiendront par avance. On n'en imprimera aucun en grand papier que pour ceux qui les demanderont"--P. 2. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
