note = """Probably a prospectus for Toulongeon's "Histoire de France depuis la révolution de 1789", published 1801-1810. Caption title. "Le prix de la souscription sera, ou total de 30 francs, ou partiel de 6 francs, pour les quatre premières livraisons formant un volume in-4° d'environ 400 pages. On souscrira chez le cen. Laroche, notaire, rue des Petits-Champs, no. 1280, près le Palais-Egalité"--P. 7. Ms. annotations. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
