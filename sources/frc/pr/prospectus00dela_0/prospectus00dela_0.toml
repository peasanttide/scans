note = """Prospectus for J.J. Ernst's "Papillons d'Europe, peints d'après nature.". Caption title. "A Paris, chez P.M. Delaguette, imprimeur-libraire, rue de la Vieille-Draperie, Ernst & Gerardin, auteurs, rue de la Harpe, à l'ancien Collège de Narbonne, Bazan & Poignant, marchands d'estampes, rue & hôtel Serpente"--P. 4. Printer and date of publication from colophon. "L'ouvrage sera distribué par cayers ou volumes ... composé de 12 planches & de leurs descriptions. Il paroîtra un cayer tous les trois mois; le premier paroîtra dans le courant de février 1779; la totalité de l'ouvrage composera huit à neuf cayers; chaque cayer se paiera 18 liv."--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
