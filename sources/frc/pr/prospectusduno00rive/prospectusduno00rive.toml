type = "pamphlet"
title = "Prospectus d'un ouvrage proposé par souscription par M. l'abbé Rive"
language = "fr"
place = "Paris"
date = "1782"
note = """Prospectus for Rive's "Essai sur l'art de vérifier l'âge des miniatures peintes dans des manuscrits depuis le XIVe jusqu'au XVIIe siècle inclusivement", never completed with 26 plates published in 1782. "Permis d'imprimer. A Paris, 11 juin 1782"--P. [1] at end. "On souscrira chez moi, rue du Cherche-Midi, vis-à-vis celle du Regard, maison de M. le médecin Coste ... On souscrira encore chez Esprit, libraire au Palais-Royal"--P. 23. "Je ne tirerai que quatre-vingts exemplaires de mon recueil. Son prix sera, pour les souscripteurs, de 25 louis, & de 40 pour ceux qui n'auront pas souscrit"--P. 19. Signatures: A-C¹². Tail-piece. Half bound marbled papers over boards, red leather; marbled endpapers; gold stamped spine title: Prospectus par l'abbé Rive. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/prospectusduno00rive"
subject = [
    "Rive, Jean-Joseph, 1730-1791",
    "Booksellers and bookselling",
]

