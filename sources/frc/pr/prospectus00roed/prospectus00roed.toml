note = """Prospectus for "Journal d'économie publique, de morale, et de politique," which began publication in 1796. Caption title. Printer statement from colophon. "A compter du 10 fructidor prochain, il paroîtra tous les dix jours un numéro de ce journal"--P. 2. "On s'abonne pour trois mois, six mois & un an, à raison de 24 liv. par an pour Paris, & de 27 liv. pour les départemens. On reçoit les abonnemens au bureau du Journal de Paris, rue J.-J. Rousseau, n°. 14"--P. 2. Ms. annotations. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.   No numbered pages.<br /><br />."""
