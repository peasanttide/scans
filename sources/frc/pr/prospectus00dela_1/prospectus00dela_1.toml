note = """Prospectus for "Les trois fabulistes, Ésope, Phèdre et La Fontaine", published in 1796. Caption title. "On souscrit à Paris chez Delance, successeur de Desaint, imprimeur, rue de la Harpe, n°. 133. La souscription est ouverte dès-à-présent, et sera fermée irrévocablement le 30 vendemiaire, an troisième de la République [21 October 1794]"--P. [1]. "On payera pour chaque exemplaire en 4 vol. in-8°, beau papier, 200 livres. Il sera ... 100 exemplaires in-4°, papier-vélin, dont la souscription est fixée à 2000 livres."--P. 2. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
