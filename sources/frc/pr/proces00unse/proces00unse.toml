#:schema ../../../../schemas/source.json
layer = "source"
id = "proces00unse"
type = "book"
title = "Procès-verbaux et rapports des autorités civiles et militaires, sur les événemens arrivés dans la commune à'Avignon [sic], dans les journées des 24, 25, 26, 27, 28, 29 et 30 pluviôse dernier."
language = "fr"
place = "A Avignon"
date = "1797"
note = "Rapport du général de brigade Tisson, fait au genéral divisionnaire Willot, sur les évenemens qui ont eu lieu à Avignon, dans les journées des 24, 25, 26, et 27 du mois de pluviôse, an cinquieme de la République française -- Post-scriptum -- Rapport général du chef de brigade Glanjuad, commandant la place d'Avignon en état de siége sur les événemens des derniers jours de pluviose, an cinqueme de la République française, au général de brigade Tisson, commandant le département de Vaucluse -- Rapport du caporal, commandant le poste du bateau, du 26 pluviôse, an cinquieme de la République -- Rapport du capitaine Champagnet, commandant le fort du Palais, du 26 pluviôse, an cinquieme de la République -- Rapport de l'officier de patrouille des grenadiers, du 26 pluviôse, an cinquieme de la République -- Rapport du commandant du poste de la maison commune, du 26 pluviôse, an cinquieme de la République -- Rapport du citoyen Varinot, adjudant de la place d'Avignon, du 26 pluviôse, an cinquieme de la République -- Rapport du citoyen Dupeyron, lieutenant commandé pour renforcer le poste de l'attelier d'armes, du 26 pluviôse, an cinquieme de la République -- Rapport du citoyen Alexandre Lafond, caporal du poste de l'attelier d'armes, relativement à l'enlevement des armes, du 26 pluviôse, an cinquieme de la République -- Rapport du commandant du fort du Palais d'Avignon, dyu 29 au 29 pluviôse, an cinquieme de la République -- L'administration municipale du canton et commune d'Avignon, département de Vaucluse, au ministre de la police générale -- Procès-verbal des séances de l'administration centrale du département de Vaucluse, des 26, 27, 28, 29 et 30 pluviôse, an cinquieme de la République française. Imprint from colophon. Not in Martin & Walter. Révolution française. Erratum at end. Scanner's note: No copyright found.  No table of contents found. Title on cover. Damaged, stained pages and cover. <br />."
url = "https://archive.org/details/proces00unse"
subject = ["Riots"]
extent = "57 p. ; 21 cm."

