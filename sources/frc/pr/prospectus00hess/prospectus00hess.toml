note = """Probably a prospectus for Robert de Hesseln's "Nouvelle topographie, ou, Description détaillée de la France". "On souscrit au Bureau topographique, cour des Prémontrés, rue Haute-Feuille.". Printer's monogram device on t.p. "Les souscripteurs payeront 3 liv. 12 sols pour chaque carte ou plan topographique, accompagné du discours in folio ... Ceux qui n'auront pas souscrit paieront 6 liv. pour chacun des plans ou cartes, accompagné du discours explicatif"--P. [4]. Plan général de la Nouvelle topographie, ou, Description détaillée de la France -- Conditions -- Modèle de souscription -- Avis intéressant. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
