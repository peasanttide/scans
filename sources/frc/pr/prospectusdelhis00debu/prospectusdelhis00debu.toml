note = """Prospectus for the third edition of Dézallier d'Argenville's "La conchyliologie, ou, Histoire naturelle des coquilles de mer, d'eau douce, terrestres et fossiles.". Caption title. "Troisieme édition, considérablement augmentée de descriptions et de figures en taille-douce ... par Mrs de Favanne pere et fils: 2 vol. in-4°, grand papier, proposés par souscription. A Paris, chez Debure pere, quai des Augustins. M.DCC.LXXII."--P. [1]. Imprint from colophon. Head- and tail-pieces. Includes prices. "Liste des planches de cette IIIe édition" on last page. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text.  Title page and cover are combined."""
