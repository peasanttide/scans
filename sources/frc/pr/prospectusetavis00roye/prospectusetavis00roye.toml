note = """Prospectus for an edition of the collected works of Voltaire. Caption title. "Cette edition ... formera 22 vol. in-8. ... Le terme de la souscription qui est actuellement ouverte à Paris chez M. Royez, libraire, quai & près des Augustins, & en Europe chez les principaux libraires, ne sera prorogé, pour Paris, que jusqu'au quinze avril de l'année 1789"--P. 3. Printed in double columns. "Le prix de la collection entière sera de 99 liv. broch."--P. 3. Includes advertisements for other titles sold by Royez. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
