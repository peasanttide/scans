note = "Caption title. Imprint from colophon. At foot of p.[1]: Séance permanente, 10 août. Includes a decree inviting the formation of the Convention nationale; and also declaring the king provisionally suspended from his functions. Martin & Walter IV 2: 2108 [edition 3: last line on p.[1] ends: ... & déte-; line 2 on p.26 ends: ... à M.; line 7 on p.2 ends: ... une dépu-]. Scanner's note: No copyright page found. No table-of-contents pages found.   Title page and cover are combined. Skewed text. Uneven binding. Damaged, loose, stained pages."
