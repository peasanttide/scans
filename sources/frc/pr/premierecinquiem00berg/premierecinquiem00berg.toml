#:schema ../../../../schemas/source.json
layer = "source"
id = "premierecinquiem00berg"
type = "pamphlet"
title = "Premiere [-cinquième et dernier] des cinq projets de résolutions, sur trois lectures, présentés par Bergier (du Puy-de-Dôme), au nom d'une commission spéciale, composée des représentans Bezard, Roemers & Bergier, à la suite d'un rapport général, pour l'interprétation & l'intelligence des lois des 5 brumaire & 17 nivose an 2, 18 pluviose an 5, & autres relatives à la transmission des biens par donation, testament & succession."
language = "fr"
place = "A Paris"
date = "1799"
note = "Caption title. Imprint from colophon. Session date, 1er-4e: 13 ventose an 7. Session date, 5e: 19 ventose an 7. Martin & Walter. Révolution française. 1er. L'objet spécial de ce projet est de déterminer l'ordre intermédiaire de succeder ab intestat, d'après lequel ont dû être recueillies & partagées les successions ouvertes dans l'intervalle de la publica- de la loi du 5 brumaire an 2, à la publication de celle du 17 nivose même année -- 2nd. L'objet spécial de ce projet est d'indiquer les dispositions rétroactives des articles XXIII & XXIV de la loi du 17 nivose & de l'article III de celle du 9 fructidor an 2, qui doivent rester sans effet, & comme non avenues -- 3e. Ce projet a pour object spécial l'interprétation des articles LXIX, LXXII, LXXVI, LXXVII, LXXXII & LXXXVI de la loi du 17 nivose, relatifs à l'ordre de successibilité ab intestat & quelques dispositions, 1o. sur le retour en faveur des donateurs survivans aux donataires, 20. sur la successibilité des enfans naturels -- 4e. L'objet spécial de ce projet est d'interpréter les articles IX, XIV, XVI, LVII, et LXI de la même loi du 17 nivose, et de remplir les lacunes de cette loi, 1o. sur la capacité et l'âge requis pour disposer valablement de ses biens à titre gratuit, par actes entre-vifs ou à cause de mort, 2o. sur les formes dans lesquelles les actes de disposition doivent être faits, 3o. sur la disponibilité des biens depuis la loi du 17 nivose, 4o. sur l'application et les résultats du principe d'égalité entre successibles -- 5e. L'objet spécial de ce projet est de développer les résultats des articles premier, II, IV & XIII de la loi du 18 pluviose an 5, de régler l'application des réserves faites par les donateurs & auteurs d'institutions contractuelles, & de déterminer les modifications & le sort des avantages statutaires & conventionnels entre époux. Bibliography: Martin & Walter.  Révolution française,  I, 2729. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained pages. Loose pages.  Skewed text."
url = "https://archive.org/details/premierecinquiem00berg"
subject = [
    "Inheritance and succession",
    "Gifts causa mortis",
    "Living trusts",
]
extent = "5 v. ; 20 cm."

