note = """Prospectus for Auguste Louis Rossel de Cercy's "Collection de dix-huit combats de mer". Caption title. "On souscrit à Paris, chez Mérigot le jeune, libraire, quai des Augustins, au coin de la rue Pavée, n° 38"--P. [2]. Imprint from colophon. "Permis d'imprimer, le 22 janvier 1789"--P. [2]. "Il paroîtra chaque année, à dater du mois de mai 1790, deux estampes, dont le prix sera de 36 livres pour les souscripteurs seulement ... ; chacune sera de 24 livres pour les personnes qui n'auront pas souscrit"--P. [1]-[2]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
