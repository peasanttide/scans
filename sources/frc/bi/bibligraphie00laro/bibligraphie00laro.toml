note = """Prospectus for an encyclopedia edited by Charles de Pougens that was never published. Cf. Pougens, C. de. Mémoires et souvenirs, p. 135. Caption title. Imprint from colophon. "Permis d'imprimer & distribuer. A Lyon, ce 1er. février 1780"--P.[2]. "Addresser les paquets à M. le chevalier de Pougens, de l'Institut de Bologne, & de plusieurs académies, à Paris. A Lyon, à MM. Desalasc, Audembron, & Jossinet, négociants."--P. [2]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
