date = "1775"
note = """Prospectus for Joseph-Bathélemy-François Carrère's "Bibliotheque littéraire, historique et critique de la médecine ancienne et moderne.". Caption title. "On souscrit chez Ruault, libraire, rue de la Harpe. Et chez M. Robillart, négociant, rue Bourg-l'Abbé, près de la rue aux Ours, à Paris"--P. 3. Printer statement from colophon. "Permis d'imprimer ce 25 mai 1775"--P. 3. "Le prix de chaque volume broché sera de sept livres pour les souscripteurs, & de dix livres pour ceux qui n'auront pas souscrit"--P. 3. Laid in: Form letter from Ruault and Robillart soliciting biographical and bibliographical information from Michel Adanson for inclusion in the proposed work. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
