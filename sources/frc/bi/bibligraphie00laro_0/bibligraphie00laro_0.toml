#:schema ../../../../schemas/source.json
layer = "source"
id = "bibligraphie00laro_0"
type = "pamphlet"
title = "Bibliographie encyclopédique, ou, Dictionnaire raisonné et analytique des ouvrages intérressants, imprimés ou manuscrits, dans toutes les langues et dans tous les genres, depuis le commencement des siecles jusqu'à nos jours"
language = "fr"
place = "A Lyon"
date = "1780"
note = """Prospectus for an encyclopedia edited by Charles de Pougens that was never published. Cf. Pougens, C. de. Mémoires et souvenirs, p. 135. "Cette collection contiendra environ soixante & douze volumes in-4° au plus ... Chaque volume coûtera douze livres en feuilles ... Les premiers volumes de chaque division paroîtront à la fois dans le courant de décembre 1781, & l'on déliverera un volume de chaque division tous les huit mois"--P. 16. "On sera le maître de s'adresser à M. Mariette, chargé spécialement de recevoir les souscriptions, chez M. Regnault, notaire, rue des Fossés Mont-Martre, près la place des Victoires à Paris"--P. 16. Title vignette; head- and tail-pieces. Includes blank subscription form. Discours préliminaire des éditeurs -- Table sommaire des divisions -- Invitation aux savants, aux gens de lettres et aux artistes -- Conditions de la souscription. Ms. annotations. Laid in: Letter to Charles de Pougens, dated 17 mars 1780 and signed in ms: [Adanson?]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/bibligraphie00laro_0"
subject = [
    "Bibliographie encyclopédique",
    "Booksellers and bookselling",
    "Encyclopedias and dictionaries",
]

