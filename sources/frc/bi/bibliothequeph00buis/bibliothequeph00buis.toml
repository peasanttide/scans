note = """Prospectus for "Bibliotheque physico-économique, instructive et amusante.". Caption title. "On insérera dans les années suivantes les articles utiles & nouveaux, qu'on voudra bien adresser, franc de port, à Paris, à M. Buisson, hôtel de Mesgrigny, rue des Poitevins, no. 13, à qui l'on s'adresse aussi pour se procurer cet ouvrage"--P. [2]. "Permis d'imprimer, ce 6 décembre 1784"--P. [2]. "Ouvrage à la portée de tout le monde. Prix, 2 liv. 12 sols chaque volume broché, franc par la poste"--P. [1]. Scanner's note: Tight margins.<br />No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No numbered pages. <br /><br /><br />."""
