note = "Half title. Imprint from colophon. A collection of articles, each separately paged. See contents note. Martin & Walter IV 2: 6881 (incomplete copy). 21 mai 1771. Réfutation des observations sur l'écrit intitulé Protestation des princes, par Ling.... -- 31 décembre 1772. Opinion sur les lettres des 6 et 28 décembre 1772 -- Le patriote parisien -- Appréciation de la journée du 12 novembre 1774, appologétique a Son Altesse Sérénissime Monseigneur le Prince de Conti -- 5 octobre 1776. Essai de l'opinion publique depuis le 12 mai 1774 -- 23 juin 1788. Voeu national françois, contenant les motifs de réclamations, les causes & moyens d'oppositions, ainsi que les principes de protestations -- Adresse. P... A... -- Doléances du 6 avril 1789 ... -- Réponse nationale au discours prononcé par le roi ... le 5 mai 1789. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding. Irregular pagination."
