note = """Signed: Par le chevalier de Mopinot, ingénieur à la suite des armées, & lieutenant-colonel au régiment Dauphin, cavalerie. "Ce discours est extrait d'un ouvrage manuscrit en deux volumes in-folio, ayant pour titre, Les dangers du rang suprême, que l'auteur se propose de donner à la bibliothèque du roi pour y servir à l'éducation des princes destinés à regner"--P. 22. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 25109. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
