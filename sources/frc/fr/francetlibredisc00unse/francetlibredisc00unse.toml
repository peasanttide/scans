title = "Franc Et Libre Discovrs Faict A Monsievr Le Prince : sur les deriers poincts de sa Declaration."
language = "fr"
place = "A Paris"
date = "1615"
note = """Signatures: A⁴. Lindsay and Neu. French pol. pam. Printer's device on title page. Head-piece; initial. This is a criticism of Conde's "Manifeste" in which he asserts his authority against the Monarch. The "Discovrs" suggests reconciliation and negation of his point of view. André, Les sources de l'histoire de France, part III, v. 4, p. 113, no. 2225. Scanner's note: No copyright page found. No table-of-contents pages found.  Cover and Title page are combined.  Uneven binding.  Skewed text.  Damaged, stained, marked, torn and/or loose pages."""
