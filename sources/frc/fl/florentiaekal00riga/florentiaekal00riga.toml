note = """Prospectus for a collection of correspondence of several 15th century intellectuals, edited from manuscripts held in Florence. Caption title. "Illis vero, qui nobiscum societatem non inibunt, sex Julii pro unoquoque volumine, exsolvendi erunt, idemque solvere debebunt ii, qui etsi nomen suum huic operi subscripserint, volumen tamen, quod passim prodierit, duobus saltem mensibus post editionem non acceperint, accipiendumve curaverint"--P. [2]. Inscription: Monsieur bibliothequaire de Sorbonne. [Cl?] Paris. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
