type = "pamphlet"
title = "Jugement rendu par le tribunal criminel du département de Vaucluse, séant a Avignon, qui condamne Jean-Baptiste Veyrier, natif de Valréas, habitant à Carpentras, âgé de cinquante-quatre ans, accusé d'avoir vendu plus cher en assignat qu'avec des écus, à six ans de fer conformément à l'article de la loi du 11 avril 1790 (vieux style) article II, le condamne en outre a être exposé pendant six-heurs aux regards du peuple attaché à un poteau sur la place publique d'Orange, & être mis sur la tête un écriteau ou seront inscrit ses noms, sa profession, son domicile, la cause de sa condamnation conformément à l'article XXVIII titre I du code pénal"
language = "fr"
place = "Avignon"
date = "1794"
note = """Caption title. Signed: Fouque, président. Ducros, greffier. Imprint from colophon. "Fait à Avignon ce dix-sept floréal, l'an deux de la République française ... "--P. 4. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
url = "https://archive.org/details/jugementrendupar00vauc_4"
