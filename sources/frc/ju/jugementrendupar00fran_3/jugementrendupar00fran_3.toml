#:schema ../../../../schemas/source.json
layer = "source"
id = "jugementrendupar00fran_3"
type = "pamphlet"
title = """Jugement rendu par le Tribunal revolutionnaire, établi par la loi du 10 mars 1793, séant à Paris, au Palais, qui, sur la déclaration du juré de jugement, portant, "Qu'il est constant qu'il a été pratiqué des machinations et entretenu des intelligences avec les ennemis de l'État et leurs agens, pour les engager à commettre des hostilités, leur indiquer et favoriser les moyens de les entreprendre, et diriger contre la France, notamment en faisant à l'étranger, sous des prétextes préparés, divers voyages pour concerter ces plans hostiles avec ces ennemis, en leur fournissant à eux ou à leurs agens, de secours en argent, que Louis-Marguerite-Bernard Escourt, ancien captain de cavalerie, et actuellement pensionné de la nation, est convaincu d'être le complice de ces machinations et intelligences," condamne Louis-Marguerite-Bernard Escourt à la peine de mort, conformément à l'article premier de la première section du titre premier de la seconde partie du code pénal : du 21 frimaire, l'an deuxième de la République française, une et indivisible"""
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. Signed: Herman, président. N.J. Fabricius, greffier. Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
url = "https://archive.org/details/jugementrendupar00fran_3"
subject = [
    "Escourt, Louis-Marguerite-Bernard",
    "Conspiracies",
    "Political crimes and offenses",
    "Capital punishment",
]
extent = "7 p. ; 26 cm."

