type = "book"
title = """Jugement rendu par le Tribunal criminel-revolutionnaire, etabli par la loi du 10 mars 1793, séant à Paris, au Palais, qui, sur la déclaration du juré de jugement, portant "Qu'il est constant, 1o. qu'il existé une conspiration contre l'unité et l'indivisibilité de la République, contre la liberté et la sûreté du peuple français, 2o. qui Jean-Pierre Brissot, Pierre-Victurnien Vergniaud, Arnaud Gensonné, Claude-Romain-Lauze Duperret, Jean-Louis Carra, François-Martin Gardien, Eléonor-Dufriche Valazé, Jean Duprat, Charles-Alexis Brulard-Sillery, Claude Fauchet, Jean-François Ducos, Jean-Baptiste Boyer-Fonfrede, Marc-David-Albin Lasource, Benoît Lesterpt-Beauvais, Gaspard-Severin Duchastel, Pierre Mainvielle, Jacques Lacaze, Pierre Lehardy, Jacques Boileau, Charles-Louis Antiboul, et Louis-François-Sébastien Vigée, sont convaincus d'être les auteurs ou les complices de cet conspiration," condamne lesdits Brissot, Vergniaud, Gensonné, Duperret, Carra, Gardien, Dufriche-Valazé, Duprat, Brulard-Sillery, Fauchet, Ducos, Boyer-Fonfrede, Lasource, Lesterpt-Beauvais, Duchastel, Mainvielle, Lacaze, Lehardy, Boileau, Antiboul et Vigée a�"""
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. At head of title: Republique française une et indivisible. Signed: Herman, président. N.J. Fabricius, greffier. Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter. Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages. Some faint text."
url = "https://archive.org/details/jugementrendupar00fran_2"
subject = [
