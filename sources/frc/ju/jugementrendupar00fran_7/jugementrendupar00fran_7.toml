id = "jugementrendupar00fran_7"
type = "pamphlet"
title = "Jugement rendu par le Tribunal révolutionnaire, établi a Paris, par la loi du 10 mars 1793, séant au Palais de justice, à Paris, qui, sur la déclaration du juré de jugement, portant, qu'il est constant que dans la commune de Luzy, district de Moulins-la-République, département de la Nièvre, il a été tenu des propos tendans à favoriser l'entrée des ennemis sur le territoire français, à ébranler la fidélité des citoyens de ladite commune envers la République, à provoquer le meurtre des habitans de Paris, à dissoudre la représentation nationale, et à rétablir la royauté en France, que Denis Repoux Chevagny est convaincu d'avoir tenu lesdits propos, condamne ledit Repoux Chevagny à la peine de mort, conformément à l'article IV de la première section du titre premier de la deuxième partie du code pénal : du 14 floréal, an deuxième de la République, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = "Caption title. At head of title: La liberté ou la mort. Signed: Herman, président; N.J. Fabricius, greffier. Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, IV:2, 8019. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
