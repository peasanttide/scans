id = "jugementrendupar00fran_11"
type = "pamphlet"
title = "Jugement rendu par le Tribunal révolutionnaire, établi à Paris, qui ordonne que Charles-Nicolas Leleu, âgé de quarante ans, né à Vitry-sur-Marne, perruquier, et membre du conseil-général de la commune, demeurant à Paris, rue Dominique, fauxbourg Germain, numéro 1535, Léopld Nicolas, imprimeur et juré du Tribunal révolutionnaire, âgé de 37 ans, né à Mirecourt, département des Voges, demurant à Paris, rue Honoré, no. 355, Jean-François Lechenard ... tous déclarés traîtres à la patrie, par décret du 9 thermidor, seront livrés à l'exécuteur des jugemens criminels, pour leur faire subir la peine de mort, infligée à tous traîtres à la République, et ce, sur la place publique de la Révolutionnaire de cette ville : du douze thermidor, heure de midi, l'an 2e. de la République française, une, indivisible et impérissable"
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. At head of title: (37). Signed: Scellier, vice-président, et Woff, commis-greffier. Imprint from colophon. Martin & Walter. Révolution française. Contains judgments for Charles-Nicolas Leleu, Léopold Nicolas, Jean-François Lechenard, François Tortot, Pierre-François Quesniard, Pierre Cietty, Jean-Etienne Lahure, François-René Camus, Pierre-Eutrope Gillet-Maire, Antoine Frery, Jean-Jacques Arthur, Jean-Baptiste Grillet. Bibliography: Martin & Walter.  Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages.  Faint text."
url = "https://archive.org/details/jugementrendupar00fran_11"
subject = [
    "Traitors",
    "Political crimes and offenses",
    "Capital punishment",
]
extent = "7 p. ; 26 cm."

