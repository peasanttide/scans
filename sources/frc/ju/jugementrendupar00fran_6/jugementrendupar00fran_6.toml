type = "pamphlet"
title = "Jugement rendu par le Tribunal révolutionnaire établi à Paris, par la loi du 10 mars 1793, séant au Palais de justice à Paris, qui, sur la déclaration du juré du jugement, portant, qu'il est constant qu'il a existé un complot contre la liberté, la sûreté, la souverainete du peuple, contre l'unité et l'indivisibilité de la République, que Louis-Joseph-Ignace Chalmeton, Jacques Rabault, François-Joseph Mouthon, Jeun-Antoine Poulet, Claude-Antoine Bernard et Guillaume Nogaret, sont convaincus d'être complices de ce complot, condamne lesdits Chalmeton, Rabault, Mouthon, Poulet, Bernard et Nogaret à la peine de mort, conformément aux dispositions de la loi du 16 décembre 1792 : du 12 floréal, l'an 2e. de la République française, une et indivisible"
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. Signed: Dumas, président. J.C. L'Ecrivain, greffier. Imprint from colophon. Martin & Walter. Révolution française. Stamp: Tribunal revolutionnaire. La loi du 10 mars 1793. Bibliography: Martin & Walter.  Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
