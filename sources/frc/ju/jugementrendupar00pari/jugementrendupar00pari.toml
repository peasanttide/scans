#:schema ../../../../schemas/source.json
layer = "source"
id = "jugementrendupar00pari"
type = "pamphlet"
title = "Jugement rendu par M. Lenoir, conseiller d'état, lieutenant général de police, commissaire du conseil en cette partie, qui ordonne l'exécution des arrêts & réglemens, concernans la librairie & l'imprimerie, & notamment des articles CI & CIX de l'arrêt du Conseil d'Etat du roi, du 28 fé́vrier 1723, ensemble des lettres de priviléges accordées par Sa Majesté, les 19 février 1750, 30 décembre 1761, 11 juillet 1764, 25 avril 1770 & 10 avril 1771, soit au sieur Desaint, libraire à Paris, soit à d'autres imprimeurs ou libraires, qui ont cédé leurs droits audit sieur Desaint ou à la veuve Desaint, pour l'impression ou la réimpression de l'Imitation de Jesus-Christ traduite, avec des réflexions, par le pere Gonelieu, de l'Histoire de France par M. l'abbé Velly, des Sermons de M. l'abbé Clément, des Conférences du diocèse d'Angers & des Œuvres de M. l'abbé de La Caille, & celles accordées le 28 juin 1770, au sieur Cellot, pour l'impression de l'Histoire des variations des eglises protestantes, par M. Bossuet .."
language = "fr"
place = "A Paris"
date = "1777"
note = "Caption title. Imprint from colophon. Head-piece. Orders the seizure of materials from and fines for booksellers and printers, namely Barret, alleged to have pirated books whose copyright was held by the Desaints and Cellot. Includes judgements against several other Parisian printers. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."
url = "https://archive.org/details/jugementrendupar00pari"
subject = [
    "Desaint, Nicolas, 1731?-1771",
    "Desaint, Catherine-Michelle, fl. 1771-1808",
    "Cellot, Louis, fl. 1756-1788?",
    "Barret, Jean-Marie, 1731-1786",
    "Printing industry",
    "Printers",
    "Books",
]

