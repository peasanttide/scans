title = """Jugement rendu par le Tribunal révolutionnaire, établi par la loi du 10 mars 1793, séant à Paris, au Palais, qui sur la déclaration du juré de jugement, portant, "Qu'il a existé une conspiration tendante à rétablir la monarchie, à détruire la représentation nationale et le gouvernement républicain, que Lacroix, Danton, Herault, Philippeaux, Westerman, et Camille-Desmoulins, sont convaincus d'avoir trempé dans cette conspiration, qu'il a existé une conspiration tendante à diffamer, à avilir la représentation nationale, et à détruire, par la corruption, le gouvernement républicain, que Fabre, Chabot, Delaunay, sont convaincus d'avoir trafiqués de leurs opinions, comme représentans du peuple, que Bazire et complice desdits Delaunay et Chabot, en ayant gardé le silence, soit sur les révélations qui lui ont été faites de leurs manœuvres criminelles,  soit sur les propositions intéressées qui lui ont été faites, que D'Espagnac, Junius et Emmanuel Frey, Gusman et Diderischen, sont convaincus d'avoir trempé dans cette conspiration, que Lullier n'est pas convaincu d'avoir tremṕ dans cette conspiration," condamne l"""
