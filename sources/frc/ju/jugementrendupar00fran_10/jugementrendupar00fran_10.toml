title = "Jugement rendu par le Tribunal révolutionnaire, établi a Paris, qui ordonne que Ponce Tanchon, Marc-Louis Desvieux, François-Auguste Paff, Jacques-Mathurin Lelièvre, Louis-François Dorigny, Pierre-Alexandre Louvet, Jean-Jacques Lubin, Jacques-Pierre Coru, Pierre-Simon-Joseph Jault, Jean-Baptiste Bergot, Jacques-Nicolas Lumière, Jan Paquote, Jacques-Simon Blin, Marie-François Langlois, Jean-Nicolas Langlois, Jean-Pierre Eude, Pierre-Léon l'admiral, Pierre-Jacques Legrand, Pierre Haëner, Martial Gamory, André Marce, Charles-Huaut Desboisseaux, Jean-Baptiste Charigny, Jacques Moyne, Joseph Ravel, Jacques Morel, Claude Besnard, Pierre-François Devaux, Joseph Alavoine, François-Laurent Chatelin, Jacques-Louis Cresson, Jean-Claude Giardin, Denis Dumoutiers, Piere Dumez, Edme-Marguerite Lauvain, déclarés traîtres à la patrie, par décret du 9 thermidor, seront livrés à l'exécuteur des jugemens criminels, pour leur faire subir la piene de mort infligée à tout traître à la République, et ce, sans délai, sur la place publique de la Révolution de cette ville : du 11 thermidor, l'an deuxième de la République française, une, i"
