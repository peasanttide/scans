#:schema ../../../../schemas/source.json
layer = "source"
id = "jugementrendupar00vauc_5"
type = "pamphlet"
title = "Jugement rendu par le tribunal criminel du département de Vaucluse, séant a Avignon, qui aquitte Louis Dioulefet de la commune de Cavaillon, âgé de cinquante-un an, de l'accusation portée contre lui pour crime d'accaparement & ordonne qui sera mis en liberté : charge l'accusateur public de le dénoncer au tribunal de la police correctionnelle de Cavaillon, pour avoir négligé l'exécution de la loi du vingt-neuf mars, relative à l'inscription à placer sur la porte des maisons portant les noms des habitans, le charge en outre de poursuivre le nommé Sauvaire, marchand de cuir de la commune d'Aiguiere, prévenu d'être l'auteur de l'accaparemens dont été accusé Louis Dioulefet"
language = "fr"
place = "A Avignon"
date = "1794"
note = """Caption title. Signed: Fouque, président. Ducros, greffier. Imprint from colophon. "Fait à Avignon le dix-huit floréal, l'an deux de la République française ... "--P. 5. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
url = "https://archive.org/details/jugementrendupar00vauc_5"
subject = [
    "Dioulefet, Louis",
    "Monopolies",
    "Acquittals",
]
extent = "6 p. ; 27 cm."

