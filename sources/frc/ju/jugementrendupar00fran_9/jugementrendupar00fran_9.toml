#:schema ../../../../schemas/source.json
layer = "source"
id = "jugementrendupar00fran_9"
type = "pamphlet"
title = "Jugement rendu par le Tribunal révolutionnaire, établi à Paris, qui ordonne que Bertrand Armant, lecteur-secrétaire, membre du conseil-général de la commune, Jean-Baptiste-Crespin Taillebot, officier-municipal, Gervais Beaudouin, compagnon jouaillier, Prosper Sijas, commis à l'administration de la régie, Pierre Remy, tablettier, administrateur de police, Claude-Antoine Deltroit, officier-municipal, et membre de l'état civil ... déclarés traitres à la patrie par décret du 9 thermidor, seront livrés à l'exécuteur des jugemens criminels pour leur faire subir la peine de mort infligée à tous traîtres à la République, et ce sans délai, sur la place publique de la révolution de cette ville : du 11 thermidor, l'an 2 de la République française, une et indivisible"
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. At head of title: No. 35. Signed: Scellier, vice-président. Volff, commis-greffier. Imprint from colophon. Martin & Walter. Révolution française. Contains judgments for Bertrand Armant, Jean-Baptiste-Crespin Thaillebot, Gervais Beaudouin, Prosper Sijas, Pierre Remy, Claude-Antoine Deltroit, Jean-Guillaume-François Vaucanu, Claude Bigant, Jean-Charles-Pierre Lesire, Jean-Baptiste-Emmanuel Legendre, Jean-Philippe-Victor Charlemagne, Pierre-Nicolas Delacour, Augustin-Germain Jobert, Pierre-Louis Paris, Claude Jonquoy, René-Toussaint Daubancourt, Jean-Baptiste Vincent, Martin Wichterich, Pierre-Henry, Jean Cazenard, Jean-Louis Gibert, Pierre Giraud, François Pelletier, Nicolas Jérôme, Jean-Baptiste Cochois, Jean-Léonard Farrot, René Grenard, Jacques Lasnier, André Mercier, Jean-Pierre Bernard, Etienne-Antoine Souars, Dominique Mettot, Louis-Joseph Mercier, Jean-Jacques Baurieux, Antoine Gentelle. Bibliography: Martin & Walter.  Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
url = "https://archive.org/details/jugementrendupar00fran_9"
subject = [
    "Political crimes and offenses",
    "Capital punishment",
]
extent = "16 p. ; 26 cm."

