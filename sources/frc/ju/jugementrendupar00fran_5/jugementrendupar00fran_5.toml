type = "pamphlet"
title = "Jugement rendu par le Tribunal révolutionnaire, établi a Paris par la loi du 10 mars 1793, séant au Palais de justice, à Paris, qui sur la déclaration du juré du jugement, portant, qu'il est constant qu'il a été pratiqué des manœuvres et intelligences, tendantes à livrer aux ennemis la place de Verdun, à favoriser les progrès de leurs armes sur le territoire français, à détruire la liberté, la répresentation nationale, et à rétablirle [sic] despotisme .."
language = "fr"
place = "A Paris"
date = "1794"
note = "Caption title. Signed: Herman, président, N.J. Fabricius, greffier. Imprint from colophon. Dated, p. 3: Du 7 floréal, l'an deuxième de la République française une et indivisible. Martin & Walter. Révolution française. Criminal judgment of Alexandre-Joseph Neyon, Jean-Baptiste-Philibert Perrin, Henry-Barthelemy Grimoard, Henri-François Croyer, Jean Gossin, Jean-Michel Colloz, Guillain Lefebure, Claude-Elisabeth Cordière, Cristophe Herbillon, Nicolas Lamesle, Jean-Baptiste Barthè, Jacques-Nicolas d'Aubermenil, Jean-Baptiste Pelegrin, Michel Joulin, Badillon Leclerc, Gerarde Desprez, Pierre Thuileur, Jacques Petit, François Fortain, François Chotain fils, Annegrand Febure, femme Tabouillot, Thérese Pierson, femme Bestel, Marie-Françoise Henry, femme Lalance, Françoise Herbillon, veuve Masson, Suzanne Henry, Gabriel Henry, Marguerite-Angélique Lagizière, Genevieve-Henriette Vatrin, Hélène Vatrin, Marguerite Croutte, Nicolas Milly, Claire Tabouillon, and Barbe Henry. Bibliography: Martin & Walter.  Révolution française, IV:2, 8109. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages. Faint text."
url = "https://archive.org/details/jugementrendupar00fran_5"
subject = [
    "Political crimes and offenses",
    "Capital punishment",
]
