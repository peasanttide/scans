note = """Attributed to Guyot-Desherbiers. Cf. Barbier, Quérard. Originally published in 1798. Cf. Barbier. "Robespierre aux frères et amis" signed: Pérac; "Camille-Jordan aux fils légitimes de la monarchie et de l'Église" signed: Pasteur. Last word of p. 23: de-; another edition exists with last word: régénératrices. Variant of Martin & Walter. Révolution française, III, 26547. Variant of Barbier, A.A. Ouvrages anonymes, IV, column 371. Quérard, J.M. Superchéries littéraires. Bibliography: Quérard, J.M.  Superchéries littéraires,  III, column 427. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."""
