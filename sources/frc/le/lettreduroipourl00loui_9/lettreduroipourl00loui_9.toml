title = "Lettre du roi pour la convocation des États-généraux à Versailles, le 27 avril 1789 : et règlement y annexé, pour la Lorraine et Barrois."
language = "fr"
place = "A Paris"
date = "1789"
note = """Signed, p. 6: Louis; et plus bas, Chastenent de Puysegur. Not in Martin & Walter. Révolution française. "Ordre des élections & députations dans les bailliages royaux de la province de Lorraine & Barrois, pour l'assemblée prochaine des États-généraux"--P. 11-12. "État, par ordre alphabétique, des villes de la province de Lorraine & Barrois, qui doivent envoyer plus de quatre députés à l'assemblée de leur bailliage, & du nombre de députés que chacune y enverra"--P. 13. Ms. notes, [2] p. at end. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />Varying page sizes. Test lost in binding. Some text obscured by wrinkled pages. <br />."""
