title = "Le concile des trentes en déroute : ou Le secret des émeutes découvert."
language = "fr"
place = "A Paris"
date = "1791"
note = "Opening sentence: Il est donc vrai que la France entière est livrée aux mains de trente factieux qui commandent les émeutes, qui en soudoient les artisans, et qui trompent moins encore le peuple, qu'ils ne le fatiguent en abusant de son nom pour couvrir des excès auxquels il n'a point, ou que très-peu de part. Final paragraph: Les séances des Jacobins sont bruyantes, absurdes, ridicules; mais ce n'est pas là que se portent les grands coups. C'est au conciliabule de la chancellerie d'Orléans que se forment les grands projets; c'est là que les grands acteurs se réunissent, et le club des Jacobins lui-même n'est pas dans leur secret. Martin & Walter IV 2: 3713. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."
