language = "fr"
place = "A Paris"
date = "1792"
note = """Caption title. Signed: Champy, député de la commune de Strasbourg. Imprint from colophon. "Paris, le 27 juin 1792, l'an IV de la liberté"--P. [1]. "L'Assemblée nationale ayant décrété l'impression de la lettre de MM. Roland et Servan, ex-ministres, lue dans sa séance du 29 juin, j'ai cru devoir publier, par la même voie, les deux lettres que j'ai addressées à M. Roland, dont la dernière contient la réponse à plusieurs articles de celle que l'assemblée fait imprimer"--P. [1]. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 6749. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged and stained pages and cover. Title on cover page."""
