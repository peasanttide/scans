title = "Les chefs-d'œuvre dramatiques, ou, Recueil des meilleures pieces du théatre françois, tragique, comique & lyrique"
language = "fr"
place = "Paris"
date = "1774"
note = """Prospectuses for "Les chefs-d'œuvre dramatiques", edited by Jean-François Marmontel, and for five other titles. Caption title. Imprint from colophon. "Permis d'imprimer, ce 20 avril 1774"--P. [4]. "Les personnes de la province recevront, port franc, les Chefs-d'œuvre dramatiques, le Droit commun de la France, & le Style du Châtelet, & le tome VI de l'Histoire des différents peuples du monde ... en s'adressant au Bureau de l'abonnement littéraire ... On affranchira le port des lettres & celui de l'argent, qu'on adressera à M. Luneau de Boisjermain"--P. [3]. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/leschefsdoeu00unse"
