title = "Le Heravt, et l'arrest des trois estats : ensembles les questions d'vne abbesse sur la demeure du roy."
language = "fr"
place = "A Paris"
date = "1649"
note = """Title page device of a Roman emperor and words "non vi sed ingenio" and Greek translation. Signatures: A-B². Fictitious account written by an abbesse to her sisters discussing the Fronde. "Le heravlt ov les questions": p. [4]-[8], in verse. "Arrest des trois estates": p. [8], in verse. Caption title: Le Heravt ov les questions d'vne religieuse sur la demeure du roy & l'arrest des trois estats. Unpaged except p. [3], [6], [7], numbered I, 3, 4. First state of Moreau 1623 (described as 6 p.) with comma after "heravt" in title. Cf. Walsh 1623. Published after the Treaty of Rueil, March 11, 1649 (Moreau 1623) and possibly after its acceptance by the Parlement March 15. Cf. Moreau III, 313. Moreau. Walsh. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained, marked, torn and/or loose pages. Uneven binding. Skewed text. Text is lost in the binding or extends off of the edge of the page.  Title and cover page are combined."""
url = "https://archive.org/details/leheravt00unse"
