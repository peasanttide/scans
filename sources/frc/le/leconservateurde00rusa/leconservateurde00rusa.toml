note = """Prospectus for "Le conservateur de la Restauration.". Caption title. Place of publication and publisher from colophon. "Le conservateur a déjà trois mois d'existence ... Le conservateur est venu au milieu de deux époques ... entre la chambre royaliste de 1827 et la chambre populaire de 1828 ..."--P. [1]. "On souscrit à Paris, a la direction du Conservateur, rue Saint-Dominique Saint-Germain, n° 29 ..., a la librairie ecclésiastique de Rusand, rue du Pot-au-Fer Saint-Sulpice, n° 8; a Lyon, chez Rusand, libraire, imprimeur du roi, rue Mercière, n° 26; chez les principaux libraires des provinces et de l'étranger, et chez tous les directeurs des postes"--P. 4. "L'ouvrage ... paraît aux mêmes époques que son prédécesseur, par livraisons égales ou inégales, moyennant 11 fr. pour un volume, 20 fr. pour deux, 36 fr. pour quatre à Paris, et 1 fr. 50 c. de plus par volume pour les départemens"--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page.  Text lost in binding."""
