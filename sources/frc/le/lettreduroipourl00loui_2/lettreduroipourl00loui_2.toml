title = "Lettre du roi pour la convocation des Etats-généraux à Versailles, le 27 avril 1789 : et règlement y annexé."
language = "fr"
place = "A Paris"
date = "1789"
note = """Signed, p. 5: Louis; et plus bas, Laurent de Villedeuil. Not in Martin & Walter. Révolution française. "État, par ordre alphabétique, des bailliages royaux & des sénéchaussées royales des pays d'élections, qui députeront directement ou indirectment aux États-généraux; avec le nombre de leurs députations, chaque députation composée d'un député du clergé, d'un de la noblesse & de deux du Tiers-État"--P. 29-36. "Etat, par ordre alphabétique, contenant les noms des villes des pays d'élections, qui doivent envoyer plus de quatre députés aux assemblées des bailliages & sénéchaussées, & le nombre des députés que chacune y enverra"--P. 37-39. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />."""
