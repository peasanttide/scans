language = "fr"
place = "A Paris"
date = "1723"
note = """Prospectus for an unrealized postumous edition of Callot's etchings, which were to have been pulled from plates that Jacques Fagnani acquired from Israël Sylvestre's son-in-law, Nicole Petit de Loigny. "La souscription entiere [est] de quatre cens cinquante livres ... Les souscripteurs seront reçûes chez le sieur De Launay libraire ... Il commencera à délivrer le premier volume au mois de decembre prochain"--P. 2, second sequence. Title vignette; head-piece. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
