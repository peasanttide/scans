note = "By Barthélemy d'Orbanne and Jean Joseph Mounier. Cf. Maignien. Dated, p. 3: 2 juillet 1788. Martin & Walter. Révolution française. Variant of Maignien, E. Ouvrages anonymes et pseudonymes du Dauphiné, 1357. Summary of the meeting held by the Conseil général of Grenoble and the resulting letter to the king. Bibliography: Martin & Walter.  Révolution française,  III, 25381. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
