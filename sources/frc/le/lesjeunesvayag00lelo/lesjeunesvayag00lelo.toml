note = """Prospectus for Léon N. Astoin and Constant Taillard's "Les jeunes voyageurs, ou, Lettres sur la France en prose et en vers". Caption title. Imprint from colophon. "L'ouvrage est entièrement achevé, et vient d'être mis en vente. A Paris, chez Lelong, libraire-éditeur, Palais-Royal, galeries de Bois, n° 233. Paris, le 1er décembre 1820"--P. 4. "Six volumes in-18, imprimés sur papier grand-raisin"--P. [1]. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
