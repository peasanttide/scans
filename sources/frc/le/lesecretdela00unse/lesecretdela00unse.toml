language = "fr"
place = "A Paris"
date = "1649"
note = """Title page vignette. Signatures: A-D². Shoulder notes. Permission to print, p. 16, dated: Faict à Paris le 26 mars 1649. "Théologien d'estat à la reine" (Moreau 3770) appeared the previous month in 1649. Presents to Queen Anne a religious commentary on unity in government and historical arguments against Mazarin. Originally published as Le secret de la paix. A la reyne (Moreau 3626). Cf. Walsh 3627. Followed in 1651 by Le Veritable secret de la paix a la reyne. (Moreau 3963). Cf. Moreau 3627. Moreau. Walsh. Scanner's note: No copyright found. No table of contents found. Damaged, stained pages and cover.  Title on cover.<br />."""
