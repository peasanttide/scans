note = """Martin & Walter. Révolution française. "Lettre du citoyen Lalande l'astronome, au citoyen Cubieres"--P. [3]-6. "Les trente-six hymnes civiques pour les trente-six décadis de l'année républicaine"--P. [49]-135. "De l'Imprimerie de Guilhemat, rue des Maçons-Sorbonne, no. 411."--P. 135. "Cette troisième édition a été réellement commencée en l'an 7, et voilà pourquoi il y a en l'an 7 au frontispice; mais des obstacles survenus pendant l'impression ont empêché qu'elle parût à l'époque désignée; ainsi elle n'a paru véritablement qu'en l'an 8, et c'est cette date qu'elle devroit porter."--P. 135. Stamped on back: Bibliothèque populaire des amis de l'instruction, XIVe. arrond. Bibliography: Martin & Walter.  Révolution française,  I, 8960. Scanner's note: No copyright page found. No table-of-contents pages found."""
