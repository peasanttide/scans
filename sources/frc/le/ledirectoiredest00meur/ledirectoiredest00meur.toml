title = "Le directoire destitué du département de la Meurthe : a la Convention nationale."
language = "fr"
place = "Paris"
date = "1793"
note = """Caption title. Imprint from colophon. Opening words: Les représentans du peuple Saint-Just et Lebas, envoyés extraordinairement par la Convention nationale aux Armées du Rhin et de la Moselle, ont accusé l'administration du département de la Meurthe de mollesse et de mauvaise foi dans la fourniture du contingent des subsistances militaires .. "Extrait de l'arrêté des représentans du peuple près l'Armée du Rhin. Du 21 frimaire l'an 2 de la République françoise, une et indivisible [11 décembre 1793]": p.29-30. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."""
