id = "lettreduroipourl00loui_1"
type = "pamphlet"
title = "Lettre du roi pour la convocation des États-généraux à Versailles le 27 avril 1789 : et règlement y annexé."
language = "fr"
place = "A Paris"
date = "1789"
note = """Signed p. 5: Louis; et plus bas, Laurent de Villedeuil. Not in Martin & Walter. Révolution française. "Etat, par ordre alpbabétique [i.e. alphabétique], des bailliages royaux & des sénéchaussées royales des pays d'élections, qui députeront directement ou indirectment aux États-généraux; avec le nombre de leurs députations, chaque députation composée d'un député du clergé, d'un de la noblesse & de deux du Tiers-état"--P. 1-10 at end. "Bailliages, qui ont aquis la députation directe depuis 1614; avec le nombre de leurs députations"--P. 11-12 at end. "Etat, par ordre alphabétique, contenant les noms des villes des pays d'élections, qui doivent envoyer plus de quatre députés aux assemblées des bailliages & sénéchaussées, & le nombre des députés que chacune y enverra"--P. 13-16 at end. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />Irregular pagination. <br />."""
url = "https://archive.org/details/lettreduroipourl00loui_1"
