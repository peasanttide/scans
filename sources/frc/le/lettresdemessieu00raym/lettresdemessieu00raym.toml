note = """Title differs in Martin & Walter: A Messieurs les rédacteurs de la Chronique, de la part de M. Raymond. Martin & Walter. Révolution française. "Lettre à M. d'Albert de Rioms, chef d'escadre"--P. [1]-9. "Lettre à M. d'Albert de Rioms, chef d'escadre. Paris, le [blank] 1790"--P. 9-13. "A Messieurs les rédacteurs de la Chronique, de la part de M. Raymond, major en second de la garde nationale de Toulon, l'un des députés à l'Assemblée nationale pour l'affaire de cette ville"--P. 14-18. "Copie d'une lettre écrite à M. d'Ouville, officier du régiment de Dauphiné, pour démentir le fait avancé contre moi dans le mémoire signé d'Albert. Paris, le 11 janvier 1790"--P. 18-21. Bibliography: Martin & Walter.  Révolution française,  IV:1, 28808. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Skewed text."""
