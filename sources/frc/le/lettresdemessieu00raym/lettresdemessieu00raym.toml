title = "Lettres de Messieurs Raymond, Jourdan et Mallard, députés de la Garde nationale & de la commune de Toulon, servant de réponse aux injures insérées contre eux dans le mémoire de M. le comte d'Albert de Rioms, chef d'escadre."
language = "fr"
