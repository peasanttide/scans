title = "Lettre du roi pour la convocation des États-généraux a Versailles, le 27 avril 1789 : et règlement y annexé."
language = "fr"
place = "A Paris"
date = "1789"
note = """Signed p. 5: Louis; et plus bas, Laurent de Villedeuil. Not in Martin & Walter. Révolution française. Single rule line after publisher statement on t.p.; a variant edition exists with double rule line. "État, par ordre alphabétique, des bailliages royaux & des sénéchaussées royales de pays d'élections, qui députeront directement ou inderectement aux États-généraux, avec le nombre de leurs députations; chaque députation composée du'un député du clergé, d'un de la noblesse & de deux du Tiers-état"--P. 1-12 at end. "État, par ordre alphabétique, contenant les noms des villes des pays d'élections qui doivent envoyer plus de quatre députés aux assemblées des bailliages & sénéchaussées, & le nombre des députés qua chacune y enverra"--P. 13-15 at end. Ms. annotations. Scanner's note: No Copyright found. No Table of Contents found.  Damaged, stained pages and cover. <br />Irregular pagination. Text lost in binding. Tight margins. <br />."""
url = "https://archive.org/details/lettreduroipourl00loui_0"
