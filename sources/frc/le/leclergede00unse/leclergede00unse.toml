title = "Le clergé de France, ou, Tableau historique & chronologique des archevêques, evêques, abbés, abbesses, & chefs des chapitres principaux du royaume, depuis la fondation des eglises jusqu'à nos jours"
language = "fr"
place = "Paris"
date = "1774"
note = """Prospectuses for Dutems's "Le clergé de France" and Libois's "L'encyclopédie des dieux et des héros.". Caption title. Imprint from colophon. "Permis d'imprimer, ce 7 avril 1774"--P. [4]. "Le prix des sept volumes du Clergé de France ... sera de 31 liv. 10 s. pour les personnes qui souscriront, & de 36 liv. pour celles qui n'auront pas souscrit ... On souscrira pour Paris chez Delalain, libraire"--P. [2]. "Les personnes de province qui voudront se procurer les deux volumes de M. Libois pourront s'adresser à Paris à lui-même, rue des Arcis, maison de M. Solvet, marchand epicier, à la Perle"--P. [4]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
