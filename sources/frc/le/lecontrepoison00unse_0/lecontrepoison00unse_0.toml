note = "Caption title. Signed: Offroi, soldat invalide. Imprint from colophon. At head of title: Prix, deux sols. Not in Martin & Walter. Révolution française. Variant of BN, CXXVI, column 682. Variant of BM, CLXXIV, column 698. A response to Dénonciation au Comité des recherches de l'empoissonnement des invalides, published in 1790. Cf. Martin & Walter, IV:2, 5198. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
