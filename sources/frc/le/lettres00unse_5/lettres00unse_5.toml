note = """By Jean-Joseph Rive. Cf. Barbier, Quérard. Fictitious imprint. Printed in Paris. Cf. Barbier, Quérard. Weller gives Nîmes as place of publication. Variant of Martin & Walter. Révolution française, IV:1, 29400. Barbier A.A. Ouvrages anonymes. Quérard. Weller, E.O. Falsche Druckorte. Includes bibliographical references. "Appendix a mes lettres purpuracées, etc. aux MM. Debaux, Philibert et Juglar, chargés à Aix de la correspondance avec le Tiers-État de Provence, qui assiste aux États-généraux à Versailles"--P. [93]-117. Errata, [2] p. at end. Bibliography: Barbier  A.A. Ouvrages anonymes,  II, column 1287. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Uneven binding.  Skewed text.  Damaged, stained, marked and/or loose pages."""
