note = """Caption title. Signed: Par J.J. Pithou de Loinville, citoyen de Sorin. Imprint from colophon. "Se trouve chez l'auteur, rue du Plâtre Saint-Jacques, maison du sieur Arnoult, peintre, no 28"--P. 15. Two title vignettes: Lumiere et liberté, ont fiats miracles -- La loi et le roi, voila nos oracles. Martin & Walter. Révolution française. "Résumé"--P. 11-13. "La parole"--P. 13-15. Bibliography: Martin & Walter.  Révolution française,  IV:1, 27528. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
