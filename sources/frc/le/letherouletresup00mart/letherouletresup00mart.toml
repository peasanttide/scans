note = """Attributed to Martin de Bussy; published by Jérôme Lalande, cf. Barbier. "On trouve à l'Imprimerie de la rue des Petits-Augustins, no. 33, Faubourg Saint-Germain, le Livre de Thot, et la totalité des ouvrages d'Etteilla, sur les hautes sciences, etc., etc."--P. [ii]. Barbier, A.A. Ouvrages anonymes. Cioranescu, A. 18. s. Not in Martin & Walter. Révolution française. Poem published by the astronomer Joseph Jérôme Lalande to disprove accusations of atheism leveled against him. Bibliography: Barbier, A.A.  Ouvrages anonymes,  II, column 304. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover."""
