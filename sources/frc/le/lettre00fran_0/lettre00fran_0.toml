note = """Caption title. Without imprint. Opening words: Vous avez vu dans la translation du Parlement de Bordeaux, des magistrats privés de leur liberté, pour avoir défendu les loix & les peuples .. "Extrait des registres du Parlement de Bordeaux. Du 21 décembre 1787": p.[33]-36. "Vu les lettres-patentes du 30 novembre dernier, portant seconde & finale jussion de procéder à l'enregistrement ... de l'edit du mois de juin dernier, portant établissement des assemblées provinciales ...": p.[33]. Apparently extracted from a larger, unidentified work. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages.  Page numbers begin at 30."""
