title = "Le Veritable manifeste de monseignevr le prince : touchant les raisons de sa sortie, & les protestations qu'il fait aux Parisiens, qu'il n'abandonnera iamais leurs interests."
language = "fr"
place = "A Paris"
date = "1652"
note = "Signatures: A-B². Condé defends his actions in leaving Paris and assures Parisians of his fidelity. Variant of edition published between October 13 and 21, 1652. Cf. Moreau III, 379. Two pieces which speak against the Véritable Manifeste are Observations politiques (Moreau 2570) and later the Véritable réponse au prétendu manifeste de monsieur le prince (Moreau 3953). Moreau. Scanner's note: No copyright page found. No table-of-contents pages found.   Damaged, stained, marked, torn and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page.  Title and cover page are combined."
url = "https://archive.org/details/leveritablemanif00cond"
