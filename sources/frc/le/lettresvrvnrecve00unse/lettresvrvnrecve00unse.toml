title = "Lettre svr vn recveil dv manifeste des propheties tiré des œuures d'vn personnage doüé de don particulier de Dieu, pour publier les choses predites obscurement és propheties, & les faire entendre ouuertement sur la grande reuolution d'icelles, à la destruction des preuaricateurs de l'Eglise, restaurtion d'icelle selon la promesse d'Elie, & ruyne, & destruction de la 4. monarchie en l'estat que la treuuent les infideles. Monstrant que ces choses seront accomplies en tout, & l'estat du monde sera reduict vniuersellement à l'Eglise, auant au l'enfant qui naistra ceste année 1615. sçache discerner le bien d'entre le mal."
