language = "fr"
place = "A Montpellier"
date = "1793"
note = "Caption title. Imprint from colophon. At head of title: Linerté, égalité, unité, indivisibilité. Opening sentences: Aux assemblées primaires! Aux assemblées primaires! La République trahie, la Convention opprimée, le génie, la vertu dans les fers nous y appellent, nous y entraînent. Sauvons la République .. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
