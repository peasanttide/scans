language = "fr"
place = "Paris?"
date = "1800"
note = """Prospectus for David's engraving "Le triomphe de la République française.". Caption title. "On souscrit chez David, rue Pierre-Sarrazin, n°. 14.". "Chaque epreuve avec la lettre, 12 francs; et les premières epreuves avant la lettre, 18 francs. On se fait inscrire en payant d'avance 6 fr. pour les epreuves avec la lettre, et 9 fr. pour les premières epreuves avant la lettre.". "En souscrivant, on reçoit une epreuve du portrait du premier consul, que le citoyen David a gravé dans le style égyptien, d'après la belle cornaline qui appartient à Madame Bonaparte.". Accompanied by letter of transmittal signed in ms. by David. Letter addressed in ms. to: Citoyen Adanson, membre de l'Institut nation[al], rue de la Victoire, no 47. Ms. notes in Adanson's hand: Gravûre de Bonaparte en style egyptien et Triomphe de la France par David. Dessin de Monnet. Souscription recue le 26 g[...?] 1800. Je l'ai différée. (Adanson). Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers.  Varying page sizes. <br /><br />."""
url = "https://archive.org/details/letriomphedelare00davi"
