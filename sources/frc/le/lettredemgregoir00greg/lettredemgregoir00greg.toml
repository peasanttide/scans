type = "pamphlet"
title = "Lettre de M. Grégoire, curé d'Emberménil, député de Lorraine, a ses confrères les députés du clergé, & à tous les curés de la nation : dans laquelle on expose les véritables intérêts du clergé, & où l'on démontre la nécessité de vérifier les pouvoirs en commun, & de délibérer par tête : avec la liste des députés qui, dans la séance du 19 juin 1789, se sont réunis à la chambre nationale."
language = "fr"
place = "Paris?"
date = "1789"
note = """"La lettre aux curés a fait la plus vive sensation à Paris. Tous les exemplaires ont été enlevés rapidement. Nous croyons rendre service au public en la réimprimant."--T.p. verso. Not in Martin & Walter. Révolution française. "Liste des membres du clergé qui, dans la séance du 19 juin 1789, ont voté pour la vérification des pouvoirs en commun dans la salle de l'Assemblée générale, & ont signé l'arrêté pris en conséquence"--P. 31-36. Scanner's note: No copyright page found. Damaged pages. Uneven binding. Skewed text. Title and cover pages combined."""
