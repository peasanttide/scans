title = "Lettre du roi pour la convocation des Etats-généraux à Versailles, le 27 avril 1789 : et règlement y annexé."
language = "fr"
place = "Paris"
date = "1789"
note = """Signed p. 5: Louis; et plus bas, Laurent de Villedeuil. Not in Martin & Walter. Révolution française. Double rule line below publisher statement on t.p.; a variant edition exists with single rule line. "État, par ordre alphabétique, des bailliages royaux & des sénéchaussées royales de pays d'élections, qui députeront directement ou inderectement aux États-généraux, avec le nombre de leurs députations; chaque députation composée d'un député du clergé, d'un de la noblesse & de deux du Tiers-état"--P. 1-12 at end. "État, par ordre alphabétique, contenant les noms des villes des pays d'élections qui doivent envoyer plus de quatre députés aux assemblées des bailliages & sénéchaussées, & le nombre des députés qua chacune y enverra"--P. 13-15 at end. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />Irregular pagination. <br />."""
url = "https://archive.org/details/lettreduroipourl00loui"
