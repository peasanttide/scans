id = "lettreduncitoyen00mail"
type = "book"
title = "Lettre d'un citoyen françois : a un député de l'Assemblée nationale ; sur le Discours de M. Mailhe, membre du Comité diplomatique, dans l'affaire des princes possessionnés en Alsace, prononcé à la séance du samedi 25 février 1792 ; cette lettre, qui est précédée du Discours de M. Mailhe, peut, en même-temps, servir de réponse à ceux de MM. Pastoret, et Lasource, prononcés sur le même objet, dans la séance du Ier. mars, et encore à une brochure qui se vend à Paris sous le titre de Réflexions politiques sur les prétentions des princes et etats de l'Empire possessionnés en Alsace, Lorraine, et comté de Bourgogne."
language = "fr"
place = "A Paris"
date = "1792"
note = """Publisher from colophon; remainder of imprint from t.p. "Discours prononcé par M. Mailhe, dans l'affaire des princes allemandes possessionnés en Alsace et en Lorraine, à la séance du samedi 23 février 1792": p.[3]-27. "Lettre d'un citoyen françois ...": p.29-56. The pamphlet by Pastoret (Martin & Walter III: 26565) has title: Opinion ... sur les indemnités à accorder aux princes allemandes possessionnés en France .. The pamphlet by Lasource (Martin & Walter III: 19486) has title: Opinion ... sur les indemnités à accorder aux princes étrangers possessionnés en France .. The anonymous pamphlet mentioned in the title is Martin & Walter IV 2: 15360. Martin & Walter. Scanner's note: Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. No copyright page found. No table-of-contents pages found."""
url = "https://archive.org/details/lettreduncitoyen00mail"
subject = [
    "Pastoret, Claude Emmanuel Joseph Pierre, marquis de, 1755-1840",
    "Lasource, Marc David Alba, 1763-1793",
    "Réflexions politiques sur les prétentions des princes et états de l'Empire",
    "Alien property",
]
extent = "56 p. ; 20 cm."

