note = "Includes: Response de Monseigneur le Prince au Roy. Lindsay & Neu. French political pamphlets. The letter from the King is dated Paris, July 26, 1615, and is signed Loys. The letter from the Prince is dated at Coussy July 27, 1615, and is singed henry de Bovrbon. Both letters concern the King's journey to Guyenne. Bibl. Nat. Cat. gen., v. 100, col. 600. Scanner's note: Title and cover page are combined. Damaged, stained, marked, torn and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Page numbering error."
