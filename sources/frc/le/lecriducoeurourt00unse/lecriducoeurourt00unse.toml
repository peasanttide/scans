note = "Half title. Opening words: Après avoir prononcé, d'abord, dans l'église principale de R.... le serment décrété par l'Assemblée nationale, pour tous les ecclésiastiques fonctionnaires publics, & l'avoir, peu de jours après, hautement rétracté, il me sembloit que je n'avois plus d'autre partie à prendre que celui de la retraite & du silence .. Martin & Walter IV 2: 4908 (which supplies the date: 1791). Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover."
