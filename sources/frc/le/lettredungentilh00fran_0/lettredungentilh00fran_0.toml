note = """Caption title. Without imprint. "Mémoire au roi pour la noblesse de Dauphiné": p.3-16. "De Grenoble. Le 7 juin 1788": p.17-20. About "... des lettres de cachet portant un ordre du roi de quitter ... la ville de Grenoble ..." involving the president and officers of the court at Grenoble. "Arrêté de la sénéchaussée de Lyon, du vendrdi, 23 mai 1788, veille du jour où l'intendant avoit annoncé qu'il devoit leur porter les ordres du roi": p.21-27. Not in Martin & Walter [edition 2: 27 p.; with extra texts as indicated]. Scanner's note: Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. No copyright page found. No table-of-contents pages found."""
