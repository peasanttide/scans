language = "fr"
place = "Paris"
date = "1774"
note = """Catalog for Bureau de l'abonnement littéraire, including prospectuses for Viard's "Les vrais principes de la lecture, de l'orthographe et de la prononciation françoises" and for several works written or edited by Luneau de Boisjermain. Caption title. "Le port franc des livres par la poste n'est point restreint à ce seul ouvrage ni aux suivants, il s'étend à tous les livres de la Librairie de Paris ... & à toutes les nouveautés qui se distribuent journellement dans la capitale, & à celles sur-tout dont le Bureau des abonnements littéraires a distribué les prospectus ... Les personnes de la province qui veulent jouir de cette commodité ... doivent s'adresser à Paris, à M. Luneau de Boisjermain, hôtel de la Fautriere, rue de la Comédie Françoise"--P. [1]. Citation from Journal des sçavans, "mois de février 1774," on p. [4]. Includes prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
url = "https://archive.org/details/lesvraisprincipe00bure"
