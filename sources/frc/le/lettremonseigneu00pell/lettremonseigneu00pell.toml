note = """Dated and signed at end: A Paris ce 17. May, 1614, Pelletier. Author's name is usually cited as Thomas, sometimes as Pierre. Caption title; no t.p. Signatures: A⁴. Written at Paris May 17, 1714, and signed: Pelletier. In this letter he denies being the author of a work intitled "Lettre de Messieurs de la cour de Parlement de Bordeaux". Bibl. Nat. Cat. gen., v.132. col. 623. Lindsay & Neu. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
