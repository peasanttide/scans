title = "Lettre a M. l'évêque d'A-- et compagnie, auteurs de l'Adresse aux provinces."
language = "fr"
place = "France"
date = "1790"
note = "By François-Louis Suleau; addressed to the bishop of Autun, Charles Maurice Talleyrand-Périgord. Cf. Barbier. Adresse aux provinces attributed by Barbier to F.X.M.A. de Montesquiou-Fezensac; cf. Barbier, A.A. Ouvrages anonymes, I, column 71. Suggested date of publication based on another edition, published 1790. Cf. Barbier; Martin & Walter. Variant of Barbier, A.A. Ouvrages anonymes, IV, column 140. Variant of Martin & Walter. Révolution française, IV:1, 32021. Forms part of the French Revolution Collection at the Newberry Library. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."
url = "https://archive.org/details/lettre00unse_9mm"
extent = "15 p. ; 20 cm."

