type = "pamphlet"
title = "Lettre lue à l'Assemblée-patriotique, concernant M. Blanc-Gilli, administrateur du département & juge de paix, au sujet d'un acte d'intégrité que les ennemis du bien public taxoient de forfaiture."
language = "fr"
place = "A Marseille"
date = "1791"
note = """Caption title. Signed, p. 7: Hipolite Peise, secrétaire de paix du premier arrondissement du canton de Marseille. Marseille ce 29 mars 1791. Imprint from colophon. Not in Martin & Walter. Révolution française. "Depend de la déliberation du 30 mars 1791"--P. 8. Peise describes the court case between sieur Cibon, Pierre Roman, and Marie Richaud, defends the actions of the justice of the peace Blanc-Gilli, and takes the blame himself for the procedural error. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
url = "https://archive.org/details/lettre00unse_m2k"
