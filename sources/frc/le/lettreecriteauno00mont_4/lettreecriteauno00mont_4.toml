title = "Lettre écrite au nom du roi, par M. Montmorin, ministre des affaires étrangeres, aux ambassadeurs et ministres résidens près les cours : imprimée par ordre de l'Assemblée nationale."
language = "fr"
place = "Paris"
date = "1791"
note = """Caption title. Imprint from colophon. Suggested date of publication based on another edition, published in 1791. Cf. Martin & Walter. Martin & Walter. Révolution française. Variant of Saricks, A. Melvin Coll., I, 4101. Instructs them to notify their respective courts of the King's acceptance of the Constitution. "Discours de M. le président de l'Assemblée nationale, chef de la députation au roi"--P. 6-7. Bibliography: Martin & Walter.  Révolution française,  III, 25064. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
