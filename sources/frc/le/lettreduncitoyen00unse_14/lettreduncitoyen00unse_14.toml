note = "Caption title. Without imprint. Dated at end: A Crest, le 1er. août 1788. The pamphlet in question (not in Martin & Walter) has title: Réflexions d'un patriote dauphinois, sur le nouveau plan d'administration du gouvernement, & sur le dernier arrêté du Parlement de Grenoble, du 20 mai, suivi de l'adhésion de la noblesse du Dauphiné. Not in Martin & Walter [edition 2: 24 p.]. Scanner's note: Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. No copyright page found. No table-of-contents pages found."
