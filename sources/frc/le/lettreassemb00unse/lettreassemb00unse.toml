note = """Caption title. Imprint from colophon. Martin & Walter. Révolution française. Concerns the decree enacted Aug. 4, 1789, articles I-XV. "Sur la demande formée séparément, concernant la sanction du dernier décret de l'Assemblée nationale, en faveur de la libre circulation des grains, & de la défense d'en exporter au dehors"--P. 13-14. Bibliography: Martin & Walter.  Révolution française, III, 21797. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
