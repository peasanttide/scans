title = "Le cri de l'humanité aux États-généraux, sur les premiers & les plus importans des objets politiques : la conservation annuelle d'un demi million de citoyens de tout état, qui périssent ou surchargent les hôpitaux & les habitations : le rétablissement ultérieure & salutaire de plusieurs millions d'autres, de tout sexe, de tout âge & de tout rang, des maladies sociales, contagieuses, (vénériennes) : la préservation de l'abus & du danger des mauvais remedes, & des faux-guérisseurs publics, par une police rigoureuse, & par un examen parallele comparatif : invocation pressante, dans laquelle on propose des moyens également célebres & efficaces, dont on présente ici par la gravure & le détail, quelques succés très-extraordinaires : extrait d'un recueil circonstancié, sous le même titre, avec deux planches, qui se touve à Paris chez Cussac, & tous les autres libraires du Palais-Royal, & à l'adresse ci-après page 5 /"
