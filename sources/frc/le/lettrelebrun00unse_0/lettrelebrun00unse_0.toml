note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Imprimée par ordre de la Convention nationale, & envoyée aux quatre-vingt-quatre départemens.". Includes Très-gracieux discours de Sa Majesté aux deux chambres du parlement. Variant of Martin & Walter. Révolution française, III, 20132. Scanner's note: No copyright page found. No table-of-contents pages found.  Missing page numbers 5-8.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
