id = "ledereglement00dubo"
type = "pamphlet"
title = "Le dereglement de l'estat, où les curieux verront que les veritables causes des desordres sont : I. Le mespris de la religion dans la diuision de ses docteurs, dans la politique des predicateurs, & dans la mauuais exemple des grands. II. La confusion des trois estats, dans l'ambition déreglée du clergé, dans l'abus de la noblesse; & dans le luxe du peuple. III. L'impunité des crimes dans les personnes publiques. IV. La trop grande abondance des richesses dans les ecclesiastiques. V. Le mauuais vsage de la politique dans la pratique des maximes Italiennes, contraires à la simplicité des Franéois ; Auec vn discours en suite que fera voir dans l'application de ces cinq causes à leurs effects, par les exemples du temps, que tous les desordres de l'estat en prouenus."
language = "fr"
place = "Paris?"
date = "1651"
note = "Attribué à Du Bosc de Montandré par la Bibliographie des Mazarinades. Reference: Moreau, C. Mazarinades 1009. Reference: RLIN ERMMFRBN019638860-B. Bound with other titles. Scanner's note: No copyright page found. No table-of-contents pages found.   Damaged, stained, marked, torn and/or loose pages. Uneven binding. Skewed text.  Title and cover page are combined."
