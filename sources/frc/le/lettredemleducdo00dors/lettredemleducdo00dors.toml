note = """Caption title. Martin & Walter. Révolution française. "Lettre de M. le comte de Mont-Morin à M. le président de l'Assemblée nationale"--P. 4. "Réponse de M. le duc de Liancourt, président de l'Assemblée nationale, à M. le comte de Montmorin"--P. 5-6. "Reponse de M. Necker à la lettre que l'Assemblée nationale lui avoit fait écrire, pour l'engager à venir reprendre sa place dans le ministere; adressée par M. le comte de Montmorin à M. le président"--P. 7-[8]. Bibliography: Martin & Walter.  Révolution française,  III, 25060. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Page 7 printed twice."""
