title = "Le royal av Mazarin luy faisant voir par la raison & par l'histoire. I. Que l'authorité des roys sur la vie & sur le bien des subjets est sor limitée, à moins qu'elle ne soit tirannique. II. Que l'authorité des princes du sang iest essentielle dans le gouuernement. III. Que l'authorité des autres Parlemens de France, pour les affaires d'Estat, est inferieure & subordonnée à celle du Parlement de Paris. IV. Que les prelats n'ont point d'authorité dans le maniment des affaires d'Estat; & que leur deuoir les engage de n'auoir d'attachement que pour le sanctuaire."
