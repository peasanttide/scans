note = """"Cette premiere lettre, qui servira de prospectus, se distribuera gratis chez les libraires sudits. Les autres lettres, qui formeront une espece de petit traité, se venderont séparément ... Il en paroîtra une tous les mardis de chaque semaine"--P. 16. The phrase "Tome premier" appears after the author statement on t.p. Colophon: De l'imprimerie de la V. Regnard, imprimeur de l'Académie françoise, rue basse des Ursins, 1768. Title vignette; head-piece. "Le prix de chaque lettres est de 5 sols.". Liste des ouvrages composés par M. Buc'hoz -- Lettre premiere, pour servir de prospectus -- Approbation. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.   <br />."""
