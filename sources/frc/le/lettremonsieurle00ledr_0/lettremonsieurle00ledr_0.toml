language = "fr"
place = "A Paris"
date = "1649"
note = 'Signed (p. 18): Nicholas le Dru. Le Dru is a pseudonym for the abbé de Laffemas. Cf. Moreau II, 106. Title page vignette. Signatures: A-E². "Scazon", Latin poem, on p. 19. Shoulder notes. In verse. Edition differs in title page layout, vignette, form of date, etc. Cf. Haeghen 1813, Walsh 1813d. Possibly published between March 4 and March 11, 1649. Cf. Moreau III, 312. Moreau. Haeghen. Walsh.'
