note = "Imprint from colophon. Saricks, A. Melvin Coll. Martin & Walter. Révolution française. Consists of discourses by members of the nobility on the reunion and co-operation of the three estates. Lettre de M. Necker a M. Bailly -- Liste de Messieurs de la Noblesse qui se sont rendus à l'Assemblée nationale le 25 juin 1789 -- Discours de M. le comte de Clermont Tonnerre -- Réponse de M. le président de l'Assemblée nationale, au discours de M. le comte de Clermont-Tonnerre -- Discours de M. Rouf de Varicourt -- Déclaration de M. Bottez, curé de Neuville -- Discours de M. le marquis de Sillery -- Discours de M. Dumouchel, recteur de l'Université -- Discours de M. du Perier, curé de Saint-Pierre d'Etampes. Bibliography: Saricks, A. Melvin Coll., I, 4204. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text.  Text extends off of the edge of the page."
