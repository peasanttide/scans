note = "Caption title. By Jean Joseph Mounier. Cf. Maignien. Suggested date of publication based on editions published in 1788. Cf. BM, Saricks. Variant of Martin & Walter. Révolution française, III, 25383. Variant of BN, CXX, columns 746-747. Variant of BM, CLXV, column 650. Variant of Maignien, E. Ouvrages anonymes et pseudonymes du Dauphiné, 1375. Variant of Saricks, A. Melvin Coll., II, 5301. Lettre écrite a Sa Majesté sur les formes des Etats-généraux -- Mémoire adressé au roi, par les officiers municipaux, notables & autres habitants, formant le Tiers-etat de la ville de Vesoul -- Doléance d'un annobli. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
