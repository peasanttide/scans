title = "Lettre du roi pour la convocation des États-généraux a Versailles le 27 avril 1789 : et règlement y annexé."
language = "fr"
place = "A Caen"
date = "1789"
note = """Signed, p. 5: Louis; et plus bas, Laurent de Villedeuil. "Sur l'imprimé à Paris.". Not in Martin & Walter. Révolution française. "État, par ordre alphabétique, des bailliages royaux & des sénéchaussées royales des pays d'elections, qui députeront directement ou indirectement aux Etats-généraux, avec le nombre de leurs députations; chaque députation composée d'un député du clergé, d'un de la noblesse & de deux du Tiers-état"--P. 33-44. "État par ordre alphabétique, contenant les noms de villes des pays d'elections qui doivent envoyer plus de quatre députés aux assemblées des bailliages & sénéchaussées, & le nombre de députes que chacune y enverra"--P. 45-47. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />."""
