type = "pamphlet"
title = "Le Goufre infernal des aristocrates, ou, L'antre de Gattey : dans lequel un jeune provincial entraîné comme malgré lui, se trouve initié aux mystères diaboliques de la cabale des noirs, par l'abbé Maury, & Barbasure, grand-vicaire de Toulouse /"
language = "fr"
place = "Paris"
date = "1790"
note = """Martin & Walter. Engraving on leaf facing t.p.: L'aristocratie démasquée. Déffiez vous de ses caresses, ses mille bras armés, sont prèts à vous fraper [sic]. "Dédicace aux caustiques & malins ecrivains, membres de l'aristocratie": p. 3-4. Caption title: L'antre de Gattey, ou, Le jeune provincial initié aux mystères de l'aristocratie, par l'abbé Maury. "Lettre écrite par l'abbé Maury, à un de ses amis, à Peronne, lequel a pris sur lui de la rendre publique, afin de prévenir les dangers auxquels ce député s'expose tous les jours": p. 20-25. "Conversation du sieur Gattey, avec quelques écrivains, ses associés": p. 26-30. "Couplets. Air: des Portraits à la mode": p. 31-32. Dated on p. 25: De Paris le 18 mai 1790. Bibliography: Martin & Walter  31402. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
url = "https://archive.org/details/legoufreinfernal00sera"
subject = [
    "Gattey, François-Jacques, d. 1794",
    "Maury, Jean Siffrein, 1746-1817",
    "Barbasure, grand-vicaire de Toulouse",
    "Aristocracy (Social class)",
    "Songs",
]
extent = "32 p., [1] leaf of plates : ill. (engraving) ; 22 cm. (8vo)"

