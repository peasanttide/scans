title = "Lettre du roi pour la convocation des États-généraux à Versailles, le 27 avril 1789 : et règlement y annexé, pour la Bretagne."
language = "fr"
place = "A Paris"
date = "1789"
note = """Signed, p. 5: Louis; et plus bas, Laurent de Villedeuil. Not in Martin & Walter. Révolution française. "Ordre des élections & députations du Tiers-état dans les sénéchaussées du duché de Bretagne, pour l'assemblée prochaine des États-généraux"--P. 17-18. "État, par ordre alphabétique, des villes du duché de Bretagne, qui doivent envoyer plus de quatre députés aux assemblées des sénéchaussées; & le nombre que chacune y enverra"--P. 19. "Nombre des électeurs à nommer dans chacune des neuf assemblées diocésaines"--P. 20. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />."""
