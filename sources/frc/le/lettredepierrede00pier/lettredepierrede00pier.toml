place = "A Paris"
date = "1649"
note = """Signed at end: Pierre de Provence. Title page vignette. Headpiece of royal arms: p. 3. Signatures: A-C². Fictitious letter which discusses a number of events and personages involved in uprisings in Aix. "Lettre de l'ombre de la belle Maguelonne" (Moreau 1933) is the response to this epistle. Published between January 18 and 23, 1649. Cf. Moreau III, 303. Moreau. Scanner's note: No copyright found. No table of contents found. Damaged, stained pages and cover.  Title on cover.<br />."""
