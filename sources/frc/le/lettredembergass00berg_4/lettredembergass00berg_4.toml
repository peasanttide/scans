note = "Caption title. At head of title: Cette lettre a été envoyée hier, à M. le président de l'Assemblée nationale. Je crois devoir la publier. On ne tardera pas à être instruit des motifs du silence que je garde, depuis plusieurs mois, sur l'ordre de choses dans lequel nous vivons. Ce 7 février 1790. Signatures: A². Variant of Martin & Walter. Révolution française, I, 2646. Scanner's note: No copyright page found. No table-of-contents pages found.  Page number 6 is printed as 9."
