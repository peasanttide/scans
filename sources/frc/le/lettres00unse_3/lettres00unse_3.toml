id = "lettres00unse_3"
type = "pamphlet"
title = "Lettres de Notre Très-Saint Père le pape, Pie VI, sur le serment civique prêté par les ecclésiastiques, & sur les élections & consécrations des faux évêques dans le royaume de France."
language = "fr"
place = "A Paris"
date = "1791"
note = "Added t.p. in Latin. Not in Martin & Walter. Révolution française. Variant of BM, CCVI, column 526. Eilectis filiis nostris S.R.E. cardinalibus, & venerabilibus archiepiscopis, & episcopis, ac dilectis filiis capitulis, clero, & populo regni Galliarum Pius PP. VI, dilecti filii nostri, venerabiles fratres, ac dilecti filii, salutem & apostolicam benedictionem -- Breve, cum pluribus exemplis proecedentium litterarum, ad quem libet archiepiscopum regni Galliarum missum, ut episcopis suae provinciae per eum communicentur -- Pie VI, pape, a nos très-cher fils les cardinaux de la Sainte-Eglise romaine, à nos vénérables frères les archevêques & evêques, & à nos chers fils les chapîtres, clergé & peuple du royaume de France, salut & bénédiction apostolique -- Bref, adressé avec plusieurs exemplaires de la lettre précédente, à chacun des archêveques du royaume de France, par lequel le souverain pontife les cahrge de les distribuer à tous les evêques de leur province respective. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text. Irregular pagination."
