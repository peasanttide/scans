title = "Lettre de M. Martin, membre de l'Assemblée nationale, à M. Spigne, à Marseille : précédée & suivie de réflexions adressées aux Marseillois, sur tout ce qui s'est passé à Marseille, à l'occasion de cette lettre qu'on a interceptée & publiée, sans cependant la faire imprimer, parce que l'impression auroit anéanti toutes les calomnies dont elle a été le prétexte."
