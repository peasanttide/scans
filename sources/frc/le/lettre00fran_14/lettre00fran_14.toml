note = "Half title. Opening sentence: L'honneur d'être le premier prince de votre sang, & les droits à vos bontés que donne cet auguste rang, n'ont pu garantir M. le Duc d'Orléans d'un exil rigoureux. Also concerns the exile of the Parlement de Bordeaux to Libourne. Not in Martin & Walter [edition 1: 12 p.]. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
