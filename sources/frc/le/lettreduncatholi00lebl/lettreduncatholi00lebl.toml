title = "Lettre d'un catholique du diocèse de Paris : au citoyen Jean-Claude Le Blanc-Beaulieu ; se disant dans la communion du Saint-Siège Apostolique, et Evêque métropolitaine de Rouen."
language = "fr"
place = "s.l."
date = "1800"
note = """Caption title. Without imprint. Signed at end: Lucet, canoniste. "C'est le titre que vous prenez, citoyen, à la tête de la lettre circulaire que vous adressez, le 8 brumaire an neuf [30 octobre 1800], à vos soi-disant coopérateurs, avec les actes du prétendu concile métropolitain, tenu, le mois précédent, sous votre influence immédiate. Or, ce titre est contraire à la vérité ...": p.[1]-2. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
