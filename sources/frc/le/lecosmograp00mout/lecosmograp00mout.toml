language = "fr"
place = "A Paris"
date = "1776"
note = """Proposed work never published? "La souscription sera ouverte jusqu'au 31 décembre se cette année 1776. A Paris chez Moutard, libraire de la reine, quai des Augustins. On pourra aussi souscrire a Lyon chez les freres Perisse, a Bordeaux chez les freres La Bottiere & les freres Chapuis, a Rouen chez Le Boucher, a Orléans chez la veuve Rouzeau-Montaut, a Strasbourg chez Baver & compagnie, a Montpellier chez Rigaud, Pons & compagnie, a Caen chez Leroy, a Geneve chez Chirol, a Avignon chez Guilhermont, a La Haye chez Pierre-Frédéric Gosse, a Londres chez Einsly. Et chez les principaux libraires des grandes villes de l'Europe"--P. 9-10. Colophon: De l'imprimerie de Gueffier, au bas de la rue de la Harpe, 1776. Title vignette. Includes prices. Prospectus -- Le libraire aux souscripteurs -- Conditions de la souscription -- Catalogue des livres nouveaux, ou nouvellement acquis, qui se trouvent chez le même libraire. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
