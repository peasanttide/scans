note = "Signatures: A-D². In double columns. A verse satire of Richelieu originally published in 1635; attributed to Charles de Beys, to Louis d'Espinay, comte d'Estelan, and to Jacques Favereau. Cf. Walsh 1503. Published before March 30, 1649. Cf. Moreau III, 325. Moreau. Walsh. Text of first Miliade. 1st ed., 1635. New edition, 1649. Cf. Moreau, C. Bibliographie des Mazarinades, v. 2, p. 11, no. 1503. Lelong, Bibliothèque historique de la France, v. 3, p. 211, no. 32485."
