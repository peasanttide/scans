title = "Le progrès des arts dans la République, poëme : précédé d'un discours sur le même sujet : suivi d'un autre poëme intitulé, Dieu et les saints, de quelques vers sur les victoires de Buonaparté, des doléances du pape, et de nouveaux hymnes civiques /"
language = "fr"
place = "A Paris"
date = "1796"
