language = "fr"
place = "A Paris"
date = "1791"
note = """Caption title. Imprint from colophon. Martin & Walter. Révolution française. "M. Brissot, auteur du Patriote françois, a fait imprimer une lettre en réponse à celle que je lui ai écrite le 13 de ce mois. Il avoit publié la première partie de ma lettre dans son journal, j'aurois desiré qu'il publiât également la seconde partie. Je fais imprimer ma lettre entière, je souhaite qu'on me juge d'après cette lettre, plutôt que d'après les extraits du Logographe que M. Brissot a cités, & dans lesquels j'avoue que je ne reconnois pas ce que j'ai dit"--P. [1]. Bibliography: Martin & Walter.  Révolution française,  I, 5994. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
