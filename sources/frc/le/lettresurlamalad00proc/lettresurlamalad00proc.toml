note = "Caption title. The author severely criticizes the noted surgeon, La Peyronie, for attempting to practice medicine, especially upon the person of the king. Binder's title: Bataille de Fontenay. This satiric letter is written about m. de la Peyronie, first surgeon of the king, whom the author accuses of ignorance and imprudence in treatment of the king at Metz. Inlaid. Scanner's note: No copyright page found. No table-of-contents pages found."
