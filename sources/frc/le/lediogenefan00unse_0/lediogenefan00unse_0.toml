note = "Bibliothèque nationale de France online catalogue appears to list 3 different pamphlets with title Le Diogène français or Le Diogène françois. Le Diogène français, with no subtitle, is assigned to the reign of Louis XIII but lacks imprint or exact date. The second has the full title and imprint: Le Diogene françois, ou les facétieux discours du vray Anti-dotour comique blaisois. Jouxte la coppie imprimé a Limoge, Guillaume Bureau,1617. The third was printed in 1652 with the title: Le Diogène français, ou l'homme d'état à la France soupirante; NUC indicates that this was first published in 1615 under the shorter title. References in the text appear to belong to the period around 1615. Caption title. Lelong, Bibliothèque historique de la France, v. 2, p. 775, no. 27231. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, marked, and/or stained pages.  Title and cover page are combined."
