note = """Caption title. "On s'adressera tout ce qui concerne la rédaction, les réclamations relatives aux abonnemens ... à J.-H. Valant, éditeur propriétaire du Cosmète, faubourg Denis, n°. 65, au pensionnat du Licée de la jeunesse"--P. 2. Printer statement from colophon. "Le premier numéro paroîtra le premier germinal an 7 de la République française [21 March 1799]"--P. 2. "Le prix de l'abonnement est de 20 fr. pour un an, et de 11 fr. pour six mois ... On s'abonne à Paris, au bureau du Cosmète à l'adresse ci-dessus; dans les départemens et pays étrangers, chez tous les libraires et directeurs des postes"--P. 2. Accompanied by letter of transmittal dated: Paris, 15 pluviôse an 7 [3 February 1799]; signed: Valant, editeur-propriétaire du Cosmète, faubourg Denis, n°. 65, au Lycée de la jeunesse. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Only one numbered page.<br /><br />."""
