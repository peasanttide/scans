note = "Signed at end: Cvsson. Dated at end: Du 21 ianvier 1649. Title page vignette. Signatures: A-B². Professing obedience, the Normandy Parlement informs King Louis of its refusal to receive the comte d'Harcourt. According to Moreau, there is another edition of 4 p. published by Nicolas Bessin. Moreau, C. Bibliographie des mazarinades, v. 2, p. 142, no. 1968. Moreau."
