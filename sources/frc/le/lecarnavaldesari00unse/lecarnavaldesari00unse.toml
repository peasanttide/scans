note = "Half title. Imprint from colophon. Caption on p.[3]: Le carnaval des aristocrates. Nouveau complot découvert par M. de La Fayette. Projet pour ne le pas manquer le Mardi gras. La Garde nationale partie pour Gentilly, la Maison blanche & autres endroits, disperser les ouvriers gagnés par les aristocrates. La cavalerie armée extraordinairement. Grandes révolution à Blos, à Mer, & Vendôme. Les curés prêchent contre la Révolution. Grand discours prononcé au Club monarchique, le 3 mars 1791, à 8 heures du soir. Martin & Walter IV 2: 2988. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br /><br />."
