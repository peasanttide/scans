title = "Lettre écrite au nom du roi, par M. Montmorin, ministre des affaires étrangeres, aux ambassadeurs et ministres résidans près les cours : imprimée par ordre de l'Assemblée nationale."
language = "fr"
place = "A Nantes"
date = "1791"
note = """Caption title. Imprint from colophon. Martin & Walter. Révolution française. Instructs them to notify their respective courts of the King's acceptance of the Constitution. "Discours de M. le président de l'Assemblée nationale, chef de la députation au roi"--P. 5. "Lettre bougrement patriotique du véritable Pere Duchêne, sur le décret qui nous fout des assignats de 5 liv. pour 100 millions, en remplacement des assignats de 2000 et 1000 liv. qui seront supprimés"--P. 6-8. Bibliography: Martin & Walter.  Révolution française,  III, 25064. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
