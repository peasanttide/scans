note = "Half title. Not in Martin & Walter. Premier principe. L'indifférence des religions -- Deuxieme principe. Nécessité de bonnes loix -- Trosieme [sic] principe. La force publique -- Quatrieme principe. L'égalité des citoyens -- Cinquieme principe. La juste repartition de l'impôt -- Sixieme principe. Distinction & indépendance des pouvoirs régisseurs -- Septieme principe. La souveraineté du peuple -- Huitieme principe. Droit commun aux magistratures & à leur élection. Scanner's note: Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. No copyright page found. No table-of-contents pages found."
