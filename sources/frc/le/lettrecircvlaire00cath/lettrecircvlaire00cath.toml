note = "In 2 pts., the 2d with special t.-p.: Epistola Archiepiscoporvm et Episcoporvm Parisiis nunc agentium, ad Archiepiscopos & Episcopos Regni Galliae, super animaduerisione duorum libellorum, quorum tituli sunt: prioris quidem, Modesta & brevis discussio aliquarum assertionum Doctoris Kellisoni in tractatu de ecclesiastica hierarchia, authore Eduardo Knotto [pseud.] Iesuitarum Anglorum Viceprouinciali sub ementito nomine Nicolai Smithaei [pseud.]. Posterioris verò, Apologia pro modo procedendi Sanctae Sedis Apostolicae in regendis Angliae Catholicis tempore persecutionis, auctore Ioanne Floydo Iesuita Anglo, sub falso nomine Danielis à Iesu. Iussu cleri denuò in lucem edita. Parisiis, Excudebat Antonivs Vitray, M.DC.XLIII. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover page. <br />."
