note = "Prospectus for: Histoire générale de Dauphiné / par Nicolas Chorier. Grenoble, 1661-1672. Signatures: A-D². Title vignette (coat of arms of Dauphiné); initial; head-piece. Inscribed by author: Pour Monseigneur le premier president de la chambre des comptes de Dauphine [i.e. Denis Salvaing de Boissieu]. Son treshumble et tresobeissant seruiteur Chorier. Bookplate: Bibliotheque P. Couturier de Royas. Illustrated bookplate (motto: Famille, Dieu, patrie): Bibliothèque de Charles Jaillet, Viennois. [Signed] H. Lety MCMXLI. Ms. notes ([4] p.) regarding the provenance of the Newberry Library's copy bound in at end, signed: Charles Jaillet, 7 juin 1929. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."
