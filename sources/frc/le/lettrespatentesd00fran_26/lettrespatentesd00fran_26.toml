title = "Lettres patentes du roi sur les décrets de l'Assemblée nationale des 14, 15, 16, 18, 20 & 21 mars 1790, concernant la suppression de la gabelle, du quartbouillon, & autres droits relatifs à la vente des sels, à compter du 1er. avril 1790, le remplacement au marc la livre des impositions réelles & personelles de la présente année, tant de la somme de quarante millions formant les deux tiers du revenu net de la gabelle, que de celle de deux millions, faisant les deux tiers du produit net des droits de traite, perçus sur le transport des sels destinés à la consommation des provinces franches & rédimées, l'extinction des procès criminels, & autres dispositions relatives à la suppression des gabelles : donnée à Paris, le 30 mars 1790"
