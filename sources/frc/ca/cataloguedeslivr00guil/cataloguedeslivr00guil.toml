date = "1806"
note = """"Nota. Le même libraire se charge de fournir tous les livres qui ne sont point sur son catalogue, aux prix de Paris annoncés dans les journaux. Les livres seront envoyés franc de port et d'emballage à celui qui achètera pour 100 fr. et au-dessus.". Title vignette (bookseller's monogram device). "Avis aux imprimeurs. Je profite de cette occasion pour offrir à MM. les imprimeurs mes services, comme fondeur en caractères ..."--T.p. verso. With prices. Catalog (1 sheet ([2] p.)) laid in: Éditions stéréotypes d'Erhan. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Text is lost in the binding."""
