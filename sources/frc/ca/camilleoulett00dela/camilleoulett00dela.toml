note = """Prospectus for "Camille, ou, Lettres de deux filles de ce siècle", generally attributed to Samuel de Constant, sometimes to Isabelle de Charrière. Cf. Barbier, A.A. Ouvrages anonymes, t. 1, column 483. Caption title. "Permis d'imprimer, le 22 avril 1785"--P. [4]. "Prix, 8 liv. broché"--P. [1]. Includes prospectus for Nicolas Bricaire de La Dixmerie's "Les dangers d'un premier choix" and brief descriptions of 4 other titles sold by Delalain. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
