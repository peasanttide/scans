title = "Cahier contenant les remonstrances, plaintes, doléances & supplications /"
language = "fr"
place = "s.l."
date = "1789"
note = """Half title. Caption on p.[1]: Cahier contenant les très-humbles & très-respectueuses remontrances, plaintes, doléances & supplications du Tiers-etat du bailliage de Château-Thierry, assemblé en ladite ville, en vertu des lettres du roi, du 24 janvier dernier, portant convocation des Etats-généraux à Versailles le 27 avril prochain; & encore en vertu de l'ordonnance de M. le lieutenant-général audit bailliage, à défaut de M. le grand-bailli d'epée, en date du 18 février dernier. Et que le Tiers charge les députés, qui le représenteront & qui seront munis de ses pouvoirs, de porter en ladite assemblée des Etats-généraux, & de déposer aux pieds du trône. "Extrait du procès-verbal de ce qui s'est passé à l'assemblée de l'ordre du Tiers-etat du bailliage de Château-Thierry, convoquée & tenue pour la nomination de ses députés aux Etats-généraux": p.65-81. Dated at beginning: Le mardi 10 mars 1789, huit heures du matin. Martin & Walter IV 2: 3309. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br />."""
url = "https://archive.org/details/cahiercontenantl00chte"
