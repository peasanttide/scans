date = "1765"
note = """Caption title. Publication date from BN. Catalogues de libraires. "On trouve chez le même beaucoup d'autres livres, tant de France que des pays etrangers, dont il a des notes manuscrites ou imprimées, beaucoup de livres italiens, & un fonds de livres anciens sur toutes sortes de matieres. Le même libraire fait catalogues, prisées, ventes de livres, achette en gros cabinets & bibliothéques"--At end. BN. Catalogues de libraires. With prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
