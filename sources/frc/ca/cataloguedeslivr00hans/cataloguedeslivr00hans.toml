place = "Paris"
date = "1764"
note = """Caption title. Place of publication and publisher from BN. "Supplément au catalogue, 1764": [1] p. at end. Woodcut vignette at head of title. BN. Catalogues de libraires. Catalog of primarily religious literature, including Catholic missals and psalters, books for various monastic orders, Bibles, sermons, and books on theology and morality, and books on law, geography, history, arts, and sciences. With prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />Text cut off at page edges.<br />Tight margins.  Text lost in binding.<br /><br />."""
