note = """Caption title. Publication information from BN. Catalogues de libraires. Printed in double columns. "N.B. Les frais de reliure ne sont pas compris dans les prix du présent catalogue ..."--P. [1]. "On trouve dans la même librairie, à Paris et à Strasbourg, un assortiment choisi de livres français et un autre de livres étrangers, ainsi qu'un dépôt des cartes géographiques les plus estimées"--P. 8. BN. Catalogues de libraires. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
