note = """Caption title. Latest date noted in text: 1770. Printed in double columns. Atlas -- Plans des villes -- Écrans nouveaux -- Cartes d'une feuille. "On trouve chez ledit sieur des plans de Paris de toutes grandeurs, toutes les cartes de la France, publiées par l'Académie, avec une carte générale des 175 feuilles, par ordre de leur publication, divisée par province, ainsi que tout ce qu'on peur desirer en géographie. Tout ce fonds est nouveau"--At end. With prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
