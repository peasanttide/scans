date = "1770"
note = """"On trouve chez les mêmes libraires un grand nombre de livres anciens & nouveaux, tant de France que des pays etrangers. Ils achetent en gros les bibliothèques; ils font aussi ventes & prisées de bibliothèques"--P. 27. Title vignette; head-piece. BN. Catalogues de libraires. Covers books in French on a variety of topics, including the arts and sciences, law, and history; collected works of Jousse, Dézallier d'Argenville, Langlet du Fresnoy, Collet, Pothier, and Burigny; and books in Greek, Latin, and Italian. With prices. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
