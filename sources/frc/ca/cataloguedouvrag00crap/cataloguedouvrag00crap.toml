title = "Catalogue d'ouvrages proposés a un rabais considérable, qui se trouvent chez Crapart, libraire, rue de Vaugirard"
language = "fr"
place = "Paris"
date = "1774"
note = """"Crapart, libraire, rue de Vaugirard, près la place Saint Michel, à Paris, a acquis depuis peu un certain nombre des livres suivans, qu'il propose à prix de rabais jusqu'au mois d'avril prochain 1775, le tout en feuilles, passé lequel tems il n'en sera plus donné qu'au prix ordinaire"--P. [3]. Imprint from colophon. Place and date of publication from BN. Head- and tail-pieces. BN. Catalogues de libraires. Catalogue des livres françois -- Livres grecs, latins, italiens, &c. -- Livres nouveaux, ou nouvellement acquis, qui se trouvent chez le même libraire. Includes original and discounted prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
url = "https://archive.org/details/cataloguedouvrag00crap"
subject = [
    "Crapart, Nicolas, d. 1783",
    "Booksellers and bookselling",
]

