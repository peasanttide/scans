note = """Prospectus for La Platière's "Galerie universelle des hommes qui se sont illustrés dans les sciences et dans les lettres". Colophon: De l'imprimerie de Cailleau, rue Galande, n°. 64. "On souscrit à Paris, au Bureau de la Galerie universelle, au Palais Royal, n°. 160, chez M. le comte de la Platiere ... On souscrira pareillement, chez Cailleau, imprimeur-libraire, rue Galande, n°. 64, Bailly, rue Saint-Honoré, près de la barrière des sergents. Et chez tous les principaux libraires de l'Europe"--P. 8. "Cet ouvrage composera vingt-quatre volumes in-8° avec figures, que les souscripteurs payeront 96 liv."--P. 6-7. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
