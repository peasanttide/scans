note = """Prospectus for La Platière's "Galerie des hommes célèbres par leurs vertus, ou fameux par leurs crimes, depuis 1789 jusqu'à présent.". Proposed work never published? Caption title. "On adressera les renseignemens pour la perfection de l'ouvrage et pour l'inscription au citoyen Sulpice-Imbert de la Platiere, rue Caumartin, n°. 3"--P. 4. "Le prix pour les souscripteurs sera de 5 livres, valeur métallique, de 6 livres pour ceux qui ne se seront pas fait enregistrer. L'ouvrage paroîtra le 15 fructidor, an quatrième"--P. 3. Laid in: Letter of transmittal regarding the prospectus, signed: Sulpice-Imbert de la Platiere; addressed in ms: Au citoyen Adanson, membre de l'Institut, rue Chantereine, à Paris; date written in ms: 1 [?]bre 1796. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
