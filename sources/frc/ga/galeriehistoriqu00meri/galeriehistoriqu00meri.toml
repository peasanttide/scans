note = """Prospectus for Pujol de Mortry's "Galerie historique universelle.". Caption title. "On souscrit à Paris chez Mérigot le jeune, libraire, quai des Augustins; a Valenciennes chez Giard; et chez les principaux libraires des villes du royaume et de l'Europe"--P. [4]. "Permis d'imprimer, le 31 janvier 1786"--P. [4]. "Chaque livraison, composée de huit portraits et de vint-quatre pages de discours ..., se paiera 3 livres 12 sols pour les souscripteurs et 4 livres 10 sols pour les personnes qui n'auront point souscrit"--P. [4]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
