note = """Prospectus for "Gazette nationale, ou, Le moniteur universel," which began publication in 1789. Caption title. "On souscrit indistinctement pour la Gazette nationale à Paris, hôtel de Thou, rue des Poitevins, n° 18, en s'adressant au sieur Aubry, directeur du bureau de ladite Gazette; ou au bureau des Affiches de Paris, rue Neuve S. Augustin. On souscrit aussi chez tout les libraires & directeurs des postes de France; & à Londres, chez Emsly, libr. dans le Strand"--P. 4. Place of publication and printer statement from colophon. "Le prix de la feuille au débit dans Paris est de 6 sous. La première paroîtra le mardi 24 novembre"--P. 4. Includes prices for various subscription packages. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
