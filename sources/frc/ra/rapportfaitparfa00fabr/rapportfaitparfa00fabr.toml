title = "Rapport fait par Fabre (de l'Aude), au nom d'une commission spéciale, sur le message du Directoire exécutif du 3 brumaire an 6, tendant à ce que la commune de Tourteron, département des Ardennes, soit autorisée à emprunter la somme de 1500 fr., pour servir à payer le prix et les réparations de la halle et du pressoir dont elle a fait l'acquisition : séance du 14 vendémiaire an 8."
