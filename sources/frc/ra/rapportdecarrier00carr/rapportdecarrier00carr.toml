language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rapport par Carrier"--Bottom of p. 17. Martin & Walter. Révolution française. "Liberté, Égalité. Mort aux tyrans, paix aux peuples. Le gouvernement révolutionnaire jusqu'a la paix. La société populaire régénérée d'Aurillac, chef-lieu du département du Cantal, à la Convention nationale"--P. 36-40. Carrier's account of his actions in the Vendée. Also includes defense of Carrier by the Société populaire d'Aurillac. Bibliography: Martin & Walter.  Révolution française,  I, 6283. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page combined."""
