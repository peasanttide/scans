id = "rapportdelacommi00chen"
type = "book"
title = "Rapport de la commission nommée par le Directoire, le 27 août (vieux style) de l'an second de la République une & indivisible, pour vérifier les différentes dénonciations qui ont été faites, contre plusieurs administrateurs de l'Hôtel national des militaires invalides & autres agens de l'administration, & prendre des renseignemens sur tous les abus qui peuvent exister dans cet hôtel."
language = "fr"
place = "Paris"
date = "1793"
note = """Caption title. "Ce rapport a été fait au Directoire du département le 12 brumaire, de l'an 2e. de la République une & indivisible, (nouveau style)"--Bottom of p. [1]. Imprint from colophon. Martin & Walter. Révolution française. "Procès-verbal du 28 août, l'an 2e. de la République française, une & indivisible"--P.17-47. "Club des Cordeliers. Rapport sur l'organisation de la maison nationale des invalides, fait au nom de la commission établie à cet effet, par Chenaux, membre du Club des Cordeliers. Séance du vendredi 4 octobre 1793, l'an 2 de la République française, une & indivisible"--P. [49]-79. Bibliography: Martin & Walter.  Révolution française,  I, 7213. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Skewed text. Uneven binding. Damaged, stained, marked and/or loose pages."""
url = "https://archive.org/details/rapportdelacommi00chen"
subject = [
    "Hôtel royal des invalides (France)",
    "Disabled veterans",
]
