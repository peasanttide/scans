note = """Caption title. At head of title: Corps législatif. Conseil des anciens. Imprint from colophon. "Rapport de Pompeï"--Bottom of p. 9. Martin & Walter. Révolution française. "Compte général des depenses du Conseil des anciens, ordonnées par la Commission des inspecteurs, depuis le premier vendémiaire an 6, jusqu'au premier vendémiaire an 7 de la République française, sur les différens crédits qui lui ont été ouverts"--P. [19]-32. Bibliography: Martin & Walter.  Révolution française, III, 27750. Scanner's note: No copyright page found. No table-of-contents pages found.   Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
