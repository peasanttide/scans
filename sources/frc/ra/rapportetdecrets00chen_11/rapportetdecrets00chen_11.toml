title = "Rapport et décrets sur le prompt jugement des émigrés trouvés sur le territoire de la République, l'expulsion des individus rentrés après déportation, et les peines portées contre ceux qui provoqueraient l'avilissement de la représentation nationale, ou le retour à la royauté, &c. &c. : suivis du discours du cit. Louvet, représentant du peuple."
language = "fr"
place = "A Caen"
date = "1795"
note = """"Séance de la Convention nationale, du 12 floréal, an troisième de la République française. Le représentant du peuple Marie-Joseph Chénier, au nom des Comités de salut public, de sûreté générale et de législation réunis, présente le rapport suivant"--P. [1]. Imprint from colophon. Variant of Martin & Walter. Révolution française, I, 7298. Forms part of the French Revolution Collection at the Newberry Library. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text."""
