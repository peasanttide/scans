language = "fr"
place = "A Paris"
date = "1796"
note = """"Envoyé, par la Convention nationale, commissaire près les armées du nord, détenu par les Autrichiens, & mis en liberté le 5 nivôse, conjointement avec les commissaires de la Convention nationale trahis par Dumouriez. Fait au Conseil des cinq-cents, le 24 nivôse, l'an IV de la République française, une & indivisible"--P. [3]. Imprint from colophon. "Rapport de Drouet"--Bottom of p. 11. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text."""
url = "https://archive.org/details/rapportdureprese00drou"
