title = "Rapport fait a la Convention nationale, au nom du Comité de salut public, par Billaud-Varenne, dans la séance du premier floréal, l'an 2 de la République une & indivisible, sur la théorie du gouvernement démocratique, & sa vigueur utile pour contenir l'ambition, & pour tempérer l'essor de l'esprit militaire, sur le but politique de la guerre actuelle, & sur la nécessité d'inspirer l'amour des vertus civiles par des fêtes publiques & des institutions morales."
