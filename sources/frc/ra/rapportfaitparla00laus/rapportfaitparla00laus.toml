title = "Rapport fait par Laussat, au nom d'une commission, sur la résolution du 29 fructidor an 7 qui ordonne que les produits bruts des revenus publics en régie et les frais administratifs de leur régie seront compris dans les états annuels des recettes et dépenses à dresser par les ministres, et que lesdits frais seront partie des crédits à ouvrir aux ministres par le Corps législatif : séance du sixième jour complémentaire an 7."
language = "fr"
place = "A Paris"
date = "1799"
note = """Caption title. At head of title: Corps législatif. Conseil des anciens. Imprint from colophon. "Rapport de Laussat"--Bottom of p. 5. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 19719. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Damaged, worn pages and cover. Discolored pages. Skewed text."""
