#:schema ../../../../schemas/source.json
layer = "source"
id = "rapportfaitparro00rouy"
type = "pamphlet"
title = "Rapport fait par Rouyer, député du département de l'Hérault, sur la solde des troupes d'artillerie de la marine, des administrateurs et officiers attachés au service des vaisseaux de l'Etat, et des matelots : séance du 17 floréal an 5."
language = "fr"
place = "A Paris"
date = "1797"
note = """At head of caption title: Corps législatif, Conseil des cinq-cents. "Rapport de Rouyer"--Bottom of p. 9. Martin & Walter. Révolution française. Tables on p. 11-20: Tarif de la solde des officiers de la marine -- Tarif de la solde des administrateurs de la marine -- Tarif de la solde des troupes d'artillerie de la marine -- Tarif de la solde des ingénieurs, constructeurs, directeurs des mouvemens des ports, chefs de mouvemens d'artillerie, sous-chefs de mouvemens et d'artillerie, ingénieurs des bâtimens civils, élèves ingénieurs -- Tableau des apppointemens [sic] des trois examinateurs -- hydrographeset des professeurs des ecoles d'ydrographie [sic] -- Solde des militaires employés de l'artillerie, et des employés non militaires qui sont attachés aux forges, fonderies et manufactures d'armes de la marine -- Tarif de la solde des officiers mariniers, de manœuvre, pilotage, canonnage, charpentage et voilerie, et de celle des matelots-novices et mousses --Tarif de la solde des officiers de santé de la marine. Bibliography: Martin & Walter.  Révolution française,  IV:1, 30270. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Skewed text."""
url = "https://archive.org/details/rapportfaitparro00rouy"
subject = ["France. Marine"]
extent = "23 p. ; 20 cm."

