title = "Rapport sur l'ere de la République /"
language = "fr"
place = "Paris"
date = "1793"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rap. sur l'ère de la Rép. par G. Rome"--Bottom of p. 9. Martin & Walter. Révolution française. Two tables on folded leaves. Proposes the adoption of a metric time system and a French calendar. The names proposed for the days, weeks, and months were not adopted. Inscribed by author: À la Societé des cordeliers, G. Romme. Bibliography: Martin & Walter.  Révolution française,  IV:1, 29850. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
