type = "pamphlet"
title = "Rapport adressé a MM. les honorables membres du Comité civil du district des Mathurins, remis par M. le chevalier de Favanne, capitaine, à M. le président Desperat, vendredi 24 juillet 1789, de la part de M. le chevalier Quesnay de Beaurepaire, ancien commandant en chef des milices parisiennes du district des Mathurins."
language = "fr"
place = "Paris"
date = "1789"
note = """Caption title. Signed, p. 21: Le chr. Quesnay de Beaurepaire, ancien commandant en chef de la milice parisienne des Mathurins, président de l'Académie des sciences & beaux-arts de Richemond en Virginie. Imprint from colophon. Place and date of publication from Martin & Walter. Martin & Walter. Révolution française. "Réponse du Comité à M. le chevalier Quesnay de Beaurepaire"--P. 23. "Copie d'un procès-verbal des citoyens du district de St. André-des-Arcs, envoyé à MM- de l'Etat-Major de l'hôtel-de-ville de Paris, le 30 juillet, à sept heures du soir"--P. 25-27. "Copie du récit des tentatives du district des Mathurins, pour se procurer des armes & munitions dans la journée du lundi 13 juillet 1789"--P. 27-30. "Avis aux citoyens"--P. 32. Bibliography: Martin & Walter.  Révolution française,  IV, 28439. Scanner's note: No Copyright found. No Table of Contents found.  Damaged, stained pages and cover. <br />."""
url = "https://archive.org/details/rapport00unse_96"
subject = [
    "Quesnay de Beaurepaire, Alexandre Marie, 1755-1820",
    "Insurgency",
]
extent = "32 p. ; 19 cm."

