title = "Rapport fait à la Convention nationale au nom du comité de salut public, par Billaud-Varenne, dans la séance du premier floréal, l'an 2 de la République une et indivisible, sur la théorie du gouvernement démocratique et sa vigueur utile pour contenir l'ambition, et temperer l'essor de l'esprit militaire, sur le but politique de la guerre actuelle, et sur la nécessité d'inspirer l'amour des vertus civiles par des fêtes publiques et des institutions morales : imprimé par ordre de la Convention nationale."
