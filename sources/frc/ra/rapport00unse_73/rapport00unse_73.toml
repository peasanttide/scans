title = "Rapport fait par d'Outrepont, député de la Dyle, au nom d'une commission spéciale composée des représentans du peuple Bohan, Decaigny, Louvet & d'Outrepont, sur la question de savoir si une déclaration de jury de jugement peut être annullée pour une partie, & être maintenue & produire son effet pour l'autre, & si, en vertu des articles 396 & 414 de la loi du 3 brumaire, la nullité d'une partie ne frappe pas nécessairement sur la totalité? : séance du 24 messidor an 6."
