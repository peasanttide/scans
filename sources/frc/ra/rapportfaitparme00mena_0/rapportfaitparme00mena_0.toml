title = "Rapport fait par Ménard-Lagroye, sur une pétition du citoyen Alhoy, premier instituteur et chef de l'ecole nationale des sourds-muets de Paris, tendante à faire adopter un moyen simple et facile pour assurer l'existence de cette école, et pour en conserver et créer d'autres également précieuses à l'humanité : séance du 13 vendémiaire an 8."
language = "fr"
place = "Paris"
date = "1799"
note = """Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. "Rapport de Ménard-Lagroye"--Bottom of p. 9. Martin & Walter. Révolution française. "Eclaircissemens sur le projet d'assurance pour l'entretien des écoles nationales des sourds-muets et aveugles-nés, fournis par les instituteurs en chef de ces écoles à Paris"--P. 13-19; signed: Alhoy, premier instituteur des sourds-muets. Haüy, premier instituteur des aveugles-travailleurs. Bibliography: Martin & Walter.  Révolution française,  III, 23780. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
