title = "Rapport et projet de décret présentés au nom du Comité de liquidation par J.B. Lecarpentier, député du département de la Manche à la Convention nationale, sur une avance à faire à la commune de Lille, à compte sur l'indemnité qui lui est due par la nation française, pour les dommages qu'elle a essuyés lorsque les ennemies l'ont bombardée à la fin de septembre, & au commencement d'octobre derniers."
