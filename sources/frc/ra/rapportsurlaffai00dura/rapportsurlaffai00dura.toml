note = "Caption title. Imprint from colophon. Publication date from Martin & Walter. Martin & Walter. Révolution française. BN. Monglond, A. France révolutionnaire et impériale. In the spring of 1790 the curate of Saint-Sulpice had refused to publish the bans of marriage of the actor François Joseph Talma. Talma in turn refused to renounce his profession for the purposes of the church ceremony. Cf. Carlson, M. The theatre of the French Revolution (Ithaca, 1966), p. 41. Bibliography: Martin & Walter.  Révolution française,  II, 12412. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained pages and cover. Title on cover page. Skewed text."
