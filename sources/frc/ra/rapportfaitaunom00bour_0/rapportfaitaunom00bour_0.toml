note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rap. et détails, par Léonard-Bourdon"--Bottom of p. [5]. Martin & Walter. Révolution française. "Décret de la Convention nationale, du 26 fructidor"--P. 3-4. "Détails de la fête que la Convention nationale a décrétée le 26 fructidor, pour être célébrée le quintidi des sans-culottides"--P. [5]-9. "Programme de la musique à exécuter pendant la fête"--P. 9-10. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Martin & Walter.  Révolution française, I, 4767. Scanner's note: No copyright found. No table of contents found. Title on cover. Damaged, stained pages and cover. <br />."""
