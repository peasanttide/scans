title = "Rapport fait a la Convention nationale au nom de ses Comités de marine, colonial et des finances, réunis, de la demande formée par le ministre de la marine d'un fonds de 48,672,263 livres 9 sols 8 deniers, pour les besoins de son département /"
language = "fr"
place = "Paris"
date = "1792"
note = """Caption title. At head of title: Convention nationale. "Imprimé par ordre de la Convention nationale"--P. [1]. Imprint from colophon. "Le 19 du même mois il a présenté à la Convention un mémoire, où, ... il articule formellement la demand d'un fonds de 43,672,263 liv. 9 sols 8 dernier pour subvenir aux besoins urgens du département de la marine & des colonies, pour le reste de l'année 1792"--P. 2. "Rapport par M. Marec"--Bottom of p. 17. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 23008."""
