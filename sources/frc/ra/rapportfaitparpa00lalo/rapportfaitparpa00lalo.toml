title = "Rapport fait par P.A. Laloy, au nom d'une commission spéciale chargée d'examiner, 1.̊ Le message du Directoire exécutif concernant la loi qui doit déterminer le genre de preuves nécessaires aux ci-devant nobles et anoblis pour s'élever au rang de citoyen français ; 2.̊ Les différentes pétitions et observations adressées au Conseil sur ce point ; 3 ̊De déterminer la forme dans laquelle devra être faite la preuve exigée par l'art. II de cette loi du 9 frimaire, pour rendre l'exception applicable : séance du 6 ventôse an 6."
