title = "Rapport sur le décret général relatif aux départemens du royaume."
language = "fr"
place = "s.l."
date = "1789"
note = """Caption title. Without imprint. Opening sentence: En vous proposant de terminer la division du royaume en départemens & en districts par un décret général, votre Comité de constitution regrette de n'avoir plus pour organe le citoyen ... qui vous a rapporté ... le plus grand nombre des résultats du travail de vos commissaires. "La division du royaume en départemens & en districts n'est décretée, quant à présent, que pour l'exerciser du pouvoir administratif ...": p.16. Not in Martin & Walter. Imperfect: p.[1]-[2] (t.p.?) wanting. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages. Pages appear to be missing. Page numbers start with 4."""
url = "https://archive.org/details/rapportsurledcre00fran"
extent = "16 p. ; 20 cm."

