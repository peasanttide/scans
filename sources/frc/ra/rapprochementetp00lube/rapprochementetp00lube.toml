title = "Rapprochement et parallèle des souffrances de Jésus-Christ, avec celles de Louis XVI, dit le bienfaisant, dans sa prison royale : dédiés a Sa Sainteté Pie VI, vicaire de J.C., à tous les ordres hiérarchiques de l'Eglise universelle, aux rois chrétiens de la terre, à la famille royale de France, et à tous les généreux français des deux sexes, restés constamment fidèles à Dieu, à leur roi, à leur honneur /"
language = "fr"
place = "A Paris"
date = "1792"
