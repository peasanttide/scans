title = "Rapport fait par Andrieux, au nom d'un commission speciale, sur une nouvelle fixation du traitement des juges des tribunaux civils & criminels & des juges-de-paix, à compter du premier vendémiaire de l'an 7, sur la nécessité de pourvoir incessamment à l'acquit de l'arriéré de ces traitmens antérieur à l'an 7, & à leur paiement exact de mois en mois à l'avenir : et message du Directoire exécutif, imprimé à la suite par ordre du conseil : séance du 8 brumaire de l'an 7"
language = "fr"
place = "A Paris"
date = "1798"
note = "Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. Martin & Walter. Révolution française. Tables on folded leaves: No. I. État des traitemens et indemnités des juges civils, des présidens des tribunaux criminels et accusateurs publics, a compter du premier vendémiaire an VII -- No. II. État des traitemens des juges de paix, dans toutes les communes de la République, à compter du premier vendémiaire de l'an 7. Bibliography: Martin & Walter.  Révolution française, I, 273. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."
