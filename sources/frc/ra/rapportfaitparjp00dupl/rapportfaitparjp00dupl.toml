title = "Rapport fait par J.P.F. Duplantier, député du département de la Gironde, au nom de la commission spéciale, chargée d'organiser les tribunaux de commerce d'après les formes & suivant les principes constitutionnels & de fixer leur arrondissement d'une manière uniforme dans toute l'étendue de la République, suivi du projet de résolution : séance du 12 nivose an 7."
