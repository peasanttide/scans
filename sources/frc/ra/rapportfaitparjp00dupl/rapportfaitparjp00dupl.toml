place = "A Paris"
date = "1799"
note = """Caption title. At head of title: Corps législatif, Conseil des cinq-cents. Imprint from colophon. "Rapport par Duplantier"--Bottom of p. 17. "Les membres de la commission sont les représentans du peuple Pollart, Crevelier, Guillemot, Pelissier & le rapporteur"--P. [1]. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 12068. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Inconsistent page size. Damaged pages."""
