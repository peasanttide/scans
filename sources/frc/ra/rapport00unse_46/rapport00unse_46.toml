title = "Rapport fait par M. Morel (de la Marne), au nom d'une commission spéciale, sur un message du Directoire exécutif du 27 thermidor an 7, tendant à autoriser l'agent municipal de la commune de Drosnay canton de Giffaumont, département de la Marne, à imposer une somme de onze cents francs sur les contribuables de la même commune : séance du 27 vendémiaire an 8."
