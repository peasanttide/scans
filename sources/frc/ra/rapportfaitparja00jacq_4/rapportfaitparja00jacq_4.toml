title = "Rapport fait par Jacqueminot, au nom d'une commission spéciale, sur cette question, proposée par un message du Directoire et par des pétitionnaires, Les débiteurs de personnes condamnées révolutionnairement, qui, pendant la durée de la confiscation, se sont libérés au trésor public, en conformité des lois alors existantes, peuvent-ils, depuis la loi du 21 prairial an 3, être poursuivis hypothécairement par les créanciers des condamnés? : séance du 12 thermidor an 7."
