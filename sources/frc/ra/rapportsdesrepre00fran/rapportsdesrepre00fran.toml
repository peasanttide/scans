#:schema ../../../../schemas/source.json
layer = "source"
id = "rapportsdesrepre00fran"
type = "book"
title = "Rapports des représentans du peuple Camus, Bancal, Quinette, Lamarque, envoyés par la Convention nationale, conjointement avec le général et ministre de la guerre Beurnonville, à l'armée du Nord, par décret du 30 mars 1793, et du représentant du peuple Drouet : lus au Conseil des cinq-cents, les 22, 23 et 27 nivôse, l'an IVe. de la République française, une et indivisible."
language = "fr"
place = "À Paris"
date = "1796"
note = "At head of title: République française. Imprint from colophon. Publication date based on Martin & Walter. Variant of Martin & Walter. Révolution française, IV:2, 3828. Includes bibliographical references. No. 3. Discours du président aux citoyens admis à la barre du Conseil, qui ont partagé la captivité des représentans du peuple Camus, Bancal, Quinette, Lamarque et Drouet -- No. 4. Rapports des représentans du peuple Camus, Bancal, Quinette et Lamarque -- No. 5. Rapport du représentant du peuple Drouet, envoyé ... commissaire près les armées du Nord, détenu par les Autrichiens, et mis en liberté le 5 nivôse, conjointement avec les commissaires de la Convention nationale trahis par Dumouriez ... -- No. 6. Manifeste de la Convention nationale ... publié au mois d'avril 1793 ... -- No. 7. Extrait du procès-verbal des séances du Conseil des cinq-cents, relatif à l'arrivée ... des représentants ... Camus, Lamarque, Quinette et Bancal ... -- No. 8. Lois qui ordonnent l'impression ... des rapports, récits, discours et manifeste ci-dessus. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover page."
url = "https://archive.org/details/rapportsdesrepre00fran"
subject = [
    "Dumouriez, Charles François Du Périer, 1739-1823",
