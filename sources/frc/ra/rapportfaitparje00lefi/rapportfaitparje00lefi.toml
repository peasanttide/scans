title = "Rapport fait par Jean-Alban Lefiot, député du département de la Nièvre, d'une mission qu'il a commencé à remplir, en qualité de représentant du peuple, le 27 frimaire, & qui a cessé le 9 germinal, dans les départemens du Cher, de la Nièvre & du Loiret."
language = "fr"
place = "A Paris"
date = "1795"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. First of two parts, the second of which was published in 1795. Cf. Martin & Walter. Révolution française, II, 20545. Date of publication based on second part. "Rapport par Lefiot"--Bottom of p. 9. Not in Martin & Walter. Révolution française. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, discolored pages. Damaged cover. Skewed text. Faint text."""
