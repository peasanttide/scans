title = "Rapport et projet de décret, présentés au nom du Comité de législation, par François-Siméon Bezard, citoyen du département de l'Oise, représentant du peuple, sur les lettres-patentes accordées pour des cas particuliers, enregistrées sans opposition, sur les arrêts de propre mouvement, & autres des ci-devant Conseils, rendus sans parties présentes ou appellées, ni pièces vues; et sur l'interprétation de l'art. 6 de la loi du 12 octobre 1790, avec un compte succinct de la pétition du citoyen Wargemont, renvoyée au Comité le 23 octobre dernier imprimés par ordre du Comité de législation."
language = "fr"
date = "1792"
