title = "Rapport fait a la Convention nationale au nom de son Comité des six, établi pour analyser les projets de constitution : sur le titre premier du projet du Comité des neuf, concernant la division du territoire de la République /"
language = "fr"
place = "Paris"
date = "1793"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. Martin & Walter. Révolution française. "Addition. Le Comité des six vient de recevoir de Vitré, des observations anonymes sur le projet de constitution du Comité. Il a trouvé l'article suivant, sur la division du territoire, assez intéressant pour le faire imprimer à la suite de ce rapport"--P. 13-15. Includes bibliographical references. Bibliography: Martin & Walter.  Révolution française,  III, 19132."""
