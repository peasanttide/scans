title = "Rapport fait par Luminais, au nom d'une commission spéciale composée des représentants du peuple Jean Debry, Mortier Du Parc, Roger Martin, Gay-Vernon et Luminais, concernant le mode de surveillance à établir sur les chefs d'établissements particuliers d'instruction et d'éducation, et sur tous les individus privés qui enseignent, soit chez eux, soit chez les autres : séance du 28 nivôse an 6."
