title = "Rapport fait a la Convention nationale, dans la séance du 17 fructidor, an 3, au nom des Comités de salut public, de sureté générale et de législation, sur le général A.-P. Montesquiou /"
language = "fr"
place = "Paris"
date = "1795"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rapport, par Doulcet"--Bottom of p. 5. Martin & Walter. Révolution française. Supports Montesquiou-Fezensac's reinstatement as a French citizen, calling for the repeal of the decree of accusation leveled against him 9 November 1792. Bibliography: Martin & Walter.  Révolution française,  IV:1, 27813. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding. Large portion missing from back cover."""
url = "https://archive.org/details/rapportfaitlacon00doul"
