title = "Rapport fait a la Convention nationale par Dentzel, député du Bas-Rhin, et envoyé par elle le 3 juillet 1793, l'an deux de la République française, en qualité de représentant du peuple, pour l'organisation du district établi à Landau, & adjoint par le même décret aux commissaires de l'armée du Rhin avec les mêmes pouvoirs."
