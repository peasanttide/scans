type = "pamphlet"
title = "Rapport fait au nom d'une commission spéciale, par Michaud, sur une réclamation du citoyen Marchand, de la commune de Baume, département du Doubs, tendante à ce que l'exécution d'un arrêté, par lequel le représentant du peuple Saladin l'a destitué de ses fonctions, ne puisse l'empêcher de profiter de l'exception que renferme la loi du 3 brumaire, en faveur des parens d'émigrés qui ont rempli sans interruption des fonctions publiques : séance du 18 ventôse an 6."
language = "fr"
place = "A Paris"
date = "1798"
note = "Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 24191. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Skewed text. Worn, damaged pages and cover."
