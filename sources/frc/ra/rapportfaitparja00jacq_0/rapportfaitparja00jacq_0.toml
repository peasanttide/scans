title = "Rapport fait par Jacqueminot, au nom d'une commission spéciale, sur les poursuites dirigées contre les cautions simples des émigrés reconnus solvables, contre les cédans avec garantie des créances sur des émigrés solvables, contre les héritiers des personnes condamnées révolutionnairement, & contre ceux qui, ayant été inscrits sur des listes d'émigrés, n'ont été rayés définitivement qu'après la vente de tout ou partie de leurs biens immeubles : séance du troisième jour complémentaire an 6."
language = "fr"
place = "A Paris"
date = "1798"
