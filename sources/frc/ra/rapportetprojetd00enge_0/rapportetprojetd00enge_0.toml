title = "Rapport et projet de décret par Engerran, député de la Manche, faits au nom des Comités de législation, de commerce et des finances, sur le mode de disposition des objets dépendans des sociétés de manufactures et de commerce dans lesquelles la République est intéressée, à titre de confiscation, et sur le besoin de la cession par expertise de quelques biens nationaux, pour cause d'utilité publique : imprimés par ordre de la Convention nationale."
