title = "Rapport fait a la Convention nationale, au nom du Comité de salut public, par Billaud-Varennes, dans la séance du premier floréal, l'an II de la République une et indivisible, sur la théorie du gouvernement démocratique, et sa vigueur utile pour contenir l'ambition, et pour tempérer l'essor de l'esprit militaire, sur le but politique de la guerre actuelle, et sur la nécessité d'inspirer l'amour des vertus civiles par des fêtes publiques et des institutions morales."
