note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rap. et détails, par Léonard-Bourdon"--Bottom of p. [5]. Martin & Walter. Révolution française. "Décret de la Convention nationale, du 26 fructidor"--P. 3-4. "Détails de la fête que la Convention nationale a décrétée le 26 fructidor, pour être célébrée le quintidi des sans-culottides"--P. [5]-9. "Programme de la musique à exécuter pendant la fête"--P. 9-10. Bibliography: Martin & Walter.  Révolution française,  I, 4767. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Discolored pages."""
