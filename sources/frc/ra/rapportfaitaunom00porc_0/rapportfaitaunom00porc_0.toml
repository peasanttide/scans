note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Rapport par Porcher"--Bottom of p. 5. Martin & Walter. Révolution française. Recounts the brutality of Cousin and annuls a judgment condeming 17 of his victims to death for contumacy. Bibliography: Martin & Walter.  Révolution française,  IV:1, 27827. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text.  Irregular pagination."""
