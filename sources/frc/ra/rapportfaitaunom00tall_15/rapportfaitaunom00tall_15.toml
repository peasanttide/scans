title = "Rapport fait au nom du Comité de division, par M. Thevenin, député du département du Puy-de-Dôme, sur les difficultés présentées à l'Assemblée nationale par le conseil-général du département de l'Oise, en interprétation du décret du 19 septembre dernier, concernaut [sic] le tirage auquel il a été procédé par les corps administratifs, de la moitié des membres des directoires qui devoient sortir par le sort, avant la nomination des députés à la législature : imprimé par ordre de l'Assemblée nationale, et ajourné à jeudi."
language = "fr"
place = "A Paris"
date = "1791"
