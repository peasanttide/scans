id = "rapportfaitaub00unse_0"
type = "pamphlet"
title = "Rapport fait par Aubert, au nom d'une commission spéciale, sur deux messages du Directoire exécutif, des 25 frimaire et 4 floréal an 7, relatifs aux restitutions consenties par le traité de Bâle, et au mode de liquidation de la dette publique à l'égard des étrangers non domiciliés en France, et qui ont traité avec la République pour des fournitures provenant de leur propre sol, et payables en numéraire dans leur propre pays avant le premier vendémiaire an 5 : séance du 16 fructidor an 7"
language = "fr"
place = "Paris"
date = "1799"
note = """Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. "Rapport par Aubert"--Bottom of p. 9. Martin & Walter. Révolution française. Rapport fait par Aubert, au nom d'une commission spéciale, sur deux messages du Directoire exécutif, des 25 frimaire et 4 floréal an 7, relatifs aux restitutions consenties par le traité de Bâle, et au mode de liquidation de la dette publique à l'égard des étrangers non domiciliés en France, et qui ont traité avec la République pour des fournitures provenant de leur propre sol, et payables en numéraire dans leur propre pays avant le premier vendémiaire an 5 -- No. 1er. Première classe. Apperçu qui indique, par approximation, la nature, le nombre et le montant des créances des Espagnols qui sont créanciers de la République française -- No. II. Deuxième classe. Réquisition d'effets en nature et expropriation, en vertu de la loi du maximum -- No. III. Troisième classe. Inteceptation de la correspondance -- No. IV. Quatrième classe. Réclamations relatives à Saint-Sébastien de Guipuzcoa, pendant qu'elle étoit soumise aux armées françaises -- No. V. Cinquième classe. Rentes -- No. VI. État par apperçu des sommes dues aux négocians étrangers. Bibliography: Martin & Walter.  Révolution française, I, 627. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
url = "https://archive.org/details/rapportfaitaub00unse_0"
subject = [
    "France. (1795 July 22)",
    "Debts, External",
    "Restitution",
]
extent = "16 p. ; 25 cm."

