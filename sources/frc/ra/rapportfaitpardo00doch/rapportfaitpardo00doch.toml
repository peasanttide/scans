title = "Rapport fait par Doche-Delisle (de la Charente), au nom d'une commission spéciale, sur le traitement des greffiers & commis-greffiers des tribunaux criminels, correctionnels & des juges-de-paix, sur l'établissement & le mode de perception au profit du trésor public de droits de greffe sur les expeditions & actes délivrés à partie civile dans les tribunaux criminels et correctionnels, et sur ceux à établir par addition à la loi du 21 ventôse sur les actes, prescrits par celle du 11 brumaire concernant les expropriations forcées : séance du 13 floréal an 7."
