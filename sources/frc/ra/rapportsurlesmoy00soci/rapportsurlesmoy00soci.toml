type = "book"
title = "Rapport sur les moyens d'améliorer l'agriculture dans le district de Romans : fait à la Société populaire de ce chef-lieu et de l'Unité-sur-Izere réunis, dont l'impression a été ordonnée par l'administration du district."
language = "fr"
place = "France"
date = "1794"
note = "Caption title. Dated, p. 63: 17 vendémiaire, l'an troisieme de la République. Not in Martin & Walter. Révolution française. La Commission d'agriculture et des arts, aux habitans des campagnes -- Principes généraux sur l'etablissement des prairies artificielles -- De la culture alternative des trefles et des graines, surtout dans les terres qui ne sont pas très-fécondes -- De l'alternat des Luzernes avec les grains -- Instruction sur les moyens de conserver la pomme-de-terre pendant plusieurs années, sans aucune altération, et de l'employer avec succès dans la fabrication du pain / par Jean Guillaume, membre de la société libre d'économie rurale de Paris -- Instruction sur la culture du pavot simple, improprement appelé œillet ou œillette, ou oliette, et sur les avantages de sa graine pour faire de l'huile, publiée par la Commission d'agriculture et des arts -- Instruction sur la culture et l'usage des choux colsacs, publiée par la Commission d'agriculture et des arts -- Extrait du registre des délibérations du directoire du district de Romans. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover. Irregular pagination. Page number 62 missing."
