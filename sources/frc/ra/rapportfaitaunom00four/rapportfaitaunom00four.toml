language = "fr"
place = "A Paris"
date = "1795"
note = """Caption title. At head of title: Convention nationale. "Imprimé par ordre de la Convention nationale.". Imprint from colophon. "Rapport par Fourcroy, du 14 nivôse."--Bottom of p. 9. Not in Martin & Walter. Révolution française. Discusses advances in military technology including saltpeter, steel, hot air balloons, the telegraph, and shipbuilding materials, as well as developments in the leather tanning process. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Skewed text. Damaged, stained, loose pages. Uneven binding."""
