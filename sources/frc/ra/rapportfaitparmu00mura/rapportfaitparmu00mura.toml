#:schema ../../../../schemas/source.json
layer = "source"
id = "rapportfaitparmu00mura"
type = "pamphlet"
title = "Rapport fait par Muraire, au nom de la commission chargée d'examiner la résolution du Conseil des cinq-cents sur ces deux questions : la déclaration d'un jury d'accusation portant qu'il n'y a pas lieu à accusation, peut-elle être dénoncée à un tribunal criminelle sous prétexte que les formalités prescrites par la loi n'ont pas été observées? Et d'après la cassation qui seroit prononcée, le prévenu devroit-il être renvoyé devant un autre directeur de jury? : lorsqu'un jugement de condamnation ou d'absolution a été cassé sur le seul réquisitoire du commissaire du pouvoir exécutif près le Tribunal de cassation, sans que le condamné ou le commissaire près le tribunal criminel se soient pourvus dans le délai prescrit par la loi, ce jugement doit-il cependant exister et avoir son exécution? : séance du 13 nivôse, an V."
language = "fr"
place = "Paris"
date = "1797"
note = """Caption title. At head of title: Corps législatif, Conseil des anciens. Imprint from colophon. "Rapport par Muraire"--Bottom of p. 9. Martin & Walter. Révolution française. Includes bibliographical references. Bibliography: Martin & Walter.  Révolution française,  III, 25531. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover."""
