title = "Rapport fait par Boulay (de la Meurthe), au nom de la commission chargée de présenter ses vues sur les deux problèmes suivans, 1o. Quelles sont les mesures d'ostracisme, d'exil & d'expulsion les plus convenables aux principes de justice & de liberté, & les plus propres à consolider la République? 2o. Y ayant entre le Corps législatif & le Directoire une opposition telle que la marche du gouvernement soit entravée & la chose publique compromise, quel est le moyen politique & régulier, le plus capable de prévenir cette crise, & de rétablir la marche constitutionnelle des pouvoirs : chargée aussi de présenter des mesures sur les ci-devant nobles & anoblis : séance du 25 vendémiaire an 6."
language = "fr"
place = "A Paris"
date = "1797"
