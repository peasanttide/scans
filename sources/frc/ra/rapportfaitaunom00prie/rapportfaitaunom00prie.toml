title = "Rapport fait au nom du Comité d'instruction publique, sur la nécessité et les moyens d'introduire dans toute la république les nouveaux poids et mesures précédemment décretés : suivi d'un projet de décret, et d'une note instructive /"
language = "fr"
place = "A Paris"
