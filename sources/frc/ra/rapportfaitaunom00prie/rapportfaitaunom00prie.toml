note = """At head of title: Convention nationale. "Imprimés par ordre de la Convention nationale.". "Rapport par C.A. Prieur"--Bottom of p. 17, first sequence. Variant of Martin & Walter. Révolution française, IV:1, 28230. Rapport fait au nom du Comité d'instruction publique, sur la nécessité et les moyens d'introduire dans toute la république les nouveaux poids et mesures précédemment décretés -- Note instructive sur les poids et mesures a joindre au rapport de C.A. Prieur (de la Côte-d'Or), lue à la Convention nationale le 11 ventôse, an troisième -- Vocabulaire des measures républicaines, contenant l'indication de leurs valeurs et de leurs principaux usages -- Table sommaire des rapports et écrets concnernant les poids et measures. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
