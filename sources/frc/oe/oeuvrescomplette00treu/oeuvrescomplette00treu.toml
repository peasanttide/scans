note = """Prospectus for: Oeuvres complettes de Louis de Saint-Simon. Strasbourg, 1791. Caption title. "Prix 39 livres brochés, et franc de port en province 45 liv. On en a tiré 25 exemplaires sur papier vélin, prix 84 livres"--P. [1]. Laid in: Letter of transmittal dated "le 18 may 1791" regarding the publication of the proposed edition of Saint-Simon's works, signed in ms.: Onfroy, libraire, rue St Victor, no 11. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
