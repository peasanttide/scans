language = "fr"
place = "A Paris"
date = "1789"
note = """Prospectus for an edition of selected works of Jean-François de Bastide that was never published. "Ce choix contiendra douze volumes in 8°., de vingt-quatre feuilles chacun, divisés en deux parties; le prix de chaque partie sera de quarante sous; il en paroîtra une nouvelle tous les premiers du mois, à commencer du premier de juillet prochain."--T.p. verso. Blank subscription form on t.p. verso. Title vignette; head-pieces. Includes "Avant-propos" and biographical notice for Bastide. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
