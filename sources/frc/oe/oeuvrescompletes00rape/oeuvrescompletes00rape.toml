note = """Prospectus for: Œuvres complètes de Buffon. Paris, 1817-1818. Caption title. At head of title: Par souscription. "On souscrit à Paris, chez Rapet, commissionnaire en librairie et fournitures de bureaux, rue Saint-André-des-Arcs, n°. 41"--P. 3. "Le prix de chaque volume avec figures, pour toutes les personnes qui souscriront avant la fin de juin, sera de 12 fr. sur papier carré superfin d'Auvergne, et de 30 fr. pour le papier vélin ... passé l'époque de la souscription, les volumes seront portés de rigueur à 15 fr. Le premier volume paraîtra dans les premiers jours de juillet"--P. 3. List of booksellers in cities both provincial and abroad, p. 3-4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
