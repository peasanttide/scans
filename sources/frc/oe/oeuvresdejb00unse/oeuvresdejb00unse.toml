note = """Prospectus for an edition of Jean-Baptiste Rousseau's collected works, edited by Abbé Seguy and published in 1743. Caption title. "On déclare que la souscription ne sera ouverte que pendant six mois, à compter du premier du prémier jour d'aoust 1741, datte de ce programme"--P. [2]. "On pourra souscrire a Paris chez Didot, libraire, quai des Augustins, à la Bible d'or; a Londres chez M. Carpentier, à l'hôtel de S.E. Mr. l'ambassadeur de la reine de Hongrie; dans les villes de l'empire aux bureaux des postes impériales; dans les villes des Pays-Bas chez les directeurs des postes; a Dresde chez M. Boutet, sécretaire de Mr. l'Envoyé extraordinaire de France; a Vienne en Autriche chez Mr. de Schmids, agent de plusieurs princes de l'empire; a Francfort sur le Mein chez Fr. Varrentrapp, libraire"--P. [2]. "Le prix sera de seize livres de France chaque volume"--P. [2]. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page."""
