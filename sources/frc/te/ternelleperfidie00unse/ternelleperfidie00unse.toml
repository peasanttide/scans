title = "Éternelle perfidie des Condés : preuves qu'ils ont depuis 250 ans sans cesse sacrifié, par toutes sortes de crimes, le bien & le repos de la nation à leur ambition & à leur ressentiment de vengeance ; & que l'on doit faire & parfaire le procès à Louis-Joseph de Bourbon-Condé en sa présence ou par contumace, s'il retarde à rentrer en France ; pour servir de réponse à une feuille sédutrice contenant une fausse expression des sentimens de Louis-Joseph de Bourbon-Condé, qui s'est répandu dans Paris avec profusion, à l'instant qu'il se proposoit de consommer le plus grand des forfaits, & d'exécuter les projets les plus coupables."
language = "fr"
place = "Paris"
date = "1791"
