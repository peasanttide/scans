note = """Dedication signed: Bouillet, doct. en médec. de la Fac. de Montpellier, profess. de mathem. Proposed work never published. Cf. Eloy, N.F.J. Dict. historique de la médecine. Title vignette; head-pieces. "Tout l'ouvrage sera divisé en vingt livres, qui formeront environ sept volumes in-quarto, beau caractere, ou autant de volumes in-douze, plus petit caractere"--P. 4, second sequence. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
