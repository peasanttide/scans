note = """Caption title. Signed: Foucaud, défenseur officieux, juge de paix de la cité à Limoges. Imprint from colophon. Not in Martin & Walter. Révolution française. "Lettre du citoyen Peskai, membre du Conseil des anciens, au citoyen Lafond, secrétaire de Saulnier, commissaire du Directoire exécutif près les tribunaux civil et criminel. Paris, le 13 thermidor l'an 5, rue des Petits-Augustins, no. 1249"--P. 13-14. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page is on the cover. Skewed text. Damaged, loose pages. Uneven binding."""
