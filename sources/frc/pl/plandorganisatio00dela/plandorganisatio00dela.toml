id = "plandorganisatio00dela"
type = "book"
title = "Plan d'organisation applicable à la Constitution qui convient le mieux à la République française : dédie aux Amis de la loi & à leurs fondateurs /"
language = "fr"
place = "A Paris"
date = "1795"
note = """"Cet ouvrage, qui admet aussi en principe l'unité & l'indivisibilité de la République, 1o. réunit les corps législatif, exécutif, administratif & judiciaire, sous la surveillance d'un corps de patriciens représentans du peuple, ce qui forme le Sénat de France. 2o. Il offre une nouvelle division absolument neuve, plus éclairée & plus agréable de la France, en départements, districts & communes, 3o. Il offre toutes sortes d'établissemens que commandent l'humanité, la justice & l'intérêt national.". Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 9778. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
