title = "Plan d'une nouvelle bibliographie"
language = "fr"
place = "Paris"
date = "1796"
note = """Prospectus for "Souvenirs bibliographiques de quinzaine" and "Magasin du bibliophile," both edited edited by Charles-Louis Aubry and first published in 1797, and "Souvenir général, which was never published. Caption title. Printer statement from colophon. "Ainsi donc cette entreprise ... n'occasionnera aux souscripteurs de l'an 5 ..."--P. 8. Includes prices. Laid in: Paper band to wrap around delivered issues of "Souvenirs bibliographiques de quinzaine" and "Magasin du bibliophile" addressed in ms. to: Adanson, de l'Institut national, rue Chantereine. Ms. annotations. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Irregular pagination.  Insert included.  Text lost in binding. <br /><br />."""
url = "https://archive.org/details/plandunenouv00aubr"
