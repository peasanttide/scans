title = "Plaintes et doléances des Dames de la Halle & des marchés de Paris : rédigées au grand salon des Porcherons ; pour être présentées à messieux des Etats-généraux ; nouvelle impression qu'on a ravaudé, repassé & ajusté de son mieux, pour afin de les rendre plus longues & mieux torchées ; où l'on parle, sans gêne, de plusieurs personnes qui se le sont attiré, de plusieurs choses arrivées il n'y a pas long-temps, & de la prise de la Bastille ; ecrit à l'ordinaire par M. Josse, écrivain à la Pointe Sainte-Eustache."
