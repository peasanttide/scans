title = "Plaidoyer pour le sieur Jean-François Lieutaud, détenu dans les prisons nationales de Marseille, défendeur en exécution de décret de prise de corps rendu par le tribunal dudit Marseille dans la nuit du 27 au 28 décembre 1790, & demandeur en requisition à fins d'élargissement provisoire, du premier avril 1791, d'une part, contre M. le procureur de la commune dudit Marseille, joint M. l'accusateur public, querellants en prétendus délits de leze-nation, complots, conjuration, subornation & fuite clandestine, demandeurs & défendeurs, d'autre."
language = "fr"
place = "Marseille?"
date = "1791"
note = "Caption title. Signed: J. Franç. Lieutaud. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
