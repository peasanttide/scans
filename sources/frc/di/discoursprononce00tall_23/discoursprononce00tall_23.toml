title = "Discours prononcés au temple décadaire de Rouen, le 20 prairial, an sept, en mémoire des ministres de paix, assassinés à Rastadt par les ordres du gouvernement autrichien."
language = "fr"
place = "A Rouen"
date = "1799"
note = "Imprint from colophon. Saricks, A. Melvin Coll. Not in Martin & Walter. Révolution française. Discours prononcé dans le temple décadaire de la commune de Rouen, à la pompe funèbre, célébrée en mémoire des citoyens Bonnier et Roberjot, ministres plénipotentiaires de la République française, assassinés à Rastadt / par le citoyen Alexandre Ysabeau, membre du jury d'instruction de l'Ecole centrale et de la Seine d'émulation des sciences et arts de Rouen -- Discours prononcé par le citoyen Delaitre, commissaire central du département -- Discours prononcé par le citoyen Noel, membre du jury d'instruction publique -- Imprécation prononcé le même jour, au temple décadaire / par le président de l'administration municipale de Rouen. Bibliography: Saricks, A. Melvin Coll.,  II, 5170. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
url = "https://archive.org/details/discoursprononce00tall_23"
subject = [
    "Congress of Rastatt 1797-1799)",
    "Assassination",
]
