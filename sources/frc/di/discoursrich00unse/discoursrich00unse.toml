note = "Caption title. Not in Martin & Walter. Révolution française. Discours de M. Richard, maire d'Avignon, un des députés du club de cette ville, prononcé au nom de la députation auprès de la Société des amis de la constitution établie à Arles, dans la séance du 31 mars 1791 -- Réponse du président de la Société des amis de la constitution établie à Arles, au discours prononcé par M. Richard, maire d'Avignon, un des députés du club de cette ville, au nom de la députation de ce dernier club, près du premier, & dans la séance du jeudi 31 mars 1791 -- Vers prononcés par M. Giraud de l'Oratoire, dans la même séance, à la suite d'un excellent discours que sa modestie nous cache encore, & qui ont été unanimement adoptés par la société, sous le titre de Commandemens du parfait clubiste. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
