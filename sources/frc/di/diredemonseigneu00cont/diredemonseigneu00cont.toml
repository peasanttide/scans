note = """"Les notables ayant nommé un Comité de commissaires, pour concilier & rapprocher la préavis des bureaux chez Monsieur, Monseigneur le prince de Conti a addressé à Monsieur, le 28, le dire suivant"--P. [3]. Not in Martin & Walter. Révolution française. Address in the name of the Comité de commissaires of the Assemblée des notables. Includes the reply of Louis XVI to whom his brother forwarded M. Conti's address. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Skewed text. Page numbering errors. Stained pages and cover."""
