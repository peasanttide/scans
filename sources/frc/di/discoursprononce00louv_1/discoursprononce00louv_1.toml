title = "Discours prononcé par le représentant du peuple J.B. Louvet, dans la séance du 14 prairial, an III, pour célébrer la mémoire du représentant du peuple Feraud, assassiné dans ses fonctions, le premier de ce mois : imprimé par ordre de la Convention = Discurso que pronunció el representante del pueblo J.B. Louvet, en la sesión del dia 14 de praderial, año 3. (2 de junio de 1795), para honrar la memoria del representante del pueblo Feraud, asesinado en el exercicio de sus funciones, el primero de praderial (20 de mayo) : impreso y traducido por orden de la Convencion."
language = "fr"
place = "En Paris"
date = "1795"
note = "Imprint from colophon. Parallel colophon, p. 48: À Paris, de l'Imprimerie de la République, messidor, an III. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 22032. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text.  Tight margins.  Some text is lost in the binding."
