type = "pamphlet"
title = "Discours et replique du comte de Mirabeau a l'Assemblée nationale, dans les séances des 20 et 22 mai, sur cette question, A qui la nation doit-elle déléguer le droit de la paix et de la guerre : avec une lettre d'envoi a Messieurs les administrateurs des departemens."
language = "fr"
place = "A Paris"
date = "1790"
note = "Martin & Walter. Révolution française. The folded leaf contains the Decret sur l'exercice du droit de la guerre et de la paix, showing, in parallel columns, the proposal by Mirabeau, the amendments by Le Chapelier, and the final version adopted by the Assemblée nationale. Bibliography: Martin & Walter.  Révolution française,  III, 24502. Scanner's note: No copyright page found. No table-of-contents pages found. Irregular pagination. The last few page numbers are in reverse order. Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."
