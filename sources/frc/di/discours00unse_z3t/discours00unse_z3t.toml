title = "Discours prononcé par Ch. Ph. Ronsin, le samedi 18 août 1792, l'an 4ème. de la liberté et le premier de l'egalité, à la section du Théâtre François, dite de Marseille, à l'occasion de la cérémonie funèbre ordonnée en l'honneur de nos frères d'armes morts à la journée du 10, pour la défense de la liberté et de l'égalité."
language = "fr"
place = "A Paris"
date = "1792"
note = """"La section du Théâtre François ... a arrêté l'impression de ce discours ..."--P. 12. Publisher statement from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  IV:1, 29875. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
