note = """Prospectus for Claude François Achard's "Dictionnaire de la Provence et du Comté-Venaissin.". Caption title. "On souscrit à Marseille chez Jean Mossy, imprimeur-libraire; Sube & Laporte, & Roullet, libraires"--P. 7. Place of publication and printer statement from colophon. "Le Dictionnaire ... coûtera 50 liv. en feuilles. La souscription sera ouverte jusques au Ier. novembre 1784 pour Marseille, & jusques au premier janvier 1785 pour le reste de la Provence &c."--P. 7. Head-pieces; printed in double columns. List of 35 additional booksellers in 17 other cities, p. 8. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
