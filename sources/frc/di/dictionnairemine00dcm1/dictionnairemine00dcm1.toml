note = """Prospectus for Pierre-Joseph Buc'hoz's "Dictionnaire minéralogique et hydrologique de la France", published by Costard 1772-1776. Caption title. "Quatre volumes in-8° de près de sept cens pages chacun"--P. [i]. "La condition de l'acquisition actuelle est simplement de payer 9 livres, en retirant le premier volumes en feuilles, au moyen de quoi l'on recevra le troisieme gratis, & l'on ne paiera que 9 livres en retirant le second avec le quatrieme, de façon que l'ouvrage complet ne coûtera que 18 livres (au lieu de 24 livres)"--P. iv. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.   No page numbers. <br /><br />."""
