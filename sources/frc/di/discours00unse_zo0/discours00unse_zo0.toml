#:schema ../../../../schemas/source.json
layer = "source"
id = "discours00unse_zo0"
type = "pamphlet"
title = "Discours de M. Savoye de Rollin, avocat-général au Parlement de Dauphiné, prononcé lors de la séance de cette cour, du 21 octobre 1788, pour l'enregistrement & la publication de la declaration du roi, du 23 septembre 1788, qui ordonne que l'assemblée des Etats-généraux aura lieu dans le courant du mois de janvier de l'anné prochaine, & que les officiers des cours reprendront l'exercice de leurs fonctions : avec cette déclaration du roi, & l'arrêt d'enregistrement de ladite cour."
language = "fr"
place = "A Grenoble"
date = "1788"
note = """Imprint from colophon. Martin & Walter. Révolution française. "Declaration du roi, donnée à Versailles le 23 septembre 1788, qui ordonne que l'assemblée des Etats-généraux aura lieu dans le courant de janvier 1789, & que les officiers des cours reprendront l'exercise de leurs fonctions"--8 p. at end. Bibliography: Martin & Walter.  Révolution française,  IV:1, 31172. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
