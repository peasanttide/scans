title = "Dictionnaire raisonné de plusieurs mots qui sont dans la bouche de tout le monde : et ne présentent pas des idées bien nettes /"
language = "fr"
place = "A Paris"
date = "1790"
note = "Martin & Walter IV 2: 5618 (which cites the incorrect publication date: 1780). Premiere partie. Mots de toutes les langues. Anarchie. Civisme, amour de la patrie, esprit de corps. Constitution. Despotisme et monarchie. Liberté, propriété, sureté de l'un et de l'autre. Loi. Nation -- Seconde partie. Mots françois. Nation françois. Roi. États-généraux. Parlement et cours souverains -- Troisieme partie. Mots étrangers. Prérogative royale. Pouvoir exécutif. Liste civile. Mots anglois a traduire. Mot polonois. Scanner's note: No copyright page found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. Back cover is also table of contents. Page 104 reads as 410. Page 215 reads as 15. Irregular pagination."
