type = "pamphlet"
title = "Discours par Mr. Roux, théologal, vicaire-général du diocese d'Apt, electeur du canton & notable de la municipalité d'Apt, dans l'assemblée électorale du departément des Bouches du Rhône : avec l'extrait du procès-verbal de ladite assemblée, qui a délibéré que le chef-lieu du district d'Apt doit être fixé irrévocablement à Apt : par ordre de la municipalité."
language = "fr"
place = "A Aix"
date = "1790"
note = """Martin & Walter. Révolution française. Includes bibliographical references. "Extrait du procès-verbal de l'assemblée electorale du département des Bouches du Rhône"--P. 15-16. "Discours prononcé par M. Roux, vicaire-général & electeur d'Apt, dans l'eglise cathédrale, en présence de l'assemblée électorale du district d'Apt, qui assista au Te Deum après les élections des administrateurs"--P. 17-21. Bibliography: Martin & Walter.  Révolution française,  IV:1, 30236. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
