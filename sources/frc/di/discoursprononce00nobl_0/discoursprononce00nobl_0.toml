note = """Caption title. At head of title: Corps législatif. Conseil des anciens. Imprint from colophon. Martin & Walter. Révolution française. On the condition of Debry, the lone survivor of the assassinations at the second Congress of Rastatt, in response to reports of his death. "Copie du procès-verbal dressé par le citoyen Maréchal, officier de santé, des blessures du citoyen ministre Jean Debry"--P. 2-3. "Copie de la lettre écrite par la citoyenne Victoire Debry à l'une de ses amies"--P. 4-6. Bibliography: Martin & Walter.  Révolution française,  III, 25834. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."""
