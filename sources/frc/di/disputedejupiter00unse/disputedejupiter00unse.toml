note = """Caption title. Imprint from colophon. "L'histoire générale des conspirations n'est au fond qun [i.e. que] celle des passions ... nous choisicons dans cette immense collection la conspiration de Merlin, de Larévelllère [i.e. La Révellière] et de Rewbell [i.e. Reubell]": p.3. "Tels étaient les effets de ce gouvernement, tant absurde, tantôt atroce, que la journée du 30 prairial [an VII = 18 juin 1799] a renversé en déconcertant la conspiration qui en faisait la force": p.6. Martin & Walter IV 2: 5887. Scanner's note: Title on cover. Damaged, stained pages and cover. No title page found. No copyright page found. No table-of-contents pages found."""
