title = "Discours que M. Savoye de Rollin, avocat général & président du cinquime [sic] district, a prononcé avant le serment des officiers municipaux, dans l'église cathédrale de Grenoble : et celui de M. le maire à la maison commune."
language = "fr"
place = "Grenoble?"
date = "1790"
note = """Caption title. The mayor of Grenoble was Joseph-Marie de Barral from February 28 until August 1; Laurent de Franquières, Antoine Barnave, and Daniel d'Isoard were also mayor in 1790. Imprint from colophon. Not in Martin & Walter. Révolution française. "Discours de M. Royer, aîné, commissaire des Etats de la province du Dauphiné, prononcé dans l'assemblée du quatrieme district, dont il étoit président"--P. 7-8. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/discours00unse_eth"
subject = ["Representative government and representation"]
extent = "8 p. ; 21 cm."

