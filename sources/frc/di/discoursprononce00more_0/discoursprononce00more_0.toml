title = "Discours prononcé par le général Moreau, devant la Cour de justice criminelle, après avoir obtenu la parole du président : moyens employés par M. Bonnet, son défenseur, pour la justification de ce général : extrait de jugement qui condamne à la peine de mort vingt des individus accusés de conspiration contre la sûreté intérieure & extérieur de l'Etat, qui condamne à la détention pour deux ans, comme coupables, cinq autres accusés, & a acquitté vingt-deux des preveneus de ladite conspiration, dont cinq sont renvoyés à la police correctionele, pour fait de contravention à la loi."
language = "fr"
place = "Reimprimé à Rouen"
date = "1804"
note = "Caption title. Imprint from colophon. Dated, p. 8: Vu & permis. Rouen, ce 21 prairial an 12. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."
