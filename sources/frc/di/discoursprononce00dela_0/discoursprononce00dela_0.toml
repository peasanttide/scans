#:schema ../../../../schemas/source.json
layer = "source"
id = "discoursprononce00dela_0"
type = "pamphlet"
title = "Discours prononcé par le citoyen Delafleutrie, substitut du commissaire du gouvernement près le Tribunal criminel, à l'audience du 15 frimaire, dans l'affaire du Dictionnaire de l'Académie françoise"
language = "fr"
place = "A Paris"
date = "1802"
note = """Caption title. "Procès du Dictionnaire de l'Académie. Tribunal d'appel. Juges, cit. Martineau, président, cit. Rigault, rapporteur, cit. Selves"--Upper right corner of p. [1] at beginning. Imprint from colophon, p. 31. Regarding a copyright case in which Bossange, Masson et Besson accused booksellers Nicolas Moutardier and François-Augustin Leclère of pirating copies of the fifth edition of the Dictionnaire de l'Académie française, to which the plaintiff held the copyright. "Faits faux et calomnieux, plaidés par Moutardier et Leclere. Preuves de la fausseté et de la calomnie": 4 p., second sequence. "Conclusions motivées pour les citoyens Bossange, Masson et Besson, contre les citoyens Moutardier et Leclere": 8 p. at end; signed: Bossange, Masson et Besson. Chauveau-Lagarde, défenseur. Valton, avoué. Owner's inscription: Reçu par Pingard le 1 janvier 1803 (Adanson); ms. annotations in same hand. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
url = "https://archive.org/details/discoursprononce00dela_0"
subject = [
    "Moutardier, Nicolas, 1763-1807",
    "Leclère, François-Augustin, fl. 1786-1803",
    "Bossange, Masson et Besson",
    "Académie française",
    "Books",
    "Copyright",
]

