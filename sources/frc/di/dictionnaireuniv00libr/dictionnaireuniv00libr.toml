note = """Prospectus for a new edition of the Dictionnaire de Trévoux. "Noms des Libraires associés: Valleyre pere, Ganeau, rue Saint-Severin; D'Houry, rue de la Vieille-Boucherie; Bailly, Debure fils jeune, quai des Augustins; Veuve Savoye, Desprez, De Hansy jeune, Durand, Desventes de la Doué, rue Saint-Jacques; Saillant, Nyon, rue Saint-Jean-de-Beauvais; Desaint, rue du Foin; Lambert, rue de la Harpe; Delalain, rue de la Comédie Françoise. On souscrira chez les libraires des principales villes du royaume"--T.p verso. Title page in red and black; title vignette; heaf-pieces; printed in double columns. "Cet ouvrage paroîtra complet en huit volumes in-folio dans le courant du mois d'août 1771, & se vendra 208 liv. en feuilles. Les personnes qui souscriront ne païeront pour chaque exemplaire que la somme de 168 liv."--P. [4]. Ms. annotations. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
