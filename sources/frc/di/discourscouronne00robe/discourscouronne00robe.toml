type = "book"
title = "Discours couronné par la Société royale des arts et des sciences de Metz, sur les questions suivantes, proposées pour sujet du prix de l'année 1784 : 1. Quelle est l'origine de l'opinion, qui étend sur tous les individus d'une même famille, une partie de la honte attachée aux peines infamantes que subit un coupable? 2. Cette opinion est-elle plus nuisible qu'utile? 3. Dans le cas où l'on se décideroit pour l'affirmative, quels seroient les moyens de parer aux inconvéniens qui en résultent? /"
language = "fr"
place = "A Amsterdam ;Et se trouve à Paris"
date = "1785"
