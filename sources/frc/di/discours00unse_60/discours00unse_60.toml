id = "discours00unse_60"
type = "book"
title = "Discours patriotiques."
language = "fr"
place = "A Montauban"
date = "1791"
note = "Imprint from colophon. Not in Martin & Walter. Révolution française. Discours prononcé à la Société des amis de la constitution du Carla, sur les moyens de s'instruire, & d'instruire la jeunesse -- Discours prononcé à la réception de B.*** agriculteur travaillant son bien -- Discours sur l'harmonie --Discours a M. L.*** négociant de Bordeaux, partant pour cette ville -- Discours sur le courage des bons patriotes & sur la crainte des malveillans -- Discours prononcé dans l'église de Carla à la réception du juge de paix, mon ami M.L.D.L.P. -- Discours prononcé dans l'église du Carla -- Discours prononcé devant un grand feu de joie, en présence du peuple, de la municipalité, & de la Garde nationale -- Discours prononcé devant l'autel de la patrie, dans le Champ de Mars, le 14 juillet 1791 -- Discours pronncé devant un grand feu de joie, en présence de tout le peuple, la municipalité & la Garde nationale, le jour que nous apprîmes que le roi avait sanctionné la Constitution -- Discours prononcé devant l'autel de la patrie, dans le Champ de Mars, en faisant prêter le serment civique aux Amazones -- Discours sur la mort de B.** père, agriculteur, à son fils -- Discours prononcé à la Société des amis de la constitution du Carla -- Discours prononcé dans le cimetière de S.*** au bord du tombeau de M. C.*** -- Discours prononcé aux volontaires de la part de la Société des amis de la constitution -- Discours a la Société des amis de la constitution du Carla -- Chanson qui sert de réponse à celle qui dit que le roi est prisonnier dans Paris -- Romance sur la mort de M. Honoré Mirabeau. Scanner's note: No Copyright found. No Table of Contents found. Title on cover page. Damaged, stained pages and cover. <br />."
url = "https://archive.org/details/discours00unse_60"
subject = [
    "Mirabeau, Honoré-Gabriel de Riquetti, comte de, 1749-1791",
    "Louis XVI, King of France, 1754-1793",
    "Hymns, French",
]
extent = "76 p. ; 20 cm."

