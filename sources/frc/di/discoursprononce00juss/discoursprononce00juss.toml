language = "fr"
place = "Paris"
date = "1799"
note = """Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. "Discours de Jussieu"--Bottom of p. 17. Martin & Walter. Révolution française. "Discours prononcé par Camus, en présentant, au nom de l'Institut, les notices des manuscrits conservés dans les bibliothèques nationales"--P. 9-13. "Réponse de Boulay (de la Meurthe), président du Conseil des cinq-cents, aux discours prononcés, au nom de l'Institut national des sciences et arts, pour rendre compte de ses travaux pendant l'an 7. Séance du quatrième jour complémentaire an 7"--P.14-16. "Réponse de Cornet (du Loiret), président du Conseil des anciens, aux discours prononcés, au nom de l'Institut nationale des sciences et arts, pour rendre compte de ses travaux pendant l'an 7. Séance du quatrième jour complémentaire an 7"--P. 17-22. Bibliography: Martin & Walter.  Révolution française,  II, 17675. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
