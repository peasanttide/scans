note = "Caption title. Imprint from colophon. Printed on one side of leaf. Opening sentences: Une grande question politique, dont va dépendre le destin de la France, et peut-être de l'Europe, occupe en ce moment tous les esprits. Ferons-nous, ne ferons-nous pas la guerre? Commencerons-nous, attendrons-nous l'attaque? Signed at end: M.A.J.F. This edition not in Martin & Walter (cf. IV 2: 5772). Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."
