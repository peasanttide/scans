language = "fr"
place = "Paris"
date = "1790"
note = """Imprint from colophon. Dated, p. [1]: 28 janvier 1790. Martin & Walter. Révolution française. "Discours de M. Baulieu"--P. 5-6. "Réponse de M. l'abbé Mulot, président"--P. 6-10. Adresses in praise of Jean-François Bremont Beaulieu, who offered to give his commission to Henri Agasse, brother of two convicted forgers, and lauding this example of the new republic's ideals of liberty and justice. Bibliography: Martin & Walter.  Révolution française,  I, 1758; I, 2204; III, 25504. Scanner's note: No copyright found.  No table of contents found. Title on cover. Damaged, stained pages and cover. <br />."""
