note = "Caption title. Lamoignon was garde des sceaux 1787-1788. Imprint from colophon. At head of each page: No XVII. Not in Martin & Walter. Révolution française. Discours du roi, a l'ouverture du lit de justice, tenu à Versailles le 8 mai 1788 -- Discours de M. le garde des sceaux ... sur l'administration de la justice -- Discours de M. le garde des sceaux ... portant suppression des tribunaux d'exception -- Discours de M. le garde des sceaux ... relative à l'ordonnance criminelle -- Discours de M. le garde des sceaux ... portant réduction d'offices dans sa cour de Parlement de Paris -- Discours de M. le garde des sceaux ... portant rétablissement de la Cour plénière -- Discours de M. le garde des sceaux ... sur les vacances -- Discours du roi, à la fin du lit de justice, tenu à Versailles le 8 mai 1788. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
