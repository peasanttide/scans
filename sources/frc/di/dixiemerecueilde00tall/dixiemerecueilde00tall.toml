title = "Dixième recueil de pièces trouvées chez M. Laporte, intendant de la liste-civile : imprimées par ordre de l'Assemblée nationale."
language = "fr"
place = "A Paris"
date = "1792"
note = """"Ces pièces prouvent évidemment que Louis XVI avoit conservé un grand attachement pour ses anciens gardes-du-corps, puisqu'il les faisoit payer à Coblentz. Les originaux sont déposés au Comité de surveillance. Le 21 août 1792, l'an IVe. de la liberté & le Ier. de l'égalité.". "Déposé au Comité de surveillance par MM. Gohier & Audrein, commissaires nommés par l'Assemblée nationale pour la vérification des papiers de la liste civile"--P. 42. "Dixième recueil"--Bottom of p. 25. Martin & Walter. Révolution française. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Martin & Walter.  Révolution française,  IV:2, 13967. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged, stained pages and cover. Title on cover."""
