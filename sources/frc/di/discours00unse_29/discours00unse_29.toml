title = "Discours du roi, a l'ouverture du lit de justice, tenu à Versailles le 8 mai 1788."
language = "fr"
place = "A Toulouse"
date = "1788"
note = "Caption title. Imprint from colophon. Variant of Martin & Walter. Révolution française, III, 21738. Discours du roi -- Discours de M. le garde des sceaux, pour annoncer l'ordonnance du roi, sur l'administration de la justice -- Ordonnance du roi sur l'administration de la justice -- État des grands bailliages érigés dans l'étendue du royaume, par l'ordonnance du présent mois, & des ressort & arrondissement provisoirement attributé à chacun desdits sieges, par le même édit -- Discours de M. le garde des sceaux, pour annoncer l'édit du roi, portant suppression des tribunaux d'exception -- Edit du roi portant supression des tribunaux d'exception -- Discours de M. le garde de sceaux, pour annoncer la déclaration du roi, relative à l'ordonnance criminelle -- Declaration du roi concernant la procédure criminelle -- Discours de M. le garde des sceaux, pour annoncer l'édit du roi, portant réduction d'offices dans sa cour de Parlement de Paris -- Édit du roi, portant réduction d'offices dans sa cour de Parlement de Toulouse -- Discours de M. le garde des sceaux, pour annoncer l'édit du roi, portant rétablissement de la Cour pléniere -- Édit du roi portant rétablissement de la Cour pléniere -- Discours du roi, a la fin du lit de justice, tenu à Versailles, le 8 mai 1788. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
