#:schema ../../../../schemas/source.json
layer = "source"
id = "dissertationcont00mari"
type = "pamphlet"
title = "Dissertation contenant les signes caractéristiques de la lépre des anciens, son peu d'analogie avec la phyllitique, selon le sentiment de Boerhaave & dans laquelle on propose une méthode courte, facile & fondée sur l'expérience pour la guérison des symptômes des maladies les plus fréquentes, sur-tout de celles qui proviennent d'une dépravation des humeurs, ou des récréments dégénérés, ou d'un vice vénérien, scrophuleux & psorique récens ou invétérés"
language = "fr"
place = "A Paris"
date = "1787"
note = """Prospectus for Marie's "Nouveau précis d'anatomie, de pathologie et de l'art de guérir," a translation of "Novum compendium anatomiae universae, nec non pathologiae." Both editions were published in 1787. Cf. Quérard, J.M. France littéraire, V, p. 532. Caption title. "Permis d'imprimer, le 16 octobre 1787"--P. 4. "Le Précis d'anatomie, de pathologie & de l'art de guérir, par M. Marie, docteur en médecine & médecin consultant de Son Altesse Royal Monseigneur Comte d'Artois, se trouve chez l'auteur, rue des Prêtres Saint-Germain-l'Auxerrois, près le Pont Neuf, au Cafré du Parnasse. Et chez Croullebois, libraire, rue des Mathurins, no. 32"--P. 4. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
url = "https://archive.org/details/dissertationcont00mari"
subject = [
    "Marie, Charles-Louis-Jean",
    "Booksellers and bookselling",
    "Medical publishing",
]

