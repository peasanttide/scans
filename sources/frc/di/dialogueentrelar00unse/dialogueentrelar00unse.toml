note = """"Le vicaire. Gardez vos cures pour les donner à la recommendation de la noblesse, comme vous avez toujours fait ... pour moi, j'espere que la nation me récompensera de mes travaux; elle saura distinguer les prêtres utiles; je veux seulement jouir de la liberté de vous dire ma maniere de penser, & de vous faire voir que je ne suis pas dupe ... de votre hypocrisie": p.4. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
