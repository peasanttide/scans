note = """Caption title. Imprint from colophon. "Réponse de M. le président du Club central des citoyens du département de Paris, au discours de M. Palloi, annonçant et présentant aux citoyens le compte de ses travaux et de sa gestion, dans la démolition de la Bastille."--P. 5-7. Martin & Walter. Révolution française. Discusses Palloy's patriotism in the destruction of the Bastille. Bibliography: Martin & Walter.  Révolution française,  III, 26370. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Uneven binding. Skewed text.  Damaged, stained, and/or loose pages."""
