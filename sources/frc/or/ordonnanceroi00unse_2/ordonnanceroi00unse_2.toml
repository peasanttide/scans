title = "Ordonnance du roi, portant réglement sur la solde fixée, à compter du 1er. mai 1790, à chaque sous-officier & soldat des différentes armes qui composent l'armée : du 5 juillet 1790"
language = "fr"
place = "A Paris"
date = "1792"
note = """Caption title. Imprint from colophon, p. 16. "Armée françoise. État de la nouvelle fixation de solde attribuée, à compter du 1er mai 1790, à chaque grade de sous-officier et soldat, par jour, tant dans l'infanterie, que dans les troupes à cheval, d'après les décrets de l'Assemblée natioale, en date des 28 février, 6 et 24 juin derniers, sanctionnés par le roi"--[6] p. at end. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
