title = "Ordonnance de Monsieur le Lieutenant Général en la sénéchaussée generale de Provence, séant a Aix : qui ordonne l'enrégistrement, publication, & exécution de la lettre du Roi, du 2 mars 1789, & des réglemens y annexés, pour la convocation des Trois-États du ressort de la sénéchaussée d'Aix, au sujet de la tenue des États-généraux du royaume : du 12 mars 1789."
