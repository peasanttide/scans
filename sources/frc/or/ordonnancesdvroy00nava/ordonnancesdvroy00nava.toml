title = "Ordonnances dv Roy de Navarre, par laquelle il veut que la religion Catholique Apostolique & Romaine, soit remise en tous les endroits de ses pays & royaume. Et que les ministres de la nouuelle opinion, ayent à vuider hors sesdictz royaume & pays, s'ls ne se veulent reduire à ladicte religion Catholique Apostolique & Romaine, & abiurent leurs erreurs. Ensemble que tous les euesques, prelatz, abbez, chapitres curez, commandeurs, & autres personnes ecclesiastiques, rentrent en l'entiere possession & iouissance de leurs benefices."
