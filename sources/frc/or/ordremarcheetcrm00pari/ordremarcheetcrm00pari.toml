title = "Ordre, marche et cérémonial de la déclaration du danger de la patrie."
language = "fr"
place = "Paris"
date = "1792"
note = """Caption title. Imprint from colophon. "Proclamation de la municipalité de Paris, par le maire et conseil général de la commune. Extrait du registre des délibérations du conseil général de la commune. Le jeudi 19 juillet 1792, l'an 4 de la liberté": p.[1]-2. "Cérémonial qui sera observé dimanche et lundi, 22 et 23 juillet présent mois, pour la proclamation de l'acte du Corps législatif, qui déclare le danger de la patrie, et pour l'enrôlement civique des citoyens qui se dévouent à sa défense": p.2-6. "Acte du Corps législatif sur le danger de la patrie. Du 11 juin 1792, l'an quatrième de la liberté": p.6-8. Martin & Walter IV 2: 11612. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
