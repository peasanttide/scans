title = "Ordonnance et instruction pastorale de Monseigneur l'Evêque de Chartres au clergé et au peuple de son diocese"
language = "fr"
place = "A Paris"
date = "1703"
note = """The work in question is variously attributed to Abbé Eustace, or Bernard Couet. "Privilege du roy": p.[60]. "Extraits de quelques ouvrages des défenseurs de Jansenius, pour montrer qu'avant la condamnation des cinq propositions ils reconnissoient qu'elles étoient dans Jansenius, & les soûtenoient dans leur sens propre & naturel": p.61-82. Dated 3 August 1703. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
