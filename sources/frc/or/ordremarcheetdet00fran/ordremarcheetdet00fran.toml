type = "pamphlet"
title = "Ordre, marche et détail exact des cérémonies qui auront lieu les cinq jours complémentaires et le premier vendemiaire au Champ-de-Mars, pour la fête de la fondation de la République : foire où seront exposés les objets les plus rares et les plus précieux de nos manufactures : description de tous les jeux gymniques qui s'y feront, tels que joute sur l'eau, lutte, courses à pied, et à cheval, courses de chars : masses de feu sur les tours, les dômes et les télégraphes : explosion de six cens fusées volantes : enlevement d'un ballon manœvré sous corde par des physiciens, qui incendieront un batis, représentant une fortification et une rédoute : tableau des prix distribués aux vainqueurs dans les jeux par le ministre de l'intérieur : danses, illuminations : hymnes qui seront chantés."
language = "fr"
place = "Paris"
date = "1798"
note = """Caption title. Signed, p. 7: François (de Neufchâteau). Imprint from colophon. Place of publication from Martin & Walter. Martin & Walter. Révolution française. "Ode a la République"--P. 8. Bibliography: Martin & Walter.  Révolution française,  II, 13889. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
