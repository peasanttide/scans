title = "Ordonnance du roi, pour donner une nouvelle forme aux six compagnies de Canonniers-Bombardiers des îles du vent & sous le vent de l'Amérique, & assimiler leur traitement à celui des troupes du corps-royal employées dans les mêmes colonies : du 28 Août 1777 /"
language = "fr"
place = "A Paris"
date = "1777"
note = "Caption title. Imprint from colophon. This ordnance lists the new structure of the six companies of cannonneers-bombers (Artillery) of West Indies, gives the pay of officers and men, as well as their food rations. These troops were later sent to aid the Americans during the American Revolution."
