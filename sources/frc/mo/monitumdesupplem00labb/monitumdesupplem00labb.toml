note = """Prospectus for a supplement to "Sacrosancta concilia ad legiam editionem exacta," Philippe Labbe and Gabriel Cossart's compilation of the councils of the Catholic Church. Proposed edition never published? Caption title. Also published in French under title: Projet d'un supplément à la Collection des conciles du pere Labbe. Head-piece. "Supplementum autem edetur iisdem typis, eadem forma, ac magnitudine quàm Labbeana collectio; atque exemplarium paucior erit numerus quae minori pretio ab iis ementur qui ea maturè sibi reservata volent. Nullum autem exemplar chartâ magnâ edetur, nisi expresè postulatum"--P. 2. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
