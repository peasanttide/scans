title = "Motion d'ordre, faite à la séance du 13 ventôse, par Charles Millard, député de Saone et Loire, sur une pétition des administrateurs du même département, tendante à obtenir le rapport du décret du 23 pluviôse dernier, qui casse un arrêté du Conseil exécutif provisoire, relatif à une vente de bois faite à Claude Noailli, par Marie-Abel Vichy, fusillé depuis comme conspirateur, et projet de décret."
