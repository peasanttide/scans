note = """Caption title. By Prévost Saint-Lucien. Cf. Quérard. Suggested date of publication based on another edition, published 1789. Cf. Saricks. Vignette of two birds with garlands and a vase at head of title. Not in Martin & Walter. Révolution française. Variant of Tourneux, M. Paris pendant la Révolution française, I, 690a. Variant of Saricks, A. Melvin Coll., II, 4478-4479. Variant of Quérard, J.M. Supercheries littéraires (2. éd.), III, column 61. "Seconde partie. Projet d'institution d'une fête nationale, & d'un ordre patriotique"--Second sequence. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text."""
