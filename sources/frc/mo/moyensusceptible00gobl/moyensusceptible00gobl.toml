title = "Moyen susceptible d'être employé pour indemniser les prévenus d'émigration rayés, ainsi que ceux qui auraient droit à réclamer des indemnités sur les biens nationaux vendus, sans grever l'état d'une plus forte dette : au contraire, faire rentrer des sommes considérables, tant en capital inscription qu'en numéraire, et par là mettre le gouvernement à portée de diminuer les charges publiques."
