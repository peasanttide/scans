note = """Caption title. Without imprint. "Arrêtés de la Chambre des comptes des 17 & 18 août": p.[7]. "Requisitoire sur l'edit de subvention apporté en la Cour des aides, par M. Comte d'Artois le 17 août 1787": p.8-13. "Requisitoire sur la déclaration du timbre, apportée en la Cour des aides par Monsieur Comte d'Artois, le 17 août 1787": p.14-17. "Monseigneur Comte d'Artois, étant venu, le 17 août 1787, présenter à enregistrer à la Cour des aides, l'edit pour la subvention territoriale, & la déclaration sur le timbre, M. le premier président lui a dit": p.18-25. "Arrêté unanime de la Cour des aides. Du 18 août 1787": p.26-29. Not in Martin & Walter [edition 2: 29 p.; with extra text as indicated]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages. Page numbers start with page 4."""
