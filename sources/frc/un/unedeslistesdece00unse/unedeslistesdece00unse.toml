title = "Une des listes de ceux qui ont signé le renouvellement d'appel, & dont les actes ont été envoyez à nosseigneurs les evêques appellans"
language = "fr"
date = "1721"
note = """"Acte de renouvellement d'appel des RR. PP. Feüillans, du 19 novembre 1720": p. 8; "Autre acte de renouvellement d'appel des RR. PP. Benedictins de l'Abbaye de S. Denis en France": p. 9-10. "Cette liste a été supprimée par un arrêt du Parlement du 21. mars 1521 [sic] on l'appella en plaisantant le régiment d'Asfeld, parce que le nom de l'abbé d'Asfeld se trouva à la tête. M. le cardinal de Noailles refusa des ordres à tous ceux dont les noms étoient dans cette liste." D. de Colonia. Dict. des livres jansénistes. Antwerp, 1755. v. 2, p. 550. A pamphlet in the affair of the Papal bull Unigenitus. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover. <br />."""
