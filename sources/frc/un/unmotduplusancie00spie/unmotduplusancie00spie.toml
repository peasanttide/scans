title = "Un mot du plus ancien de tous les évangiles a N.S.P. le pape et a tous les prêtres, ou, Lettres philosophiques  sur le pêché originel : dans lesquelles on démontre que l'Église romaine a appris aux hommes à blasphémer contre l'Être suprême, sous prétexte de croire en lui, à abrutir leur raison, sous prétexte de l'éclairer, et à fouler aux pieds les principes immuables de la morale, sous prétexte de l'embellir : ouvrage utile, surtout aux prêtres, qui ne comprennent pas encore assez que la hideuse absurdité de leur doctrine est découverte /"
