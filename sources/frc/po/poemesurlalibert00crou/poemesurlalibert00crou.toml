note = """Caption title. At head of title: Convention nationale. "Prononcé à la distribution des prix de l'Université de Paris ... en présence d'une députation de la Convention nationale, du département, de la municipalité ... par le citoyen Crouzet, principal du collège du Panthéon français et ancien professeur d'éloquence au même collège, et imprimé en vertu d'un décret de la Convention, le 4 août 1793, l'an deuxième de la République française"--P. [3]. Imprint from colophon. "Poëme sur la liberté"--Bottom of p. 5. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française, I, 8942. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover. Creases in pages. Pages have been cut."""
