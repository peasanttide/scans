note = """At head of title: Directoire exécutif. "A Agen, de l'imprimerie du département"--P. 51. Text of d'Aintraigues' memorandum has caption: Ma conversation avec Monsieur le comte de Montgaillard, le 4 décembre 1796 .. "Je certifie que ce cahier a été trouvé dans le porte-feuille de M. d'Antraigues ... et cotté et paraphé par moi ... le 5 prairial, an V de la République ... Signé, Berthier"--P. 17. Variant of Martin & Walter. Révolution française, I, 401. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Skewed text."""
