title = "Pièce trouvée à Venise dans le porte-feuille de d'Antraigues, et écrite entièrement de sa main."
language = "fr"
place = "Paris"
date = "1797"
note = """At head of title: Directoire executif. "Se trouve à Paris, Chez Lemaire, imprimeur, rue d'Enfer, no. 141, près le Luxembourg"--T.p. verso. Text of d'Antraigues' memorandum has caption: Ma conversation avec Monsieur le comte de Montgaillard, le 4 décembre 1796 .. "Je certifie que ce cahier a été trouvé dans le porte-feuille de M. d'Antraigues ... et cotté et paraphé par moi ... le 5 prairial an V de la République ... Signé, Berthier"--P. 15. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 401. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Skewed text."""
