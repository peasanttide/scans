title = "Pièces trouvées à Venise dans le porte-feuille de d'Antraigues, & écrites entièrement de sa main."
language = "fr"
place = "Paris"
date = "1797"
note = """Caption title. At head of title: Corps législatif. Conseil des cinq-cents. Imprint from colophon. Text of d'Antraigues' memorandum has caption: Ma conversation avec Monsieur le comte de Montgaillard, le 4 décembre 1796 .. "Je certifie que ce cahier a été trouvé dans le porte-feuille de M. d'Antraigues ... & coté & paraphé par moi ... le 5 prairial an 5 de la République ... Signé, Berthier"--P. 13. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 402."""
url = "https://archive.org/details/piecestrouveesve00antr"
subject = [
