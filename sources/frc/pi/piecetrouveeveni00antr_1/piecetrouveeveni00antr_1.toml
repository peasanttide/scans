language = "fr"
place = "A Rouen"
date = "1797"
note = """At head of title: Directoire exécutif. Conspiration du général Pichegru, actuellement membre du nouveau tiers, entré en prairial au Conseil des cinq-cens. Text of d'Antraigues' memorandum has caption: Ma conversation avec Monsieur le comte de Montgaillard, le 4 décembre 1796 .. "Je certifie que ce cahier a été trouvé dans le porte-feuille de M. d'Antraigues ... & coté & paraphé par moi ... le 5 prairial an V de la République ... Signé, Berthier"--P. 12. Variant of Martin & Walter. Révolution française, I, 401."""
url = "https://archive.org/details/piecetrouveeveni00antr_1"
