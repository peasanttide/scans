title = "A Paris, du Bureau de l'abonnement littéraire, rue S. André-des-Arcs, la porte cochere attenant le notaire, du côté de l'égoût, le 30 novembre 1780"
language = "fr"
place = "Paris?"
date = "1780"
note = """General advertisement for discounted books, prospectuses for new works, and periodical subscriptions. Caption title. "Les personnes qui voudront recevoir les notices ... sont priées de remettre à Paris leurs adresses au Bureau de l'abonnement littéraire. M. Luneau de Boisjermain leur fera expédier ..."--P. [1]. Laid in: Printed letter of transmittal ([4] p.) advertising the subscription services of the Bureau de l'abonnement littéraire to potential authors; inscription on last blank page: Monsieur Danson, censeur royal, [Salle?] Vendome. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  No page numbers. <br /><br />."""
url = "https://archive.org/details/aparisdubu00bure"
