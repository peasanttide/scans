#:schema ../../../../schemas/source.json
layer = "source"
id = "aphorismesovsomm00mari"
type = "book"
title = "Aphorismes ov sommaires de la doctrine des Iesvites, et de quelques autres leurs docteurs : par lesquels le vray christianisme est corrompu, la paix publique troublée, & les liens de la societé humaine sont entierement violés & rompus ; extraicts des escrits, sentences, & actes publics des Iesuites, & de leurs liures, & autres de leurs docteurs ; traduits de Latin en François ; iouxte la copie imprimee en Allemagne."
language = "fr"
place = "Geneve"
date = "1610"
note = """Bound with [Plaix, César de] Anticoton. 1610. Last page misnumbered 103. Second t.p. on p. 57: Recit des desseins les plvs secrets des Iesvites : s'ensvit vne remonstrance qux bons François, sur ce que l'Abbé du Bois, Parisien, detesta & refuta par une predication publique, Mariana, Becanus, Bonarsius, Ribadaneira, Emanuel Sa, & autres Iesuites; ensemble L'arrest de la cour de parlement de Paris, et la censure de la Sorbonne, contre le liure de Iean Mariana, intitulé de rege, & regis institutione. A Geneve, MDCX. "Arrest de la Covr de Parlement, ensemble la censvre de la Sorbonne ... " : p. 91-101. "Svr la mort dv grand roy Henry qvatriesme [poem]": p. 102-[105]. Signatures: A-F⁸ G⁴. C2 mis-signed E2; C3 mis-signed E3. Title vignette; head and tail pieces; initials; marginalia. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding. Irregular pagination."""
url = "https://archive.org/details/aphorismesovsomm00mari"
subject = ["Jesuits"]
extent = "103 (i.e. 105) p. ;17 cm."

