date = "1793"
note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Aff. du gen. Anselme, par F. Poultier"--Bottom of p. 9. Martin & Walter. Révolution française. Argues that neither Anselme nor Ferru can be held accountable for the pillage of the comté de Nice in October 1792. Bibliography: Martin & Walter.  Révolution française,  IV:1, 28059. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
