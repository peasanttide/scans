title = "Affaire de Nancy : lettre de M. Louvain-Pescheloche, capitaine-aide-major de la Garde nationale parisienne, en datte du 18 octobre 1790, contenant les détails les plus exacts, dont la preuve complette peut etre acquise par témoins, de tous les événemens qui se sont passés, sous ses yeux à Nancy, pendant son séjour officiel en cette ville : en réponse à celle de M. Sillery, député à l'Assemblée nationale, rapporteur de l'affaire de Nancy."
