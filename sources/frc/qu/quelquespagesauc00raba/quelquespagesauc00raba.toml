note = """Caption title. Signed: Rabaut le jeune, Paris, 15 brumaire an 7. "Pour donner de la publicité au pamphlet du citoyen, Pellissier nous l'insérons avant notre réponse.". "Pamphlet du citoyen Pellissier, député au Conseil des cinq-cents, par le département des Bouches-du-Rhône."--P. [1]-7. "Réponse du citoyen Rabaut le jeune, rédacteur de la feuille du Bon citoyen, et membre du Conseil des anciens."--P. 7-15. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  IV:1, 28481. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
