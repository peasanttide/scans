title = "Loi qui ordonne l'envoi du tableau du nombre des députés du Corps législatif à élire par chaque département : du 27 pluviose an V de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1797"
note = """Caption title. At head of title: No. 432. Au nom de la République française. Imprint from colophon. "No. 1"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. "République française. Tableau du nombre de députés à élire par chaque département et par les colonies de la République française, tant au Conseil des anciens qu'à celui des Cing-cents, pour la formation du Corps législatif, ainsi que celui du nombre de députés à élire annuellement pendant une série de dix années, à chaque Conseil, pour le renouvellement du tiers de la représentation nationale, conformément à la constitution"--Table on folded leaf. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover. Only one numbered page."""
url = "https://archive.org/details/quiordonnele00unse"
