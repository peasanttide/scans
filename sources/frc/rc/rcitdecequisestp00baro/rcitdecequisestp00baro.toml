note = """Caption title. Without imprint. "Discours prononcé par M. Barou du Soleil, procureur du roi en la sénéchaussée & siége présidial de Lyon, en présentant à l'enrigistrement la déclaration qui annonce les Etats-généraux, & rétablit les cours & tribunaux au même & semblable état qu'ils étoient avant le 8 mai": p. 5-11. Not in Martin & Walter [edition 1: 11 p.]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
