title = "Anatomie de la langue françoise, ou, Examen philosophique et analytique"
language = "fr"
place = "Paris"
date = "1784"
note = """Prospectus for Sauseuil's "Anatomie de la langue françoise, ou, Examen philosophique et analytique", a French translation of "An analysis of the French orthography.". Caption title. Printer statement and date of publication from colophon. Includes prospectus for "Transactions philosophiques de la Société royale de Londres," a French translation by Sauseuil of "Philosophical transactions of the Royal Society of London.". "Le bureau de la souscription, tant pour l'Anatomie de la langue françoise que pour les Transactions philosophiques, est ouvert tous les jours chez l'auteur, rue du Roule, à Paris, n° 8, au magasin général de MM. Windsor pere, fils & compagnie ... On souscrit aussi chez le sieur Laporte, libraire-imprimeur, rue des Noyers; & chez le sieur Guillot, libraire de Monsieur, frère du roi, rue Saint-Jacques, vis-à-vis celle des Mathurins"--P. 8. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/anatomiedelalang00saus"
