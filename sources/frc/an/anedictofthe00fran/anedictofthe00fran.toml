title = "An edict of the French King, prohibiting all publick exercise of the pretended reformed religion in his kingdom : wherein he recalls, and totally annuls the perpetual and irrevocable edict of King Henry the IV. his grandfather, given at Nantes, full of most gracious concessions to Protestants : together with a brief and true account of the persecution carried on against those of the foresaid religion, for to make them abjure and apostatize : to which is added, the form of abjuration the revolting Protestants are to subscribe and swear to : with a declaration of his Electoral Highness of Brandenburg, in favour of those of the reformed religion, who shall think fit to settle themselves in any of his dominions"
language = "en"
place = "London"
date = "1686"
