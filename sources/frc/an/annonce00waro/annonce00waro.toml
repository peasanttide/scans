place = "Paris"
date = "1788"
note = """Prospectus for Waroquier de Méricourt de la Mothe de Combles' "Tableau généalogique historique de la noblesse" and "Tableau héraldique ou armorial général & universel" (never published?). Caption title. Printer statement from colophon. Last page of Newberry's copy torn, missing portion of imprint from colophon. "Permis d'imprimer, le 5 janvier 1788"--P. 7. "On souscrit à Paris chez l'auteur, rue Gille-Cœur; chez M. Nyon l'aîné, libraire, rue du Jardinet; Mme. Duchesne & M. Belin, libraires, rue St. Jacques; & chez tous les directeurs des affiches & journaux dans les provinces, & chez les principaux libraires des villes capitales"--P. 7. Head-piece. Includes prices. Inscription: A Monsieur, Monsieur le comte de Corneillan, a Villefranche en Rouergu[e]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
