type = "pamphlet"
title = "Réponse sommaire aux calomniateurs du citoyen Dentzel, représentant du peuple du département du Bas-Rhin : Les ennemis du citoyen Dentzel, dans leurs dénonciations, ont dit, que Dentzel devoit livrer la ville de Landau, moyennant une somme. On ne peut mieux répondre à une pareille calomnie, qu'en mettant sous les yeux du public les pièces suivantes; elles prouvent assez l'opinion que les Prussiens avoient de Dentzel, sans avoir besoin d'y rien ajouter."
language = "fr"
place = "Paris"
date = "1794"
note = "Caption title. Imprint from colophon. Dated at end: A Paris, le 5 thermidor [an II = 23 juillet 1794]. Martin & Walter IV 2: 15928. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Skewed text. Uneven binding. Damaged, stained and/or loose pages."
