title = "... Réponse aux Observations du citoyen Albert Luynes : lue au Comité d'aliénation & des domaines, réunis, dans la séance du 15 nivôse de l'an second de la République française une & indivisible [4 décembre 1793] ; & imprimée par son ordre, en vertu de son arrêté dudit jour ; faisant suite au mémoire à la Convention au sujet des domaines volés par le plus indigne favoris de nos anciens tyrans ; présenté & lu au même comité, dans les séances des 3 & 5 pluviôse, & imprimé par son ordre, en vertu de ses arrêtés desdits jours."
