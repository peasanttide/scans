note = """Prospectus for "L'union, ou, Journal de la liberté,". Caption title. Printer statement from colophon. "Cette feuille ... continuera d'être publiée en françois, seulement ... à commencer du vendredi 13 novembre 1789"--P. 2. "Le prix de la souscription, par an, est réduit à 60 liv. pour Paris, à 67 l. 16 s. pour la province et à 3 guinées pour Londres ... On souscrit à Paris, chez M. Marshall, au bâtiment de l'ancienne Comédie Françoise, et au bureau, chez M. Le Boucher, libraire, au coin des rues de la Calendre et du Marché-Palu, en la Cité. Et à Londres, chez M. Schuber, vis-à-vis l'hôtel de Grenier, en Jermin-Street"--P. 2. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
