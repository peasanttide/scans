note = """Caption title. At head of title: (No. 22*). At right of title: B. no. 15, D. 67. Signed, p. [1]: Bréard, ex-président; Cambacérés et Michaud, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que les percepteurs enverront au receveur de l'agence de l'enregistrement, l'avis et la mention de la somme dûe pour les contributions des biens appartenant à la République -- Loi portant que les drapeaux pris à Ypres, seront suspendus à la voûte de la salle de la liberté, et que les bâtimens connus sous le nom de barrières de Paris, sont érigés en monumens publics. B. no. 15, D. 68 -- Loi qui ordonne le versement à la Trésorerie nationale, des fonds provenant de la vente des quarts de réserve des bois appartenant aux communes. B. no. 15, D. 69 -- Loi qui assujétit au paiement du droit proportionnel les domaines nationaux vendus qui se trouveraient dans une succession, donation, etc. B. no. 16, D. 71. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
