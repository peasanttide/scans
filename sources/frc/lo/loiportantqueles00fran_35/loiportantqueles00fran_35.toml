title = "Loi portant que les percepteurs enverront au receveur de l'agence de l'enregistrement, l'avis et la mention de la somme dûe pour les contributions des biens appartenant à la République : du 13 messidor l'an deuxième de la République franc̦aise, une et indivisible"
