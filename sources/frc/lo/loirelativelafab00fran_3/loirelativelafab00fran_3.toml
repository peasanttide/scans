note = """Caption title. At right of title: No. 1729. Signed: Louis; countersigned: Duranthon. Imprint from colophon. Variant of Martin & Walter. Révolution française, IV:2, 9143. "Décret de l'Assembée nationale, du 14 mai 1792 ..."--P. [1]-4. "Tarif du prix que la régie nationale des poudres & salpêtres payera aux salpêtriers pour l'année 1792, comparé au prix ancien, & fixation de l'indemnité à accorder pour 1790 & 1791"--Table on folded leaf. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
