title = "Loi portant que les nouvelles officielles des nouveaux succès des armées du Nord et de Sambre et Meuse, seront envoyées aux autres armées, que le nom de Jacques Yvernot sera inscrit sur la colonne du Panthéon, etc. : du 15 messidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 24*). At right of title: B. no. 13, D. 62. Signed: Bréard, ex-président; Cambacérès et Michaud, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale décrète ..."--P. [1]. Loi portant que les nouvelles officielles des nouveaux succès des armées du Nord et de Sambre et Meuse, seront envoyées aux autres armées, que le nom de Jacques Yvernot sera inscrit sur la colonne du Panthéon, etc. -- Loi portant que l'armée du Nord et celle de Sambre et Meuse ne cessent de bien mériter de la patrie, et que les troupes des tyrans coalisés renfermées dans les places du territoire français sur la frontière du Nord, seront passées au fil de l'épée si elles ne se rendent à discrétion sous vingt-quatre heures. B. no. 13, D. 63 -- Loi relative aux certificats qui doivent être délivrés aux créanciers, pour toucher les créances, conformément au decrét du 27 brumaire. B. no. 16, D. 73 -- Loi portant qu'aucune indemnité définitive sur les pertes éprouvées par l'invasion des ennemis, ne sera acquittée qu'en vertu d'un décret. B. no. 16, D. 74 -- Loi concernant une question relative aux déclarations du juri et aux actes d'accusation. B. no. 16, D. 75. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
