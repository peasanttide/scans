title = "Lois relatives aux prises et a l'armement en course"
language = "fr"
place = "A Paris"
date = "1798"
note = """Caption title. Imprint from colophon. "No. 7"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. Arrêté du Directoire exécutif, concernant la répartition aux capteurs, du tiers du produit des prises faites par les bâtimens de la République. Du 25 messidor an VI ... -- Arrêté du Directoire exécutif, concernant la délivrance des lettres de marque et autorisation pour armer en course dans les colonies d'Amérique. Du 13 thermidor an VI ... -- Arrêté du Directoire exécutif, portant que les individus natifs de pays alliés ou neutres qui feraient partie des équipages de bâtimens ennemis, seront traités comme pirates. Du 8 brumaire an VII ... -- Arrêté du Directoire exécutif, additionnel à celui du 8 brumaire, relatif aux individus des pays alliés ou neutres embarqués sur des bâtimens ennemis. Du 24 brumaire an VII ... -- Arrêté du Directoire exécutif, qui autorise la capture des bâtimens de guerre et de commerce portant pavillon algérien, tunissien ou tripolitain. Du 27 pluviose an VII -- Arrêté du Directoire exécutif, en interpretation de celui du 12 ventose an V, concernant la navigation des bâtimens neutres. Du 28 ventose an VII ... -- Arrêté du Directoire exécutif, concernant la délivrance des lettres de marque. Du 18 germinal an VII ... -- Loi qui abroge l'article premier de celle du 29 nivose an VII, relative à la course maritime. Du 23 frimaire an VIII ... -- Arrèté des consuls de la République, qui remet en vigueur le reglement du 26 juillet 1778, concernant la navigation des bâtimens neutres. Du 29 frimaire an VIII ... Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
