note = """Caption title. At right of title: Nos. 140*, 183, 231 et 232, 497. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale décrète ..."--P. [1]. Loi portant que les objets pris à l'avenir sur les bâtimens ennemis, et propres à faciliter les progrès des sciences et des arts, ou à enrichir le muséum national, seront adressés, par les capteurs, à la Convention nationale, du 4 brumaire an III ... (no. 140*) -- Loi concernant la vente des marchandises provenant des prises faites sur les ennemis de la République, et de celles venues de l'étranger par le commerce particulier, du 12 frimaire an III ... (No. 183*) -- Loi sur les finances et le crédit publique, du 13 nivose an III ... (No. 231 et 232*) -- Loi qui permet à tous citoyens français d'armer en course pour courir sur les bâtimens ennemis, et accorde une amnistie aux marins qui ont déserté leurs quartiers ou les ports d'armement et de relâche, du 23 thermidor an III ... (No. 497*). Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
