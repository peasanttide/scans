note = """Caption title. At head of title: (No. 28*). At right of title: B. no. 19, D. 87. Signed, p. 2: Louis (du Bas-Rhin), président; A. Dumont, Brival et Legendre, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que les biens provenant de la succession Soubise seront administrés et vendus comme les autres biens nationaux ... -- Loi relative au citoyen Lebon, représentant du peuple ... B. no. 19, D. 88 -- Loi qui fixe le traitement des agens et des employés de l'agence de l'enregistrement et des domaines ... B. no. 20, D. 91 -- Loi qui accorde des pensions de retraite à plusieurs militaires retirés du service pour cause de blessures ou d'infirmités ... B. no. 23, D. 106 -- Loi qui accorde des pensions à plusieurs veuves des citoyens morts en défendant la patrie ... B. no. 23, D. 107. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
