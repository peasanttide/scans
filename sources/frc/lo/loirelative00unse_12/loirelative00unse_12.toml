title = "Loi relative à l'organisation de la Régie des droits d'enregistrement, & autres y réunis : donnée à Paris, le 27 mai 1791"
language = "fr"
place = "A Rouen"
date = "1791"
note = """Caption title. "L'Assemblée nationale a décrété, & nous voulons & ordonnons ce qui suit"--P. [1]. Imprint from colophon. At upper right of folded leaves: No. 940. Not in Martin & Walter. Révolution française. "Tableau des divers préposés de la Régie du droit d'enregistrement & autres réunis, de leur traitement, suivant les divers emplois, de leur remise, sur un produit présumé de soixante millions, & de tous frais de la régie"--Table on leaf 1. "Répartition entre tous les directeurs, inspecteurs, vérificateurs, gardes-magasins, & receveurs du timbre extraordinaire, & fixation de leur traitement & de la quotité de leur remise suivant la nature de leurs emplois, sur un produit présumé de soixante millions"--Table on leaf 2. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined. Damaged, stained pages and cover."""
url = "https://archive.org/details/loirelative00unse_12"
