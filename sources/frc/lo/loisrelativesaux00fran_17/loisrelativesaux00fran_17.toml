title = "Lois relatives aux prises et a l'armement en course"
language = "fr"
place = "A Paris"
date = "1796"
note = """Caption title. At right of title: Nos. 156, 360, 319, 364, 370. Imprint from colophon. "No. 7"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. Loi qui prescrit la forme de procéder sur les appels en matière de prises, du 8 floréal an IV de la République française ... (No. 156) -- Arrêté du Directoire exécutif, concernant la manière dont e pavillon de la République française en usera envers les bâtimens neutres, du 2 frimaire an V de la République française ... Extrait du registre des arrêtés du Directoire exécutif, du 14 messidor an IV de la République française ... (No. 360) -- Arrêté du Directoire exécutif, qui ordonne aux commandans des forces maritimes, de visiter les navires américains, du 28 messidor an IV de la République française, une et indivisible -- Loi portant que tout acquéreur de navire provenant des prises ou autre, don la vente aura été faite et consommée antérieurement à la lois du 19 thermidor an IV, et dans les formes prescrites par les lois relatives à ces sortes de ventes, est autorisé à expédier son navire pour telle destination que bon lui semblera, en remplissement les formalités exigées par les lois sur la navigation, du 7 vendémiare an V de la République française ... (No. 319) -- Arrêté du Directoire exécutif, qui prescrit des mesures de sûreté pour l'admission des navires neutralisés, et des individus venant d'Angleterre, dans les ports de la République, du 3 frimaire an cinquième de la République française ... (No. 364) -- Arrêté du Directoire exécutif, qui détermine la manière dont seront acquittés les frêts et surestaires résultant de l'arrestation des bâtimens neutres, du 9 frimaire an V de la République française ... (No. 370). Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
