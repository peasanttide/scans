note = "Caption title. At head of title: No. 92. Au nom de la République française. At right of title: B. 29, No. 198. Signed: Le Tourneur (de la Manche), président; par le Directoire exécutif, le secrétaire-général, Lagarde. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi qui attribue aux juges ordinaires la connoissance des affaires qui étaient portées devant les tribunaux de famille, du 9 ventose -- 2o. Loi qui ordonne que les affaires dont la connoissance étoit attribuée à des arbitres forcés, seront portées devant les juges ordinaires, du 9 ventose. B. 29, No. 199. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
