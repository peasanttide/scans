note = """Prospectus for French translation of Smith's "Emmeline, the orphan of the castle". Caption title. "A Paris, chez Buisson, libraire, Hôtel de Coetlosquet, rue Haute-Feuille, no. 20, au coin des Cordeliers, et chez tous les marchands de nouveautés"--P. [1]. Imprint from colophon. "Permis d'impr. A Paris, ce 17 juil. 1788"--P. [2]. Includes brief prospectuses for Mirabeau's "Sur la réforme politique des juifs" and Colleville's "Alexandrine, ou, L'amour est une vertu.". Includes prices for bound volumes. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  No page numbers. <br />."""
