note = """Caption title. At head of title: (No. 502.*). "La Convention nationale ... décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi qui étend aux militaires contre lesquels il a été prononce des peines pour fait de désertion dans l'intérieur, l'amnistie accordée par la loi du 10 thermidor à ceux qui avaient abandonné leurs drapeaux : du 23 thermidor, an troisième de la République française une et indivisible : B. no. 171. D. no. 1020 -- 2o. Loi portant que dans chaque corps des différentes armes, il pourra être accordé des congés à raison de deux hommes par cent présens aux drapeaux : du 23 thermidor, an troisième de la République française une et indivisible : B. no. 171. D. no. 1021. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
