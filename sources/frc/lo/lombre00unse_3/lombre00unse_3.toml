title = "L'Ombre de monsievr de Chastillon : ov, les avis heroïqves et importans : donnez a Mr le prince de Condé."
language = "fr"
place = "A Paris"
date = "1649"
note = """Signatures: A-C². "Advis particvlier de l'avthevr à monsievr le prince": p. 12. Also issued as "Les Avis héroïques et importants." (Moreau 514) Cf. Moreau 2591. Harangue against Condé dispairing the unrest of the times. Title vignette. In verse. Published between January 8 and 11, 1649. Cf. Moreau III, 306. Attributed to Jean Duval and Jacques Carpentier de Marigny. Cf. Walsh 2591. Portraits of the Duke and Duchess of Chastillon inserted. Moreau. Walsh."""
url = "https://archive.org/details/lombre00unse_3"
