title = "Loi qui autorise le tribunal criminel du département de Paris, à appliquer au traître Coffinal et autres individus mis hors de la loi, la peine que la loi prononce : du 18 thermidor, l'an deuxième de la République française, une et indivisble"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: No. 54. bis*. At right of title: B. no. 33, D. 183. Signed, p. [1]: Merlin (de Douai), président; Bar et Levasseur (de la Meurthe), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale autorise ..."--P. [1]. Loi qui autorise le tribunal criminel du département de Paris, à appliquer au traître Coffinal et autres individus mis hors de la loi, la peine que la loi prononce -- Loi relative à la proposition d'autoriser les représentans en mission à mettre en liberté les citoyens mis en arrestation par d'autres représentans. B. no. 33, D. 185 -- Loi qui ordonne l'envoi au Comité de salut public des arrêtés pris par les représentans du peuple en mission. B. no. 33, D. 186 -- Loi portant que les ci-devant ministres du culte, religieux et religieuses pensionnés de la République, toucheront sans délai l'arriéré des sommes qui leur sont dûes. B. no. 34, D. 187 -- Loi portant qu'un citoyen pourra réunir traitement et pension, lorsque l'un et l'autre n'exéderont pas la somme de 1000 livres. B. no. 34, D. 188 -- Loi relative aux militaire retirés avec traitement avant la guerre de la liberté, et qui se sont de nouveau dévoués au service de la République. B. no. 34, D. 189 -- Loi portant que les inscriptions provisoires de la dette consolidée continueront d'être admises en paiement des domaines nationaux. B. no. 34, D. 190. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
