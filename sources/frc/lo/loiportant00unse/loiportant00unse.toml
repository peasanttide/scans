type = "pamphlet"
title = "Loi portant que l'Armée des Pyrénées occidentales ne cesse de bien mériter de la patrie : du 24 thermidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 57*). At right of title: B. no. 36, D. 204. Signed, p. [1]: Merlin (de Douai) président; Bar, Levasseur (de la Meurthe), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que l'Armée des Pyrénées occidentales ne cesse de bien mériter de la patrie -- Loi portant que l'Armée de la Mozelle ne cesse de bien mériter de la République. B. no. 37, D. 208 -- Loi qui fixe la durée des missions des représentans du peuple près des armées et dans les départemens. B. no. 38, D. 209 -- Loi qui rappelle dans la sein de la Convention nationale les représentans du peuple absens par congé ou en mission dans leur département. B. no. 38, D. 210 -- Loi qui rapporte les dispositions de celle du 23 thermidor concernant l'élargissement des détenus. B. no. 39, D. 213 -- Loi qui détermine la manière dont le ministre plénipotentiaire des Etats-Unis de l'Amérique sera introduit au sein de la Convention nationale. B. no. 38, D. 211 -- Loi qui fixe l'heure à laquelle le ministre plénipotentiaire sera admis au sein de la Convention nationale. B. no. 38, D. 212 -- Loi additionnelle à celle du 6 juin 1793 (vieux style) relative aux pensions des militaires blessés ou infirmes. B. no. 39, D. 214 -- Loi qui reconnaîte et proclame ministre plénipotentiare des Etats-Unis d'Amérique près la République française, le citoyen James Monroe. B. no. 39, D. 215 -- Loi portant que les fermiers des biens nationaux qui sont dans l'impossibilité de satifaire à celle du 16 brumaire concernant le payement en nature, pourront se libérer en assignats. B. no. 40, D. 220. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
url = "https://archive.org/details/loiportant00unse"
