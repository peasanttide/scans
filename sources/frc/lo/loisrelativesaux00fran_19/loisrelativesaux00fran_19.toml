note = """Caption title. At right of title: Nos. 447, 493, 573, 578, 594. Imprint from colophon. "No. 7"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. Arrête du Directoire exécutif, concernant la navigation des navires neutres chargés de marchandises appartenant aux ennemis de la République, et le jugement des contestations sur la validité des prises maritimes -- Arrêté du Directoire exécutif, qui prescrit des mesures pour les prises faites sur les ennemis de l'Etat -- Arrêté du Directoire exécutif, qui ordonne l'exécution d'anciennes ordonnances relativement aux cas où les commandans de corsaires pourront relâcher des prisonniers de guerre -- Loi relative aux reprises faites par les troupes de la République sur ses ennemis -- Loi qui détermine la manière de se pourvoir contre les décisions du Conseil exécutif provisoire en matière de prises mar[i]times. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
