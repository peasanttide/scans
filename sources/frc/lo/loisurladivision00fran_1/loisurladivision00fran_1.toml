note = """Caption title. At head of title: (No. 598*). At right of title: B. 194, no. 1160. "La Convention nationale décrète"--P. [1]. Signed: Genissieu, président; Auger, Pons (de Verdun), secrétaires. Imprint from colophon. "Loi du 19 vendémiaire. No. 598"--Bottom of p. 5. Not in Martin & Walter. Révolution française. Loi sur la division du territoire de la République, le placement et l'organisation des autorités administratives et judicaires -- Loi du 19 vendémiaire an 4. Tableau de l'emplacement des chefs-lieux de département -- Tableau des tribunaux civils et criminels des départemens de la République, ainsi que des lieux de leur emplacement et des trois tribunaux d'appel affectés à chacun d'eux -- Tableau de l'emplacement des tribunaux correctionnels -- Loi qui approuve les tableaux annexés à la loi du 19 vendémiaire concernant l'organisation administrative et judiciaire. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
