title = "Loi et arrêté du Directoire exécutif, relatifs à l'emprunt forcé : des 21 et 22 nivôse, an quatrième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1796"
note = "Caption title. At head of title: No. 53. Au nom de la République française. At right of title: B. 18. No. 105. Signed: Reubell, président; par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, qui détermine un mode pour régler le cours de assignats dans les départemens autres que celui de la Seine, du 21 nivôse -- 2o. Loi portant que les cotisables en retard de payer les deux premiers tiers de l'emprunt forcé, y seront contraints, du 22 nivose. B. 18, no. 108. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."
