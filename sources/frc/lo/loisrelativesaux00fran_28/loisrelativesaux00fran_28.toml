note = """Caption title. At head of title: (No. 234*). At right of title: B. no. 107, D. 562. Signed, p. [1]: Clauzel, ex-président; Girot (du Puy-de-Dôme), Le Tourneur (de la Manche), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale décrète ..."--P. [1]. Loi qui rapporte l'article additionnel à celle du 4 nivôse sur l'abolition du maximum, du 14 nivose, l'an troisième de la République francaise, une et indivisible -- Loi qui abolit toutes procédures commencées à raison de transports de grains ou de farines, sans acquit-à-caution, dans l'intérieur de la République et à deux lieues des frontières, du 14 nivôse, l'an troisième de la République française, une et indivisible. B. no. 107. D. 563. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover. Only one numbered page."""
