note = """Caption title. Imprint from colophon. At head of title: Corps législatif. Conseil des cinq-cents. "Loi relative aux domaines congéables. Donnée à Paris, le 6 août 1791": p.[1]-10. "Loi qui abolit la tenure connue dans le départemens du Morbihan, du Finistère, & des Côtes-du-Nord, sous les noms de convenant & domaines congéables. Du 27 août 1792, l'an quatrième de la liberté": p.10-16. "Décret de la Convention nationale. Du 29 floréal, l'an 2 de la République française [18 mai 1794]:" p.16-17. "Loi relative aux domaines congéables. Du 9 brumaire an 6 de la République française, une & indivisible [30 octobre 1797]. Du 17 thermidor an 5 [4 juillet 1797]": p.17-19. Note the discrepancies between the dates of the documents and the imprint date. Martin & Walter IV 2: 3879. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
