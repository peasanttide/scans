title = "Lois relatives aux prises et à l'armement en course"
language = "fr"
place = "A Paris"
date = "1798"
note = """Caption title. Imprint from colophon. "No. 7"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. Loi relative au droit de sauvetage sur des propriétés ennemis -- Loi relative aux navires chargés de marchandises anglaises -- Arrêté du Directoire exécutif, portant levée provisoire de l'embargo mis sur les bâtimens particuliers armés en course -- Loi relative à la manière de procéder en matière de prise maritimes conduites par des français en pays neutre ou allié -- Loi relative au délais pour l'instruction et le pourvoi en cassation contre les jugemens en matière de prises maritimes -- Loi qui assujétit les neutres à fournir caution pour l'exécution des jugemens définitifs, avant l'expiration du délai pour le pourvoi en cassation -- Arrêté du Directoire exécutif, concernant les bâtimens chargés de marchandises anglaises sujettes à réexportation -- Arrêté du Directoire exécutif, concernant les lettres qui seront trouvées sur des navires ennemis -- Arrete du Directoire exécutif, concernant la quarantaine à laquelle sont soumis les bâtimens qui arrivent dans les ports de la Méditerranée. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
