title = "Loi portant que le contrôleur de la caisse générale retirera de la serre à trois clés, jusquà concurrence de cent soixante-quatorze millions huit cent trente-deux mille cinq cent quatre-vingt-sept livres dix-sept sous deux deniers, pour l'excédant des dépenses faites pendant le mois de prairial dernier : du 22 thermidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 56*). At right of title: B. no. 37, D. 207. Signed, p. [1]: Thuriot, ex-président Collombel (de la Meurthe), Fréron, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que le contrôleur de la caisse générale retirera de la serre à trois clés, jusquà concurrence de cent soixante-quatorze millions huit cent trente-deux mille cinq cent quatre-vingt-sept livres dix-sept sous deux deniers, pour l'excédant des dépenses faites pendant le mois de prairial dernier -- Loi portant que les arrêtés ou jugemens en vertu desquels des citoyens auront été mis en liberté, leur serviront de passe-ports pour se rendre à leur domicile. B. no. 35, D. 200 -- Loi portant que le Tribunal révolutionnaire entrera sans délai en activité. B. no. 36, D. 201 -- Loi portant que les jurés au Tribunal révolutionnaire, en déclarant les faits, seront tenus de déclarer l'intention dans laquelle ils ont été commis. B. no. 36, D. 202 -- Loi relative aux citoyennes non nobles dont les demandes en divorce avec des ci-devant nobles étaient formées avant la loi du 27 germinal. B. no. 40, D. 219. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
