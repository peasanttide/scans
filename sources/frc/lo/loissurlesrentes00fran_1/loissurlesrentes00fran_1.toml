note = """Caption title. At head of title: No. 419. Au nom de la République française. Imprint from colophon. "No. 9, 10"--Bottom of p. [1]. Not in Martin & Walter. Révolution française. 1o. Loi relative au paiemens des arrérages de rentes et pensions dues pour le second semestre de l'an IV, et à leur emploi en acquisition de domaines nationaux -- 2o. Loi portant que les commissaires de la résorerie feront distraction du sixième net de toutes les sommes qui proviendront de la perception des revenus et contributions ordinaires, pour l'employer au paiemens des arrérages des rentes et pensions, ordonné par la loi du cinquième jour complémentaire. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
