note = """Caption title. At head of title: (No. 37. bis*). At right of title: B. no. 28, D. 129. Signed: Thuriot, ex-président; Bar et Levasseur (de la Meurthe), secrétaires. Imprint from colophon. "Journal des décrets, no. 657"--Bottom of p. [1], second sequence. "Décret sur la solde des troupes"--Bottom of p. 5, second sequence. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète"--P. [1]. "Tarif pour la solde des militaires de tous grades et de toutes armes, employés dans les armées de la République"--14 folded p. at end. Scanner's note: No copyright page found. No table-of-contents pages found.  Inconsistent page size. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
