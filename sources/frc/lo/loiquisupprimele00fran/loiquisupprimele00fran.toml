note = """Caption title. At head of title: (No. 18*). At right of title: B. no. 9, D. 48. Signed, p. [1]: Élie Lacoste, président; Bordas et J.P. Lacombe-Saint-Michel, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui supprime les municipalités d'Ornolac, Quié, Arignac, Bonpas et Arnave, et les réunit à celle de Tarascon -- Loi qui détermine le mode de procéder dans toutes contestations de la compétence des tribunaux de famille où il aura été ordonné quelques ventes de fonds indivis avec des mineurs. B. no. 9, D. 49 -- Loi qui détermine la peine à infliger aux fonctionnaires publics et autres, qui auraient commis les délits prévus par l'article XXVII du titre II de la loi concernant la police municipale, etc. B. no. 11, D. 51 -- Loi concernant l'organisation des archives établis auprès de la représentation nationale. B. no. 12, D. 58. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
