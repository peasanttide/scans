note = """Caption title. At head of title: Au nom de la République française. Signed, p. 8: P. Barras, président. Par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. "No. 2, 3, 9"--Bottom of p. [1]; "No. 868"--Top of p. [1]. "Dépenses judiciaires, No. 868"--Bottom of p. 3. Not in Martin & Walter. Révolution française. 1o. Loi contenant fixation du traitement des juges de paix, du 8 ventose an VII. (B. 261. No. 2566) -- 2o. Loi relative aux dépenses de l'ordre judiciaire à la charge des départemens, du 8 ventose an VII. (B. 261. No. 2567) -- 3o. Loi qui fixe le traitement des commissaires du Directoire exécutif et de leurs substituts près les tribunaux, du 9 ventose an VII. (B. 261. No. 2571) -- Etat des traitemens des comissaires du Directorie exécutif et de leur substituts près les tribunaux. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
