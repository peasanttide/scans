note = """Caption title. At right of title: No. 1126. "Pour le roi. Signé M.L.F. DuPort"--P. 6. Imprint from colophon. Martin & Walter. Révolution française. Décret de l'Assemblée nationale, du 2 juillet 1791 -- État des pensions à la charge de la ferme générale des messageries -- Pensions que Durdan devoit payer jusqu'à la fin de son bail, au premier janvier 1797 -- État des pensions dont les fermiers des voitures de la cour s'étoient chargés envers les veuves de leurs co-intéressés, & les anciens cochers, à la forme de leurs délibérations, qui, sur les représentations de la compagnie, lors de la conversion de la ferme en régie, ont été confirmées par le ministre des finances, avec autorisation à continuer le payement de ces pensions .. Bibliography: Martin & Walter. Révolution française, IV:2, 9143. Scanner's note: Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text. No title page found. No copyright page found. No table-of-contents pages found."""
