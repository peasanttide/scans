note = """Caption title. At head of title: Au nom de la République française. Imprint from colophon. "No. 6"--Bottom of p. [1]; "No. 977"--Top of p. [1]. "Création de trois légions, an VII. (No. 977)"--Bottom of p. 5. Not in Martin & Walter. Révolution française. 1o. Loi qui autorise la création d'une légion étrangère sous la dénomination d'Italique, du 22 fructidor an VII -- 2o. Loi qui autorise la création d'une nouvelle légion polonaise, du 22 fructidor an VII -- 3o. Loi qui autorise la levée d'un légion sous la dénomination des Francs-du-Nord, du 22 fructidor an VII. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
