note = """Caption title. At head of title: No. 41. Au nom de la République française. Signed: Reubell, président; par le Directorie exécutif, le secrétaire général, Lagarde. Imprint from colophon. "Lois sur les traitemens de plusieurs fonctionnaires publics"--Bottom of p. 3. Not in Martin & Walter. Révolution française. 1o. Loi qui fixe le traitement des secrétaires-rédacteurs et messagers d'Etat du corps législatif, du 26 frimaire. B. 13, No. 64 -- 2o. Loi qui fixe le traitement des commissaires de la Trésorerie et de la comptabilité, du 28 frimiaire. B. 13, No. 68 -- 3o. Loi qui fixe le traitement du commissaire du Directoire exécutif près le Tribunal de cassation, et des greffiers-commis, etc., du 29 frimaire. B. 13, No. 69 -- 4o. Loi qui fixe le traitement des huissiers du corps législatif, du premier nivose. B. 13, No. 70. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
