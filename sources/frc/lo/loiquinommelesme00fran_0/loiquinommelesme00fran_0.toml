note = """Caption title. At head of title: (No. 26*). At right of title: B. no. 17, D. 78. Signed, p. [1]: Voulland, ex-président; Bordas et A. Besson, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui nomme les membres du juri chargé de l'examen des livres élémentaires remis au concours ... -- Loi qui fixe le délai dans lequel devront être déposés tous fonds ou effets appartenans aux habitans des pays qui sont en guerre avec la République ... B. no. 17, D. 79 -- Loi qui détermine la manière dont seront effectués, dans les caisses nationales, les paiemens autres que ceux de pensions intérêts et remboursemens de la dette publique, etc. ... B. no. 17, D. 80 -- Loi portant que l'administration du département du Cantal sera définitivement fixée à Aurillac ... B. no. 17, D. 81. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
