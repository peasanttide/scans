note = """Caption title. At head of title: (No. 284*). At right of title: B. no. 122, D. no. 645. Signed: P. Barras, président; Bouret, Mercier, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que les veuves et enfans, etc. dont les pensions accordées en considération des services de leurs parens dans la maison du ci-devant roi, ont été supprimées par la loi du 17 germinal, recevront, à titre de secours annuel, le montant de leurs pensions, s'il n'excède point la somme de 400 liv., de 24 nivôse, l'an troisième ... -- Loi portant que les personnes dont les pensions accordées en considération des services de leurs maris ou parens dans la maison du ci-devant roi, ont été supprimées par la loi du 17 germinal, recevront un secours annuel, du 18 pluviôse, l'an troisième ... B. no. 122, D. no. 648. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
