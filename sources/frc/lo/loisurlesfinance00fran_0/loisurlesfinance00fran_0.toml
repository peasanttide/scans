note = """Caption title. At head of title: (No. 231 et 232*). At right of title: B. no. 107, D. 559 et 560. Signed: Le Tourneur (de la Manche), président; Auguis, Dumont (du Calvados), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. "Loi qui déclare que, dans les mesures à prendre pour retirer des assignats de la circulation, il n'en sera adopté aucune qui aurait pour but une démonétisation quelconque, du 14 nivose, l'an troisième de la République française, une et indivisible"--P. 3. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
