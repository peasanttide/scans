note = """Caption title. At head of title: (No. 58*). At right of title: B. no. 39, D. 216. Signed, p. [1]: Merlin (de Douai), président; P. Barras, Fréron et Collombel (de la Meurthe), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution. française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui rapporte la disposition de l'article premier de celle du 21 messidor, qui limite son effet aux communes dont la population est au-dessous de 1200 habitans -- Loi relative à la demande d'appliquer aux soldats, marins et ouvriers des ports qui ne vivent que de leur solde, la loi du 21 messidor. B. no. 39, D. 217 -- Loi relative à la proposition faite d'ajouter dans celle concernant la mise en liberté des citoyens ouvriers et cultivateurs, le mot citoyennes. B. no. 40, D. 221 -- Loi portant que le Comité de sûreté générale pourra prononcer, au nombre de six membres, la mise en liberté des citoyens arrêtés antérieurement au 9 thermidor. B. no. 40, D. 222 -- Loi qui autorise le département de Paris à viser les certificats de résidence et de civisme délivrés par les sections et comités révolutionnaire de cette communes. B. no. 39, D. 218. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
