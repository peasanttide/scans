title = "Loi qui rapporte la disposition de l'article premier de celle du 21 messidor, qui limite son effet aux communes dont la population est au-dessous de 1200 habitans : du 29 thermidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
