language = "fr"
place = "A Paris"
date = "1795"
note = """Caption title. At head of title: (No. 397.*). "La Convention nationale ... décrète que ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi relative aux assignats dont la déchéance a été prononcée par le décret du 31 juillet 1793 (vieux style) : du 22 floréal, an troisième : B. no. 144. D. no. 809 -- 2o. Loi relative aux assignats de cinq livres et au-dessus portant des empreintes de royauté : du 27 floréal, an troisième : B. no. 144. D. no. 813 -- 3o. Loi portant que les assignats de dix livres ne sont pas démonétisés : du 28 floréal, an troisième : B. no. 144. D. no. 814 -- 4o. Loi qui ordonne la vérification de toutes les caisses de la République, pour constater la quantité d'assignats démonétisés qui s'y trouvent : du 28 floréal, an troisième : B. no. 144. D. no. 815. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
