note = """Caption title. At head of title: Au nom de la République française. Signed: Gohier, président; par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. "No. 6"--Bottom of p. [1]; "No. 988"--Top of p. [1]. Not in Martin & Walter. Révolution française. 1o. Loi relative aux défenseurs de la patrie tués en combatant, ou morts par suite de leurs blessures, du 6 vendémiaire an VIII -- 2o. Loi relative aux honneurs et aux récompenses nationales à décerner aux armées de la République, du 11 vendémiaire an VIII -- 3o. Loi relative aux honneurs qui seront décernés aux fonctionnaires et aux citoyens qui, dans les dangers publics, auront rendu de grands services à leur pays, du 11 vendémiaire an VIII. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
