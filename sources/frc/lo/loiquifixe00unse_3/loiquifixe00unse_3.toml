title = "Loi qui fixe l'indemnité à accorder aux troupes de terre et de mer, dont les équipages auront été pris dans les colonies françaises : du 27 vendémiare, l'an troisième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 135*). At right of title: B. no. 75, D. 400. Signed, p. [1]: Cambacérès, président; Eschasseriaux jeune, Boissy, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui fixe l'indemnité à accorder aux troupes de terre et de mer, dont les équipages auront été pris dans les colonies françaises -- Lois relatives au même objet, des 1er. mai 1792, 7 mai 1793 (vieux style), 4 germinal et 9 thermidor de l'an deuxième: Décret relatif aux appointemens des officiers, et aux moyens d'accélérer la formation de leurs équipages -- Decret relatif à l'indemnité à accorder aux militaires employés dans les armées dont les équipages de guerre auront été pris par les ennemis -- Decret qui prescrit les formalités à observer de la part des militaires qui réclament une indemnité pour leurs équipages de guerre pris par l'ennemi -- Loi relative à l'indemnité à accorder aux militaires dont les équipages de guerre aouront été pris par les ennemis. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
