note = """Caption title. At head of title: (No. 422.*). "La Convention nationale ... décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. Loi portant que les dispositions de l'arrêté du Comité de législation, du 12 floréal, sur les baux des biens des détenus, etc., sont applicables à ceux des biens des prévenus d'emigration et réintégrés, etc. : du 18 prairial, l'an troisième de la République française une et indivisible : B. no. 153. D. no. 899 -- Loi portant que celles sur les pères et mères d'émigrés ne sont point applicable aux pères et mères d'enfans nés hors marriage : du 18 prairial, an troisième : B. no. 154. D. no. 902 -- Loi qui rapporte celle du 6 floréal dernier, relative aux radiations sur les listes des émigrés : du 20 prairial, an troisième : B. no. 154. D. no. 906. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover. Only one numbered page."""
