language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 5*). At right of title: B. no. 3, D. no. 9. Signed, p. [1]: Turiot, ex-président; Carrier et Francastel, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... déclare"--P. [1]. Loi sur une question proposée par le jugement du tribunal du district de Chaumont, en date du 5 prairial -- Loi relative aux détenteurs de portions du rivage de la mer. B. no., 3 D no. 10 -- Loi portant que le procès-verbal de la séance du 20 prairial contiendra le détail de la fête nationale célébrée le même jour. B. no. 3, D.11 -- Loi relative aux poursuites des délits antérieurs aux nouvelles divisions faites ou à faire de quelques portions du territoire de la République. B. no. 3, D.12 -- Loi relative à la compétence des tribunaux pour connaître des revendications faites par les citoyens, des fonds ci-devant possédés par des émigrés. B. no. 5, D.18 -- Loi relative à la représentation et au paraphe des baux des fermiers du ci-devant ordre de Malte. B. no. 5, D.19 -- Loi qui annulle un jugement du tribunal du district de Vervins, et ordonne que Decaine, père et fils, et Bracelet seront traduits au Tribunal révolutionnaire. B. no. 5, D.20. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
