note = """Caption title. At head of title: No. 552. Au nom de la République française. Imprint from colophon. "No. 1, 2, 3, 12"--Bottom of p. [1]. "Conspiration royale. No. 552"--Bottom of p. 5. Not in Martin & Walter. Révolution française. 1o. Loi portant que le général de l'armée de l'intérieur et les braves défenseurs de la liberté ont bien mérité de la patrie -- 2o. Loi portant une nouvelle rédaction des articles XXX et XXXI de celle du 19 fructidor, contenant des mesures de salut public -- 3o. Loi concernant une adresse aux départemens et aux armées -- Adresse du Corps législatif aux départemens et aux armées -- 4o. Loi qui ordonne la déportation des journalistes royaux -- 5o. Proclamation du Directoire exécutif aux Français -- 6o. Loi relative aux événemens du 18 fructidor -- 7o. Loi qui corrige deux erreurs de date dans celle du 19 fructidor. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
