note = """Caption title. At head of title: (No. 400.*). "La Convention nationale décrète ... "--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi portant qu'il ne sera provisoirement fabriqué qu'une seule espèce de de pain dans la commune de Paris, etc. : du 1er. prairial, an troisième de la République, une et indivisible : B. no. 145. D. no. 820 -- 2o. Loi qui autorise les représentans du peuple dans les départemens à faire rebattre les pailles des grains où ils le croirent nécessaire : du 2 prairial, l'an troisième de la République une et indivisible : B. no. 146. D. no. 827 -- 3o. Loi qui ordonne que tous les grains en gerbe seront battus sur-le-champ : du 2 prairial, l'an troisième de la République une et indivisible : B. no. 146. D. no. 828 -- 4o. Loi contenant des mesures pour assurer la subsistance des communes et des armées de la République : du 2 prairial, l'an troisième de la République une et indivisible : B. no. 146. D. no. 829. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
