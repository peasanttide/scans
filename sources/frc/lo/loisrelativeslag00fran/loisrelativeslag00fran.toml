note = """Caption title. At head of title: (No. 241*). Signed: Le Tourneur (de la Manche), président; Auguis, Dumont (du Calvados), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. 1o. Loi relative à l'augmentation de la gendarmerie à cheval, faisant le service dans Paris et ses environs -- 2o. Loi qui augmente réorganise la gendarmerie près les tribunaux du département de Paris, et détermine le mode d'admission dans ce corps. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text.  Faded print."""
