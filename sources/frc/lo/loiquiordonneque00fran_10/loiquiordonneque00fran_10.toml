title = "Loi qui ordonne que dans chaque maison des comissions exécutives, il sera dressé, imprimé et affiché un tableau des travaux dont on s'y occupe : du 19 thermdor [sic], l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 55*). At right of title: B. no. 34, D. 191. Signed, p. [1]: Merlin (de Douai), président; Portiez (de l'Oise), P. Barras, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui ordonne que dans chaque maison des comissions exécutives, il sera dressé, imprimé et affiché un tableau des travaux dont on s'y occupe -- Loi portant que les registres de la compagnie connue sous les noms de Masson et Espagnac, seront remis à la Trésorerie nationale. B. no. 34, D. 192 -- Loi relative à la liquidation des offices des ci-devant lieutenans de maréchaux de France, conseillers, rapporteurs et secrétaires-greffiers du point-d'honneur. B. no. 34, D. 193 -- Loi qui nomme les commandans de la dix-septième division militaire -- B. no. 34, D. 194 -- Loi concernant l'organisation de la Garde nationale de Paris. B. no. 35, D. 196 -- Loi relative à l'organisation des écoles primaires, et au traitement de leurs instituteurs. B. no. 35, D. 1[blank] -- Loi portant que l'Armée des Pyrénées occidentales a bien mérité de la patrie. B. no. 35, D. 198 -- Loi sur une proposition relative aux jugemens de faits antérieurs aux lois les ont prohibés. B. no. 35, D. 199. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
