title = "L'ordre et la marche de la cérémonie, qui se fera aujourd'hui, à midi, lorsque le roi se rendra à l'Assemblée nationale, pour signer la constitution française qu'il a accepté : grand discours du roi envoyé à l'Assemblée nationale, acceptant la constitution, et son amour pour tout ce qui peut contribuer au bonheur de ses fidèles sujets ; grand désir du roi, pour que les princes français goûtent comme lui l'utilité d'une bonne constitution, qui doit faire le bonheur des Français ; avec le discours qui témoigne son ressentiment contre les les [sic] aristocrates qui n'auront pas comme lui bonne opinion de notre incomparable constitution."
language = "fr"
place = "Paris"
date = "1791"
