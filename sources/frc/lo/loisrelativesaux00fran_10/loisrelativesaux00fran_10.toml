note = """Caption title. At head of title: (No. 458.*). "La Convention nationale, décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi qui fixe définitivement un délai pour l'emploi en paiement, ou le dépôt dans les caisses nationales, des assignats portant des empreintes extérieures de royauté : du 23 messidor, an troisième de la République française une et indivisible : B. no. 162. D. no. 949 -- 2o. Loi portant que, par celle du 23 messidor, il n'est pas dérogé à celle du 22 floréal concernant l'enregistrement des assignats à face au-dessus de 100 livres : du 25 messidor, l'an troisième de la République française une et indivisible : B. no. 163. D. no. 956. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover. Only one numbered page."""
