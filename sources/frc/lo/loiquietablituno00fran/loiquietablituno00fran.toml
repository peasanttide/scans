note = """Caption title. At head of title: No. 90. Au nom de la République française. At right of title: B. 28, No. 191. Signed: Letourneur, président. Par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. Not in Martin & Walter. Révolution française. "Arrêté du Directoire exécutif, qui ordonne la confection d'un état des sommes dues par la Trésorerie ou les divers départemens du ministère, avant l'organisation du régime constitutionnel, et, du 3 ventose. B. 28, No. 192"--P. 3-4. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
