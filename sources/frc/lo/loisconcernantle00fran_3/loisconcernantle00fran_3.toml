title = "Lois concernant les émigrés et leurs créanciers : des 28 et 29 fructidor, 3e, 4e et 5e jours complémentaires, an IIIe. de la République française une et indivisible"
language = "fr"
place = "A Paris"
date = "1795"
note = """Caption title. At head of title: (No. 551.*). "La Convention nationale ... décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi relative aux réclamations à faire par les propriétaires de créances sur les émigrés d'un même département : du 28 fructidor, an troisième : B. no. 178. D. no. 1087 -- 8o. Loi qui détermine le mode de liquidation des créances sur les biens indivis avec les émigrés : du 28 fructidor, an troisième : B. no. 179. D. 1091 -- 3o. Loi qui détermine le mode de liquidation des créances sur les parens des émigrés dont les successions sont ouvertes au profit de la nation : du 29 fructidor, an troisième : B. no. 178. D. no. 1090 -- 4o. Loi qui détermine le cas dans lesquels devront être déclarés émigrés les habitans du ci-devant comtat d'Avignon : du 29 fructidor, an troisième : B. no. 181. D. no. 1106 -- 5o. Loi qui fixe pour le département de Paris, le lieu du dépôt des titres de propriété de biens indivis avec des émigrés : du 29 fructidor, an troisième : du 29 fructidor, an troisième : B. no. 179. D. no. 1092 -- 6o. Loi qui passe à l'ordre du jour sur la proposition de faire reviser toutes les radiations faites sur les listes d'émigrés : du 3e. jour complémentaire, an troisième de la République française, une et indivisible : B. no. 181. D. no. 1107 -- 7o. Loi qui désigne les prévenus d'émigration, auxquels ne sera point opposée la déchéance, prononcée par la loi du 26 floréal dernier : du quatrième jour complémentaire, an III : B. no. 181. D. no. 1109 -- 8o. Loi qui détermine le cas dans lequel les créanciers d'émigrés qui auroient formé des actes d'union seront admis à la liquidation : du quatrième jour complémentaire, an III : B. no. 181. D. no. 1110 -- 9o. Loi qui accorde aux créanciers des émigrés et autres, dont les biens sont confisqués au profit de la nation, un nouveau délai pour déposer leur titres, etc. : du quatrième jour complémentaire, an III : B. no. 181. D. no. 1111. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
