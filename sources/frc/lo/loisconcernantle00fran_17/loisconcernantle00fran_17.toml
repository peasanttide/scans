title = "Lois concernant les créanciers des emigrés : des 17 et 19 frimaire an VI de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1797"
note = """Caption title. At head of title: No. 615. Au nom de la République française. Imprint from colophon. "No. 12"--Bottom of p. [1]. "Créanciers des emigrés. 17 frimaire an VI. No. 615"--Bottom of p. 3. Not in Martin & Walter. Révolution française. 1o. Loi contenant un mode pour suppléer à la perte des titres de créances sur les émigrés -- 2o. Loi relative à la reprise des procédures existantes contre des emigrés, et que l'article XXXII de la loi du 1er. floréal an III, déclarait éteintes -- 3o. Loi relative à la liquidation de créances sur les emigrés en faillite ou réputés insolvables -- 4o. Loi relative au paiement des arrérages des rentes ou pensions dues sur des biens d'emigrés, et non encore liquidées -- 5o. Loi qui fixe de droit d'insinuation des actes contenant des dispositions rénumératoires de la part des emigrés -- 6o. Loi portant que les dispositions des articles I, II et III de la loi du 8 floréal dernier, sont applicables aux créanciers viagers et pensionnaires d'emigrés, et autres dont les biens sont frappés de la confiscation nationale. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
