title = "Loix du 17 septembre 1792, l'an quatrième de la liberté : 1o. Payement des dépenses qu'exigent les opérations nécessaires pour établir en France l'uniformité des poids & mesures, 2o. Contraventions à la loi qui défend les cocardes autres que celles aux trois couleurs nationales, 3o. Abolition de tous procès & jugemens contre des citoyens, depuis le 14 juillet 1789, sous prétexte de provocation au duel, 4o. Négociations relatives aux indemnités qui peuvent résulter du licenciement & du désarmement des régimens Suisses, 5o. Ecclésiastiques non assermentés qui se retireroient dans les pays en guerre avec la France, 6o. Défense de l'exportation des grains & fourrages provenant de propriétés situées en France, appartenant à des étrangers, 7o. Articles additionnels à la loi du 27 août dernier, relative à l'enregistrement des effets au porteur, 8o. Congés des capitaines & lieutenans de vaisseaux, dont la santé aura été altérée sur mer, 9o. Organisation de la marine"
