title = "Lois et arrêtés du Directoire exécutif, concernant les mandats territoriaux et les promesses de mandats : des 16, 17 et 18 germinal, an quatrième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1796"
note = "Caption title. At head of title: No. 134. Au nom de la République française. Signed: Le Tourneur, président; par le Directoire exécutif, le secrétaire général, Lagarde. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Arrêté du Directoire exécutif, contenant des mesures pour assurer le crédit et empêcher la falsification des mandats territoriaux, du 16 germinal, an IV. B. 38, No. 302 -- 2o. Loi portant qu'à compter du premier germinal, les traitemens seront réduits à un taux fixe et payés en mandats, du 17 germinal, an IV. B. 38, No. 303 -- 3o. Loi qui détermine les valeurs admissibles en payement de l'emprunt forcé, du 17 germinal, an IV. B. 38, No. 304 -- 4o. Arrêté du Directoire exécutif, qui ordonne la promulgation à son de trompe, dans toutes les communes de la République, de la loi du 7 de ce mois, contenant des peines contre les fabricateurs et distributeurs de faux mandats, du 18 germinal, an IV. B. 38, No. 305. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
url = "https://archive.org/details/loisetarretesdud00fran"
