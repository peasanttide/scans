language = "fr"
place = "A Paris"
date = "1796"
note = """Caption title. At head of title: No. 327. Au nom de la République française. Imprint from colophon. "No. 9, 11"--Bottom of p. [1]. "Lois sur les finances, no. 327"--Bottom of p. 3. Not in Martin & Walter. Révolution française. 1o. Loi qui prescrit les formalités à observer par les pensionnaires non liquidés, pour toucher les secours à eux accordés -- 2o. Loi concernant l'ordre des paiemens à faire par la Trésorerie nationale -- 3o. Loi qui étend aux neuf départemens réunis, le mode établi pour procéder dans les instances en matières de douanes -- 4o. Arrêté du Directoire exécu[t]if, qui fixe le mode de paiement du droit de marque et contrôle sur les ouvrages d'or et d'argent -- 5o. Loi qui proroge le délai accordé pour l'obtention des patentes. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
