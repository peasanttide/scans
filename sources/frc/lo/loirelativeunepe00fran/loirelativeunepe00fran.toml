note = """Caption title. At head of title: (No. 43* et 44*). At right of title: B. no. 31, D. 152. Signed, p. [1]: Cambon, fils aîné, ex-président; Bar et Lavasseur (de la Meurthe), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... passe à l'ordre du jour ..."--P. [1]. Loi relative à une pétition du citoyen Lambert, en interprétation ds lois de 30 mars et 10 juillet 1791, portant que les acquéreurs des domaines nationaux ne peuvent prendre que les fruits qui y sont pendans par les racines au jour de l'adjudication, du 7 thermidor, l'an second de la République ... -- Loi qui rend comunes aux procès comencés avant l'installation des tribunaux criminels, les dispositions de celle du 18 prairial sur la manière d'entendre les témoins militaires, du 7 thermidor, l'an deuxième de la République ... B. no. 32, D. 163 -- Loi relative aux indemnités accordées pour pertes occasionnées par l'intempérie des saisons et autres accidens imprévus, du 8 thermidor, l'an deuxième de la République ... B. no. 31, D. 153. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
