note = """Caption title. At head of title: (No. 247*). At right of title: B. no. 112, D. no. 582. Signed: Le Tourneur (de la Manche), président; Auguis, Borel, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui autorise l'agence des messageries nationales à faire percevoir dans tous ses bureaux une augmentation de moitié, outre les prix portés par les tarifs actuels, du 20 nivôse, l'an troisième ... -- Loi qui décharge l'agence des messageries de toute responsabilité en cas d'évènemens occasionnés par force majeure, ou de dommages causés par un défaut d'emballage, du 27 nivôse l'an troisième ... B. no. 111, D. no. 587 -- Loi qui augmente le prix des ports de lettres, du 27 nivôse, l'an troisième ... B. no. 112, D. no. 588. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
