title = "Loi portant que les armées du Nord, des Ardennes et de la Moselle ne cessent de biens mériter de la patrie, et qu'elles se nomeront désormais armée de Sambre et Meuse : du 11 messidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
