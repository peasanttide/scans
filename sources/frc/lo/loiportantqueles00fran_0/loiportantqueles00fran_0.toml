note = """Caption title. At head of title: (No. 21*). At right of title: B. no. 10, D. 50. Signed, p. [1]: P.A. Laloy, ex-président; Briez et Michaud, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que les armées du Nord, des Ardennes et de la Moselle ne cessent de biens mériter de la patrie, et qu'elles se nomeront désormais armée de Sambre et Meuse -- Loi qui modifie l'article IV de la loi du 8 pluviôse, relative aux titres et actes ci-devant féodaux. B. no. 12, D. 59 -- Loi relative à l'époque de la déchéance pour les titres qui auraient dû être fournis depuis les scellés apposés chez Orléans. B. no. 12, D. 60 -- Loi relative au remplacement des sous-lieutenans en seecond supprimés dans l'arme de la cavalerie, par la loi du 21 nivôse. B. no. 12, D. 61. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
