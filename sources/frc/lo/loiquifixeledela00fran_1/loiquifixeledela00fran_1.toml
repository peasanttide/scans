note = """Caption title. At head of title: (No. 13*). At right of title: B. no. 4, D. 16. Signed: Vadier, ex-président; Briez et Michaud, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi qui fixe le délai dans lequel tous dépositaires de faux assignats ou d'instrumens propres à leur fabrication, etc. seront tenus d'en faire la remise -- Loi concernant l'exécution de l'arrêté du Comité de salut public sur les moyens provisoires d'abolir la mendicité. B. no. 8, D. 38 -- Loi sur une question relative aux baux des biens ci-devant dépendant de l'ordre de Malte. B. no. 8, D. 39 -- Loi sur une question relative aux formalités à observer lorsque des témoins essentiels sont dans l'impossibilité de comparaître devant les jurés. B. no. 8, D. 40 -- Loi sur une question concernant la poursuite des faits relatifs à la vente ou à l'achat du numéraire, avant la publication de la loi du 11 avril 1793. B. no. 9, D. 43. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged, stained pages and cover."""
