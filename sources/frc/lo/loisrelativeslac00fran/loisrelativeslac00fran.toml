note = """Caption title. At right of title: No. 609. Imprint from colophon. "Lois sur la contribution foncière 1791 (No. 609 &c.)"--Bottom of p. 5. Not in Martin & Walter. Révolution française. Loi qui assujétit à la contribution foncière les droits de péages, et autres non supprimés par le décret du 24 mars 1790, les revenus des canaux, etc., donnée à Paris, le 25 février 1791 -- Loi relative à l'évaluation des bois et forêts et des tourbières, donnée à Paris, le 20 juillet 1791, no. 1106 -- Loi relative à la perception des contributions foncière et mobiliaire, et du droit de patentes, donnée à Paris, le 2 octobre 1791, no. 1136 -- Loi relative au mode d'imposition pour les propriétaires de champarts, agriers, terrages, cens et rentes, et autres redevances annuelles, donnée à Paris, le 12 octobre 1791, no. 1350 -- Loi realtive à la contribution foncière pour 1792, des maisons situées hors des villes, du 3 septembre 1792 l'an quatrième de la liberté, no. 2538. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
