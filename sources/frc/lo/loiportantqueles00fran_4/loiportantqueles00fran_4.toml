title = "Loi portant que les laboureurs, moissonneurs, etc. des communes dont la population est au-dessous de douze cents habitans, et qui se trouvent détenus comme suspects, seront mis provisoirement en liberté : du 21 messidor, l'an deuxième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 27*). At right of title: B. no. 17, D. 82. Signed, p. [1]: Louis (du Bas-Rhin), président; A. Dumont et Legendre, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. Loi portant que les laboureurs, moissonneurs, etc. des communes dont la population est au-dessous de douze cents habitans, et qui se trouvent détenus comme suspects, seront mis provisoirement en liberté, du 21 messidor, l'an deuxième de la République ... -- Loi additionnelle à celle du 21 messidor, sur les détenus des campagnes, du 22 messidor, l'an deuxième de la République ... B. no. 18, D. 86 -- Loi qui enjoint aux direteurs des voitures nationale de donner, par préférence, des places aux personnes assignées pour venir en déposition au Tribunal révolutionnaire, du 21 messidor, l'an deuxième de la République ... B. no. 17, D. 83 -- Loi relative au vaisseau de ligne le Vengeur, et aux braves républicains composant son équipage, du 21 messidor, l'an deuxième de la République ... B. no. 18, D. 84 -- Loi qui fixe le délai dans lequel devront être versés dans les caisses de district, les fonds appartenant aux négocians émigrés, ou condamnés par les tribunaux révolutionnaires, du 21 messidor, l'an deuxième de la République ... B. no. 18, D. 85. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
