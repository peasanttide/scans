#:schema ../../../../schemas/source.json
layer = "source"
id = "loidecretee00unse"
type = "pamphlet"
title = "Loi décrétée les 15, 16, 17 et 24 août 1793, l'an second de la République une et indivisible : qui ordonne la formation d'un grand livre pour inscrire et consolider la dette publique non viagère, la remise et annullation des anciens titres de créance, sous peine de déchéance, l'accélération de la liquidation, la supression des rentes dues aux fabriques, la reconnoissance des dettes des communes, départemens et districts, comme dettes nationales, la liquidation des annuités et des effets au porteur, le remboursement ou l'inscription de la dette sur le grand licre, le paiement annuel de la dette publique dans les districts, la faculté de convertir les assignats en une inscription sur le grand livre, à raison de cinq pour cent du capital, l'admission de la dette consolidée en paiement des domaines nationaux à vendre, et l'assujettissement de la dette consolidée au principal de la contribution foncière"
language = "fr"
place = "A Paris"
date = "1810"
note = """Caption title. At head of title: No. 1513. "La Convention nationale, après avoir entendu le rapport de sa Commission des finances, décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
url = "https://archive.org/details/loidecretee00unse"
