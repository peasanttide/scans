title = "Lois concernant la mise en activité des cinq classes de la conscription, et l'amnistie accordée aux déserteurs : des 10 et 14 messidor, an VII de la République francaise, une et indivisible"
language = "fr"
place = "A Paris"
date = "1799"
note = """Caption title. At head of title: Au nom de la République française. Signed: Sieyes, président; par le Directoire exécutif, le secrétaire-général, Lagarde. Imprint from colophon. "No. 6, 9"--Bottom of p. [1]; "No. 938"--Top of p. [1]. "Conscription militaire, an VII. No. 938"--Bottom of p. 3. Not in Martin & Walter. Révolution française. 1o. Loi qui met les conscrits de toutes les classes en activité de service, et ordonne un emprunt de cent millions sur la classe aisée des citoyens, du 10 messidor an VII -- 2o. Loi relative à l'organisation des bataillons et des compagnies dont la formation est ordonnée par la loi du 10 messidor an VII, du 14 messidor an VII (B. 291, No. 3102) -- 3o. Loi relative à l'amnistie accordée aux militaires qu ont déserté à l'intérieur ou n'ont pas rejoint leurs drapeaux, du 14 messidor an VII (B. 291, No. 3103). Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
