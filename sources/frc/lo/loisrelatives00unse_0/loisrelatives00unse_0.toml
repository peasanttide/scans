title = "Lois relatives, à l'amnistie et à la mise en liberté des citoyens condamnés pour des délits autres que le royalisme : du 29 nivose, l'an troisième de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1795"
note = """Caption title. At head of title: (No. 256*). At right of title: B. no. 113, D. no. 959. Signed: Merlin (de Thionville), ex-président; Borel, Dumont (du Calvados), secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale autorise ... "--P. [1]. Loi qui autorise le Comité de législation à statuer sur la mise en liberté des citoyens condamnés à la peine de mort ou à d'autres peines, pourvu que les jugemens ne soient causés ni pour délits ordinaires ni pour faits de royalisme -- Loi qui autorise les Comités de législation et de sûreté générale à statuer sur la mise en liberté des personnes condamnées à la déportation en vertu de la loi du 10 mars. B. no. 113, D. no. 596 -- Loi qui étend l'amnistie du 12 frimaire aux personnes condamnées pour avoir pris part à la révolte qui a éclaté dans les départemens formant l'arrondissement des armées de l'Ouest, des côtes de Brest et de Cherbourg. B. no. 113, D. no. 597. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
