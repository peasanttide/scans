note = """Caption title. At head of title: No. 636*. "La Convention nationale décrète ce qui suit"--P. [1]. Signed: Bréard, ex-président; Gleizal, secrétaire; Roger-Ducos, ex-secrétaire. Imprint from colophon. Not in Martin & Walter. Révolution française. 1o. Loi qui comprend dans les dispositions de celle du 7 vendémiaire les achats de foin, de paille et avoine pour la subsistance des chevaux des armées, du 4 brumaire, an quatrième. B. no. 202, D. no. 1211 -- 2o. Loi qui autorise les cultivateurs à se pourvoir des grains pour le renouvellement des emences, du 4 brumaire, an quatrième. B. no. 202, D. no. 1214. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover page. Damaged, stained pages and cover."""
