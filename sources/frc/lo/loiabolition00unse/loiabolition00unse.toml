title = "Loi qui ordonne l'abolition des droits de traites dans l'intérieur du royaume, à compter du 1er. décembre 1790, qui régle leur remplacemnet par un tarif unique & uniforme qui sera incessamment décrété, pour en être les droits perçus à toutes les entrées & sorties du royaume, & qui ordonne que jusqu'à la promulgation du nouveau tarif & du nouveau code des traites, les tarifs actuels & les loix existantes sur cette partie, continueront d'avoir leur exécution : donnée à Paris, le 5 novembre 1790"
language = "fr"
place = "A Paris"
date = "1790"
