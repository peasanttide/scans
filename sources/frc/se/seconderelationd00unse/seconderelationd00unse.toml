title = "Seconde relation de ce qui s'est passé en l'armee du roy & Isle de Ré, depuis le dimanche vingt-quatriesme octobre iusques au trantiesme dudit mois. Ensemble l'eslection faicte par le roy du Sieur mareschal de Schomberg, pou la conduicte de six mil hommes choisis par Sa Majesté en toutes ses trouppes de caualerie, mousquetons & infanterie, pour fondre en l'Isle de Ré. Auec les noms des chefs, capitaines & conducteurs desdites trouppes, & l'arriuee de douze barques à bon port."
