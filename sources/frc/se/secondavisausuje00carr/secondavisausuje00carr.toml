note = """Prospectus for "La Sainte Bible en latin et en françois," published 1748-1750 with French translation of the Latin Vulgate by Louis de Carrières and commentaries by Augustin Calmet, Abbé de Vence, and others. Caption title. A previous prospectus for the proposed work was published: La Sainte Bible en latin et françois. Paris : Gabriel Martin, Jean-Baptiste Coignard, Pierre-Jean Mariette, Hippolyte-Louis Guerin, 1748. Requests supplementary funds from subscribers to cover the cost of 4 volumes published in addition to the 10 promised for the proposed work. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
