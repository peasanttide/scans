#:schema ../../../../schemas/source.json
layer = "source"
id = "seconddiscourspr00dela"
type = "pamphlet"
title = "Second discours prononcé par le cen. Delafleutrie, substitut du commissaire du gouvernement près le Tribunal criminel, à l'audience du 24 frimaire, dans l'affaire du Dictionnaire de l'Académie françoise"
language = "fr"
place = "Paris?"
date = "1802"
note = """"Procès du Dictionnaire de l'Académie. Tribunal d'appel. Juges, cit. Martineau, président, cit. Rigault, rapporteur, cit. Selves"--Upper right corner of p. [1]. Regarding a copyright case in which Bossange, Masson et Besson accused booksellers Nicolas Moutardier and François-Augustin Leclère of pirating copies of the fifth edition of the Dictionnaire de l'Académie française, to which the plaintiff held the copyright. "Conclusion du commissaire du gouvernement": p. [19]-21. "Jugement du Tribunal criminel du département de la Seine, du 24 frimaire an XI": p. [22]-26. Includes bibliographical references. Owner's inscription: 2 avril 1803 Adanson. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
url = "https://archive.org/details/seconddiscourspr00dela"
subject = [
    "Moutardier, Nicolas, 1763-1807",
    "Leclère, François-Augustin, fl. 1786-1803",
    "Bossange, Masson et Besson",
    "Académie française",
    "Books",
    "Copyright",
]

