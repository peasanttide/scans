note = """Caption on p.[3]: De par le roi. Extrait des feuilles & minutes du greffe de MM. les conseillers du roi honoraires en titre en la ville, bailliage, & comté de Bar-sur-Seine, exerçant la justice sur le fait des aides, tailles, & autres impositions & droits royaux en ladite ville, bailliage & comté. Du 28 juin 1788. The pamphlet in question has opening words: Une querelle s'est élevée entre le roi & les Parlemens. Les Parlemens ont dit: "Nous voulons être roi"; closing words: c'est le plus grand bienfait qu'un roi ait pu procurer à ses peuples (cf. p.4). Not in Martin & Walter [edition 2. Title: Sentence du bailliage et comté de Bar-sur-Seine ...]. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br /><br />."""
