title = "Second procés-verbal de l'ordre le plus nombreux du royaume : tenue à la plaine de Longs-Boyaux ; Cette assemblée, quoique des plus nombreuses, s'est tenue avec la plus grande tranquillité. L'un a permis à chacun des membres qui auroient des remarques à faire, sur leurs noms ou leurs titres, de les requérir; qu'on leur rendroit justice, conformément aux desirs des cocus célèbres."
