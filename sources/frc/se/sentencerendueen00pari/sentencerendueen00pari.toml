title = "Sentence rendue en la Chambre criminelle du Châtelet de Paris, qui condamne Guillaume Maillet, maître relieur, à être blâmé, pour, étant ivre, avoir troublé par des grimaces et gestes indécens l'office divin, le jour de Pâques, dans l'église paroissiale de Saint Hilaire, avoir usé de violence envers le suisse de ladite paroisse, qui vouloit le faire sortir, avoir renversé ledit suisse & lui avoir occasioné la fracture de la rotule, de laquelle fracture ledit suisse restera estropié"
language = "fr"
place = "Paris"
date = "1782"
note = """Caption title. "Le procureur du roi demandeur & accusateur. Guillaume Maillet, maître relieur, défendeur & accusé. Claude Dunan, suisse de la paroisse de Saint-Hilare, demandeur en intervention"--P. [1]. Imprint from colophon. Head-piece. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
