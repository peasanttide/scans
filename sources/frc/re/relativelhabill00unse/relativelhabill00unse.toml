title = "Loi relative à l'habillement et équipement des troupes de la République : du 2 fructidor, l'an deuxiême de la République française, une et indivisible"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 60 et 61*). At right of title: B. no. 42, D. 229. Signed, p. 2: Merlin (de Thionville), président; Guffroy, L. Lecointre, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale ... décrète ..."--P. [1]. "Tableau des effets d'habillement, équipement et petit équipement, qui seront fournis aux troupes de la République, sans retenue sur leur solde, par la Commission de commerce et approvisionnemens, d'après l'effectif des corps, avec la durée de chacun desdits effets pour régler les remplacemens"--P. [3]-8. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
