note = "Signatures: A-O⁸, E⁴ (E4 blank). A reply to: Declaration des causes qui ont meu monseigneur le cardinal de Bourbon, & les pairs, princes, seigneurs, villes & les communautez catholiques de ce royaume de France, de s'opposer à ceux qui par tous moyens s'efforcent de subvertir la religion catholique & l'estat / Charles de Bourbon. Later published with title: Remonstrance à la France sur la protestation des chefs de la Ligue. Title normalized: Réponse aux declarations et protestations de Messieurs de Guise faites sous le nom de Monseigneur le cardinal de Bourbon pour justifier leur injuste prise des armes. Attributed to Mornay in Lelong, Bibliothèque historique de la France, v. 2, no. 18467. Desgraves, L. Les Haultin. Rothschild, N.J.E. Cat. Scanner's note: No copyright page found. No table-of-contents pages found."
