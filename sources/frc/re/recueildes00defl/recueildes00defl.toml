note = """Prospectus for Duflos' "Recueil d'estampes". Title vignette. "In-folio, papier d'Hollande.". "Nous réduirons nos cahiers à six planches. Il y en aura qui seront coloriés & d'autres qui ne le seront pas. Messieurs les souscripteurs paieront 9 liv. des uns & 4 liv. 10 sols des autres. Ceux qui n'auront pas souscrit paieront 12 liv. de ceux qui sont coloriés, & de 6 liv. de ceux qui ne le sont pas"--P. [4]. Written in ms. on t.p.: Cet avertissement a été rédigé par l'abbé Rive. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
