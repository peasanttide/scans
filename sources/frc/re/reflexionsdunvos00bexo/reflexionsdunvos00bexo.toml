title = "Réflexions d'un Vosgien, ou, le Député au coin de son feu /"
language = "fr"
place = "A Paris"
date = "1789"
note = """"Lettre de M. Bexon, avocat en parlement, procureur-fiscal à Remiremonr [sic], aux cent soixante-neuf citoyens qui l'ont honoré de leurs suffrages en l'assemblée tenue dans l'église paroissiale de cette ville, le onze du courant, pour être comissaire à la rédaction de leurs cahiers, et leur député"--P. 3-8. "Projet d'instructions particulières et de détails pour les députés des trois-etats du bailliage de Remiremont aux Etats-généraux"--P. 9-14. "Instructions sur la Constitution nationale, principal & premier objet à traiter aux Etats-généraux"--P. 15-23. "Instructions sur les demandes particulières à proposer aux Etats-généraux"--P. 24-29. "Instructions sur les lois civiles & criminelles"--P. 30-81. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 3187. Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover page are combined. Uneven binding. Damaged, loose pages. Skewed text."""
