note = "Caption title. Without imprint. In 3 pts., separately paged, the 2d and 3d with caption title: [2] Remontrances du Parlement de Provence au roy, sur l'edit du mois d'août 1759 portant établissement d'un droit unique sur les cuirs tannés & apprêtés. [3] Remontrances de la Cour des comptes, aydes et finances de Provence au roi, au sujet de l'edit du mois de septembre 1759, portant établissement d'une subvention générale. The works are dated, respectively: [1] 16 February 1760; [2] 14 Jan. 1760; [3] 23 Feb. 1760. Scanner's note: Text is lost in the binding. Text extends off of the edge of the page. Uneven binding. Skewed text. Title is on the cover. Irregular pagination. No copyright page found. No table-of-contents pages found. Title and cover pages combined."
