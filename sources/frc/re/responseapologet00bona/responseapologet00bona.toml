#:schema ../../../../schemas/source.json
layer = "source"
id = "responseapologet00bona"
type = "pamphlet"
title = "Response apologetique a l'anticoton, et à ceux de sa suite. Présentée à la Royne, mère du Roy, Régente en France. Ou il est monstre, que les autheurs anonymes de ces libelles diffamatoires sont attaints de crimes d'Heresie, leze Majeste Perfidie, Sacrilege, et tres-enorme Imposture."
language = "fr"
place = "Au Pont"
date = "1611"
note = "Title vignette (arms of the Jesuits). Reply to De Plaix's Anticoton, ou Refutation de la Lettre declaratoire du pere Coton. 1610. In defense of the Jesuits, accused of the instigation of the murder of Henri IV of France. Authorship ascribed to François Bonald by Backer.--cf. Bibl. de la Comp. de Jésus (1890) v. 1, p. 1698. Also attributed to Pierre Coton. Bibl. Nat. Cat. gen. Scanner's note: Some mis-numbered pages. <br />Irregular pagination. <br />No copyright found. No table of contents found.  Damaged, stained pages.<br />."
url = "https://archive.org/details/responseapologet00bona"
subject = [
    "Plaix, César de, -1641",
    "Henry IV, King of France, 1553-1610",
    "Jesuits",
]
extent = "1 vol. (280 pp.)parchemin, à lacets,8vo."

