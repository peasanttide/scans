title = "Recueil de lettres et memoires pour servir à l'histoire de Madame de Maintenon, & à celle du siecle passé"
language = "fr"
place = "A Amsterdam"
date = "1755"
note = """Prospectus for "Lettres de Madame de Maintenon" and La Beaumelle's "Memoires pour servir à l'histoire de Madame de Maintenon". "L'adresse de l'éditeur est: à M. de La Beaumelle, au Rockin, à Amsterdam. Celle du libraire: A.M.F. Jolly, libraire, sur le Rockin, à Amsterdam"--P. 8. Title vignette; initials; head- and tail-pieces. BN. "L'ouvrage entier sera livré aux souscripteurs le 1 octobre de cette année 1755. Les souscripteurs payeront 13 flor. argent d'Hollande, qui sont 27 liv. argent de France ... On souscrira chez tous les libraires & chez tous les banquiers de l'Europe, de même qu'aux bureaux des postes"--P. 6-7. Includes preface of "Memoires pour servir à l'histoire de Madame de Maintenon". Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/recueildelettres00main"
