note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Réponse de Vadier"--Bottom of p. 9. Martin & Walter. Révolution française. Réponse de Vadier à la pétition de la citoyenne Bardon, fille de Cazes -- Extrait des registres du Directorie du département de Haute-Garonne, du 20 avril 1792 -- Lettre écrite au Directoire du département de l'Arriège par le Directoire du district de Mirepoix, en date du 19 avril 1792, l'an IV de la liberté -- Lettre de la société populaire d'Ax, au Directoire du département, seant à Foix -- Arrêté des représentans du peuple Paganel et Cassanyes. Bibliography: Martin & Walter.  Révolution française,  IV:1, 33035. Scanner's note: Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
