title = "Reqveste presentee a mesieurs de la court, par les Escheuins & corps de la ville de Paris, tendãt à ce que defences soient faictes à tous ecclesiastiques de payer les deniers de la subuention accordez par le clergé de France, pour faire la guerre aux heretiques, à autres qu'aux receueurs de la saincte Vnion. Et aussi defences à tous receueurs generaux & particuliers, de payer les deniers de leur recepte à autres, qu'aux receueurs residens és villes qui tiennent le party de la saincte Vnion, pour estre employez aux gaiges des officiers, & rentes des particuliers."
