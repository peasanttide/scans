note = """Prospectus for Louis Marie Prudhomme and François-Silvain Laurent de Mézières' "Résumé général, ou, Extrait des cahiers de pouvoirs, instructions, demandes & doléances.". Caption title. "Ceux qui n'auront pas fait leur soumission dans le temps prescrit ... ne pourront les avoir qu'après la livraison de ceux qui se seront fait inscrire à Paris, chez M. Laurent de Mézieres, banquier, rue Saint-Benoît, n°. 28, fauxbourg Saint-Germain. A Versailles, chez M. Wafflard, libraire, rue de la Chancellerie"--P. [3]. "Paris, ce 20 mai 1789"--P. [1]. Includes prices. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
