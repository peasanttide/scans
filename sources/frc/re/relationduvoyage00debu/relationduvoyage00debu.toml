note = """Prospectus for Chappe d'Auteroche's "Voyage en Sibérie". Caption title. "Cet ouvrage est ... presque terminé: toutes les planches sont mordues à l'eau forte, excepté cinq ou six ... On pourra les voir ... chez Debure pere, libraire, quai des Augustins, à l'image Saint Paul, chez lequel on souscrira."--P. 8. "On payera en souscrivant 60 livres, & 40 livres en recevant les trois volumes en feuilles ... La souscription ne sera ouverte que jusqu'au dernier décembre 1767."--P. 8. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Creased pages.  Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
