title = "Reglement fait par le Roy en son Conseil, pour l'execution de son edict du mois de Feurier 1626. Verifié en sa Cour de Parlement, Chambre des comptes & Cour des aydes de Paris, sur l'ordre qu'il veut estre obserué tant à la visite & marque du fer & acier qui se tire des mines & minieres de France, & qui s'apporte des pays estrangers; qu'à la recepte & perception du droict deu à sadite Majesté."
