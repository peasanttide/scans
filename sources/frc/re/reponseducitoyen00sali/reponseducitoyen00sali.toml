#:schema ../../../../schemas/source.json
layer = "source"
id = "reponseducitoyen00sali"
type = "pamphlet"
title = "Réponse du citoyen Saliceti, imprimée et publiée en Corse, le 14 juin dernier, aux faits calomnieux contenus dans la lettre du 15 mai dernier, écrite par les membres du conseil du département de Corse rebelles, et actuellement en état d'accusation, aux citoyens Delcher et Lacombe-Saint-Michel, représentans du peuple, qui l'ont méprisée, et que Costantini, soi-disant député extraordinaire dudit département, a fait réimprimer et distribuer le 9 de ce mois, six jours après le départ de Saliceti pour sa mission."
language = "fr"
place = "A Paris"
date = "1793"
note = "At head of caption title: République française, une et indivisible. Publisher statement from colophon. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  IV:1, 30848. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."
url = "https://archive.org/details/reponseducitoyen00sali"
subject = [
    "Saliceti, Antoine-Christophe, 1757-1809",
    "Counterrevolutions",
]
