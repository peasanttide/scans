language = "fr"
place = "A Paris"
date = "1791"
note = """Caption title. At right of title: No. 940. "Signé Louis. Et plus bas, M.L.F. DuPort"--P. 20. Imprint from colophon. Martin & Walter. Révolution française. "Décret de l'Assemblée nationale, des 16 & 18 mai 1791"--P. [1]-20. Tables on folded leaves: Tableau des divers préposés de la régie du droit d'enregistrement & autres réunis, de leur traitement, suivant les divers emplois, de leur remise, sur un produit présumé de soixante millions, & de tous frais de régie -- Répartition entre tous les directeurs, inspectuers, vérificateurs, gardes-magasins & receveurs du timbre extraordinaire, & fixation de leur traitement & de la quotité de leur remise suivant la nature de leurs emplois, sur un produit présumé de soixante millions. Bibliography: Martin & Walter. Révolution française, IV:2, 9143. Scanner's note: Title page and cover are combined.  No copyright page found. No table-of-contents pages found."""
