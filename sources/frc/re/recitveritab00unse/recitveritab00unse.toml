title = "Recit veritable de l'entreprise que les Anglois auoient sur la ville & citadelle de Calais, par l'entremise d'vn nommé du Parc. Descouuerte par le vicomte de Fruze estranger, à Monsieur de Valence, gouuerneur de ladite ville & citadelle. Auec la prise de deux barques angloises, où dans l'vne s'est trouuée la femme d'vn pilote d'vne des remberges saisie d'vne lettre."
language = "fr"
place = "Paris"
date = "1628"
note = "Binder's title: Pieces s'les Rochel. Dated at Boulonge, July 26, 1628, and signed: L. Bibl. nat. Cat. de l'histoire de France. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding. Tight margins. Some text extends up to binding."
