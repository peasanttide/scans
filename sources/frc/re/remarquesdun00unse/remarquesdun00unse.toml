#:schema ../../../../schemas/source.json
layer = "source"
id = "remarquesdun00unse"
type = "pamphlet"
title = "Remarques d'un docteur en théologie, sur la protestation des jesuites :"
language = "fr"
place = "S.l."
date = "1700"
note = """Caption title. Relating to the author's Acte de protestation of 1700. Erroneously attributed to Charles Le Gobien by Barbier. Listed as an anonymous work by Streit and Backer/Sommervogel. Probably published 1700. Cf. Streit. Includes (p. [1]-14) the text of Le Gobien's "protestation" with "remarques" in parallel columns. Title reads: Acte de protestation signifié aux Sieurs Syndic, Doyen, & Docteurs de la Faculté de Theologie de Paris, le dix-huitiéme jour d'Octobre 1700. par le Pere le Gobien de la Compagnie de Jesus, tant en son nom, que comme se faisant fort du Pere Loüis le Comte de la même Compagnie. The "Réponse" (p. 15-20) is to "Censure de quelques Propositions des PP. le Comte et le Gobien Jesuites, publiée sous le nom de la Faculté de Theologie de Paris, refutée par les Ecrits des Dominicains et des Franciscains Missionnaires de la Chine, les plus opposez aux Iesuites.". Backer/Sommervogel. Streit. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
url = "https://archive.org/details/remarquesdun00unse"
subject = [
    "Le Gobien, Charles, 1653-1708",
    "Le Comte, Louis, 1655-1728",
    "Jesuits",
    "Université de Paris. Faculté de théologie",
    "Chinese rites",
]

