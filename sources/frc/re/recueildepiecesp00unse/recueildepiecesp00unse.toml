note = """Caption title. Without imprint. Not in Martin & Walter. Arrêté du bailliage de Meulan, du 19 mai 1788 -- Arrêté de Châlons sur Marne, du 19 mai 1788 -- Arrêté de la sénéchaussée & siége présidial d'Angoumois, du 21 mai 1788 -- Protestations de M. le lieutenant-général & d'un conseiller, du 10 juin 1788 ["Nous, Louis le Meusnier, lieutenant-général, & François Tremeau, conseiller..."] -- Arrêté de la sénéchaussée & présidial d'Angoumois, du 11 juin 1788 -- Représentations du présidial d'Angoumois, présentées à M. le Garde des sceaux, pour être remises au roi -- Protestations du bailliage & présidial de Mâcon ["Cejourd'hui 30 mai 1788 ..."] -- Extrait des registres des officiers du bailliage de Chaumont en Bassigny ["Cejourd'hui 21 mai 1788 ..."] -- Arrêté à l'issue de la séance tenue le 23 mai par M. le commissaire du roi --Arrêté du bailliage de Chaumois en Bassigny, du 11 juin 1788. Scanner's note: No copyright page found. No table-of-contents pages found.  Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
