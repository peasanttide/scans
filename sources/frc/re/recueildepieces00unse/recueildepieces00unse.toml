note = "Caption title. Without imprint. Not in Martin & Walter. Précis de ce qui s'est passé à l'assemblée du clergé, le 7 juin jusqu'au 13 dudit mois 1788 -- Extrait des minutes du greffe du bailliage de Besançon [l'an mil sept cent quatre-vingt huit, le neuf juin] -- Arrêté du bailliage & siége présidial de Caen, du 9 juin 1788 -- Extrait des registres aux délibérations des mayeur, echevins & conseil de la ville & cité de St-Omer -- Remontrances du grand-conseil, arrêtées, les semestres assemblée, & présentées à Sa Majesté le 19 juin 1788 -- Délibération prise par l'ordre des avocats du Parlement de Toulouse [le samedi, 17 mai 1788] -- Copie d'une lettre de Toulouse, du 29 mai 1788. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
