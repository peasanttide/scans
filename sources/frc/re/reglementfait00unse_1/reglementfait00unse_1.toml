language = "fr"
place = "A Paris"
date = "1789"
note = """Caption title. At right of title: Franche-Comté. "Signé Louis, et plus bas, de Chastenet de Puysegur"--P. 2. Imprint from colophon. Not in Martin & Walter. Révolution française. Variant of BM, LXXVII, column 191. "État, par ordre alphabétique, des bailliages royaux de la province de Franche-comté, qui députeront directement ou indirectement aux États-généraux, avec le nombre de leurs députations, chaque députation composée d'un député du clergé, d'un de la noblesse, & de deux du Tiers-état"--P. 3. "État, par ordre alphabétique, contenant les noms des villes de la province de Franche-comté, qui doivent envoyer plus de quatre députés aux assemblées des bailliages, & le nombre de députés que chacun y enverra"--P. 4. Scanner's note: No copyright page found. No table-of-contents pages found.   Title is on the cover page. Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
