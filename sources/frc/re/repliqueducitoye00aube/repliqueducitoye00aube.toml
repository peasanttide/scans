title = "Réplique du citoyen Auber, éditeur et propriétaire des Tableaux historiques des campagnes d'Italie, contre le citoyen Jean, marchand d'estampes"
language = "fr"
place = "Paris"
date = "1801"
note = """Imprint from colophon. Declarations in support of Auber (p. [43]-47) dated 9-11 vendémiaire, an 10. Selections from "Mémoire pour le citoyen Jean, marchand d'estampes, défendeur, contre le citoyen Auber, se disant propriétaire des Tableaux historiques des campagnes d'Italie, demandeur, et contre le citoyen Desrais, dessinateur, appelé en garantie" and the text of Auber's "Réplique" in parallel columns. Regarding a copyright lawsuit filed by Auber against Jean and Desrais, in which he purports that the two defendants pirated his engravings. Errata, p. [1] at end. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."""
url = "https://archive.org/details/repliqueducitoye00aube"
subject = [
    "Auber, Jean-Baptiste Daniel",
    "Jean, marchand d'estampes",
    "Desrais, Claude Louis, 1746-1816",
    "Piracy (Copyright)",
    "Copyright",
]

