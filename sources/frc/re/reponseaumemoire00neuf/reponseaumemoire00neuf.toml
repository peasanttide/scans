id = "reponseaumemoire00neuf"
type = "pamphlet"
title = "Réponse au memoire signifié le 14 février 1739, pour le duc de Villeroy et consors, heritiers du feu duc de Villeroy leur pere et ayeul, lequel, au moyen des donations à lui faites par l'archevêque de Lyon, son frere, étoit seul héritier des meubles et acquêts de la duchesse de Lesdiguieres, et seul héritier des propres par elle délaissez, procédans de la maison de Gondy :"
language = "fr"
place = "France?"
date = "1739"
note = "Caption title. Signed at end: Monsieur le comte de Maurepas, raporteur. Me Chiquet, avocat. Signatures: A-G². Initial; head-piece. No. 45 of 54 titles bound together. Scanner's note: Title is on the cover. Uneven binding. Skewed text. Damaged, stained, and/or torn pages. Text is lost in the binding."
url = "https://archive.org/details/reponseaumemoire00neuf"
subject = [
    "Neufville de Villeroy, Louis François Anne de, 1695-1766",
    "Inheritance and succession",
]

