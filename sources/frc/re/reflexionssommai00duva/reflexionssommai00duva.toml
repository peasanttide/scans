title = "Réflexions sommaires pour le sieur abbé de Caveirac"
language = "fr"
place = "Paris"
date = "1763"
note = "Caption title. Signed: Monsieur Duval, conseiller-rapporteur. Me. Ader, avocat. Imprint from colophon. Plea to allow Jean Novi de Caveirac to return to Paris to defend himself against accusations that he penned Appel a la raison, des ecrits et libelles publiés par la passion, contre les jesuites de France, for which Louis XV exiled him. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Text extends off of the edge of the page. Text may be lost in the binding. Permanent creases may obscure some text. Title page and cover are combined."
url = "https://archive.org/details/reflexionssommai00duva"
