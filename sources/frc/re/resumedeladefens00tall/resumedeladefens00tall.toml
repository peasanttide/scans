note = """Caption title. At head of title: Convention nationale. Imprint from colophon. "Résumé de la défense de Vadier, &c."--Bottom of p. 9. Martin & Walter. Révolution française. "Copie de la lettre d'un émigré, trouvée dans les poches du cadavre de Delfour, puni, comme Foulon, par la justice populaire"--P. 8-10. "Les membres composant la société populaire de Pamiers, à la Convention nationale"--P. 14- 16. Bibliography: Martin & Walter.  Révolution française,  IV:1, 33042. Scanner's note: Uneven binding. Skewed text. Damaged, stained and/or loose pages."""
