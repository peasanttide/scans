note = """Prospectus for a new edition of Guyot's "Répertoire universel et raisonné de jurisprudence civile, criminelle, canonique et béneficiale," published 1784-1785. Caption title. "A Paris, chez Visse, libraire, rue de la Harpe, près de le rue Serpente, et chez les principaux libraires des provinces de France"--P. [1]. Imprint from colophon. "L'exemplaire du Répertoire in-quarto ne contiendra, quoiqu'il y ait des augmentations considérables, qu'environ 16 à 17 volumes; il coûtera 156 livres payables, savoir, 12 livres en souscrivant, & pareille somme en recevant chacun des premiers volumes"--P. 3. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  <br />."""
