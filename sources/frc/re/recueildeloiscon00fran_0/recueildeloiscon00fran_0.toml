title = "Recueil de lois concernant la dime"
language = "fr"
place = "A Paris"
date = "1796"
note = "Caption title. At right of title: No. 82 bis. PR. Imprint from colophon. Not in Martin & Walter. Révolution française. Extraits des décrets de l'Assemblée nationale, relatifs à l'abolition du régime féodal et de la dîme. Des 4, 6, 7, 8 et 11 août 1789 (82 bis. Pr.) -- Extrait du décret relatif aux dîmes. Des 14 et 20-22 avril 1790 (no. 322 Pr.) -- Loi qui règle les obligations des fermiers envers les propriétaires, relativvement à la dîme, aux vingtièmes, capitation, taille et autres contributions dont ils pouvaient être tenus. Du 11 mars-10 avril 1791 (no. 765) -- Extrait du décret qui supprime différens droits féodaux, conservés par la loi du 15 mars 1790. Du 25 août 1792 (no. 2250) -- Décret de la Convention nationale, qui défend d'exiger des colons ou métayers, aucunes prestations féodales. Du 1er. jour du 2e. mois de l'an second de la République (no. 1768) -- Loi relative au paiement des valeurs stipulées dans les baux à ferme antérieurs au décret du premier brumaire an II, équivalent de la dîme et d'autres droits supprimés. Du 27 brumaire an V ... (no. 357) / [Directoire exécutif]. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."
