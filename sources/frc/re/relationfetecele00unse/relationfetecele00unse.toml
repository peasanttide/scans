title = "... Relation de la f^ete célébrée par l'Armée de la République française : en Italie, `a l'occasion de l'anniversaire de la mémorable journée du 14 juillet, époque choisie par le Général en chef, pour donner aux demi-brigades de l'Armée les nouveaux drapeaux qui rapellent les batailles dans lesquelles chacune a concouru `a la victoire ; et adresses individuelles des soldats et officiers de l'Armée, `a ceux de l'Armée de l'intérieur et au Directoire exécutif"
