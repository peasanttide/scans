type = "book"
title = "Relation de ce qui s'est passé au procès de Milord Preston & du Sieur Jean Ashton : leur conviction & condamnation, pour crime de haute-trahison contre leurs Majestés le Roi Guillaume & la Reine Marie ; (Pour avoir conspiré contre la vie de leurs Majestés, tâché de les déposer, de changer le gouvernement présent, de faire envahir le royaume d'Angleterre par le Roi de France, & exciter une rebellion contre leurs Majestés.) ; avec plusieurs lettres & des mémoires très-curieux du Roi Jacques au Roi de France, au Pape & à divers ministres ; publiée par le commandement de la reine, le vendredi 16/26 janvier 1692 ; réimprimé par ordre de l'Assemblée nationale, le 26 janvier 1791."
language = "fr"
