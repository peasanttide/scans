title = "Réponses du C. Régley, secrétaire du district de Sens, aux inculpations dirigées contre lui par la municipalité dudit Sens dans sa délibération du dix-sept floréal an III."
language = "fr"
place = "A Sens"
date = "1795"
note = """Caption title. At head of title: Liberté, égalité, fraternité. Imprint from colophon. Not in Martin & Walter. Révolution française. "Extrait du registre des délibérations de l'administration du district de Sens, séance publique du vingt-deux floréal de l'an trois de la République françasie une et indivisible, tenue par les citoyens Chapelain, président, Sandreier, Éliaux, Cave, Douine, Lescuyer, administrateurs, Lorillon, procureur-syndic, et Boulley, secrétaire-adjoint"--P. 15-16. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained and/or loose pages.  Title page and cover are combined. Uneven binding.  Skewed text."""
