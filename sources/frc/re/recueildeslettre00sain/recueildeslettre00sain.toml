title = "Recueil des lettres écrites à MM. les officiers municipaux de Montauban, par M. Guignard : M. le rapporteur, à l'Assemblée nationale, de l'affaire de Montauban, a énoncé que le secrétaire d'État dans le département duquel est cette ville, avoit écrit une lettre d'approbation à la municipalité de Montauban, & sur ce qu'on lui a demandé quel est le secrétaire d'État, il a nommé M. de Saint-Priest : le roi a daigné permettre à M. Guignard-Saint-Priest, de rendre ces lettres publiques"
