title = "Représentations des officiers de la sénéchaussée et siege présidial de Lyon, a Mgr. le garde des sceaux de France : précédées d'un arrêté du premier septembre 1787, & suivies des lettres adressées à Monseigneur le garde des sceaux, à Monsieur le premier président du Parlement de Paris, & à Messieurs du Châtelet de Paris."
language = "fr"
place = "A Lyon"
date = "1787"
note = "Imprint from colophon. Documents dated 13 September 1787. Not in Martin & Walter. Révolution française. Concerns the banishment to Troyes of the Parlement de Paris (August 1787). Forms part of the French Revolution Collection at the Newberry Library. Scanner's note: Title is on the cover. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
