note = """Caption title. Without imprint. Dated on p.12: ... le 19 janvier 1788. "Eh! quel événement fut jamais plus intéressant, pour la ville de Bordeaux, que la privation qu'elle éprouve, depuis plus de cinq mois, du Parlement, qu'elle a toujours eu l'avantage de posséder dans son sein?": p.[1]-2. "Délibération du chapitre de l'Eglise métropolitaine & primatiale Saint André de Bordeaux, pour demander la convocation de l'Assemblée des cent-trente. Du samedi 19 janvier 1788": p.13-15. Not in Martin & Walter [edition 2: 15 p., with extra text as cited above]. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages."""
