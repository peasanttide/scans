title = "Réponse faite par Bara (des Ardennes), rapporteur de la commission spéciale chargée d'examiner la question de savoir s'il ne convient pas d'autoriser le Directoire exécutif à faire continuer les travaux préparatoires qui ont pour objet de donner aux cantons les limites constitutionnelles dont ils sont susceptibles, aux objections faites contre le projet de ladite commission séance du 3 frimaire an 7."
