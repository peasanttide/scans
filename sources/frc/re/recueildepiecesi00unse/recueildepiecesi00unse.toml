note = "Not in Martin & Walter. Les quand, les si, les mais, les car -- Jeu de quilles -- Mémoire des marchandes du Palais, a M. le Garde des sceaux -- Lettre a Monsieur le Baron de P**, officier aux Gardes-françoises, sur les devoirs du militaire français. Paris, 7 juin 1788 -- Les réflexions et la résolution d'un bon roi -- Apologie de la Cour pléniere, par M. l'Abbé Vélin ... -- Requête de l'exécuteur des hautes-oeuvres, aux juges-consuls en enthérinement de son contract d'union avec ses créanciers -- Lettre a Monseigneur de Lamoignon, Garde des sceaux -- Observations d'un homme impartial -- Lettre d'un membre d'un grand-bailliage de ** à son cousin -- Lettre du Prince de Guimenée, au roi -- Arrest du Conseil d'état du peuple françois ... Du 3 juillet 1788. Scanner's note: No copyright page found.  Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text.  Missing pages 47-48. Inside pages and covers fused together."
