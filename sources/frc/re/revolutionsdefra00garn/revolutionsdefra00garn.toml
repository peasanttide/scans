note = """Prospectus for "Révolutions de France et de Brabant", edited by Camille Desmoulins and published 1789-1791. Caption title. "Le prix de l'abonnement est de 6 liv. 15 s. pour Paris, & de 7 liv. 10 s. pour la province, pour trois mois, franc de port par tout le royaume. On souscrit à Paris chez Garnéry, libraire, quai des Augustins, n°. 25, & chez les directeurs des postes & principaux libraires de la France"--P. [3]. Imprint from colophon. "Livres nouveaux qui sortent dessous presse": p. [3]-[4]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
