title = "Rentrée du Parlement de Paris, du 24 septembre 1788 : contenant le Discours prononcé par M. Séguier, avocat général, toutes les chambres assemblées, les pairs y séant, la Déclaration pour les États-généraux, l'enrégistrement d'icelle, & le Discours de M. le Bruin, de Guadeloupe."
language = "fr"
place = "France?"
date = "1788"
