title = "Recueil de décrets concernant les titulaires d'offices, gagistes & pensionnaires de la ci-devant liste civile"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. "La Convention nationale ... décrète ..."--P. [1]. Imprint from colophon. Not in Martin & Walter. Révolution française. Décret concernant les titulaires d'offices, gagistes & pensionnaires de la ci-devant liste civile, du 17 germinal, an II -- Décret concernant la liquidation des offices de la maison du ci-devant roi, & des secours ou pensions à accorder aux gagistes & anciens pensionnaires de la liste civile, du 27 août 1793 ... -- Décret relatif aux pensions, dons, traitemens, gratifications & secours, & aux formalités à observer pour s'en procurer le payement, des 20 & 31 mars 1792 ... -- Décret qui proroge le délai pour les certificats de résidence à fournir par les pensionnaires sur le trésor national, du 30 juin 1792 ... -- Décret qui proroge jusqu'au premier janvier prochain, le délai pour presenter au bureau de liquidation, les certificats & passeports délivrés par les communes, du 29 novembre 1792 ... -- Décret qui proroge jusqu'au 31 décembre prochain le délai pour présenter au bureau de liquidation les certificats de résidence, du 26 mars 1793 ... -- Décrets relatifs aux certificats de résidence exigés pour être admis à la liquidation des pensions, gratifications ou secours, des 14 & 19 pluviôse, an II ... Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
