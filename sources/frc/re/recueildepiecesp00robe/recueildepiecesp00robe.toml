#:schema ../../../../schemas/source.json
layer = "source"
id = "recueildepiecesp00robe"
type = "book"
title = "Recueil de pièces patriotiques, a l'occasion de la reconnaissance de l'Être suprême & de l'immortalité de l'ame, & de la fête qui a eu lieu à Paris & à Auxerre à ce sujet, le 20 prairial, seconde année républicaine."
language = "fr"
place = "A Auxerre"
date = "1794"
note = "Variant of Martin & Walter. Révolution française, IV:1, 29526-41. L'administration du département de l'Yonne a tous les citoyens de son ressort -- Rapport fait au nom du Comité de salut public / par Maximilien Robespierre ... -- Plan de la fête a l'Être suprême, qui doit être célébrée le 20 prairial / proposé par David ... -- Discours de Maximilien Robespierre, prononcé dans la séance du septidi, 7 prairial, an deuxième ... -- Discours de Maximilien Robespierre ... au peuple réuni pour la fête de l'Être suprême -- Second discours du président de la Convention nationale ... -- Invocation a l'Être suprême ... / prononcé par Maure ... -- Discours prononcé le 20 prairial ... -- Extrait du procès-verbal de la séance publique, tenue par le Conseil général de la commune d'Auxerre ... -- Hymne a l'Être suprême / par le citoyen Liégeard fils -- Hymne pour la fête dédié a l'Être suprême et a la nature/ par le citoyen Guéniot, d'Avallon -- Hymne a l'être suprême, par Marie-Joseph Chénier ; musique de Gossec -- Hymne sur la prise de Charleroi ... / par Ch. Fr. Guéniot -- Hymne pour la fête dédiée a l'amour -- Hymne pour la fête des bienfaiteurs de l'humanité / par Charles Chaisneau ; musique de Sehnal -- Discours pour la fête des bienfaiteurs de l'humanité ... / par Charles Chaisneau -- Chanson civique. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."
url = "https://archive.org/details/recueildepiecesp00robe"
subject = [
    "Robespierre, Maximilien, 1758-1794",
    "Natural theology",
    "Atheism",
    "Festivals",
    "National songs",
    "First Coalition, War of the, 1792-1797",
]
extent = "96, [2] p. ; 21 cm."

