title = "Lois relatives à l'explosion de la poudrerie de la plaine de Grenelle"
language = "fr"
place = "A Paris"
date = "1794"
note = """Caption title. At head of title: (No. 73*). At right of title: B. no. 48, D. no. 250. Signed, p. [1]: Louis (du Bas-Rhin), ex-président; P. Barras, Lecointre, secrétaires. Imprint from colophon. Not in Martin & Walter. Révolution française. "La Convention nationale décrète ..."--P. [1]. Loi portant nomination de représentans du peuple pour se rendre près des sections de Paris, rassurer les citoyens et les inviter à veiller à la tranquillité et à la sûreté publique, du 14 fructidor, l'an deuxième de la République ... -- Proclamation de la Convention nationale, du 14 fructidor, l'an deuxième de la République ... B. no. 48, D. 251 -- Loi qui assure des secours aux citoyens blessés, et aux parens de ceux qui auroient pu périr ou être blessés par l'effet de l'exposion qui vient d'avoir lieu, du 14 fructidor, l'an deuxième de la République ... B. no. 48, D. 252 -- Loi sur les secours provisoires à accorder aux citoyens blessés, et aux pères, mères, veuves et enfans de ceux qui ont péri, ou ont été blessés de l'explosion qui a eu lieu à la poudrerie de Grenelle, du 15 fructidor, l'an deuxième de la République française, une et indivisible. Scanner's note: No copyright page found. No table-of-contents pages found.  Title page and cover are combined. Damaged, stained, creased and/or loose pages. Uneven binding. Skewed text."""
