note = "Caption title. Signed: Par le républicain T. Rousseau, premier commis du bureau des lois, au département de la guerre. Imprint from colophon. Also issued as part of: L'ame du peuple et du soldat. Martin & Walter. Révolution française. Idée de l'ancien gouvernement : air, Quoi! ma voisine est-tu fâchée? -- Des capucinades du roi de Prusse et de Brunswick : air, Le saint craignant de pécher -- Le pamphlet royaliste de Raynal-Malouet, ou de Raynal-Maury : air, A la façon de Barbari -- Hymne pour la fête de l'égalité : air, O ma tendre musette! -- Le bref du pape-royau -- Les principes du vrai répub[l]icain : air, Vous qui desirez sans fins -- Les faux patriotes : air, Laissez paître vos bêtes. Bibliography: Martin & Walter.  Révolution française,  IV:1, 30133. Scanner's note: No copyright page found. No table-of-contents pages found.  Title and cover page are combined.  Damaged, stained, marked and/or loose pages.  Uneven binding.  Skewed text."
