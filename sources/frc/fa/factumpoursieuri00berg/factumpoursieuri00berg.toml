language = "fr"
place = "France?"
date = "1694"
note = """Caption title. Signed at end: Monsieur Pecoil, raporteur. Signatures: A-E². Last page blank. Head-pieces. Regarding the estate of Vincent Bergier, merchant from Saint Étienne en Forest, Loire, France. "Parallele de l'affirmation de Jerôme Goyet, avec les inventaires & ordonnances du bailliage de Reims, & les missives de Gabriel Goyet, son frere": pages 9-19; several "missives" dated 1694. No. 13 of 54 titles bound together. Scanner's note: Uneven binding. Skewed text. Title is on the cover. Text is lost in the binding. Damaged, stained, or torn pages."""
