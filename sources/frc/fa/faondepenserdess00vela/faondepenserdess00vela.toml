date = "1789"
note = """Caption title. Without imprint. Opening sentence: Nous, prêtres du clergé séculier & régulier de la sénéchaussée du Vélay, informés que, dans la capitale, le silence d'un grand nombre de diocèses, sur le systême d'expoliation du clergé de France, est interprété comme un consentement de leur part, & craignant le reproche d'une coupable connivence, avons pris & prenons la résolution de ne laisser aucun nuage sur notre façon de penser. "Fait au Puy, ce 3 décembre 1789 ... la présente copie imprimée conforme à l'original ... auquel sont jointes les signatures des susdits prêtres du clergé séculier & régulier de la sénéchaussée du Vélay": p.8. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found.   Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
