place = "Paris?"
date = "1780"
note = """Prospectus for engravings by Benoit Louis Henriquez to accompany Diderot and D'Alembert's Encylopédie. Caption title. At head of title: Gravure. Head-piece. "Le prix est de 3 liv. chaque portrait in-fol. Ils se vendent tous quatre à Paris, chez Henriquez, rue de la Vieille Estrapade, maison de M. Moreau, maitre charpentier, & ceux de Messieurs Diderot & d'Alembert seulement chez M. Panckoucke, libraire, hôtel de Thou, & chez M. Brunet, libraire, rue des Écrivains"--P. 2. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Only one numbered page.  Text extends past page edges. <br /><br />."""
