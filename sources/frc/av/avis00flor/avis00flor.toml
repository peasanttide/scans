date = "1743"
note = """Prospectus for the 1743 edition of the Old Latin version of the Bible, published by Florentain. Caption title. "On pourra s'adresser, à Reims, chez ledit Florentain, et à Paris, chez Gabriel Valleyre, imprimeur, ruë Saint Severin"--P. [2]. Head-piece. "De trois volumes in-folio, dont cette édition sera composée, les deux premiers ... sont imprimez, et le troisiéme ... est sous presse. Le prix de chaque volume sera de trente livres en blanc, fin papier d'Auvergne, & de quarante-cinq livres, grand papier aussi d'Auvergne"--P. [1]-[2]. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
