date = "1765"
note = """Prospectus for François A. de Garsault's "Explication abrégée de sept cents dix-neuf plantes, tant étrangères que de nos climats, et de cent trente quatre animaux, en sept cents trente planches," a volume of descriptive text published in 1766 to accompany Garsault's "Les figures des plantes et animaux d'usage en médecine," published in 1764 as a volume of illustrations based on Etienne-François Geoffroy's "Tractatus de materia medica.". Caption title. "Son recueil sera vendu 48 livres, depuis le premier juillet jusqu'au premier janvier 1766, après lequel temps tout l'ouvrage coutera 51 livres broché.". "Ceux qui ont jusqu'à présent acquis le recueil d'estampes trouveront l'explication, sans rien payer (chez MM. Desprez, imprimeur du roi & du clergé de France, rue Saint-Jacques, au coin de la rue des Noyers, & Desaint, libraire, rue Saint-Jean-de-Beauvais).". Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
