title = "Avis charitable aux fidèles : sincerement attachés a la communion de l'Église catholique."
language = "fr"
place = "Paris"
date = "1791"
note = "Caption title. Imprint from colophon. This edition not in Martin & Walter (cf. IV 2: 2568). Imperfect: p.[1]-[2] (t.p.? half title?) wanting. Article premier. Les simples fidèles ne courent aucun risque pour leur salut, quelque parti qu'ils prennent dans les circonstances présentes, & à plus forte raison en n'en prenant aucun -- Article second. En regardant même les nouveaux pasteurs comme des intrus, on n'auroit pas un motif suffisant pour refuser de se soumettre à eux, de communiquer avec eux & de recevoir d'eux les sacremens. Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover.  First numbered page is number 4.<br /><br /><br />."
