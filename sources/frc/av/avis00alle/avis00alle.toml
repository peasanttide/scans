note = """Prospectus for a world map in 40 sheets of the first 80 degrees of longitude. Caption title. First line: Le sieur Alleon de Varcourt, ancien navigateur & ingénieur .. "[Alléon de Varcourt] demande à tous ceux qui voudront avoir des exemplaires, qui fera d'abord celui 79 à 80 dégrés, 300 liv. pour chacun ... Tous ceux qui voudront se faire inscrire sous tel nom qu'il leur plaira s'adresseront au sieur Alleon de Varcourt, rue Michel-le-Comte, chez le vitrier.". "Permis d'imprimer, ce 20 mars 1763.". Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. No pagination.  Title page and cover are combined."""
