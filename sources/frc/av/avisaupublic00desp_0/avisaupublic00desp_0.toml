date = "1744"
note = """Prospectus for Le Maistre de Sacy's French translation of the Bible, also known as the Port-Royal version. Caption title. "Nous offrons une diminution du prix ordinaire de ce livre, qui est de 150 liv., que nous réduisons à 90 liv. en feuilles ... Les libraires commenceront à recevoir les assurances au mois de novembre prochain ... Les sudits libraires ne recevront ces assurances que jusqu'au dernier fevrier 1745"--P. 2-3. Head-piece. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text. Text extends off of the edge of the page."""
