note = """Prospectus for "Journal encyclopédique ou universel.". Caption title. "On s'adressera à Paris, chez M. Lutton, avocat, greffier au parlement, rue Ste. Anne, butte St. Roch, ou a Bouillon, à M Weissenbruch, directeur du bureau des journaux"--P. [2]. "Pour faciliter au public l'acquisition de ce journal ... il ne coûtera a Paris que 25 liv. 4 s. aulieu de 33 liv. 12 s. ..., & pris à Bouillon, 24 liv. ... Le prix pour les pays étrangers est de 30 liv."--P. [2]. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination."""
