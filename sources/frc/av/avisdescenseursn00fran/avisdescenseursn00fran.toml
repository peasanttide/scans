title = "Avis des censeurs nommés par la cour du parlement de Paris"
language = "fr"
place = "A Utrecht"
date = "1751"
note = """"Avis donné par Denis Leger, Pierre le Merre, & Nicolas Bertin ... " p. 8. "Publié par Nicolas Bertin, l'un des censeurs, qui a fait les notes. L'avertissement est de l'abbé J.-B. Cadry." Barbier. First intended to be published in 1722 as a supplement to Jean Hardouin's edition of the Councils of the Church, which had been suppressed by the Parlement of Paris at its original publication in 1715. In 1725 the Conseil d'Etat authorized publication of Hardouin's edition without the "Avis." Cf. "Avertissement" p. iii-xvi. French and Latin in parallel columns. Text of the "Avis des censeurs" (p. 1-97): Latin and French in parallel columns. "Arrest du Conseil d'etat du roy. Du 21. avril 1725. Extrait des registres du Conseil d'etat": p. 98-100. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.  Title on cover. <br />."""
url = "https://archive.org/details/avisdescenseursn00fran"
subject = [
    "Hardouin, Jean, 1646-1729",
    "Catholic Church",
]

