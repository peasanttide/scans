title = "Avis a tous les souscripteurs de La feuille villageoise"
language = "fr"
place = "Paris"
date = "1791"
note = """Prospectus for "La feuille villageoise," which began publication in 1790. Caption title. Printer statement from colophon. "Cette première année expire le 28 septembre prochain"--P. 1. "On renouvellera l'abonnement chez Desenne, libraire au Palais Royal, numéros 1 et 2, chez les principaux libraires, et chez les directeurs des postes des différens départemens ... Le prix de la souscription sera de neuf livres par an"--P. 12. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Book is missing pages 5-8."""
url = "https://archive.org/details/avistouslessousc00ceru"
