note = """Another edition dated 1615, containing 23 pages states that it was written by "le sieur D.C.", and was dedicated to President Jeannin. This edition does not contain the dedication. André, Les sources de l'histoire de France, part III, v. 4, p. 105, no. 2188. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text. Uneven binding."""
