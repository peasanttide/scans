title = "Avertissement en droit, que met pardevant vous, Messieurs les senechal, magistrats, & officiers de la senéchaussée & siege presidial de Lyon, Dame Françoise Chaussat, veuve & heritiere de Mre. Thomas Deboze, chevalier, conseiller du roy, tresorier de France au Bureau des finances de la generalité de Lyon, deffenderesse & demanderesse en revocation d'apposition de scellé, recherche & description, & en revocation de saisies :"
language = "fr"
place = "Lyon?"
date = "1723"
note = """Caption title. Signed at end: Me. Butturieu, procureur. "Communiqué le [blank] avril 1723"--Page 75. No. 48 of 54 titles bound together; tightly timmed at bottom with some loss of text. The statement "Communiqué le [blank] avril 1723" (page 75) is completed in manuscript to read: Communiqué le per. avril 1723. Scanner's note: Title is on the cover. Uneven binding. Skewed text. Damaged, stained, and/or torn pages. Text is lost in the binding or extends off of the edge of the page."""
