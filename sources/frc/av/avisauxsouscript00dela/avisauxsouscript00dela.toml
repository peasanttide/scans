date = "1786"
note = """Notice regarding the final installment of Saint Non's "Voyage pittoresque, ou, Description des royaumes de Naples et de Sicile", published 1781-1786. Caption title. Imprint from colophon. Printer precedes place of publication in colophon. "Ce dernier cahier contient, entres autres, quatres planches nouvelles des médailles de la Sicile ... Les soins et la finesse avec lesquels ces médailles ont été gravées, ne permettant pas d'en tirer beaucoup d'épreuves, elles ne seront délivrées qu'à ceux des souscripteurs qui les désireront ... en payant 9 liv. de plus pour les quatorze estampes.". Scanner's note: No copyright page found. No table-of-contents pages found. Title and cover pages combined."""
