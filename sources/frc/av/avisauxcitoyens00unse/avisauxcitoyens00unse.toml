note = "Caption title. Without imprint. Opening sentence: Des hommes mal intentionnés, afin de troubler les consciences timorées de ceux qui admettent la constitution civile du clergé, affectent de répandre, & tachent de persuader au peuple que ceux-là sont excommuniés, & schismatiques, qui, contre la volonté du pape formellement exprimée, disent-ils, par une bulle, professent & participent au culte des prètres assermentés. For a reply to this see: Avis aux Catholiques: en réponse à un écrit intitulé: Avis aux citoyens. Not in Martin & Walter. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."
