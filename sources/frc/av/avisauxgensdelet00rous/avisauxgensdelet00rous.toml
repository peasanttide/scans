note = """Notice from the Société typographique de Genève announcing the availability of "Œuvres posthumes de Jean-Jacques Rousseau," published 1781-1783. Head-piece. "9 vol. in 8°. Prix, 21 liv. br.". "Les personnes qui auront l'edition in-12, & qui desireroient acquérir ce Supplément, sont priées d'envoyer un volume aux sieurs Hardoin, libraire, rue des Prêtres Saint-Germain-l'Auxerrois, & Guyot, libraire, rue de la Harpe, pour servir de modèle au relieur qui sera chargé de les rendre du même format.". Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover.   No page numbers. <br /><br />."""
