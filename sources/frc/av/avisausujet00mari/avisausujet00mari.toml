language = "fr"
place = "Paris?"
date = "1744"
note = """Prospectus for "Recueil d'estampes d'après les tableaux des peintres les plus celèbres d'Italie, des pays-Bas et de France, qui sont à Aix dans le cabinet de M. Boyer d'Aguilles", a collection of prints engraved by Jacobus Coelemans. Caption title. "On trouvera des exemplaires du sudit recueil & l'on pourra aussi prendre des assurances à Paris chez Pierre-Jean Mariette, imprimeur-libraire, ruë S. Jacques, aux Colonnes d'Hercules, & chez les principaux libraires des plus grandes villes de l'Europe"--P. [3]. Publication date from colophon. Includes prices on different types of paper, with or without subscription. Scanner's note: Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
