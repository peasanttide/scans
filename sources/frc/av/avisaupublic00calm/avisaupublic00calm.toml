note = """Prospectus for a reprint of Augustin Calmet's "Commentaire littéral sur tous les livres de l'Ancien et du Nouveau Testament.". Caption title. "On pourra s'adresser à Paris, ruë S. Jacques, chez Gabriel Martin à l'Etoile, Jean-Baptiste Coignard à la Bible d'or, Pierre-Jean Mariette aux Colonnes d'Hercule, Hippolyte-Louis Guerin à S. Thomas d'Aquin, et chez Pierre-Alexandre Martin, quay des Augustins, à l'Ecu de France"--P. [2]. "L'ouvrage entier pourroit être livré au public dans le mois de février 1741. Mais pour rendre le payement plus aisé, les libraires s'engagent de fournir les neuf premiers volumes ... au quinze du mois de janvier 1741"--P. [1]. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
