title = "Avis requisitorial des conseillers, ambassadeurs, & envoyés des electeurs, princes & etats de l'Empire, assemblés en diete : traduit littéralement sur une piece allemande, intitulée Reich-Gutachten."
language = "fr"
place = "s.l."
date = "1791"
note = """Caption title. Without imprint. "Dictature de l'Empire": p.[1]-21 (signed on p.21: Signat. Ratisbonn. Le 2 février 1791. (L.S.) Cancellaria Monguntina). "Décret de Commission impériale sur l'Avis réquisitorial de la Diète du 2 février 1791": p.22-31. Signed on p.31: Signatum Ratisbonne le 18 février 1791. (L.S.) N. Prince de la Tour-Taxis. This edition not in Martin & Walter (cf. IV 2: 2614, which specifies: Sur les droits des princes possessionés d'Alsace). Scanner's note: No copyright. No table of contents. Title on cover. Damaged, stained pages and cover. <br /><br />."""
