note = """Prospectus for Diderot and D'Alembert's Encyclopédie. Caption title. "Debure l'ainé, Barrois l'ainé & Barrois le jeune, libraires, quai des Augustins, ayant acquis du fonds de feu MM. Le Breton & Briasson le restant de ce grand ouvrage avec toutes les figures ... offrent le peu d'exemplaires qui leur restent en 33 vol. in-folio, y compris les 5 vol. du Supplément, pour 600 livres, en feuilles"--P. [1]. Printer from colophon. "Permis d'imprimer, le 24 novembre 1783"--P. [4]. Includes booksellers' catalogs of Jean Debure, Louis-François Barrois, and Théophile Barrois. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained, marked and/or loose pages. Uneven binding. Skewed text."""
