title = "Avis au public"
language = "fr"
place = "London"
date = "1774"
note = """Caption title. First sentence: L'édition de l'Hortus Malabaricus en folio, étant très rare depuis long tems, en forte qu'on ne peut l'acheter qu'à un très grand prix, le docteur Hill à Londres, afin de conserver cet excellent ouvrage à la posterité à un prix raisonnable, s'est determiné d'en donner à ses propres depends une nouvelle edition complette en latin, en douze volumes quarto, avec plusieurs de ses additions. At head of title: Londres, Feb. 15e, 1774. Last three pages blank. "Les amateurs d'histoire naturelle, qui voudroient faire l'acquisition de cette nouvelle édition, s'addresseront à leurs respective [sic] libraires, dans les principales villes de l'Europe"--P. [1]. Includes prices. Addressed in ms. to: Monsieur Adanson, de la Société royale des sciences à Paris, rue des Petits Champs, à Paris. Two ms. letters on blank p. [1]-[2] regarding the the publication and distribution of the proposed edition, one from Michel Adanson to John Hill (dated: A Paris, 1 mars 1774), the other from Hill to Adanson (dated: Londres, ce 21 de févr. 1774). Scanner's note: Text lost in binding. Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."""
url = "https://archive.org/details/avisaupublic00hill"
