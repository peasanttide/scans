note = """Prospectus for "Ami du roi, des François, de l'ordre et sur-tout de la vérité.". Caption title. Publication information from colophon. Printed in double columns. "Le bureau des souscriptions est désormais ouvert rue Saint-André-des-Arcs, n°. 37, au coin de la rue de l'Eperon, au premier"--P. [1]. "Le prix de la souscription pour la province est de 33 liv. pour un an; 18 liv. pour six mois; 10 liv. pour trois mois. Pour Paris 30 liv. pour un an; 16 liv. pour six mois; 9 liv. pour trois mois"--P. 2. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Title page and cover are combined."""
