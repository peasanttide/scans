note = """Prospectus for Maupin's "La poule au pot, ou, L'accomplissement du vœu de Henry IV.". Proposed work never published? Caption title. "Les personnes qui me feront l'honneur de souscrire pour la Poule au pot, ou pour l'Art des vins fins, voudront bien affranchir l'argent et leurs lettres, qui seront adressées à M. Maupin, auteur de l'Art de la vigne, de l'Art des vins, & de la Seule richesse du peuple, rue du Pont-aux-Choux, n°. 43, à Paris"--P. 2. Date of publication from colophon. "Prix de la souscription, 12 liv. 6 liv. 2 liv. & même au-dessous, suivant le zèle ou les moyens des souscripteurs"--P. [1]. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages.  Only one numbered page. <br />."""
