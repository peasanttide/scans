note = """Prospectus for Desmonceaux's "Traité des maladies des yeux et des oreilles.". Caption title. Printer statement from colophon. "Permis d'imprimer, ce 22 février 1785"--P. 8. "On souscrit chez Lottin aîné, imprimeur-libraire du roi, ordinaire de la ville, & Lottin de S.-Germain, imprimeur ordinaire de la ville, rue S.-André-des-Arcs, n°. 27. Et chez M. l'abbé Desmonceaux en sa maison de campagne à Issy, près de Paris"--P. 8. "La souscription sera ouverte depuis le 15 mars 1785 jusqu'au 1 juin inclusivement ... La souscription sera de quinze livres pour les deux volumes reliés en basane, & de treize livres dix sols brochés"--P. 8. Scanner's note: No copyright found.  No table of contents found.  Damaged, stained pages and cover. <br />."""
