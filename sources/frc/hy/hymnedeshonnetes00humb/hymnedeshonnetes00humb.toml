id = "hymnedeshonnetes00humb"
type = "book"
title = "Hymne des honnêtes-gens, ou, Hymne anti-marseillais : sur la mort du roi Louis XVI et de Marie-Antoinette, archiduchesse d'Autriche, reine de France et de Navarre, etc. : avec des notes intéressantes et instructives sur les horreurs commises à Paris, tant à la journée du 10 août, qu'à celle du 2 septembre et autres époques, avec une digression préliminaire, une description détaillée du lieu des séances de l'Assemblée nationale, et une dissertation finale sur les motifs ultérieurs qui constatent la nécessité de la coalition générale de toutes les puissances et nations de l'Europe, auxquelles cet ouvrage est adressé, et spécialement dédié à Sa Majesté l'empereur et roi, dans la personne de Son Altesse Royale Mgr. l'archiduc Charles, lieutenant-gouverneur et capitaine-général des Pays-Bas, etc., etc. : servant d'apologie à la glorieuse campagne de 1793, aux hauts faits et succès de Son Altesse Sérénissime Mgr. le prince de Saxe-Cobourg, feld-maréchal, général en chef des armées victorieuses de sadite majesté et de l'empire, etc. /"
language = "fr"
place = "Brussels?"
date = "1794"
note = "Dated, p. [2]: Bruxelles, ce 10 avril 1794. Not in Martin & Walter. Révolution française. Errata at end. Scanner's note: No copyright page found. No table-of-contents pages found. Damaged pages and cover. Stained pages."
url = "https://archive.org/details/hymnedeshonnetes00humb"
subject = [
    "Louis XVI, King of France, 1754-1793",
    "Marie Antoinette, Queen, consort of Louis XVI, King of France, 1755-1793",
    "France. Assemblée nationale constituante (1789-1791)",
    "France. Assemblée nationale législative (1791-1792)",
    "Counterrevolutions",
    "First Coalition, War of the, 1792-1797",
]
