type = "book"
title = "Hymne a la nature : décret de la Convention, du 18 floréal, an 2e. de la République française, sur les fêtes décadaires : article VII, la République fera célébrer des fêtes à l'Être suprême, à la nature, etc. : article IX, la Convention nationale appele tous les talens à l'honneur de concourir à leur établissement par des hymnes : art. X, le Comité de salut public distinguera les ouvrages qui lui paroîtront propres à remplir cet objet, et récompensera leurs auteurs."
language = "fr"
place = "A Paris"
date = "1794"
