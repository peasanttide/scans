date = "1793"
note = "Imprint from colophon. Not in Martin & Walter. Révolution française. Hymne des Marseillois -- Chanson des sans-culottes : air, C'est ce qui nous console -- Sur le salpêtre -- Éloge de la gamelle : air, de la Carmagnole -- Les voyages du Bonnet Rouge : air, C'est ce qui me console -- Le Français prisonnier de guerre : air, Comment goûter quelque repos -- Chanson de guerre : air, Aussi-tôt que la lumière -- Le réveil des nations : air, Si vous aimez la danse -- Rondeau pour danser autor de l'arbre de la liberté -- Insurrection du peuple français contre les tyrans : air, Allons enfans de la patrie. Scanner's note: Book is missing pages 5/6 & 11/12."
