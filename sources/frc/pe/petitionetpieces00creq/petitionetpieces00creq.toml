type = "book"
title = "Pétition et pièces présentées à l'Assemblée nationale par l'infortuné Charles de Bourbon-Montmorency, connu sous le nom d'Alexandre de Crequy, détenu 46 ans en différentes prisons et forteresses, par lesquelles il dévoile à la nation le comble des horreurs, de la tyrannie et du despotisme, sous les règnes de Louis XV et de Louis XVI."
language = "fr"
place = "A Paris"
date = "1791"
note = """"Cette pétition a été généralement applaudie de l'Assemblée nationale et du public.". "Cet ouvrage se vend à Paris, chez Lebour, librarire au Palais-Royal, no. 188, et chez tous les marchands de nouveautés."--P. [1] at end. Martin & Walter. Révolution française. "Supplément de la pétition et requête présentées a l'Assemblée nationale, le 13 novembre 1791"P. 14-71. Bibliography: Martin & Walter.  Révolution française,  I, 8800. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on the cover page. Skewed text."""
