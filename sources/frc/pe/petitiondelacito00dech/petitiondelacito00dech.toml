title = "Pétition de la citoyenne veuve Gve. Dechézeaux, née Vatable, lue par son frère, le citoyen Achilles Dechézeaux, à la barre de la Convention nationale à la séance du 29 germinal, an 3e de la République française une & indivisible."
language = "fr"
place = "Paris"
date = "1795"
note = """Caption title. "Réponse du citoyen Boissy-d'Anglas, président, à la pétition de la citoyenne veuve G. Dechézeaux"--P. 3-4. "A la Convention nationale, précis des faits qui ont motivé le jugement de condamnation à mort de Gustave Dechézeaux, ci-devant député à la Convention nationale, rendu par le Tribunal révolutionnaire de Rochefort le 28 nivôse de l'an deux, & exposé des moyens qui doivent opérer la rehabilitation de sa mémoire": p. [1]-38. "Du 29 germinal, an troisième"--P. 38. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  II, 9503. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, stained pages. Damaged, uneven binding. Skewed text. Inconsistent page size. Loose pages."""
url = "https://archive.org/details/petitiondelacito00dech"
subject = [
    "Dechézeaux, Gustave, 1760-1794",
    "Political rehabilitation",
]
