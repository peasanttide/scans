#:schema ../../../../schemas/source.json
layer = "source"
id = "petitionetmemoir00vale"
type = "pamphlet"
title = "Pétition et mémoire a la Convention nationale, contre des arrestations arbitraires faites par ordre des citoyens Amar et Merlinot, commissaires conventionnels envoyés dans le département de l'Ain : mai 1793, an IIe de la République française."
language = "fr"
place = "A Paris"
date = "1793"
note = """Signed, p. vi: Valentin, Chicod, Morel et Goyffon, fondés de pouvoirs des détenus. Signed, p. 48: Brangier, secrétaire. Martin & Walter. Révolution française. "Petition présentée, le 19 mai, à la Convention nationale, en faveur d'un grand nombre de détenus par ordre des commissaires conventionnels, envoyés dans le département de l'Ain. Renvoyée, par décret du même jour, aux Comités réunis de législation et de sûreté générale. Le citoyen Phélippeaux, rapporteur"--P. [iii]-vi. "Observations en forme de mémoire, présentées aux Comités réunis de législation et de sûreté générale, relativement à une pétition contenant réclamation contre des arrestations aussi multipliées qu'arbitraires, faites dans le département de l'Ain, par ordre des citoyens Amar et Merlinot, représentans d'un peuple libre"--P. [1]-32. "Pièces justificatives. Tant de la Pétition présentée à la Convention le 19 mai, que du Mémoire y relatif, remis au Comités réunis de législation et de sûreté générale"--P. 33-48. Bibliography: Martin & Walter.  Révolution française,  IV:1, 33102. Scanner's note: Title and cover page are combined. Uneven binding. Damaged pages. Inconsistent page size. Skewed text."""
url = "https://archive.org/details/petitionetmemoir00vale"
subject = ["Arrest"]
extent = "vi, 48 p. ; 22 cm."

