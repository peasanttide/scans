note = """By Albin-Joseph-Ulpin Hennet. Cf. Martin & Walter. Excerpts from the works of Montaigne, Charron, Montesquieu and Voltaire concerning divorce, followed by Hennet's observations and interpretations. "De l'imprimerie de la Feuille du jour, rue de Bondi, no. 74, à côté de l'Opera"--Colophon. Martin & Walter. Révolution française. "Epitre dedicatoire a un enfant"--P. [iii]-vj. "Consultation sur les lois et les usages qui s'observent sur le divorce, en Pologne et dans la Suisse protestante"--P. [37]-67. Bibliography: Martin & Walter.  Révolution française,  II, 16506. Scanner's note: No copyright page found. Damaged, stained pages and cover."""
