note = "Caption title. Signed: Dupré, auteur, quai Pelletier, no. 45. Imprint from colophon. Place of publication from Martin & Walter. Martin & Walter. Révolution française. Advocating abolishing all taxes and replacing them with a system whereby all non-subsistence agricultural products are sold to the state which in turn sells the products to the populace. Bibliography: Martin & Walter.  Révolution française,  II, 12313. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."
