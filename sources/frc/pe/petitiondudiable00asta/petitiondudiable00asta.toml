id = "petitiondudiable00asta"
type = "pamphlet"
title = "Pétition du diable aux deux conseils, demandant l'établissement d'une ménagerie dans la cour du palais du Directoire exécutif, et dans les jardins du Conseil des anciens, et des cinq-cents : project d'y faire mettre en cage tous les scélérats qui ont trahi la république, tels que les directeurs infidèles, les mauvais députés, les ministres perfides, et, sur-tout, les fournisseurs de la république : autre projet, pour élever des colonnes d'honneur à ceux qui rempliront leurs fonctions en bons citoyens."
language = "fr"
place = "Paris"
date = "1796"
note = """Caption title. Signed: Astaroth. Publisher from colophon; location from Martin & Walter. "Traduit de l'hébru par Isaac Nathan"--P. 8 (apocryphal?). "Se distribue rue des Prêtres-Severin, no. 169"--P. 8. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  I, 6215. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged pages and cover. Skewed text."""
