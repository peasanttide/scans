#:schema ../../../../schemas/source.json
layer = "source"
id = "petitiondemdepaw00pawl"
type = "pamphlet"
title = "Pétition de M. de Pawlet dont l'objet est de démontrer à l'Assemblée nationale que le Roi n'a jamais de cessé de désirer le bonheur des Français, qu'on en trouve une preuve bien frappante dans sa declaration du 23 juin 1789 qui méditée et prise pour guide, eût operé la plus heureuse révolution, prévenu tous les maux qu'on a éprouvés, et offert les moyens d'assurer en très-peu de tems, une constitution qui eût fait, à l'instant, de la France, la nation la plus riche, la plus libre et la plus puissante : sous cette consideration il demanded à l'Assemblée nationale de vouloir se mettre à la tête de tous les vrais amis de la patrie, à l'effet de supplier Sa Majesté de reprendre les rênes du gouvernement pour réprimer les factieux, éviter la guerre et rendre bientôt les peuples heureux."
language = "fr"
place = "Paris"
date = "1792"
note = "Caption title. Signed: De Pawlet. Publisher from colophon; location and date from Martin & Walter. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,  III, 26625. Scanner's note: Title is on the cover page. Skewed text. Damaged pages. Inconsistent page sizes.  No copyright page found. No table-of-contents pages found."
