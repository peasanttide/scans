title = "Petit carême de l'Abbé Maury, ou, Sermons prêchés dans l'assemblée des enragés."
language = "fr"
place = "A Paris"
date = "1790"
note = "Caption title. Authorship claimed by Jacques-René Hébert; sometimes ascribed to Restif de La Bretonne. Cf. Tourneaux, IV, 23997. Imprint from colophon. Imprints vary. Nos. 2-5: Rue Gît-le-Cœur, hôtel S. Louis, no. 4, et chez les marchands de nouveautés; de l'imprimerie de Laurens junior, libraire, rue Saint-Jacques, vis-à-vis celle des Mathurins, no. 37. Nos. 6-10: De l'imprimerie de J. Grand, rue du Foin-S. Jacques, no 6. Tourneux, M. Paris pendant la Révolution française. Martin & Walter. Révolution française. Forms part of the French Revolution Collection at the Newberry Library. Bibliography: Tourneux, M. Paris pendant la Révolution française,  IV, 23995. Scanner's note: Title and cover are combined. Uneven binding. Skewed text. Damaged, stained and/or loose pages."
url = "https://archive.org/details/petit00unse"
subject = [
    "Maury, Jean Siffrein, 1746-1817",
    "Aristocracy (Social class)",
]
extent = "10 v. (80 p.) ; 18 cm."

