title = "Assemblée des trois ordres de la province de Dauphiné."
language = "fr"
place = "France"
date = "1788"
note = """Caption title. By Jean Joseph Mounier. Cf. Martin & Walter, Maignien. "Du vingt-un juillet mil sept cent quatre-vingt-huit ..."--P. [1]. Variant of Martin & Walter. Révolution française, III, 25369; IV:2, 4968. Variant of Saricks, A. Melvin Coll., II, 5298. Variant of Maignien, E. Ouvrages anonymes et pseudonymes du Dauphiné, 236. "Très-respecteuses representations des trois ordres de la province de Dauphiné"--P. 13-23. Summarizes the results of the Assemblée de Vizille, held 21 July 1788, including the letter to the king protesting recent edicts and calling upon him to convene the États-généraux. Scanner's note: No copyright page found. No table-of-contents pages found. Title page and cover are combined. Damaged, stained and/or loose pages. Uneven binding. Skewed text."""
