note = """Prospectus for "Assemblée nationale, corps administratifs et nouvelles politiques et littéraires de l'Europe.". Caption title. At head of title: Seconde législature. L'an 3 de la liberté. "On s'adressera au sieur Perlet, hôtel de Châteauvieux, rue Saint André-des-Arcs, pour tout ce qui regarde la distribution et l'abonnement de ce journal; et à M. Lenoir de La Roche, rue du cimetière Saint-André-des-Arcs, au coin de celle de l'Eperon, pour tous les objets qui regarderont la rédaction, ainsi que les livres, gravures, etc. qu'on désirera faire annoncer"--P. 3. Advertisement, p. [1] at end: Imprimerie établie avec les superbes caractères de Baskerville, hôtel de Châteauvieux, rue Saint-André-des-Arcs ... S'adresser au sieur Perlet, imprimeur du Tribunal de cassation et des tribunaux des premier et sixième arrondissemens de Paris .. Includes prices. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text."""
