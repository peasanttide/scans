title = "Mémoire adressé au roi /"
language = "fr"
place = "A Rennes"
date = "1788"
note = """Caption title. Imprint from colophon. Opening paragraph: Votre Majesté nous a déclaré qu'elle avoit lu nos mémoires. Qu'il nous soit permis de lui témoigner notre douleur de ce que la justice de nos réclamations lui étant connue, l'oppression sous laquelle nous gémissons, n'ait éprouvé aucun soulagement. "Fait en commission, à Rennes le 18 août 1788": p.22. "Réponse fait par le roi, le 31 juillet 1788, a MM. les députés et commissaires des États de Bretagne": p.23-24. Not in Martin & Walter [edition 2: 24 p., with extra text as cited above]. Scanner's note: Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages.No title page found. No copyright page found. No table-of-contents pages found."""
