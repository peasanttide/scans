note = """Caption title. Without imprint. Opening paragraph: Votre Majesté nous a déclaré avoir lu nos mémoires. Qu'il nous soit permis de lui témoigner notre douleur de ce que la justice de nos réclamations lui étant connue, l'oppression sous laquelle nous gémissons, n'ait éprouvé aucun soulagement. "Fait en commission, à Rennes le 18 août 1788": p.19. Not in Martin & Walter [edition 1: 20 p.]. Scanner's note: Title page and cover are combined. Skewed text. Uneven binding. Damaged, stained, and/or loose pages. No title page found. No copyright page found. No table-of-contents pages found."""
