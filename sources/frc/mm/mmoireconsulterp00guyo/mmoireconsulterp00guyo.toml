title = "Mémoire a consulter pour le Sieur Guyot"
language = "fr"
place = "Paris"
date = "1775"
note = "Caption title. Imprint at foot of p. 12. Signed on p. 11: Guyot. Relating to a legal dispute between Catherine Chaucat (widow of the publisher Nicolas Desaint) and Guyot over the publication rights of Répertoire universel & raisonné de jurisprudence civile, criminelle, canonique & bénéficiale, the editorship of which is acribed either to Joseph Nicolas Guyot or to Pierre Jean Jacques Guillaume Guyot. Dated 31 October 1775. Scanner's note: No copyright page found. No table-of-contents pages found.  Damaged, torn, stained and/or loose pages. Uneven binding. Skewed text. Irregular pagination. Title page and cover are combined."
