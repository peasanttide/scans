title = "Mémoire et consultation sur la question suivante : Quels sont les moyens que doivent employer les habitans de Paris, pour obtenir de nommer eux-mêmes leurs représentans aux prochains Etats-généraux ; & n'en pas laisser la nomination aux officiers de l'Hôtel-de-ville & à un petit nombre de notables, que les officiers de l'Hôtel-de-ville sont dans l'usage de s'associer arbitrairement dans cette fonction?"
