note = "Caption title. Without imprint. Opening sentences: Les décrets de l'Assemblée nationale qui ordonnent la division du royaume en départemens & en districts, portent: les electeurs du département délibéront s'il y a lieu de faire alterner, entre Pertuis & Apt, l'assemblée de district, provisoirement indiquée à Apt. Les electeurs de la ville d'Apt se proposent, dit-on, de se refuser à l'alternat. Not in Martin & Walter. Scanner's note: No copyright page found. No table-of-contents pages found. Title is on cover page. Damaged, stained and/or loose pages. Uneven binding. Skewed text."
