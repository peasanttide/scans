language = "fr"
place = "France?"
date = "1790"
note = """Attributed to J.-M.-A. Servan. Cf. Barbier. Martin & Walter. Révolution française. Monglond, A. France révolutionnaire et impériale. Barbier, A.A. Ouvrages anonymes. Presents speeches by Rousseau and Mirabeau at a fictitious meeting of the Assemblée nationale. "Extrait de la séance de l'Assemblée nationale, du lundi 24 décembre 1789"--P. 1-13. "Suite des décrets de l'Assemblée nationale, concernant les comédiens."--P. 14-37. Bibliography: Martin & Walter.  Révolution française,  IV:1, 31477. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
