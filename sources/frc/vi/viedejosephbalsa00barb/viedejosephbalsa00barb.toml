note = """Translation of: Compendio della vita e delle gesta di Giuseppe Balsamo, denominato il conte Cagliostro. Passano attributes this work to "mons. Barbéri." Lattanzi attributes it to "Barbèri, Francesco Mons." Haven attributes it to "P. Marcello jésuite." It is now generally attributed to Giovanni Barberi, 1748-1821. Cf. Passano, G.B. Anonime e pseudonime (1877 ed.), p. 77. Lattanzi, A. Bib. della massoneria italiana e di Cagliostro. Bib. Cagliostrana. Caillet, I.C. Manuel bibliographique des sciences psychiques ou occultes. Haven, M. Maitre inconnu Cagliostro. Bib. Wolfsteig, A. Bib. der Freimaurerischen literatur. Not in: Martin & Walter. Révolution française. Publisher's advertisement, p. [ii]. Includes bibliographical references. Bibliography: Lattanzi, A.  Bib. della massoneria italiana e di Cagliostro. Bib. Cagliostrana,  128ee. Scanner's note: No copyright page found. No table-of-contents pages found. Skewed text."""
