note = """Caption title. "Avec approbation & permission de vendre & distribuer, à Paris ce 20 juillet 1790."--Colophon. Variant of Martin & Walter. Révolution française, II, 9589. Aux bon citoyens, travailleurs au champ de Mars, par M. Deduit, auteur patriote. Air: Au coin du feu -- Chanson nouvelle sur la fédération. Air: Si je meurs que l'on m'en terre -- Dialogue entre un ivrogne et sa femme. Air: De Calpigi -- Ah! Ça ira, dictum populaire. Air: De la nouvelle contredanse, dite le Carillon notional -- Chanson nouvelle sur la fédération. Air: Si je meurs que l'on m'enterre -- Chanson nouvelle, dédiée à la nation. Air: pour un peuple aimable & sensible. Scanner's note: No copyright page found. No table-of-contents pages found. Title on cover. Damaged pages and cover."""
