note = """Half title. Imprint from colophon. Caption on p.[1]: Aux représentans du peuple composant le Comité d'instruction publique. Les citoyens soussignés, membres du conseil général de la commune de Dole, au Jura. "La Convention nationale a reconnu que l'instruction étoit un des principaux remparts de la liberté ...": p.2. Dated at end: Dole, le 26 ventôse, l'an trois de la République française, une et indivisible [16 mars 1795]. About educational facilities in Dôle. Not in Martin & Walter. Scanner's note: Title page located on front cover. No copyright page found. No table-of-contents pages found. Worn, damaged and discolored pages and cover. Skewed text."""
