note = """Caption title. Without imprint. "Tiers-état" (p.3-6) Opening words: Électeurs du Tiers-état, votre mission est la plus importante de toutes; vous allez nommer les vrais représentans de la nation .. "A la noblesse" (p.6-14) Opening words: Nobles, je vous ai peints tout-à-l'heure comme les ennemis du peuple. J'aime à m'en flatter, vous ne le serez pas long-tems .. "Au clergé" (p.14-15) Opening words: Je ne lui dirai que deux mots; les curés sont le Tiers-état du clergé .. Not in Martin & Walter. Scanner's note: No title page found. No copyright page found. No table-of-contents pages found."""
