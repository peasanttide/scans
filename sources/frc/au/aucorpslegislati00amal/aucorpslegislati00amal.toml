note = """Caption title. Signed, p. 13-14: Paris, 26 fructidor an 6. Maza ... Aldamar ... Galindert ... J. Oskamp Jr. ... J.N. Apostool ... J.S. Amalry. Imprint from colophon. "Après avoir remis la pièce qui précède au Conseil des cinq-cents, les pétitionnaires se sont rendus en corps auprès du Directoire, et y ont, par l'organe du citoyen J.S. Amalry, prononcé le discours suivant"--P. [15]-20. Martin & Walter. Révolution française. Bibliography: Martin & Walter.  Révolution française,I, 197. Scanner's note: Title found on front cover. No copyright page found. No table-of-contents pages found."""
