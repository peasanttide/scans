title = "Au Corps législatif : fabrication d'un nouveau billon blanc, plus parfait, en pièces de 10 et de 5 sols (cinq décimes et vingt-cinq centimes) pour satisfaire au besoin des appoints dans les transactions journalières, et sa prompte émission dans onze caisses, où tout le papier-monnoie pourrait être échangé à bureau ouvert : avec offre de faire au gouvernement toutes les avances nécessaires : objet renvoyé à une commission spéciale du Conseil des cinq-cents, d'après un message du Directoire-exécutif."
language = "fr"
