note = "Caption title. By Jean-Gabriel Peltier. Cf. Barbier. Dated, p. [1]: 21 octobre 1789. Variant of Martin & Walter. Révolution française, III, 26722. Variant of Barbier, A.A. Ouvrages anonymes, I, column 1111. Remarks on the mob at Versailles, 5 October 1789, and accuses Mirabeau and the Duke of Orléans of instigating it. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
