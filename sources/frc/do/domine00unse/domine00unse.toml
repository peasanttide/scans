date = "1789"
note = "By Jean-Gabriel Peltier. Cf. Barbier. Fictitious imprint; actual place of publication from Weller. Signatures: A-B⁸. Page [3] missigned: A; another edition exists with signature: A2. Last word of p. [3]: d'être; another edition exists with last word: pour. Martin & Walter. Révolution française. Barbier, A.A. Ouvrages anonymes. Weller, E.O. Falsche Druckorte. Remarks on the mob at Versailles, 5 October 1789, and accuses Mirabeau and the Duke of Orléans of instigating it. Bibliography: Martin & Walter.  Révolution française,  III, 26722. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
