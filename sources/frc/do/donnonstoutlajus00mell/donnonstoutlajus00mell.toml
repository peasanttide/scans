note = """Caption title. Signed: Melletier. Paris, ce 29 vendemiaire, l'an 3e de la Rép. franç. Imprint from colophon. Martin & Walter. Révolution française. Melletier presents the petition delivered by Gonchon to the citizens of faubourg Saint-Antoine for which he was denounced by Laurent Lecointre. "A la Convention nationale"--P. 3-8. Bibliography: Martin & Walter.  Révolution française,  III, 23744. Scanner's note: Title page and cover are combined. Damaged, stained, marked and/or loose pages. Uneven binding. Skewed text."""
