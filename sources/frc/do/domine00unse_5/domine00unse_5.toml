title = "Domine salvum fac regem."
language = "fr"
place = "Sur les bords du Gange [i.e. Paris"
date = "1789"
note = "By Jean-Gabriel Peltier. Cf. Barbier. Fictitious imprint; actual place of publication from Weller. Title vignette of an urn on a pedestal, with garlands and panpipe. Variant of Martin & Walter. Révolution française, III, 26722. Variant of Barbier, A.A. Ouvrages anonymes, I, column 1111. BM. Weller, E.O. Falsche Druckorte. Remarks on the mob at Versailles, 5 October 1789, and accuses Mirabeau and the Duke of Orléans of instigating it. Bibliography: BM,  LIV, column 483. Scanner's note: No copyright page found. No table-of-contents pages found. Title page is on the cover. Damaged, stained, and/or loose pages. Uneven binding. Skewed text."
url = "https://archive.org/details/domine00unse_5"
subject = [
    "Orléans, Louis Philippe Joseph, duc d', 1747-1793",
    "Mirabeau, Honoré-Gabriel de Riquetti, comte de, 1749-1791",
    "Mobs",
]
