note  = "The frontispiece of Pellet's volume, captioned 'Fac-similé d'une caricature du temps'. The subject is Andre Boniface Louis Riqueti, vicomte de Mirabeau, called Mirabeau-Tonneau, the orator's younger brother and one of the Apotres: he is shown hauled up to the tribune of the National Assembly holding a sheet marked 'motion', while placards read 'Caisse d'escompte supprimee' and 'Desolation ... de la cour'. What is held here is the 1873 wood-engraved reproduction; the caricature it copies is contemporary with the events, so between 1789 and 1791, and the original print, its engraver and its date are not identified in the volume."

