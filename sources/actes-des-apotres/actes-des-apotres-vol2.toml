note   = "Numbers 31-59. Pages 1-42, 111-120, 157-218, 301-302, 515-572 are assigned to no number: the covers and title leaf, the serialised essay on the English revolution bound at the head, and the pamphlets, supplements and tables bound among and after the numbers. One of them, on pages 203-218, is a `Lettre de M. Bergasse` of 15 February 1790 with its own pagination. They are left unassigned rather than guessed at. Numbers 35, 38, 39, 40, 41 are bound in this volume but their leaves could not be identified from the text layer; their records carry no page range."

