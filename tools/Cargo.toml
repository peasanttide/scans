[package]
name = "scans"
version = "0.1.0"
edition = "2024"
description = "Validate, migrate and describe the primary source and scan archive."
publish = false

[lib]
name = "scans"
path = "src/lib.rs"

[[bin]]
name = "scans"
path = "src/main.rs"

[features]
default = []
# Checks that must read image and container bytes: graphic dimensions, real PDF page counts,
# text-file existence, filename case, LFS-pointer detection.
#
# OFF BY DEFAULT AND IT MUST STAY THAT WAY. The repository holds several gigabytes of .jp2 in
# Git LFS; the default `scans validate` path must never open one. The agent that implements
# the probe checks adds its decoder dependencies here as `optional = true` and lists them in
# this feature, and imports them lazily inside the probe functions so a default build still
# compiles with none of them present.
#
# `lopdf` is the only decoder dependency. It reads a PDF's real page count for `E704`, and it
# is used rather than a hand-rolled scan for `/Type /Page` because modern PDFs put their page
# objects inside compressed object streams, where that scan silently finds zero and would turn
# an unreadable file into a false error. Image dimensions (`E702`) are read by the hand-written
# header parser in `validate::probe` instead: the archive's images are JPEG 2000, which no
# mainstream Rust image crate decodes, so a decoder dependency would add weight without
# covering the one format that matters.
probe = ["dep:lopdf"]
# `scans ingest` reads a bound volume's PDF text layer to recover the issue documents
# inside it. Same reason as `probe` for being off by default: it opens container bytes.
ingest = ["dep:lopdf"]
# `scans render` and `scans extract` turn a page of a scanned container into pixels. Off by
# default for the same reason as the other two, and for one more: this is the only feature
# that pulls a rasteriser and its ~70 transitive crates into the build, and the default
# `validate` path must not pay for them.
#
# `hayro` is the decoder, not `lopdf`, and the choice is forced by what is actually in the
# archive. Every one of volume 1's 888 page images is JBIG2, and volume 2 adds JPEG 2000
# plates. `lopdf` hands back the raw compressed stream for both and decodes neither, so an
# extractor built on it would emit files nothing can open. `hayro` is a pure-Rust PDF
# rasteriser whose `images` feature carries pure-Rust JBIG2 and JPEG 2000 decoders, which is
# the whole reason it is here — no C toolchain, no Ghostscript, no pdfium binary to ship.
render = ["dep:hayro", "dep:png"]
# `scans frc fetch` downloads the corpus PDFs from archive.org. Off by default because it is
# the only feature that opens a socket, and because it drags in a TLS stack that a `validate`
# run has no business paying for.
#
# `ureq` rather than `reqwest`: this makes one request at a time by design — the whole point
# is to be a polite guest on someone else's server — so an async runtime would be several
# hundred crates of dependency bought to do nothing. It is pure Rust with rustls, so there is
# still no C toolchain.
fetch = ["dep:ureq", "dep:md-5"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
# A pure-Rust PDF rasteriser. See the `render` feature for why this rather than lopdf.
hayro = { version = "0.7.1", optional = true }
lopdf = { version = "0.44", default-features = false, optional = true }
# Written by hand rather than through vello's `Pixmap::into_png`, which always emits RGBA8.
# A bitonal scan encoded as 8-bit grey is a quarter of the size for identical pixels, and
# these files exist to be read a few hundred at a time.
png = { version = "0.18.1", optional = true }
# A real XML parser rather than the hand-rolled parsing used elsewhere in this crate.
# 38,377 files of machine-generated XML from a decade of changing derive pipelines is
# exactly the input that finds the gap between the documented format and the served bytes.
# Pure Rust, no C toolchain, which is the constraint that actually matters here.
quick-xml = "0.38"
# The OCR sidecars are markdown with YAML frontmatter, so something has to read YAML.
# `serde_norway` rather than `serde_yaml`, which its author archived in 2024; this is the
# maintained fork of it and keeps the same serde-based API. Pure Rust.
serde_norway = "0.9"
# Verifying a download against the MD5 archive.org publishes for it. A truncated PDF that is
# committed and then believed is worse than one that failed loudly.
md-5 = { version = "0.10", optional = true }
ureq = { version = "3", optional = true }
# schemars DERIVES the JSON Schema from the same types the validator uses, so the schema
# cannot drift away from the code. It is never hand-written.
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
# `toml` reads; `toml_edit` writes, so emitted TOML is formatted for humans.
toml = "1.1.4"
toml_edit = "0.25.13"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3"
